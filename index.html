  trick: `Both formulas are "X over X minus the fixed cost". Remember that shape and you never need to memorise them separately — and DTL can be computed directly as contribution margin ÷ (EBIT − interest), skipping the two intermediate steps.`,
  breaks: `DOL depends on the sales level, so it is not a fixed property of the firm. Near breakeven it approaches infinity — mathematically correct and a favourite exam construction.`
});

// ── #20 Coefficient of variation ──────────────────────────────────
addC({
  id: 'cv', subject: 'Quantitative Methods', name: 'Coefficient of Variation',
  tagline: 'Risk per unit of return, when the scales differ',
  bigIdea: `Standard deviation alone cannot compare investments with different average returns. A 5% deviation is huge on a 2% return and trivial on a 40% return. CV divides one by the other to give <strong>risk per unit of return — a pure number you can compare across anything</strong>.`,
  formula: `CV = <span class="hi">σ</span> / <span class="hi2">mean</span>&nbsp;&nbsp;&nbsp;<em>lower is better</em>`,
  vars: [{ sym: 'σ', def: 'Standard deviation of the returns' }, { sym: 'mean', def: 'Average (expected) return' }],
  intuition: `Think of it as <strong>the inverse of the Sharpe ratio without the risk-free rate</strong>. Sharpe asks how much excess return you earn per unit of risk and rewards high numbers. CV asks how much risk you take per unit of return and rewards low ones.`,
  pullQuote: `"Standard deviation answers 'how much does it move'. CV answers 'how much does it move relative to what it pays'."`,
  connected: ['sharpe', 'z-score-ci'],
  inputs: [
    { id: 'cv_m1', label: 'Investment A mean return', sym: '', type: 'range', min: 0.5, max: 40, step: 0.5, val: 8, unit: '%' },
    { id: 'cv_s1', label: 'Investment A std deviation', sym: '', type: 'range', min: 0.5, max: 60, step: 0.5, val: 10, unit: '%' },
    { id: 'cv_m2', label: 'Investment B mean return', sym: '', type: 'range', min: 0.5, max: 40, step: 0.5, val: 20, unit: '%' },
    { id: 'cv_s2', label: 'Investment B std deviation', sym: '', type: 'range', min: 0.5, max: 60, step: 0.5, val: 22, unit: '%' }],
  calc(v) {
    const a = v.cv_s1 / v.cv_m1, b = v.cv_s2 / v.cv_m2;
    const win = a < b ? 'A' : b < a ? 'B' : 'neither';
    return { value: P(a) + ' vs ' + P(b), label: 'CV — A vs B',
      breakdown: `A: ${v.cv_s1}% ÷ ${v.cv_m1}% = <strong>${P(a)}</strong><br>B: ${v.cv_s2}% ÷ ${v.cv_m2}% = <strong>${P(b)}</strong><br>Lower CV is the better risk-return trade-off`,
      insight: win === 'neither' ? `Both have identical CV — <em>the same risk per unit of return</em> despite different absolute figures. This is exactly the situation where standard deviation alone would mislead you.` :
        `<strong>${win}</strong> offers the better trade-off at <strong>${P(Math.min(a, b))}</strong> risk per unit of return. Notice that B has the ${v.cv_s2 > v.cv_s1 ? 'higher' : 'lower'} absolute standard deviation — <em>the raw volatility number does not settle the comparison</em>.` };
  },
  traps: [{ label: 'Lower is better here', text: 'CV runs the opposite way to Sharpe. A <strong>lower</strong> CV is preferable because it means less risk per unit of return, while a <strong>higher</strong> Sharpe is preferable. Questions frequently pair the two to see if you reverse one.' },
          { label: 'Meaningless with a negative mean', text: 'If the average return is negative, CV produces a negative number that cannot be sensibly ranked. The measure only works for positive expected returns.' }],
  reality: `CV is widely used outside finance — in laboratory work and manufacturing quality control — precisely because it strips out units and lets you compare the consistency of processes measured on entirely different scales.`
}, {
  plain: `Coefficient of variation = standard deviation ÷ mean. Lower is better.`,
  recipe: [`Divide the standard deviation by the mean return.`, `Compare across investments — the smaller value wins.`],
  trick: `Remember the direction by what is on top: <em>risk is in the numerator</em>, so more of it makes the number bigger and worse. Sharpe puts return on top, so bigger is better. One glance at which is on top settles it.`,
  breaks: `Only valid for positive means, and it ignores the risk-free rate entirely — so it is not a substitute for Sharpe when a risk-free alternative exists.`
});

// ── #21 Holding period return ─────────────────────────────────────
addC({
  id: 'hpr', subject: 'Quantitative Methods', name: 'Holding Period Return',
  tagline: 'Total return, and how to annualise it correctly',
  bigIdea: `The simplest return measure there is: <strong>everything you gained divided by what you put in</strong>. The complexity comes when you annualise it — compounding, not multiplication, is what converts a period return into an annual one.`,
  formula: `HPR = <span class="hi">(P1 − P0 + Income)</span>/P0&nbsp;&nbsp;&nbsp;Annualised = <span class="hi2">(1+HPR)^(1/n)</span> − 1`,
  vars: [{ sym: 'P0', def: 'Beginning value' }, { sym: 'P1', def: 'Ending value' },
         { sym: 'Income', def: 'Dividends, coupons or other cash received during the period' }, { sym: 'n', def: 'Length of the holding period in years' }],
  intuition: `Two sources of return, one denominator. <strong>Capital appreciation plus income, over what you started with.</strong> The annualisation step exists because a 10% return over six months is not a 20% annual return — reinvesting for the second half compounds it to 21%.`,
  pullQuote: `"Doubling a six-month return to annualise it is the single most common return-measure error, and it is always slightly wrong."`,
  connected: ['tvm', 'ear'],
  inputs: [
    { id: 'hp_p0', label: 'Beginning value', sym: 'P₀', type: 'number', min: 1, max: 100000, step: 1, val: 100, unit: '$' },
    { id: 'hp_p1', label: 'Ending value', sym: 'P₁', type: 'range', min: 1, max: 400, step: 1, val: 112, unit: '$' },
    { id: 'hp_inc', label: 'Income received', sym: '', type: 'range', min: 0, max: 50, step: 0.5, val: 3, unit: '$' },
    { id: 'hp_n', label: 'Holding period', sym: 'n', type: 'range', min: 0.25, max: 10, step: 0.25, val: 0.5, unit: 'yrs' }],
  calc(v) {
    const hpr = (v.hp_p1 - v.hp_p0 + v.hp_inc) / v.hp_p0;
    const ann = Math.pow(1 + hpr, 1 / v.hp_n) - 1;
    const naive = hpr / v.hp_n;
    const cap = (v.hp_p1 - v.hp_p0) / v.hp_p0, yld = v.hp_inc / v.hp_p0;
    return { value: P(hpr * 100) + '%', label: 'Holding period return',
      breakdown: `Capital gain <strong>${P(cap * 100)}%</strong> + income yield <strong>${P(yld * 100)}%</strong><br>Annualised (compounded): <strong>${P(ann * 100)}%</strong><br>Naive scaling would give ${P(naive * 100)}%`,
      insight: v.hp_n < 1
        ? `Over ${v.hp_n} years the return was <strong>${P(hpr * 100)}%</strong>. Compounding that up gives <strong>${P(ann * 100)}%</strong> annualised — <em>not</em> the ${P(naive * 100)}% you get by simply scaling it. The gap of ${P((ann - naive) * 100)} points is the effect of reinvesting.`
        : `Over ${v.hp_n} years the total return was <strong>${P(hpr * 100)}%</strong>, which is <strong>${P(ann * 100)}%</strong> per year compounded. <em>Taking the ${P(hpr * 100)}% and dividing by ${v.hp_n} would overstate the annual figure</em>, because it ignores that each year's return compounds on the last.` };
  },
  traps: [{ label: 'Annualise by compounding, never by scaling', text: 'Raise (1 + HPR) to the power of <strong>1/n</strong>. Dividing or multiplying the raw return by the number of periods is wrong in both directions — it overstates annual returns for multi-year holdings and understates them for sub-year ones.' }],
  reality: `Fund marketing exploits the distinction constantly. A "since inception" cumulative return of 180% over 12 years sounds spectacular until you compound it down to about 8.9% a year.`
}, {
  plain: `Holding period return = (ending value − beginning value + income) ÷ beginning value. Annualise by raising (1 + HPR) to the power 1/n.`,
  recipe: [`Add the capital gain and the income received.`, `Divide by the beginning value.`, `To annualise, raise (1 + HPR) to the power of 1 ÷ years, then subtract 1.`],
  trick: `Split it into capital gain plus income yield. Questions often give one and ask for the other, and keeping them separate means you can answer without rebuilding the whole calculation.`,
  breaks: `Never annualise by multiplying or dividing. And HPR assumes no cash was added or withdrawn mid-period — once there are interim flows, you need money-weighted or time-weighted return instead.`
});

// ── #23 Solvency ratios ───────────────────────────────────────────
addC({
  id: 'solvency', subject: 'Financial Statement Analysis', name: 'Debt-to-Equity & Interest Coverage',
  tagline: 'How much debt, and can it be serviced',
  bigIdea: `Two different questions about the same debt. <strong>Debt-to-equity is a stock measure</strong> — how much is owed relative to the owners' stake. <strong>Interest coverage is a flow measure</strong> — whether current profits comfortably meet current interest. A company can look heavily indebted and still service it easily, or the reverse.`,
  formula: `D/E = <span class="hi">Total Debt</span>/Equity&nbsp;&nbsp;&nbsp;Interest Coverage = <span class="hi2">EBIT</span>/Interest`,
  vars: [{ sym: 'Total Debt', def: 'Interest-bearing debt, short and long term' }, { sym: 'Equity', def: 'Total shareholders\' equity' },
         { sym: 'EBIT', def: 'Earnings before interest and taxes' }, { sym: 'Interest', def: 'Interest expense for the period' }],
  intuition: `A mortgage analogy makes the split obvious. The size of your loan relative to your deposit is the balance sheet question; whether your salary comfortably covers the monthly payment is the cash flow question. <strong>Lenders care far more about the second</strong>, which is why covenants are usually written on coverage.`,
  pullQuote: `"Debt-to-equity tells you how deep the hole is. Interest coverage tells you whether you can keep climbing out of it."`,
  connected: ['dupont', 'wacc', 'liquidity'],
  inputs: [
    { id: 'sv_debt', label: 'Total debt', sym: '', type: 'range', min: 0, max: 3000, step: 50, val: 800, unit: '$M' },
    { id: 'sv_eq', label: 'Shareholders\' equity', sym: '', type: 'range', min: 50, max: 3000, step: 50, val: 1000, unit: '$M' },
    { id: 'sv_ebit', label: 'EBIT', sym: '', type: 'range', min: 0, max: 800, step: 10, val: 240, unit: '$M' },
    { id: 'sv_int', label: 'Interest expense', sym: '', type: 'range', min: 1, max: 300, step: 1, val: 40, unit: '$M' }],
  calc(v) {
    const de = v.sv_debt / v.sv_eq, ic = v.sv_ebit / v.sv_int;
    const dc = v.sv_debt / (v.sv_debt + v.sv_eq);
    let insight;
    if (ic < 1.5) insight = `Interest coverage of <strong>${P(ic)}×</strong> is dangerously thin — operating profit barely exceeds the interest bill, so a modest downturn puts the company into default territory. <em>This matters far more than the D/E of ${P(de)}</em>, because coverage is what covenants are written against.`;
    else if (de > 2 && ic > 4) insight = `An apparent contradiction worth understanding: D/E of <strong>${P(de)}</strong> looks aggressive, yet coverage of <strong>${P(ic)}×</strong> is comfortable. <em>The debt is large but cheap and well-serviced.</em> Utilities and infrastructure businesses live here routinely.`;
    else insight = `D/E of <strong>${P(de)}</strong> means $${P(de)} of debt per dollar of equity, and debt funds <strong>${P(dc * 100, 0)}%</strong> of total capital. Coverage of <strong>${P(ic)}×</strong> means operating profit covers the interest bill ${P(ic)} times over.`;
    return { value: P(de) + '×', label: 'Debt-to-equity',
      breakdown: `D/E <strong>${P(de)}</strong> · Debt-to-capital <strong>${P(dc, 3)}</strong> · Interest coverage <strong>${P(ic)}×</strong><br>EBIT $${P(v.sv_ebit, 0)}M against interest of $${P(v.sv_int, 0)}M`, insight };
  },
  traps: [{ label: 'Debt-to-equity is not the equity multiplier', text: 'The DuPont leverage factor is <strong>assets ÷ equity</strong>; this is <strong>debt ÷ equity</strong>. Since assets = debt + other liabilities + equity, the two differ. A D/E of 1.0 does <em>not</em> mean an equity multiplier of 1.0.' }],
  reality: `Rating agencies weight coverage ratios more heavily than balance sheet ratios for exactly the reason above — defaults happen when cash runs out, not when a ratio crosses a threshold.`
}, {
  plain: `Debt-to-equity = total debt ÷ equity. Interest coverage = EBIT ÷ interest expense.`,
  recipe: [`D/E: divide interest-bearing debt by shareholders' equity.`, `Coverage: divide EBIT by interest expense.`, `Debt-to-capital: debt ÷ (debt + equity), if asked.`],
  trick: `Convert freely between D/E and debt-to-capital: if D/E is 0.8, debt-to-capital is 0.8 ÷ 1.8 = 0.44. Questions often give one and ask for the other without saying so directly.`,
  breaks: `Higher coverage is better; higher D/E is worse — the two run in opposite directions and it is easy to reverse one under time pressure. Also, D/E uses debt while the DuPont multiplier uses total assets.`
});

// ── #25 Beta ──────────────────────────────────────────────────────
addC({
  id: 'beta', subject: 'Portfolio Management', name: 'Beta',
  tagline: 'Sensitivity to the market, and where the number comes from',
  bigIdea: `Beta measures how much an asset moves <strong>when the market moves</strong>. It is covariance with the market scaled by market variance — which makes it the market's own risk measured in units of itself, so the market always has a beta of exactly 1.`,
  formula: `β = <span class="hi">Cov(i,m)</span> / <span class="hi2">σ²m</span>&nbsp;&nbsp;=&nbsp;&nbsp;ρ(i,m) × σi / σm`,
  vars: [{ sym: 'Cov(i,m)', def: 'Covariance between the asset and the market' }, { sym: 'σ²m', def: 'Variance of market returns' },
         { sym: 'ρ(i,m)', def: 'Correlation between the asset and the market' }, { sym: 'σi', def: 'Standard deviation of the asset' }],
  intuition: `The second form is the more revealing one. Beta is <strong>correlation multiplied by relative volatility</strong>. A stock can be wildly volatile and still have a low beta if that volatility is uncorrelated with the market — because only the shared movement is systematic, and only systematic risk is compensated.`,
  pullQuote: `"A volatile stock with zero market correlation has a beta of zero, and CAPM says it should earn the risk-free rate. Diversification handles the rest."`,
  connected: ['capm', 'port-var', 'treynor-alpha'],
  inputs: [
    { id: 'bt_rho', label: 'Correlation with market', sym: 'ρ', type: 'range', min: -1, max: 1, step: 0.05, val: 0.6, unit: '' },
    { id: 'bt_si', label: 'Asset std deviation', sym: 'σi', type: 'range', min: 1, max: 60, step: 1, val: 25, unit: '%' },
    { id: 'bt_sm', label: 'Market std deviation', sym: 'σm', type: 'range', min: 1, max: 40, step: 1, val: 15, unit: '%' },
    { id: 'bt_rf', label: 'Risk-free rate', sym: 'Rf', type: 'range', min: 0, max: 8, step: 0.25, val: 3, unit: '%' },
    { id: 'bt_erp', label: 'Equity risk premium', sym: 'ERP', type: 'range', min: 1, max: 12, step: 0.25, val: 5, unit: '%' }],
  calc(v) {
    const b = v.bt_rho * v.bt_si / v.bt_sm, cov = v.bt_rho * v.bt_si * v.bt_sm;
    const req = v.bt_rf + b * v.bt_erp;
    let insight;
    if (Math.abs(v.bt_rho) < 0.1) insight = `Correlation is essentially zero, so beta is <strong>${P(b)}</strong> despite the asset having ${v.bt_si}% volatility — <em>far more than the market's ${v.bt_sm}%</em>. All of that risk is diversifiable, none of it is compensated, and CAPM requires only ${P(req)}%.`;
    else if (b > 1) insight = `Beta of <strong>${P(b)}</strong> means this asset amplifies market moves: the market up 10%, this up roughly ${P(b * 10)}%. Required return is <strong>${P(req)}%</strong>. Notice beta exceeds 1 here because relative volatility (${P(v.bt_si / v.bt_sm)}×) more than offsets a correlation of only ${P(v.bt_rho, 2)}.`;
    else insight = `Beta of <strong>${P(b)}</strong> means this asset dampens market moves. Its ${v.bt_si}% volatility is ${v.bt_si > v.bt_sm ? 'higher' : 'lower'} than the market's ${v.bt_sm}%, but a correlation of ${P(v.bt_rho, 2)} means <em>only part of that movement is systematic</em>.`;
    return { value: P(b), label: 'Beta',
      breakdown: `Covariance: <strong>${P(cov, 1)}</strong> (ρ × σi × σm)<br>β = ${P(v.bt_rho, 2)} × ${v.bt_si} ÷ ${v.bt_sm} = <strong>${P(b)}</strong><br>CAPM required return: <strong>${P(req)}%</strong>`, insight };
  },
  traps: [{ label: 'High volatility does not mean high beta', text: 'Beta captures only the <strong>portion of volatility correlated with the market</strong>. Gold miners and biotech firms can be extremely volatile with modest betas. The exam tests this by giving a high σ alongside a low correlation.' }],
  reality: `Published betas are usually "adjusted" toward 1 using a two-thirds/one-third weighting, because raw historical betas mean-revert. Two data providers can therefore quote different betas for the same stock on the same day.`
}, {
  plain: `Beta = covariance with the market ÷ market variance, which is the same as correlation × (asset volatility ÷ market volatility).`,
  recipe: [`If given covariance: divide by market variance (σm squared).`, `If given correlation: multiply by σi ÷ σm.`, `Feed the result into CAPM for the required return.`],
  trick: `The second form is faster and more intuitive whenever correlation is given. Remember the market's beta is 1 by construction, and the risk-free asset's is 0 — those two anchors catch most arithmetic slips instantly.`,
  breaks: `Watch whether the denominator is market variance or market standard deviation — variance is squared. And a portfolio's beta is the weighted average of its holdings' betas, unlike standard deviation, which is not.`
});

// ── #26 Covariance & correlation ──────────────────────────────────
addC({
  id: 'cov-corr', subject: 'Quantitative Methods', name: 'Covariance & Correlation',
  tagline: 'The same relationship, one with units and one without',
  bigIdea: `Covariance tells you whether two things move together, but its size is meaningless because it carries units. Correlation divides it by both standard deviations to produce <strong>a clean number between −1 and +1</strong> that can be compared across any pair of assets.`,
  formula: `ρ = <span class="hi">Cov(A,B)</span> / (<span class="hi2">σA × σB</span>)&nbsp;&nbsp;&nbsp;so&nbsp;&nbsp;Cov = ρ σA σB`,
  vars: [{ sym: 'Cov(A,B)', def: 'Covariance — sign is meaningful, magnitude is not' }, { sym: 'ρ', def: 'Correlation coefficient, bounded by −1 and +1' },
         { sym: 'σA, σB', def: 'Standard deviations of the two variables' }],
  intuition: `Covariance is <strong>correlation wearing units</strong>. Reading a covariance of 240 tells you only that the two move together — you cannot tell whether that is a strong relationship until you scale it by how volatile each variable is. That scaling is exactly what correlation does.`,
  pullQuote: `"Correlation of zero means no linear relationship. It does not mean no relationship — a perfect parabola has a correlation near zero."`,
  connected: ['port-var', 'beta', 'regression'],
  inputs: [
    { id: 'cc_rho', label: 'Correlation', sym: 'ρ', type: 'range', min: -1, max: 1, step: 0.05, val: 0.4, unit: '' },
    { id: 'cc_sa', label: 'Std deviation of A', sym: 'σA', type: 'range', min: 1, max: 50, step: 1, val: 18, unit: '%' },
    { id: 'cc_sb', label: 'Std deviation of B', sym: 'σB', type: 'range', min: 1, max: 50, step: 1, val: 12, unit: '%' },
    { id: 'cc_w', label: 'Weight in A', sym: 'wA', type: 'range', min: 0, max: 100, step: 5, val: 50, unit: '%' }],
  calc(v) {
    const cov = v.cc_rho * v.cc_sa * v.cc_sb, w = v.cc_w / 100;
    const varp = w * w * v.cc_sa * v.cc_sa + (1 - w) * (1 - w) * v.cc_sb * v.cc_sb + 2 * w * (1 - w) * cov;
    const sd = Math.sqrt(Math.max(varp, 0)), wavg = w * v.cc_sa + (1 - w) * v.cc_sb;
    const benefit = wavg - sd;
    return { value: P(cov, 1), label: 'Covariance',
      breakdown: `Cov = ${P(v.cc_rho, 2)} × ${v.cc_sa} × ${v.cc_sb} = <strong>${P(cov, 1)}</strong><br>Portfolio σ at ${v.cc_w}% in A: <strong>${P(sd)}%</strong><br>Weighted average of the two σ: ${P(wavg)}%`,
      insight: `Correlation of <strong>${P(v.cc_rho, 2)}</strong> produces a covariance of ${P(cov, 1)} — <em>a number whose size means nothing on its own</em>. What it does mean is visible in the portfolio: risk of ${P(sd)}% against a weighted average of ${P(wavg)}%, so imperfect correlation removed <strong>${P(benefit)} percentage points</strong> of risk for free.` };
  },
  traps: [{ label: 'Do not double-scale', text: 'If a question supplies <strong>covariance</strong>, use it directly in the portfolio variance formula. If it supplies <strong>correlation</strong>, you must multiply by both standard deviations first. Applying the sigmas to a figure that is already a covariance is the standard error.' },
          { label: 'Correlation measures linear association only', text: 'A correlation near zero rules out a <strong>linear</strong> relationship, not any relationship. It is also badly distorted by outliers and says nothing about causation.' }],
  reality: `Correlations are not stable, and they tend to rise toward 1 during market crises — precisely when the diversification they promised is most needed. This is the central practical criticism of mean-variance optimisation.`
}, {
  plain: `Correlation = covariance ÷ (σA × σB). Rearranged: covariance = correlation × σA × σB.`,
  recipe: [`To get correlation: divide covariance by the product of the two standard deviations.`, `To get covariance: multiply correlation by both standard deviations.`],
  trick: `Check the sign and the bounds before anything else. Correlation must fall between −1 and +1 — if your arithmetic produces 1.4, you have divided by variance instead of standard deviation.`,
  breaks: `Covariance magnitude is uninterpretable on its own, and correlation captures only linear association. Zero correlation does not imply independence.`
});

// ── #28 Option payoffs ────────────────────────────────────────────
addC({
  id: 'option-payoff', subject: 'Derivatives', name: 'Option Payoffs & Moneyness',
  tagline: 'Exercise value, time value, and the shape of the profit line',
  bigIdea: `An option's value splits into two pieces. <strong>Exercise value</strong> is what you would get by exercising right now — never below zero, because you can always walk away. <strong>Time value</strong> is everything else: what the market pays for the chance that things improve before expiry.`,
  formula: `Call payoff = <span class="hi">Max(S − X, 0)</span>&nbsp;&nbsp;Put payoff = <span class="hi2">Max(X − S, 0)</span>&nbsp;&nbsp;Profit = payoff − premium`,
  vars: [{ sym: 'S', def: 'Price of the underlying' }, { sym: 'X', def: 'Exercise (strike) price' },
         { sym: 'Exercise value', def: 'Value if exercised immediately — floored at zero' }, { sym: 'Time value', def: 'Option price less exercise value' }],
  intuition: `The <strong>Max(·, 0)</strong> is the whole idea. An option is a right, not an obligation, so the downside stops at zero and the premium is the most you can lose. That asymmetry — capped loss, open upside — is why volatility raises the value of both calls and puts.`,
  pullQuote: `"Time value is always positive before expiry and always zero at expiry. Everything an option is worth beyond its exercise value is a bet on time remaining."`,
  connected: ['put-call', 'forward-price'],
  inputs: [
    { id: 'op_s', label: 'Underlying price', sym: 'S', type: 'range', min: 10, max: 200, step: 1, val: 105, unit: '$' },
    { id: 'op_x', label: 'Exercise price', sym: 'X', type: 'range', min: 10, max: 200, step: 1, val: 100, unit: '$' },
    { id: 'op_c', label: 'Call premium paid', sym: 'c', type: 'range', min: 0.5, max: 40, step: 0.5, val: 8, unit: '$' }],
  calc(v) {
    const S = v.op_s, X = v.op_x;
    const cev = Math.max(S - X, 0), pev = Math.max(X - S, 0);
    const tv = v.op_c - cev, profit = cev - v.op_c, be = X + v.op_c;
    const state = S > X ? 'in the money' : S < X ? 'out of the money' : 'at the money';
    let insight;
    if (tv < 0) insight = `The premium of $${P(v.op_c)} is <em>below</em> the exercise value of $${P(cev)} — negative time value, which cannot persist. <strong>An arbitrageur would buy the option, exercise immediately and pocket the difference.</strong> Real option prices never sit here.`;
    else insight = `The call is <strong>${state}</strong>. Of the $${P(v.op_c)} premium, <strong>$${P(cev)}</strong> is exercise value and <strong>$${P(tv)}</strong> is time value. At expiry that time value goes to zero, so the underlying must reach <strong>$${P(be)}</strong> just to break even — <em>being in the money is not the same as being profitable</em>.`;
    return { value: '$' + P(cev), label: 'Call exercise value',
      breakdown: `Call exercise value <strong>$${P(cev)}</strong> · Put exercise value <strong>$${P(pev)}</strong><br>Time value in the call: <strong>$${P(tv)}</strong><br>Profit if expiring now: <strong>$${P(profit)}</strong> · Breakeven: <strong>$${P(be)}</strong>`, insight };
  },
  chart(v) {
    const X = v.op_x, c = v.op_c, lo = Math.max(1, X - 60), hi = X + 60;
    const labels = [], pay = [], prof = [];
    for (let s = lo; s <= hi; s += 2) { labels.push(s); pay.push(Math.max(s - X, 0)); prof.push(Math.max(s - X, 0) - c); }
    return { labels, datasets: [
      { label: 'Payoff at expiry', data: pay, borderWidth: 2.5, pointRadius: 0, backgroundColor: 'transparent' },
      { label: 'Profit (after premium)', data: prof, borderWidth: 2, borderDash: [5, 5], pointRadius: 0, backgroundColor: 'transparent' }],
      xLabel: 'Underlying price at expiry ($)', yLabel: 'Payoff / profit ($)',
      caption: 'The kink sits at the strike. The profit line is the payoff shifted down by the premium — they never cross above zero before breakeven' };
  },
  traps: [{ label: 'Payoff is not profit', text: 'Payoff ignores the premium; profit subtracts it. A call finishing $3 in the money on a $8 premium has a <strong>positive payoff and a $5 loss</strong>. Read which one the question asks for.' },
          { label: 'Moneyness ignores the premium entirely', text: 'In the money means S > X for a call, full stop. It says nothing about whether the trade made money — the breakeven is strike plus premium, always further away.' }],
  reality: `The buyer's maximum loss is the premium and the seller's is theoretically unlimited on a call, which is why writing uncovered calls requires margin and why most retail platforms restrict it.`
}, {
  plain: `Call payoff = Max(S − X, 0). Put payoff = Max(X − S, 0). Subtract the premium for profit.`,
  recipe: [`Compute the exercise value using the Max form — it can never be negative.`, `Time value = option premium − exercise value.`, `Profit = payoff − premium paid.`, `Breakeven for a call = strike + premium; for a put = strike − premium.`],
  trick: `Anchor on the <em>kink at the strike</em>. Left of it a call is flat at zero; right of it it rises one-for-one. Sketching that shape in ten seconds answers most payoff questions faster than any formula.`,
  breaks: `Payoff and profit are different questions and both appear as answer choices. Time value is always positive before expiry — a negative figure means you have mixed up the premium and the exercise value.`
});

// ── #30 Breakeven ─────────────────────────────────────────────────
addC({
  id: 'breakeven', subject: 'Corporate Finance', name: 'Breakeven & Contribution Margin',
  tagline: 'How many units before the fixed costs are covered',
  bigIdea: `Each unit sold contributes <strong>price minus variable cost</strong> toward the fixed costs. Breakeven is simply the point where enough units have been sold that those contributions exactly cover the fixed costs — after which every further contribution is profit.`,
  formula: `Q<sub>BE</sub> = <span class="hi">Fixed Costs</span> / <span class="hi2">(P − V)</span>`,
  vars: [{ sym: 'P − V', def: 'Contribution margin per unit' }, { sym: 'Fixed Costs', def: 'Costs that do not vary with volume' },
         { sym: 'Q(BE)', def: 'Breakeven quantity in units' }],
  intuition: `Picture <strong>filling a bucket</strong>. Fixed costs are the depth of the bucket; each unit's contribution margin is one cup of water. Breakeven is when the bucket is full. A bigger bucket or a smaller cup means more units before you see a profit.`,
  pullQuote: `"Operating leverage and breakeven are the same fact viewed twice — both are driven by the ratio of fixed costs to contribution margin."`,
  connected: ['leverage-op', 'npv'],
  inputs: [
    { id: 'be_p', label: 'Price per unit', sym: 'P', type: 'range', min: 1, max: 300, step: 1, val: 60, unit: '$' },
    { id: 'be_v', label: 'Variable cost per unit', sym: 'V', type: 'range', min: 0, max: 250, step: 1, val: 35, unit: '$' },
    { id: 'be_f', label: 'Fixed costs', sym: 'F', type: 'range', min: 0, max: 2000000, step: 25000, val: 500000, unit: '$' },
    { id: 'be_q', label: 'Actual units sold', sym: 'Q', type: 'range', min: 0, max: 100000, step: 1000, val: 30000, unit: '' }],
  calc(v) {
    const cm = v.be_p - v.be_v;
    if (cm <= 0) return { value: 'never', label: 'Breakeven quantity', breakdown: 'Contribution margin is zero or negative.', insight: `At $${v.be_p} price against $${v.be_v} variable cost, <em>every unit sold loses money before fixed costs are even considered</em>. No volume can reach breakeven — the problem is the unit economics, not the scale.` };
    const q = v.be_f / cm, profit = cm * v.be_q - v.be_f;
    const margin = v.be_q > 0 ? (v.be_q - q) / v.be_q * 100 : 0;
    return { value: Math.round(q).toLocaleString(), label: 'Breakeven quantity',
      breakdown: `Contribution margin: <strong>$${P(cm)}</strong> per unit (${P(cm / v.be_p * 100, 0)}% of price)<br>Breakeven: <strong>${Math.round(q).toLocaleString()}</strong> units · Actual: ${v.be_q.toLocaleString()}<br>Operating profit: <strong>$${P(profit, 0)}</strong>`,
      insight: v.be_q >= q
        ? `Selling ${v.be_q.toLocaleString()} against a breakeven of ${Math.round(q).toLocaleString()} gives a <strong>margin of safety of ${P(margin, 0)}%</strong> — sales could fall by that much before losses begin. Each unit beyond breakeven adds the full $${P(cm)} contribution straight to profit.`
        : `Sales of ${v.be_q.toLocaleString()} fall <strong>${Math.round(q - v.be_q).toLocaleString()} units short</strong> of the ${Math.round(q).toLocaleString()} needed. The loss of $${P(Math.abs(profit), 0)} is simply the uncovered portion of fixed costs.` };
  },
  traps: [{ label: 'Breakeven is not the shutdown point', text: 'Breakeven covers <strong>all</strong> costs. The shutdown point only asks whether revenue covers <strong>variable</strong> costs — in the short run a firm should keep operating below breakeven as long as it covers variable costs, because fixed costs are sunk either way.' }],
  reality: `Software businesses have near-zero variable costs, so their contribution margin approaches 100% and breakeven is entirely a function of fixed costs. Once past it, almost all incremental revenue drops to profit — which is why the model rewards scale so heavily.`
}, {
  plain: `Breakeven units = fixed costs ÷ (price − variable cost per unit).`,
  recipe: [`Contribution margin = price − variable cost per unit.`, `Divide fixed costs by that margin.`, `For a target profit, add it to fixed costs before dividing.`],
  trick: `The same structure answers three questions. Fixed costs ÷ margin gives breakeven; (fixed + target profit) ÷ margin gives the volume for a target; and variable costs alone in the denominator gives the shutdown point.`,
  breaks: `Distinguish breakeven from the shutdown point — the exam pairs them deliberately. And if contribution margin is negative, no volume achieves breakeven, which is a valid answer rather than an arithmetic error.`
});

// ── #31 Current yield ─────────────────────────────────────────────
addC({
  id: 'current-yield', subject: 'Fixed Income', name: 'Current Yield & Yield Measures',
  tagline: 'Why three yields on one bond all differ',
  bigIdea: `The same bond carries several yields, each ignoring something. <strong>Coupon rate</strong> ignores the price you paid. <strong>Current yield</strong> counts the price but ignores the pull to par. <strong>Yield to maturity</strong> counts everything — which is why it is the only one that fully describes the return.`,
  formula: `Current Yield = <span class="hi">Annual Coupon</span> / <span class="hi2">Bond Price</span>`,
  vars: [{ sym: 'Annual Coupon', def: 'Coupon rate × face value' }, { sym: 'Bond Price', def: 'Current market (clean) price' },
         { sym: 'Coupon rate', def: 'Coupon as a percentage of face, fixed at issue' }],
  intuition: `Current yield answers a narrow question: <strong>how much cash income per dollar invested?</strong> It says nothing about the capital gain or loss you will realise as the price drifts toward par at maturity. For a discount bond that omission understates your return; for a premium bond it overstates it.`,
  pullQuote: `"For a discount bond: coupon rate < current yield < YTM. For a premium bond the whole ordering reverses. Learn the chain, not three separate facts."`,
  connected: ['bond-price', 'ytm-ytc-ytw', 'mod-duration'],
  inputs: [
    { id: 'cy_face', label: 'Face value', sym: 'FV', type: 'number', min: 100, max: 10000, step: 100, val: 1000, unit: '$' },
    { id: 'cy_cpn', label: 'Coupon rate', sym: '', type: 'range', min: 0, max: 15, step: 0.25, val: 5, unit: '%' },
    { id: 'cy_price', label: 'Market price', sym: 'P', type: 'range', min: 400, max: 1600, step: 5, val: 920, unit: '$' },
    { id: 'cy_n', label: 'Years to maturity', sym: 'n', type: 'range', min: 1, max: 30, step: 1, val: 8, unit: 'yrs' }],
  calc(v) {
    const cpn = v.cy_face * v.cy_cpn / 100, cy = cpn / v.cy_price;
    // approximate YTM
    const ytm = (cpn + (v.cy_face - v.cy_price) / v.cy_n) / ((v.cy_face + v.cy_price) / 2);
    const disc = v.cy_price < v.cy_face;
    return { value: P(cy * 100) + '%', label: 'Current yield',
      breakdown: `Annual coupon <strong>$${P(cpn, 0)}</strong> ÷ price <strong>$${P(v.cy_price, 0)}</strong><br>Coupon rate ${P(v.cy_cpn)}% · Current yield <strong>${P(cy * 100)}%</strong> · Approx YTM <strong>${P(ytm * 100)}%</strong><br>Trading at a <strong>${disc ? 'discount' : v.cy_price > v.cy_face ? 'premium' : 'par'}</strong>`,
      insight: disc
        ? `At a discount, the ordering runs <em>coupon ${P(v.cy_cpn)}% &lt; current yield ${P(cy * 100)}% &lt; YTM ${P(ytm * 100)}%</em>. Current yield beats the coupon because you paid less than face; YTM beats current yield because <strong>you also collect the pull to par</strong> — a capital gain current yield completely ignores.`
        : v.cy_price > v.cy_face
          ? `At a premium the chain reverses: <em>coupon ${P(v.cy_cpn)}% &gt; current yield ${P(cy * 100)}% &gt; YTM ${P(ytm * 100)}%</em>. You will suffer a capital loss as the price falls toward par, and only YTM accounts for it.`
          : `Priced at par, all three measures converge at ${P(v.cy_cpn)}%. <em>There is no pull to par and no capital gain or loss</em>, so the distinctions between the yield measures vanish.` };
  },
  traps: [{ label: 'Current yield ignores the capital component entirely', text: 'It is coupon income only. Two bonds with the same current yield can have very different total returns if one trades at a discount and the other at a premium. Never rank bonds on current yield.' }],
  reality: `Income-focused investors still quote current yield because it maps to the cash they will actually receive each year. It is a cash-flow planning number rather than a return measure.`
}, {
  plain: `Current yield = annual coupon ÷ current market price.`,
  recipe: [`Annual coupon = coupon rate × face value.`, `Divide by the current price.`],
  trick: `Memorise the chain rather than three facts. Discount bond: coupon &lt; current yield &lt; YTM. Premium bond: coupon &gt; current yield &gt; YTM. At par all three are equal. Most questions here only need the ordering.`,
  breaks: `Current yield uses the clean price and counts no capital gain, so it is not a return measure. Use YTM whenever the question compares bonds or mentions holding to maturity.`
});

// ── #33 Money-weighted vs time-weighted ───────────────────────────
addC({
  id: 'mwr-twr', subject: 'Quantitative Methods', name: 'Money-Weighted vs Time-Weighted Return',
  tagline: 'Judging the investor, or judging the manager',
  bigIdea: `They answer different questions. <strong>Money-weighted return is the IRR of the actual cash flows</strong> — it rewards or punishes the timing of deposits, so it measures the investor. <strong>Time-weighted return chains the period returns</strong> and ignores flow timing entirely, so it measures the manager.`,
  formula: `MWR: solve <span class="hi">Σ CFt/(1+MWR)^t = 0</span>&nbsp;&nbsp;TWR = <span class="hi2">[(1+r1)(1+r2)...]</span>^(1/n) − 1`,
  vars: [{ sym: 'CFt', def: 'Cash flow at time t, including the ending value' }, { sym: 'r1, r2', def: 'Return in each sub-period between cash flows' },
         { sym: 'MWR', def: 'Internal rate of return of the account' }, { sym: 'TWR', def: 'Geometric chain of sub-period returns' }],
  intuition: `If an investor adds a large sum <strong>just before a good year</strong>, more of their money experiences the good return, so MWR exceeds TWR. Add just before a bad year and MWR falls below. The manager earned the same returns either way — which is precisely why performance standards require TWR.`,
  pullQuote: `"An investor can lose money in a fund that gained 20%, simply by buying more at the top. That gap is the whole distinction."`,
  connected: ['npv', 'tvm', 'hpr'],
  inputs: [
    { id: 'mw_v0', label: 'Initial investment', sym: '', type: 'number', min: 100, max: 1000000, step: 100, val: 1000, unit: '$' },
    { id: 'mw_r1', label: 'Year 1 return', sym: 'r₁', type: 'range', min: -40, max: 60, step: 1, val: 10, unit: '%' },
    { id: 'mw_add', label: 'Added at end of year 1', sym: '', type: 'range', min: -2000, max: 10000, step: 100, val: 4000, unit: '$' },
    { id: 'mw_r2', label: 'Year 2 return', sym: 'r₂', type: 'range', min: -40, max: 60, step: 1, val: -10, unit: '%' }],
  calc(v) {
    const r1 = v.mw_r1 / 100, r2 = v.mw_r2 / 100;
    const v1 = v.mw_v0 * (1 + r1), v1b = v1 + v.mw_add, v2 = v1b * (1 + r2);
    const twr = Math.pow((1 + r1) * (1 + r2), 0.5) - 1;
    // IRR of: -V0 at t0, -add at t1, +V2 at t2
    let lo = -0.95, hi = 5;
    const f = r => -v.mw_v0 * Math.pow(1 + r, 2) - v.mw_add * (1 + r) + v2;
    let mwr = 0;
    if (f(lo) * f(hi) < 0) { for (let i = 0; i < 200; i++) { mwr = (lo + hi) / 2; if (f(lo) * f(mwr) <= 0) hi = mwr; else lo = mwr; } }
    else mwr = NaN;
    const gap = (mwr - twr) * 100;
    let insight;
    if (!isFinite(mwr)) insight = `These cash flows have no single meaningful IRR — a known limitation of money-weighted return when flows change sign awkwardly. <em>Time-weighted return of ${P(twr * 100)}% remains well defined</em>, which is one reason performance standards prefer it.`;
    else if (gap < -0.5) insight = `MWR of <strong>${P(mwr * 100)}%</strong> sits <em>below</em> the TWR of <strong>${P(twr * 100)}%</strong>. The investor added $${P(v.mw_add, 0)} right before a ${v.mw_r2}% year, so <strong>more money was exposed to the worse period</strong>. The manager's record is the ${P(twr * 100)}%; the investor's experience is the ${P(mwr * 100)}%.`;
    else if (gap > 0.5) insight = `MWR of <strong>${P(mwr * 100)}%</strong> exceeds the TWR of <strong>${P(twr * 100)}%</strong> — the investor's timing helped, putting more capital to work before the stronger period. <em>That skill belongs to the investor, not the manager</em>, which is why it is stripped out of published performance.`;
    else insight = `The two measures nearly agree at <strong>${P(twr * 100)}%</strong>, because the cash flow was small or the two periods performed similarly. <em>The gap only opens when large flows meet uneven returns.</em>`;
    return { value: P(twr * 100) + '%', label: 'Time-weighted return (annual)',
      breakdown: `TWR: chain of ${v.mw_r1}% and ${v.mw_r2}% = <strong>${P(twr * 100)}%</strong> per year<br>MWR (IRR of the flows): <strong>${isFinite(mwr) ? P(mwr * 100) + '%' : 'undefined'}</strong><br>Ending value: <strong>$${P(v2, 0)}</strong>`, insight };
  },
  traps: [{ label: 'GIPS requires time-weighted', text: 'Performance presentation standards mandate <strong>time-weighted</strong> return, because managers do not control when clients deposit or withdraw. Money-weighted is appropriate when the manager <em>does</em> control the flows — private equity capital calls being the standard exception.' }],
  reality: `The gap between fund returns and investor returns is measured annually and is persistently negative — retail investors add money after strong periods and withdraw after weak ones, so their money-weighted experience trails the funds they own.`
}, {
  plain: `Money-weighted return is the IRR of the actual cash flows. Time-weighted return chains the sub-period returns and ignores flow timing.`,
  recipe: [`For TWR: compute each sub-period return, multiply the (1 + r) terms, take the nth root, subtract 1.`, `For MWR: set up the cash flows including the ending value and solve for IRR on the calculator.`],
  trick: `You can usually answer the comparison without computing either. If money went in <em>before</em> the stronger period, MWR &gt; TWR. If it went in before the weaker period, MWR &lt; TWR. Many questions ask only for that direction.`,
  breaks: `TWR is required for evaluating managers and for GIPS compliance; MWR measures the investor's own experience. Picking the wrong one is what the question is testing, not the arithmetic.`
});

// ── #34 Accrued interest ──────────────────────────────────────────
addC({
  id: 'accrued', subject: 'Fixed Income', name: 'Accrued Interest & Dirty Price',
  tagline: 'Why the price you pay is not the price you are quoted',
  bigIdea: `Bonds are quoted <strong>clean</strong> — without the coupon that has built up since the last payment date. But the seller earned that portion, so the buyer pays it. What actually changes hands is the <strong>dirty price</strong>: quoted price plus accrued interest.`,
  formula: `AI = <span class="hi">(Days since last coupon / Days in period)</span> × <span class="hi2">Coupon Payment</span>`,
  vars: [{ sym: 'AI', def: 'Accrued interest owed to the seller' }, { sym: 'Clean price', def: 'The quoted price, excluding accrued interest' },
         { sym: 'Dirty price', def: 'Clean price + accrued interest — what is actually paid' },
         { sym: 'Day count', def: '30/360 for most corporates; actual/actual for treasuries' }],
  intuition: `Think of it as <strong>splitting a rent cheque</strong>. The next coupon will be paid in full to whoever holds the bond on the payment date, but the seller held it for part of the period and earned part of it. Accrued interest transfers that share at settlement rather than waiting.`,
  pullQuote: `"Clean prices are quoted because they do not sawtooth. Dirty prices jump down on every coupon date, which would make price charts unreadable."`,
  connected: ['bond-price', 'current-yield', 'ytm-ytc-ytw'],
  inputs: [
    { id: 'ai_face', label: 'Face value', sym: 'FV', type: 'number', min: 100, max: 10000, step: 100, val: 1000, unit: '$' },
    { id: 'ai_cpn', label: 'Annual coupon rate', sym: '', type: 'range', min: 0, max: 12, step: 0.25, val: 6, unit: '%' },
    { id: 'ai_clean', label: 'Clean (quoted) price', sym: '', type: 'range', min: 500, max: 1500, step: 5, val: 985, unit: '$' },
    { id: 'ai_days', label: 'Days since last coupon', sym: '', type: 'range', min: 0, max: 180, step: 1, val: 60, unit: '' },
    { id: 'ai_period', label: 'Days in coupon period', sym: '', type: 'range', min: 90, max: 184, step: 1, val: 180, unit: '' }],
  calc(v) {
    const cpnPay = v.ai_face * v.ai_cpn / 100 / 2;
    const frac = Math.min(v.ai_days / v.ai_period, 1);
    const ai = frac * cpnPay, dirty = v.ai_clean + ai;
    return { value: '$' + P(ai), label: 'Accrued interest',
      breakdown: `Semi-annual coupon: <strong>$${P(cpnPay)}</strong><br>Elapsed: ${v.ai_days}/${v.ai_period} = <strong>${P(frac * 100, 1)}%</strong> of the period<br>Clean $${P(v.ai_clean, 0)} + accrued $${P(ai)} = dirty <strong>$${P(dirty)}</strong>`,
      insight: `The buyer pays <strong>$${P(dirty)}</strong>, not the quoted $${P(v.ai_clean, 0)}. Of the $${P(cpnPay)} coupon coming, <em>$${P(ai)} was earned by the seller</em> and is being reimbursed now. On the next payment date the buyer receives the whole $${P(cpnPay)}, netting the $${P(cpnPay - ai)} they actually earned.` };
  },
  traps: [{ label: 'Day count conventions differ by instrument', text: 'US Treasuries use <strong>actual/actual</strong>; most corporate and municipal bonds use <strong>30/360</strong>, which treats every month as 30 days. The convention is given in the question and changes the answer — read for it before calculating.' },
          { label: 'Full price includes accrued, quoted price does not', text: 'Yield and duration calculations conventionally use the clean price, but the cash that settles is the dirty price. Mixing them produces answers that are close enough to look plausible.' }],
  reality: `Between the ex-coupon date and the payment date the convention flips and accrued interest is negative, because the seller will receive a coupon covering days the buyer owns the bond.`
}, {
  plain: `Accrued interest = (days since the last coupon ÷ days in the coupon period) × the coupon payment. Add it to the quoted price to get what is actually paid.`,
  recipe: [`Coupon payment = face × annual rate ÷ number of payments per year.`, `Work out the fraction of the period elapsed using the stated day count.`, `Multiply, then add to the clean price for the dirty price.`],
  trick: `Sanity-check with the halfway point: at exactly mid-period, accrued interest is half the coupon payment. If your answer is not near that when the days are near half, you have the fraction inverted.`,
  breaks: `The day count convention changes the answer — 30/360 for corporates, actual/actual for Treasuries. And remember quoted prices are clean while settlement is dirty.`
});

// ── P/S ratio ─────────────────────────────────────────────────────
addC({
  id: 'ps-ratio', subject: 'Equity Valuation', name: 'Price-to-Sales',
  tagline: 'The multiple that still works when earnings do not',
  bigIdea: `When a company has no earnings and no book value worth speaking of, P/E and P/B both break. Sales are almost always positive and are <strong>far harder to manipulate</strong> than earnings, so P/S keeps working where the others fail — at the cost of ignoring profitability entirely.`,
  formula: `P/S = <span class="hi">Price per Share</span> / <span class="hi2">Sales per Share</span>&nbsp;&nbsp;=&nbsp;&nbsp;Market Cap / Revenue`,
  vars: [{ sym: 'Sales per share', def: 'Total revenue ÷ shares outstanding' }, { sym: 'Net margin', def: 'The bridge between P/S and P/E' },
         { sym: 'P/E', def: 'P/S ÷ net margin' }],
  intuition: `P/S and P/E are joined by a single number: <strong>P/S = P/E × net margin</strong>. A company on 2× sales with a 10% margin is on 20× earnings. This is why P/S alone means nothing — <em>a low P/S on a business that cannot convert revenue to profit is not cheap</em>.`,
  pullQuote: `"Revenue is the hardest line to fake and the least informative to own. P/S trades reliability for relevance."`,
  connected: ['pe-ratio', 'pb-ratio', 'ev-ebitda'],
  inputs: [
    { id: 'ps_price', label: 'Share price', sym: 'P', type: 'range', min: 1, max: 500, step: 1, val: 45, unit: '$' },
    { id: 'ps_rev', label: 'Revenue', sym: '', type: 'range', min: 10, max: 20000, step: 10, val: 2000, unit: '$M' },
    { id: 'ps_sh', label: 'Shares outstanding', sym: '', type: 'range', min: 1, max: 2000, step: 1, val: 100, unit: 'M' },
    { id: 'ps_margin', label: 'Net profit margin', sym: '', type: 'range', min: -20, max: 40, step: 0.5, val: 8, unit: '%' }],
  calc(v) {
    const sps = v.ps_rev / v.ps_sh, ps = v.ps_price / sps, m = v.ps_margin / 100;
    const pe = m > 0 ? ps / m : NaN;
    return { value: P(ps) + '×', label: 'Price-to-sales',
      breakdown: `Sales per share: <strong>$${P(sps)}</strong> ($${P(v.ps_rev, 0)}M ÷ ${P(v.ps_sh, 0)}M shares)<br>P/S = $${P(v.ps_price, 0)} ÷ $${P(sps)} = <strong>${P(ps)}×</strong><br>Implied P/E at a ${v.ps_margin}% margin: <strong>${isFinite(pe) ? P(pe) + '×' : 'n/a — loss-making'}</strong>`,
      insight: m <= 0
        ? `The company is loss-making, so <strong>P/E does not exist</strong> and P/S of ${P(ps)}× is one of the few multiples still computable. <em>That is exactly its purpose</em> — but it tells you nothing about whether this revenue will ever become profit.`
        : `A P/S of <strong>${P(ps)}×</strong> on a ${v.ps_margin}% net margin implies a P/E of <strong>${P(pe)}×</strong>. <em>The margin does all the work in that translation</em>: hold P/S constant and halve the margin, and the P/E doubles.` };
  },
  traps: [{ label: 'Low P/S is not automatically cheap', text: 'Grocers trade on very low P/S because their margins are razor thin; software firms trade on high P/S because theirs are wide. Comparing P/S across industries with different margin structures is <strong>meaningless</strong> without adjusting for profitability.' }],
  reality: `P/S dominates in early-stage technology and biotech coverage, where profits are years away. It is also used as a sanity check against earnings-based multiples, since revenue is much harder to manage upward than net income.`
}, {
  plain: `Price-to-sales = share price ÷ sales per share, which is the same as market cap ÷ revenue.`,
  recipe: [`Sales per share = revenue ÷ shares outstanding.`, `Divide the share price by that figure.`],
  trick: `The bridge to P/E is one line: <em>P/S = P/E × net margin</em>. Given any two, you have the third — and it instantly shows why a low P/S on a low-margin business is not a bargain.`,
  breaks: `P/S ignores cost structure and leverage entirely, so it is only comparable within an industry. Where capital structures differ, EV/Sales is the sounder measure.`
});

// ── Hedge fund fees (Alternatives) ────────────────────────────────
addC({
  id: 'hf-fees', subject: 'Portfolio Management', name: 'Hedge Fund Fee Structures',
  tagline: 'Two-and-twenty, hurdles and the high-water mark',
  bigIdea: `Alternative managers charge twice: a <strong>management fee</strong> on assets regardless of performance, and an <strong>incentive fee</strong> on gains. Hurdle rates and high-water marks exist to stop investors paying performance fees on returns that are not genuinely new.`,
  formula: `Net = Gross − <span class="hi">mgmt% × assets</span> − <span class="hi2">incentive% × (gain above hurdle & HWM)</span>`,
  vars: [{ sym: 'Management fee', def: 'Charged on assets — often beginning or ending value, and the question will specify' },
         { sym: 'Incentive fee', def: 'Charged on profits, typically 20%' },
         { sym: 'Hurdle rate', def: 'Minimum return before incentive fees apply' },
         { sym: 'High-water mark', def: 'The peak value previously reached — losses must be recovered before fees resume' }],
  intuition: `The high-water mark stops <strong>paying twice for the same gains</strong>. If a fund falls 20% and then rises 20%, investors are still below where they started — charging a performance fee on that rebound would reward the manager for repairing their own damage.`,
  pullQuote: `"Two-and-twenty on a 10% gross return leaves the investor with roughly 6.4%. The manager takes over a third of the gain for none of the risk."`,
  connected: ['sharpe', 'frontier'],
  inputs: [
    { id: 'hf_v0', label: 'Beginning value', sym: '', type: 'number', min: 1, max: 10000, step: 1, val: 100, unit: '$M' },
    { id: 'hf_gross', label: 'Gross return', sym: '', type: 'range', min: -40, max: 60, step: 1, val: 20, unit: '%' },
    { id: 'hf_mgmt', label: 'Management fee', sym: '', type: 'range', min: 0, max: 4, step: 0.25, val: 2, unit: '%' },
    { id: 'hf_inc', label: 'Incentive fee', sym: '', type: 'range', min: 0, max: 30, step: 1, val: 20, unit: '%' },
    { id: 'hf_hurdle', label: 'Hurdle rate', sym: '', type: 'range', min: 0, max: 12, step: 0.5, val: 0, unit: '%' },
    { id: 'hf_hwm', label: 'High-water mark', sym: '', type: 'range', min: 0, max: 300, step: 1, val: 100, unit: '$M' }],
  calc(v) {
    const v0 = v.hf_v0, gross = v0 * (1 + v.hf_gross / 100);
    const mgmt = v0 * v.hf_mgmt / 100;
    const hurdleVal = v0 * (1 + v.hf_hurdle / 100);
    const base = Math.max(hurdleVal, v.hf_hwm);
    const excess = Math.max(gross - base, 0);
    const inc = excess * v.hf_inc / 100;
    const net = gross - mgmt - inc;
    const netRet = (net / v0 - 1) * 100, feeShare = v.hf_gross > 0 ? (mgmt + inc) / (gross - v0) * 100 : 0;
    let insight;
    if (gross <= v.hf_hwm) insight = `Ending value of $${P(gross, 1)}M is at or below the high-water mark of $${P(v.hf_hwm, 0)}M, so <strong>no incentive fee is charged</strong>. The manager still collects $${P(mgmt, 2)}M in management fees — <em>the base fee is payable whether or not anyone makes money</em>.`;
    else if (v.hf_hurdle > 0) insight = `The incentive fee applies only above the higher of the hurdle ($${P(hurdleVal, 1)}M) and the high-water mark ($${P(v.hf_hwm, 0)}M). Excess of <strong>$${P(excess, 2)}M</strong> generates a $${P(inc, 2)}M performance fee, leaving investors <strong>${P(netRet)}%</strong> from a ${v.hf_gross}% gross return.`;
    else insight = `A ${v.hf_gross}% gross return becomes <strong>${P(netRet)}%</strong> net. Fees consumed <strong>${P(feeShare, 0)}%</strong> of the gain — $${P(mgmt, 2)}M management plus $${P(inc, 2)}M incentive. <em>The management fee is charged regardless of performance</em>, which is why it hurts most in flat years.`;
    return { value: P(netRet) + '%', label: 'Net return to investor',
      breakdown: `Gross value $${P(gross, 1)}M · Management fee <strong>$${P(mgmt, 2)}M</strong> · Incentive fee <strong>$${P(inc, 2)}M</strong><br>Net to investor: <strong>$${P(net, 2)}M</strong> from $${P(v0, 0)}M`, insight };
  },
  traps: [{ label: 'Hurdle and high-water mark are not the same thing', text: 'A <strong>hurdle</strong> is a minimum return this period. A <strong>high-water mark</strong> is the highest value ever reached. When both apply, the incentive fee is charged only above whichever is higher — and questions routinely provide both to see if you take only one.' },
          { label: 'Check what the management fee is charged on', text: 'It may be on beginning assets, ending assets, or average assets, and it may be deducted <strong>before</strong> the incentive fee is calculated. The question always specifies; the ordering changes the answer.' }],
  reality: `Fee pressure has compressed the classic two-and-twenty toward roughly 1.4 and 17 across the industry, and funds of funds add a second layer on top — which is the main reason their net returns have struggled to justify the structure.`
}, {
  plain: `Management fee on assets, plus an incentive fee on gains above both the hurdle rate and the high-water mark.`,
  recipe: [`Management fee = fee rate × the specified asset base.`, `Find the incentive threshold: the higher of the hurdle value and the high-water mark.`, `Incentive fee = rate × (ending value − threshold), floored at zero.`, `Net value = gross − both fees.`],
  trick: `Two-and-twenty on a 10% gross return nets roughly 6.4%. Carrying that anchor lets you eliminate implausible answer choices instantly.`,
  breaks: `Check whether the management fee is on beginning, ending or average assets, and whether it comes out before the incentive fee is computed. Where both a hurdle and a high-water mark exist, only the higher one binds.`
});

const EXPLAINERS = [

  {
    id: 'x-alt-categories',
    subject: 'Alternative Investments',
    name: 'What makes an investment "alternative"',
    tagline: 'The shared characteristics, and why they travel together',
    brief: `Private equity, hedge funds, real estate, infrastructure, commodities and digital assets are grouped together despite having almost nothing in common as businesses. The grouping is not about what they invest in — it is about <strong>how they are structured, priced and accessed</strong>.`,
    prompt: `Before opening: name four characteristics these categories share, and explain why illiquidity and high fees tend to appear together.`,
    sections: [
      { h: 'The shared characteristics', b: `Narrow specialisation by the manager, relatively low correlation with traditional assets, less regulation and less transparency, limited and often restricted access, <strong>illiquidity</strong>, potential use of leverage, complex legal structures, and fee models that include a performance component. Not every alternative shows all of these, but the more a category shows, the more "alternative" it is treated as being.` },
      { h: 'Why illiquidity sits at the centre', b: `Most of the other characteristics follow from it. If investors cannot withdraw quickly, the manager can hold assets that take years to work out — which justifies specialisation, permits leverage, and supports a performance fee measured over a long horizon. It is also why valuations are infrequent and often based on appraisal rather than market price.` },
      { h: 'The main categories', b: `<strong>Private capital</strong> splits into private equity (buyout, venture) and private debt (direct lending, mezzanine, distressed). <strong>Real assets</strong> covers real estate, infrastructure, commodities, timberland and farmland. <strong>Hedge funds</strong> are defined by strategy rather than asset class. <strong>Digital assets</strong> is the newest addition.` },
      { h: 'How investors access them', b: `Three routes, each with different economics: <strong>direct investment</strong> (most control, highest minimum, no fee layer), <strong>co-investment</strong> alongside a fund (partial control, reduced fees), and <strong>fund investment</strong> (least control, full fees, most diversification and least required expertise). Fund-of-funds adds a second fee layer on top.` }
    ],
    examTests: `Questions here usually ask you to identify a characteristic that is <em>not</em> typical, or to rank the three access routes by control, fees or required expertise. Learn the ordering — direct, co-investment, fund — and the fact that it runs the same way for control and for fee burden but the opposite way for diversification.`
  },

  {
    id: 'x-pe',
    subject: 'Alternative Investments',
    name: 'Private equity structures',
    tagline: 'Buyout, venture, the J-curve, and how money comes back',
    brief: `Private equity funds do not take your money on day one and they do not return it on a schedule. Capital is <strong>committed</strong>, then called when needed, then returned as investments are exited — which produces a distinctive return pattern that looks alarming for the first several years.`,
    prompt: `Before opening: explain why a healthy private equity fund shows negative returns in its early years, and name three ways a fund exits an investment.`,
    sections: [
      { h: 'Buyout versus venture capital', b: `<strong>Buyout</strong> acquires mature, cash-generative companies, usually with substantial debt, and creates value through operational improvement and deleveraging. Returns are moderate but the failure rate is low. <strong>Venture capital</strong> funds early-stage companies with equity rather than debt, expects most investments to fail, and relies on a small number of very large winners. Buyout uses leverage; venture generally cannot, because the companies have no cash flow to service it.` },
      { h: 'The J-curve', b: `Early years show negative returns because <strong>fees are charged on committed capital from the start</strong> while investments are still immature and carried at cost. As portfolio companies are written up and exited, returns turn positive and the curve rises. A negative IRR in year two is normal, not a warning sign — which is why judging a fund before roughly year five is meaningless.` },
      { h: 'Exit routes', b: `<strong>Trade sale</strong> to a strategic buyer (often the highest price, since synergies are available), <strong>secondary sale</strong> to another financial sponsor, <strong>IPO</strong> (highest valuations in strong markets but slowest and most costly), <strong>recapitalisation</strong> (borrowing to pay a dividend — extracts cash without exiting), and <strong>write-off</strong>. Exit route and timing drive returns more than entry price in many deals.` },
      { h: 'Performance measures', b: `Because cash flows are irregular and controlled by the manager, <strong>money-weighted return (IRR) is appropriate here</strong> — the exception to the usual preference for time-weighted. Alongside it: <strong>MOIC</strong> (total value ÷ paid-in), <strong>DPI</strong> (distributions ÷ paid-in, what you have actually received), <strong>RVPI</strong> (residual value ÷ paid-in, what is still on paper) and <strong>TVPI</strong> = DPI + RVPI.` }
    ],
    examTests: `The J-curve and the IRR exception are the two most testable points. Note the logic of the exception: time-weighted return is required when the manager does not control cash flows — in private equity the manager <em>does</em> control them through capital calls, so money-weighted is the correct measure.`
  },

  {
    id: 'x-hedge-strategies',
    subject: 'Alternative Investments',
    name: 'Hedge fund strategies',
    tagline: 'Four families, and what each is actually betting on',
    brief: `"Hedge fund" describes a structure, not a strategy. The label covers approaches with almost opposite risk profiles, which is why an index of hedge funds tells you very little. The curriculum groups them into <strong>four broad families</strong>.`,
    prompt: `Before opening: name the four strategy families, and identify which one is most exposed to a sudden loss of market liquidity.`,
    sections: [
      { h: 'Equity hedge', b: `Trades primarily in equities, taking both long and short positions. Includes long/short equity, <strong>market neutral</strong> (beta deliberately near zero, returns come from stock selection alone), short-biased, and fundamental growth or value approaches. The defining question is how much market exposure remains after the shorts.` },
      { h: 'Event driven', b: `Bets on corporate events. <strong>Merger arbitrage</strong> buys the target and shorts the acquirer, earning the deal spread but losing heavily if the deal breaks. Also distressed/restructuring, special situations, and activist strategies. Returns look steady with occasional sharp losses — a short-volatility profile.` },
      { h: 'Relative value', b: `Exploits pricing differences between related securities: convertible arbitrage, fixed-income arbitrage, volatility trades. Individual spreads are small, so <strong>leverage is heavy</strong>. This family is the most vulnerable to a liquidity shock, because forced deleveraging widens the very spreads the strategy is betting will narrow.` },
      { h: 'Macro and CTA', b: `<strong>Global macro</strong> takes directional positions on currencies, rates, commodities and indices based on economic views. <strong>Managed futures / CTAs</strong> are usually systematic and trend-following. This family tends to perform well in sustained market moves — including downturns — which gives it the most genuine diversification value of the four.` }
    ],

  {
    id: 'x-real-estate',
    subject: 'Alternative Investments',
    name: 'Real estate',
    tagline: 'Four ways to own it, three ways to value it',
    brief: `Real estate can be held privately or publicly, as equity or as debt — a two-by-two grid that produces four very different investments in the same underlying buildings.`,

      { h: 'The cap rate', b: `Net operating income divided by property value — effectively a yield, and the inverse of a price multiple. A <strong>lower cap rate means a more expensive property</strong>, which is the reverse of how yield intuition usually runs. Cap rates fall when interest rates fall or when the location is seen as safer.` },
      { h: 'Why the return data flatters', b: `Private real estate is valued by <strong>appraisal, not transaction</strong>. Appraisals are infrequent and anchored on the previous appraisal, so reported returns are smoothed. That understates true volatility and understates correlation with other assets — making the diversification benefit look larger than it is.` }
    ],
    examTests: `The appraisal-smoothing point applies to every illiquid asset class and is a favourite. Also know that a lower cap rate signals a higher price, and that REITs behave far more like equities than like the property they hold — which undermines the diversification argument for the public quadrants.`

  {
    id: 'x-commodities',
    subject: 'Alternative Investments',
    name: 'Commodities and roll yield',
    tagline: 'Contango, backwardation, and where the return actually comes from',
    brief: `Almost nobody invests in commodities by owning them — storage, insurance and spoilage make that impractical. Exposure comes through <strong>futures</strong>, which means the return has components that have nothing to do with the commodity price.`,

    sections: [

      { h: 'Contango and backwardation', b: `<strong>Contango</strong>: futures price above spot, the curve slopes upward. A long investor rolling forward sells cheap and buys expensive, so <strong>roll yield is negative</strong>. <strong>Backwardation</strong>: futures below spot, curve slopes downward, and rolling produces a <strong>positive</strong> roll yield. Contango typically reflects high storage costs; backwardation reflects a high convenience yield from holding the physical good.` },
      { h: 'Why the curve slopes as it does', b: `Futures price ≈ spot + storage costs − convenience yield. Storage pushes toward contango; convenience yield — the value of having the physical commodity available during a shortage — pushes toward backwardation. Precious metals, cheap to store and with no industrial urgency, sit in contango almost permanently.` },
      { h: 'Role in a portfolio', b: `Commodities have historically offered <strong>inflation protection</strong> and low correlation with equities and bonds. The inflation link is genuine for energy and food, which sit directly in consumer price baskets. But a long-only commodity index in persistent contango can lose money while spot prices are flat — a real and frequently overlooked drag.` }
    ],

  {
    id: 'x-private-debt',
    subject: 'Alternative Investments',
    name: 'Private debt',
    tagline: 'Lending where the banks have withdrawn',
    brief: `Private debt is lending directly to companies outside the public bond market and outside the banking system. It has grown rapidly because bank regulation made mid-market corporate lending unattractive to banks, leaving a gap.`,

    brief: `Infrastructure means the physical assets underpinning economic activity: toll roads, airports, utilities, pipelines, telecom towers, hospitals and schools. The investment case rests on <strong>long-lived assets producing predictable, often regulated or contracted cash flows</strong>.`,

  {
    id: 'x-digital-assets',
    subject: 'Alternative Investments',
    name: 'Digital assets',

  {
    id: 'x-alt-portfolio',
    subject: 'Alternative Investments',
    name: 'Alternatives in a portfolio',
    tagline: 'The diversification case, and why the data overstates it',
    brief: `Alternatives are added for return enhancement, diversification, or both. But the reported statistics that support the case are <strong>systematically biased in the manager's favour</strong>, and the exam expects you to know how.`,
    prompt: `Before opening: name three biases in reported alternative-investment returns, and explain how each distorts the picture.`,
    sections: [
      { h: 'The case for including them', b: `Access to return sources unavailable in public markets, an <strong>illiquidity premium</strong> for accepting long lock-ups, exposure to manager skill where dispersion between top and bottom performers is far wider than in public equity, and genuine inflation protection from real assets.` },
      { h: 'Why reported volatility is too low', b: `Illiquid assets are valued by <strong>appraisal, not transaction</strong>. Appraisals are infrequent and anchored on the prior valuation, which smooths the reported series. The consequence is understated standard deviation, understated correlation, and therefore <strong>overstated Sharpe ratios</strong> and an overstated diversification benefit.` },
      { h: 'The reporting biases', b: `<strong>Survivorship bias</strong>: failed funds stop reporting and drop out of the index, lifting the average. <strong>Backfill bias</strong>: a fund that joins a database may add its historical record, and only funds with good histories choose to join. <strong>Self-selection</strong>: reporting is voluntary throughout, so poor performers simply stay out.` },
      { h: 'The practical constraints', b: `Long lock-ups and limited redemption windows, capital calls that must be met on the manager's schedule rather than the investor's, high minimums, fee layers that compound in fund-of-funds structures, and due diligence demands well beyond those of public markets.` }
    ],
    examTests: `The three biases — survivorship, backfill, self-selection — are directly examinable, and all push reported returns <em>upward</em>. Pair that with appraisal smoothing pushing reported risk <em>downward</em>, and the combined effect on any risk-adjusted measure is what the question is usually driving at.`
  },

  {
    id: 'x-pe-terms',
    subject: 'Alternative Investments',
    name: 'Partnership terms',
    tagline: 'Committed capital, waterfalls and clawback',
    brief: `Private fund economics run on a set of terms that determine <em>when</em> the manager gets paid, not just how much. Those timing rules are what the exam tests, and they explain several otherwise puzzling features of reported performance.`,
    prompt: `Before opening: explain the difference between committed and invested capital, and what a clawback provision is designed to prevent.`,
    sections: [
      { h: 'Committed versus invested capital', b: `Investors <strong>commit</strong> an amount but pay it in through <strong>capital calls</strong> as investments are made. Management fees are commonly charged on <strong>committed</strong> capital during the investment period — so investors pay fees on money not yet deployed, which is a major contributor to the early negative returns of the J-curve.` },
      { h: 'The distribution waterfall', b: `Determines the order in which proceeds are split. Under a <strong>deal-by-deal</strong> waterfall the manager takes carried interest as each investment exits — favourable to the manager. Under a <strong>whole-of-fund</strong> waterfall investors must first receive all their capital back plus the hurdle before any carry is paid — favourable to investors.` },
      { h: 'Clawback', b: `If early exits generate carried interest and later investments then lose money, the manager may have been paid on gains the fund never ultimately delivered. A <strong>clawback provision</strong> requires that carry to be returned. It exists specifically because deal-by-deal waterfalls create that possibility — a whole-of-fund structure largely avoids the problem.` },
      { h: 'Hurdle and catch-up', b: `The <strong>hurdle</strong> is the return investors receive before carry begins. A <strong>catch-up clause</strong> then allocates a large share — sometimes all — of the next profits to the manager, until the overall split reaches the agreed ratio. Without a catch-up the manager only earns carry on gains above the hurdle; with one, the hurdle becomes a timing device rather than a permanent giveaway.` }
    ],
    examTests: `Fees on committed rather than invested capital is the highest-yield fact here, because it explains the J-curve. Clawback and the deal-by-deal versus whole-of-fund distinction are commonly paired — know that clawback exists to fix a problem the deal-by-deal structure creates.`
  }

];

function matches(c) {
  if (state.subject !== 'All' && c.subject !== state.subject) return false;
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return (c.name + ' ' + c.tagline + ' ' + c.subject).toLowerCase().includes(q);
}
const visibleItems = () => pool().filter(matches);

els.search.addEventListener('input', () => {
  state.query = els.search.value;
  els.searchClear.classList.toggle('show', state.query.length > 0);
  renderList();

  els.search.value = ''; state.query = '';
  els.searchClear.classList.remove('show');
  renderList(); els.search.focus();
});

function renderFilters() {
  els.filters.innerHTML = '';

    : isMap() ? ['All'].concat([...new Set(MAP_THREADS.map(x => x.subject))])
    : SUBJECTS;
  list.forEach(s => {
    const n = s === 'All' ? pool().length : pool().filter(c => c.subject === s).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'chip' + (s === state.subject ? ' active' : '');
    b.textContent = SUBJECT_SHORT[s] || s;
    b.setAttribute('aria-pressed', s === state.subject);
    b.addEventListener('click', () => {
      state.subject = s;
      renderFilters(); renderList();
      els.list.scrollTop = 0;

    els.filters.appendChild(b);
  });
}

      const score = state.drillsDone.get(c.id);
      const eres = state.ethicsDone.get(c.id);
      html += `<button class="concept-item${state.activeId === c.id ? ' active' : ''}${isDone(c.id) ? ' visited' : ''}" data-id="${c.id}"${state.activeId === c.id ? ' aria-current="true"' : ''}>
        <span class="ci-name">${c.name}</span>
        <span class="ci-tag">${score ? score.correct + ' of ' + score.total + ' correct' : (eres || state.topicsDone.has(c.id) || state.mapDone.has(c.id) ? 'Studied' : c.tagline)}</span>
        ${ICON.check}
      </button>`;
    });
  });
  els.list.innerHTML = html;
  els.list.querySelectorAll('.concept-item').forEach(el => {
    el.addEventListener('click', () => open(el.dataset.id));
  });
}

function renderProgress() {
  const c1 = $('cntC'), c2 = $('cntD'), c3 = $('cntE');
  if (c1) c1.textContent = CONCEPTS.length;
  if (c2) c2.textContent = DRILLS.length;
  if (c3) c3.textContent = ETHICS.length;
  const c4 = $('cntX'); if (c4) c4.textContent = EXPLAINERS.length;
  const c5 = $('cntM'); if (c5) c5.textContent = MAP_THREADS.length;
  const total = pool().length;
  const done = isMap() ? state.mapDone.size : isTopics() ? state.topicsDone.size : isEthics() ? state.ethicsDone.size : isDrills() ? state.drillsDone.size : state.visited.size;
  const pct = total ? (done / total * 100).toFixed(0) : 0;
  els.sbProgressText.textContent = `${done} / ${total}`;
  els.sbProgressFill.style.width = pct + '%';
  els.hdrProgressText.textContent = isMap() ? `${done} of ${total} studied` : isTopics() ? `${done} of ${total} studied` : (isDrills() || isEthics()) ? `${done} of ${total} attempted` : `${done} of ${total} explored`;
  els.hdrProgressFill.style.width = pct + '%';
}

// =====================================================================
// ROUTER
// =====================================================================
function open(id) {
  if (MAP_THREADS.some(x => x.id === id)) {
    if (!isMap()) switchTo('map');
    openMapThread(id);
  } else if (EXPLAINERS.some(x => x.id === id)) {
    if (!isTopics()) switchTo('topics');
    openTopic(id);
  } else if (ETHICS.some(e => e.id === id)) {
    if (!isEthics()) switchTo('ethics');
    openEthics(id);
  } else if (DRILLS.some(d => d.id === id)) {
    if (!isDrills()) switchTo('drills');
    openDrill(id);
  } else {
    if (state.mode !== 'concepts') switchTo('concepts');
    openConcept(id);
  }
}
function switchTo(mode) {
  state.mode = mode;
  state.subject = 'All';
  els.modeSwitch.querySelectorAll('.mode-btn').forEach(x => x.classList.toggle('active', x.dataset.mode === mode));
  els.sbTitle.textContent = MODE_TITLE[mode];
  els.search.placeholder = MODE_PLACEHOLDER[mode];
  renderFilters();
}

function orderList() {
  const filtered = visibleItems();
  return filtered.some(x => x.id === state.activeId) ? filtered : pool();
}

function pagerHtml(idx, order) {
  const prev = idx > 0 ? order[idx - 1] : null;
  const next = idx > -1 && idx < order.length - 1 ? order[idx + 1] : null;
  return `<nav class="pager">
    <button class="pager-btn prev" ${prev ? `data-id="${prev.id}"` : 'disabled'}>
      ${ICON.arrowL}<span><span class="pager-dir">Previous</span><span class="pager-name">${prev ? prev.name : '—'}</span></span>
    </button>
    <button class="pager-btn next" ${next ? `data-id="${next.id}"` : 'disabled'}>
      <span><span class="pager-dir">Next</span><span class="pager-name">${next ? next.name : '—'}</span></span>${ICON.arrow}
    </button>
  </nav>`;
}

function wireLinks() {
  els.main.querySelectorAll('.link-btn, .pager-btn[data-id], .starter').forEach(b => {
    if (b.dataset.id) b.addEventListener('click', () => open(b.dataset.id));
  });
}

  }).join('');

  els.main.innerHTML = `

    <div class="hero">
