:"cmp","h":["Local currency","Foreign currency"],"d":[["Can print?","Yes","No"],["Default risk","Very low","Real"],["Constraint","Inflation","Reserves"]]}},{"s":"fi","t":"Fixed-Income Markets for Government Issuers","n":"Non-Sovereign and Supranational Issuers","b":"Non-sovereign issuers include states, provinces and municipalities, which may be backed by general taxing power or by specific project revenue. Quasi-government agencies carry implicit or explicit sovereign backing. Supranational entities like the World Bank are funded by member governments and typically rated at the top of the scale.","q":"What distinguishes a general obligation from a revenue bond?","a":"A general obligation is backed by the issuer's full taxing power, while a revenue bond depends solely on cash flows from a specific project.","v":{"k":"grid","h":["Issuer type","Backing"],"d":[["Sovereign","Taxing power, currency"],["Municipal GO","Local taxing power"],["Revenue bond","Project cash flows"],["Supranational","Member governments"]]}},{"s":"fi","t":"Fixed-Income Bond Valuation: Prices and Yields","n":"Pricing a Bond","f":"P = Σ Coupon/(1+r)ᵗ + Par/(1+r)ⁿ","b":"A bond price is the present value of its cash flows. The inverse relationship between price and yield is the foundation of fixed income: when required yield rises, each future cash flow is discounted more heavily and the price falls. The relationship is not linear, which is why duration alone is an incomplete measure of risk.","q":"Why is the price-yield relationship non-linear?","a":"Discounting is exponential, so successive yield increases reduce price by progressively smaller amounts — the source of convexity.","v":{"k":"plot","x":"Yield","y":"Price","s":[{"n":"Price-yield curve","p":[[8,94],[30,72],[52,55],[74,43],[92,36]]}],"note":"Convex: falls at a decreasing rate"}},{"s":"fi","t":"Fixed-Income Bond Valuation: Prices and Yields","n":"Clean and Dirty Price","f":"Dirty price = Clean price + Accrued interest","b":"Between coupon dates, interest accrues to the seller. The dirty or full price is what actually changes hands; the clean or flat price is quoted, because it removes the sawtooth pattern created by accrual and reset. Day count conventions differ — actual/actual for most government bonds, 30/360 for many corporates — and the choice changes the accrual.","q":"Why are bonds quoted at clean prices?","a":"Removing accrued interest eliminates the sawtooth pattern between coupon dates, making quoted prices comparable across time.","v":{"k":"plot","x":"Time","y":"Price","s":[{"n":"Dirty price","p":[[8,40],[28,62],[30,40],[52,62],[54,40],[76,62],[78,40],[92,54]]},{"n":"Clean price","p":[[8,40],[92,42]]}],"note":"Accrual resets at each coupon date"}},{"s":"fi","t":"Fixed-Income Bond Valuation: Prices and Yields","n":"Matrix Pricing","b":"When a bond does not trade, estimate its price from comparable bonds with similar credit quality and maturity by interpolating yields. It is standard for new issues and thinly traded bonds. The weakness is that it assumes comparability across issuers and structures — a bond with an embedded option or unusual covenants is not comparable regardless of rating and maturity.","q":"When is matrix pricing unreliable?","a":"When the bond has features the comparables lack — embedded options, unusual covenants, or different liquidity — since these are not captured by rating and maturity alone.","v":{"k":"steps","d":[["3-year comparable: 4.2%","observed"],["5-year comparable: 4.8%","observed"],["Interpolate for 4-year","4.5%"],["Discount cash flows","estimated price"]]}},{"s":"fi","t":"Yield and Yield Spread Measures for Fixed-Rate Bonds","n":"Yield to Maturity and Its Assumptions","b":"YTM is the single discount rate equating price to the present value of cash flows — the internal rate of return of the bond. It assumes you hold to maturity, the issuer makes every payment, and all coupons are reinvested at the YTM itself. That last assumption is the weakest: realised return matches YTM only if reinvestment rates cooperate.","q":"Which YTM assumption most often fails?","a":"Reinvestment of all coupons at the yield to maturity — actual reinvestment rates vary, so realised return differs from YTM.","v":{"k":"grid","h":["Assumption","Reality"],"d":[["Hold to maturity","May sell early"],["No default","Credit risk exists"],["Reinvest at YTM","Rates vary"]]}},{"s":"fi","t":"Yield and Yield Spread Measures for Fixed-Rate Bonds","n":"Current Yield vs YTM","f":"Current yield = Annual coupon / Price","b":"Current yield captures only income, ignoring any capital gain or loss from the pull to par. For a discount bond, YTM exceeds current yield because the price will rise to par; for a premium bond, YTM is below current yield because the price will fall. Current yield equals YTM only at par.","q":"For a discount bond, how do current yield and YTM compare?","a":"YTM is higher, because it includes the capital gain from the price rising to par, which current yield ignores.","v":{"k":"cmp","h":["Discount bond","Premium bond"],"d":[["Coupon rate","< YTM","> YTM"],["Current yield","< YTM","> YTM"],["Price path","Rises to par","Falls to par"]]}},{"s":"fi","t":"Yield and Yield Spread Measures for Fixed-Rate Bonds","n":"Yield to Call and Yield to Worst","b":"For a callable bond, compute the yield to each possible call date and to maturity. Yield to worst is the lowest of these — the conservative assumption that the issuer exercises whichever option is least favourable to you. When a callable bond trades above the call price, yield to call is the relevant measure, not yield to maturity.","q":"What is yield to worst?","a":"The lowest yield among yield to maturity and yields to each call date, assuming the issuer acts in its own interest.","v":{"k":"bars","d":[["Yield to call (yr 3)",3.8],["Yield to call (yr 5)",4.3],["Yield to maturity",4.9]],"u":"% — worst is 3.8"}},{"s":"fi","t":"Yield and Yield Spread Measures for Fixed-Rate Bonds","n":"Yield Spreads","b":"The G-spread is the yield over an interpolated government bond of the same maturity. The I-spread is over the swap rate. The Z-spread is the constant amount added to every spot rate that makes present value equal the price — more accurate because it uses the whole curve. The option-adjusted spread removes the value of embedded options.","q":"Why is the Z-spread more accurate than the G-spread?","a":"It adds a constant spread to every point on the spot curve rather than comparing to a single maturity-matched yield, capturing curve shape.","v":{"k":"scale","l":"Simplest","r":"Most precise","d":["G-spread","I-spread","Z-spread","OAS"]}},{"s":"fi","t":"Yield and Yield Spread Measures for Floating-Rate Instruments","n":"Discount Margin","b":"For a floating-rate note, the discount margin is the spread over the reference rate that equates present value to price — the floater's equivalent of yield to maturity. When the required margin equals the quoted margin, the note prices at par. A note trading below par has a discount margin above its quoted margin, reflecting credit deterioration.","q":"What does a discount margin above the quoted margin indicate?","a":"The market requires more spread than the note pays, so it trades below par — typically reflecting deteriorated credit quality.","v":{"k":"cmp","h":["Quoted margin","Discount margin"],"d":[["Set","At issue, fixed","By market, varies"],["If equal","Price = par","Price = par"],["If DM higher","—","Price below par"]]}},{"s":"fi","t":"Yield and Yield Spread Measures for Floating-Rate Instruments","n":"Money Market Yields","b":"Short-term instruments use conventions that are not directly comparable. A discount-basis yield understates the true return because it divides by face value rather than price. An add-on rate divides by the purchase price, which is correct. Bond equivalent yield converts money market quotes to a comparable annual basis so instruments can be assessed together.","q":"Why does a discount-basis quote understate the return?","a":"It expresses the discount as a percentage of face value rather than of the price actually paid, which is lower.","v":{"k":"cmp","h":["Discount basis","Add-on rate"],"d":[["Divides by","Face value","Purchase price"],["Understates?","Yes","No"],["Used for","T-bills","CDs, repos"]]}},{"s":"fi","t":"The Term Structure of Interest Rates","n":"Spot, Par and Forward Curves","b":"The spot curve gives zero-coupon yields for each maturity — the true building blocks for discounting. The par curve gives the coupon rate that prices a bond at par for each maturity. The forward curve gives rates for future periods implied by today's spot rates. All three are derived from the same information and must be mutually consistent.","q":"What does the spot curve represent?","a":"Yields on zero-coupon bonds for each maturity — the pure discount rates used to value individual cash flows.","v":{"k":"plot","x":"Maturity","y":"Rate","s":[{"n":"Spot","p":[[8,32],[35,50],[62,62],[92,70]]},{"n":"Forward","p":[[8,38],[35,64],[62,76],[92,82]]},{"n":"Par","p":[[8,32],[35,48],[62,58],[92,65]]}],"note":"Forward lies above spot when the curve is upward-sloping"}},{"s":"fi","t":"The Term Structure of Interest Rates","n":"Deriving Forward Rates","f":"(1+z₂)² = (1+z₁)(1+f₁,₁)","b":"Forward rates are implied, not forecast. Investing for two years must equal investing one year and reinvesting at the implied forward rate, or arbitrage exists. When the spot curve slopes upward, forward rates exceed spot rates. Forwards are not predictions of future spot rates — they are break-even rates that make the two strategies equivalent.","q":"Are forward rates forecasts of future spot rates?","a":"No. They are break-even rates implied by arbitrage between investment horizons, and they systematically differ from realised future spot rates.","v":{"k":"steps","d":[["1-year spot = 3%","observed"],["2-year spot = 4%","observed"],["(1.04)² / 1.03","solve"],["1-year forward = 5.01%","implied"]]}},{"s":"fi","t":"The Term Structure of Interest Rates","n":"Yield Curve Shapes","b":"An upward-sloping curve is normal, reflecting term premiums and expected growth. A flat curve suggests transition. An inverted curve, where short rates exceed long rates, has preceded most recessions — it signals that the market expects rate cuts, which implies expected economic weakness. A humped curve peaks at intermediate maturities.","q":"Why does an inverted yield curve signal recession risk?","a":"Long rates below short rates imply the market expects future rate cuts, which central banks deliver in response to economic weakness.","v":{"k":"plot","x":"Maturity","y":"Yield","s":[{"n":"Normal","p":[[8,30],[40,55],[70,68],[92,74]]},{"n":"Inverted","p":[[8,76],[40,60],[70,46],[92,38]]}],"note":"Inversion has preceded most recessions"}},{"s":"fi","t":"The Term Structure of Interest Rates","n":"Term Structure Theories","b":"Pure expectations says the curve reflects only expected future short rates. Liquidity preference adds a premium for longer maturities, so upward slope is normal even with flat expectations. Segmented markets says maturities are separate markets driven by distinct investor groups. Preferred habitat allows investors to leave their preferred maturity if compensated.","q":"Why does liquidity preference theory imply a normally upward curve?","a":"Investors require a term premium for holding longer maturities, so long yields exceed the average of expected short rates even when expectations are flat.","v":{"k":"grid","h":["Theory","Curve slope explained by"],"d":[["Pure expectations","Expected short rates only"],["Liquidity preference","+ term premium"],["Segmented markets","Separate supply/demand"],["Preferred habitat","Habitat + compensation"]]}},{"s":"fi","t":"Interest Rate Risk and Return","n":"Two Offsetting Risks","b":"Rising rates cut the price of a bond you hold but raise the return on reinvested coupons. Falling rates do the reverse. Price risk and reinvestment risk move in opposite directions, and they exactly offset at one horizon — the Macaulay duration. Holding a bond for that period immunises the investor against a parallel shift in rates.","q":"At what horizon do price and reinvestment risk offset?","a":"At the Macaulay duration, where the loss in price from rising rates is exactly offset by higher reinvestment income.","v":{"k":"plot","x":"Investment horizon","y":"Risk","s":[{"n":"Price risk","p":[[8,88],[50,48],[92,10]]},{"n":"Reinvestment risk","p":[[8,10],[50,48],[92,88]]}],"note":"They cross at Macaulay duration"}},{"s":"fi","t":"Yield-Based Bond Duration Measures and Properties","n":"Macaulay Duration","b":"The weighted average time to receive a bond's cash flows, with each weight being that cash flow's share of present value. A zero-coupon bond's Macaulay duration equals its maturity, since there is only one cash flow. Coupon-paying bonds have duration below maturity, and higher coupons pull it lower because more value arrives earlier.","q":"Why is a zero-coupon bond's Macaulay duration equal to its maturity?","a":"All value arrives in a single payment at maturity, so the weighted average time to receive cash flows is exactly the maturity.","v":{"k":"tline","d":[["t=1","coupon, small weight","+"],["t=2","coupon, small weight","+"],["t=3","coupon + par, large weight","+"]]}},{"s":"fi","t":"Yield-Based Bond Duration Measures and Properties","n":"Modified Duration","f":"ModDur = MacDur / (1 + y/m)   ·   %ΔP ≈ −ModDur × Δy","b":"Modified duration converts Macaulay duration into a direct price sensitivity: the approximate percentage price change for a one percentage point yield move. A duration of 7 means a 1% rate rise costs roughly 7% of price. The approximation is linear, so it is accurate for small moves and increasingly wrong for large ones.","q":"A bond has modified duration of 6. What happens if yields rise 50bp?","a":"Price falls approximately 3% — six times the 0.5 percentage point yield change, before convexity adjustment.","v":{"k":"bars","d":[["2-year note",1.9],["5-year note",4.5],["10-year bond",8.2],["30-year bond",19.0]],"u":"modified duration"}},{"s":"fi","t":"Yield-Based Bond Duration Measures and Properties","n":"What Drives Duration","b":"Three relationships, all consistent. Longer maturity means higher duration, because cash flows sit further out. Higher coupon means lower duration, because more value returns early. Higher yield means lower duration, because distant cash flows are discounted more heavily and carry less weight. Understanding the mechanism means never memorising the direction.","q":"Why does a higher coupon reduce duration?","a":"More of the bond's present value arrives in early payments, lowering the weighted average time to receive cash flows.","v":{"k":"grid","h":["Increase in","Duration"],"d":[["Maturity","Rises"],["Coupon rate","Falls"],["Yield level","Falls"],["Call feature","Falls"]]}},{"s":"fi","t":"Yield-Based Bond Duration Measures and Properties","n":"Money Duration and Price Value of a Basis Point","f":"Money duration = ModDur × Full price   ·   PVBP = money duration × 0.0001","b":"Modified duration gives a percentage; money duration gives a currency amount, which is what a risk manager actually needs. The price value of a basis point is the money change for a one basis point yield move — the standard unit for hedging, because it lets positions of different sizes and maturities be compared and offset directly.","q":"Why do risk managers use PVBP rather than modified duration?","a":"It expresses sensitivity in currency terms, allowing positions of different sizes and maturities to be compared and hedged directly.","v":{"k":"steps","d":[["ModDur = 7.2","sensitivity"],["Price = $980,000","position"],["Money duration = $7.06m","product"],["PVBP = $706","per basis point"]]}},{"s":"fi","t":"Yield-Based Bond Duration Measures and Properties","n":"Portfolio Duration","b":"Portfolio duration is the market-value-weighted average of the individual durations. The convenience masks an assumption: it measures sensitivity to a parallel shift in the yield curve only. When the curve twists or steepens, two portfolios with identical duration can perform very differently, which is why key rate durations exist.","q":"What does portfolio duration fail to capture?","a":"Non-parallel curve movements — twists and steepening affect maturity segments differently, which a single duration number cannot represent.","v":{"k":"flow","d":["Weight each bond","× its duration","Sum","= portfolio duration"]}},{"s":"fi","t":"Yield-Based Bond Convexity and Portfolio Properties","n":"Convexity","f":"%ΔP ≈ (−ModDur × Δy) + (½ × Convexity × Δy²)","b":"Duration draws a straight line against a curved relationship, so it understates price gains when yields fall and overstates losses when they rise. Convexity corrects for the curvature and is always positive for option-free bonds — a favourable property, because it means errors work in the investor's favour in both directions.","q":"Why is positive convexity desirable?","a":"Prices rise more than duration predicts when yields fall and fall less than predicted when yields rise, so the curvature benefits the holder both ways.","v":{"k":"plot","x":"Yield","y":"Price","s":[{"n":"Actual price","p":[[8,94],[30,72],[52,55],[74,43],[92,36]]},{"n":"Duration estimate","p":[[8,88],[52,55],[92,22]]}],"note":"Gap between line and curve is convexity"}},{"s":"fi","t":"Yield-Based Bond Convexity and Portfolio Properties","n":"When Convexity Matters Most","b":"The convexity adjustment is negligible for small yield changes and material for large ones, because the term is scaled by the square of the yield change. It also rises with maturity and falls with coupon. In stable rate environments duration alone suffices; in volatile ones, ignoring convexity produces meaningfully wrong estimates.","q":"When is the convexity adjustment material?","a":"For large yield changes, since the adjustment scales with the square of the yield move, and for long-maturity low-coupon bonds.","v":{"k":"bars","d":[["10bp move",2],["50bp move",12],["100bp move",40],["200bp move",100]],"u":"relative size of convexity term"}},{"s":"fi","t":"Curve-Based and Empirical Fixed-Income Risk Measures","n":"Effective Duration","b":"For bonds with embedded options, cash flows change when rates change, so yield-based duration is invalid. Effective duration measures sensitivity to a parallel shift in the benchmark curve by repricing the bond under small upward and downward shifts using a model. It is the correct measure for callable, putable and mortgage-backed securities.","q":"Why can't modified duration be used for callable bonds?","a":"Cash flows are not fixed — they change when rates move and the option becomes exercisable — so a yield-based measure is invalid.","v":{"k":"cmp","h":["Modified duration","Effective duration"],"d":[["Cash flows","Assumed fixed","Allowed to change"],["Input","Yield change","Curve shift"],["Use for","Option-free","Embedded options"]]}},{"s":"fi","t":"Curve-Based and Empirical Fixed-Income Risk Measures","n":"Negative Convexity","b":"A callable bond's price appreciation is capped near the call price, so as yields fall the price-yield curve bends the wrong way. This negative convexity means the investor gets limited upside when rates fall but full downside when they rise — an unfavourable asymmetry that must be compensated by a higher yield. Mortgage-backed securities behave similarly.","q":"Why do mortgage-backed securities exhibit negative convexity?","a":"Falling rates trigger prepayments, returning principal early exactly when reinvestment rates are low, capping price appreciation.","v":{"k":"plot","x":"Falling yield →","y":"Price","s":[{"n":"Option-free","p":[[8,28],[45,58],[92,96]]},{"n":"Callable / MBS","p":[[8,28],[45,55],[70,66],[92,70]]}],"note":"Curve bends the wrong way as yields fall"}},{"s":"fi","t":"Curve-Based and Empirical Fixed-Income Risk Measures","n":"Key Rate Duration","b":"Key rate durations measure sensitivity to a change at one specific point on the curve while holding others constant. Summed, they equal effective duration, but individually they reveal exposure to curve reshaping. Two portfolios with the same total duration — a barbell and a bullet — have very different key rate profiles and perform differently when the curve twists.","q":"What do key rate durations reveal that total duration hides?","a":"Exposure to specific maturity segments, so a portfolio's response to curve steepening, flattening or twisting can be assessed.","v":{"k":"bars","d":[["2-year key rate",1.2],["5-year key rate",2.4],["10-year key rate",3.1],["30-year key rate",0.8]],"u":"key rate duration"}},{"s":"fi","t":"Curve-Based and Empirical Fixed-Income Risk Measures","n":"Empirical vs Analytical Duration","b":"Analytical duration is computed from a pricing model. Empirical duration is estimated by regressing observed price changes against benchmark yield changes. They diverge for credit-risky bonds, because when government yields fall in a flight to quality, credit spreads often widen simultaneously — so a high yield bond's empirical duration is far lower than its analytical duration.","q":"Why is empirical duration lower for high yield bonds?","a":"Credit spreads typically widen when government yields fall in stress, partly offsetting the price gain that analytical duration predicts.","v":{"k":"cmp","h":["Analytical","Empirical"],"d":[["Source","Pricing model","Historical regression"],["Assumes","Spread constant","Spread co-moves"],["High yield","Overstates","More realistic"]]}},{"s":"fi","t":"Credit Risk","n":"Components of Credit Risk","f":"Expected loss = Probability of default × Loss given default","b":"Default risk is the probability the issuer fails to pay. Loss severity, or loss given default, is how much is lost when it happens — the complement of the recovery rate. Their product is expected loss. Spread risk is separate: the price impact of changing spreads even without default, comprising credit migration risk and market liquidity risk.","q":"Distinguish default risk from spread risk.","a":"Default risk is the probability of non-payment; spread risk is the price impact of widening spreads from downgrades or illiquidity, without any default occurring.","v":{"k":"flow","d":["Probability of default","× Loss given default","= Expected loss"]}},{"s":"fi","t":"Credit Risk","n":"Credit Ratings and Their Limits","b":"Investment grade runs to BBB− or Baa3; below that is high yield. Ratings measure default probability, adjusted somewhat for expected recovery through notching. Three limitations matter: ratings lag market pricing, they do not capture spread or liquidity risk, and issuer ratings differ from issue ratings because seniority varies within a capital structure.","q":"Why does an issue rating differ from the issuer rating?","a":"Notching adjusts for seniority and security, since expected recovery varies across a single issuer's capital structure.","v":{"k":"scale","l":"Highest quality","r":"Distressed","d":["AAA","A","BBB− (IG floor)","BB","CCC"]}},{"s":"fi","t":"Credit Risk","n":"The Credit Spread","b":"Yield above the risk-free benchmark compensates for expected loss, plus premiums for credit migration, liquidity, and uncertainty about the loss distribution. Spreads widen when the economy weakens, and they widen more for lower-rated issuers — spread duration measures the price sensitivity to spread changes, and it matters more than rate duration for high yield.","q":"Why do high yield spreads widen more than investment grade in downturns?","a":"Default probability rises disproportionately for weaker credits, and liquidity deteriorates faster in lower-rated segments.","v":{"k":"plot","x":"Economic stress →","y":"Spread","s":[{"n":"Investment grade","p":[[8,14],[45,26],[92,48]]},{"n":"High yield","p":[[8,32],[45,62],[92,96]]}],"note":"High yield spreads widen disproportionately"}},{"s":"fi","t":"Credit Analysis for Corporate Issuers","n":"The Four Cs of Credit","b":"Capacity: can the business generate cash to service debt, assessed through industry position and cash flow stability. Collateral: what backs the claim, and what would it fetch in distress. Covenants: what contractual protections exist. Character: management quality, track record, and willingness to pay. Capacity does the most work; character explains most surprises.","q":"Which of the four Cs is hardest to assess and most often decisive?","a":"Character — management's integrity and willingness to pay is difficult to measure but frequently explains defaults that financial analysis missed.","v":{"k":"grid","h":["C","Question"],"d":[["Capacity","Can they pay?"],["Collateral","What backs it?"],["Covenants","What protects us?"],["Character","Will they pay?"]]}},{"s":"fi","t":"Credit Analysis for Corporate Issuers","n":"Credit Ratios","f":"Leverage = Debt/EBITDA   ·   Coverage = EBITDA/Interest","b":"Leverage ratios measure debt relative to earnings or capital; coverage ratios measure the ability to service it from earnings. Both should use adjusted figures — capitalised leases, pension deficits and off-balance-sheet obligations belong in debt. Trend matters more than level, because deteriorating ratios predict downgrades better than any absolute threshold.","q":"Why adjust reported debt in credit analysis?","a":"Leases, pension deficits and other off-balance-sheet obligations are economically debt, and omitting them understates true leverage.","v":{"k":"bars","d":[["Reported debt/EBITDA",2.8],["+ leases",3.4],["+ pension deficit",3.9]],"u":"adjusted leverage"}},{"s":"fi","t":"Credit Analysis for Government Issuers","n":"Sovereign Credit Factors","b":"Analysis splits into ability and willingness. Ability rests on institutional strength, economic size and diversity, fiscal position and debt burden, external accounts and reserves, and monetary flexibility. Willingness is political — sovereigns can usually pay local-currency debt but may choose default over austerity. Political will is the hardest variable and the one ratings capture least well.","q":"Why does sovereign analysis separate ability from willingness?","a":"A sovereign with the capacity to pay may still choose default for political reasons, so financial capacity alone does not determine outcomes.","v":{"k":"grid","h":["Factor","Assesses"],"d":[["Institutions","Policy quality"],["Economy","Size, diversity"],["Fiscal position","Debt burden"],["External accounts","Reserve adequacy"],["Monetary flexibility","Currency control"]]}},{"s":"fi","t":"Credit Analysis for Government Issuers","n":"Non-Sovereign Government Credit","b":"Municipal general obligation bonds depend on the tax base, its diversity, and unfunded pension and healthcare liabilities, which are frequently the largest hidden exposure. Revenue bonds depend entirely on a single project's cash flows and its debt service coverage ratio, so they are effectively project finance and are analysed as such.","q":"What is the most commonly understated municipal credit risk?","a":"Unfunded pension and post-employment healthcare obligations, which are large, growing and often reported outside headline debt figures.","v":{"k":"cmp","h":["General obligation","Revenue bond"],"d":[["Backed by","Taxing power","Project cash flow"],["Key risk","Tax base, pensions","Coverage ratio"],["Analysis","Fiscal","Project finance"]]}},{"s":"fi","t":"Fixed-Income Securitization","n":"Why Securitisation Exists","b":"Pooling illiquid loans and issuing securities against them serves several purposes: it converts illiquid assets into tradeable ones, transfers credit risk from originators to investors, lowers funding costs through diversification and structuring, and gives investors access to asset classes otherwise unavailable. The 2008 crisis showed how it also obscures where risk ultimately sits.","q":"What are the main benefits of securitisation?","a":"It creates liquidity from illiquid loans, transfers risk to willing holders, lowers funding costs, and broadens investor access to asset classes.","v":{"k":"flow","d":["Loans originated","Sold to SPE","Tranched securities","Sold to investors"]}},{"s":"fi","t":"Fixed-Income Securitization","n":"The Special Purpose Entity","b":"The SPE is the structural core. Assets are legally sold to it, achieving bankruptcy remoteness — if the originator fails, creditors cannot reach the pooled assets. This separation is what lets a securitisation carry a higher rating than its originator. If the true sale is challenged in court, the entire structure's rating rationale collapses.","q":"Why can an ABS be rated above its originator?","a":"Bankruptcy remoteness means the assets are legally separated from the originator, so investors depend on the pool rather than on the originator's credit.","v":{"k":"flow","d":["Originator","True sale","SPE holds assets","Insulated from bankruptcy"]}},{"s":"fi","t":"Fixed-Income Securitization","n":"Tranching and Credit Enhancement","b":"Losses hit the equity tranche first, then mezzanine, then senior — a waterfall that concentrates risk at the bottom so the top can be rated highly. Internal enhancement includes subordination, overcollateralisation and excess spread. External enhancement includes guarantees and insurance, though these introduce counterparty risk in exactly the scenarios where they are needed.","q":"How does subordination protect the senior tranche?","a":"Junior tranches absorb losses first, so the senior tranche is only impaired once subordinated capital is entirely exhausted.","v":{"k":"stack","d":[["Senior tranche","paid first, loses last"],["Mezzanine","absorbs next"],["Equity tranche","first loss"]]}},{"s":"fi","t":"Asset-Backed Security (ABS) Instrument and Market Features","n":"Amortising vs Non-Amortising Pools","b":"Amortising pools — auto loans, residential mortgages — return principal steadily, so the structure winds down naturally. Non-amortising pools like credit card receivables have no scheduled principal, so they use a lockout period during which collected principal buys new receivables, keeping the pool size constant before an amortisation period begins.","q":"Why do credit card ABS use a revolving period?","a":"The underlying receivables have no scheduled amortisation, so principal collections are reinvested in new receivables to maintain pool size.","v":{"k":"cmp","h":["Amortising","Non-amortising"],"d":[["Examples","Auto, mortgage","Credit card"],["Principal","Scheduled","None scheduled"],["Structure","Winds down","Revolving then amortising"]]}},{"s":"fi","t":"Mortgage-Backed Security (MBS) Instrument and Market Features","n":"Prepayment Risk","b":"Mortgage borrowers can repay early, and they do so when rates fall and refinancing is attractive. Contraction risk is receiving principal early when reinvestment rates are low; extension risk is receiving it late when rates have risen and you would rather reinvest. Both are unfavourable, which is the essence of negative convexity in mortgage securities.","q":"Distinguish contraction risk from extension risk.","a":"Contraction is faster prepayment when rates fall, forcing low-rate reinvestment; extension is slower prepayment when rates rise, trapping capital at below-market rates.","v":{"k":"cmp","h":["Contraction risk","Extension risk"],"d":[["Occurs when","Rates fall","Rates rise"],["Prepayments","Speed up","Slow down"],["Investor harm","Reinvest low","Capital trapped"]]}},{"s":"fi","t":"Mortgage-Backed Security (MBS) Instrument and Market Features","n":"Agency vs Non-Agency MBS","b":"Agency MBS carry government or government-sponsored guarantees against credit loss, so the investor bears prepayment risk but essentially no credit risk. Non-agency MBS have no such guarantee, so credit analysis of the underlying loans matters — loan-to-value ratios, borrower quality and documentation standards drive outcomes, as 2008 demonstrated.","q":"What risk remains in agency MBS despite the guarantee?","a":"Prepayment risk. The guarantee covers credit loss but does not protect against borrowers repaying early or late.","v":{"k":"cmp","h":["Agency MBS","Non-agency MBS"],"d":[["Credit risk","Guaranteed","Investor bears"],["Prepayment risk","Yes","Yes"],["Analysis focus","Prepayment models","Loan quality"]]}},{"s":"fi","t":"Mortgage-Backed Security (MBS) Instrument and Market Features","n":"Collateralised Mortgage Obligations","b":"CMOs redistribute prepayment risk rather than eliminating it. Sequential-pay tranches receive principal in order, so early tranches have short average lives and later ones are protected from contraction. Planned amortisation classes have a defined schedule protected by support tranches, which absorb prepayment variability — the support tranche takes concentrated risk so the PAC does not.","q":"How does a PAC tranche achieve stable cash flows?","a":"Support tranches absorb prepayment variability, allowing the PAC to follow a defined schedule within a specified prepayment range.","v":{"k":"stack","d":[["PAC tranche","protected schedule"],["Sequential tranches","ordered principal"],["Support tranche","absorbs variability"]]}},{"s":"fi","t":"Fixed-Income Issuance and Trading","n":"Repurchase Agreements","f":"Repo rate reflects collateral quality, term and counterparty","b":"A repo sells securities with an agreement to repurchase at a set price and date — economically a collateralised loan. The haircut is the excess collateral protecting the lender. Repo markets fund enormous leverage in fixed income, and their fragility is systemic: when haircuts rise suddenly, leveraged holders must sell, amplifying price declines.","q":"Why do rising repo haircuts amplify market stress?","a":"Higher haircuts force leveraged holders to post more collateral or sell assets, and forced selling drives prices down further.","v":{"k":"flow","d":["Sell security","Receive cash","Repurchase later","= collateralised loan"]}},{"s":"fi","t":"Fixed-Income Bond Valuation: Prices and Yields","n":"Bonds with Different Payment Frequencies","b":"A bond paying semiannually is valued using half the annual yield over twice the periods. Comparing bonds across frequencies requires converting to a common basis — annual-pay yields must be restated as semiannual bond equivalent yields or the comparison is wrong. This conversion is a routine exam point and a routine source of avoidable error.","q":"How do you compare an annual-pay bond to a semiannual-pay bond?","a":"Convert one to the other's basis — typically restating the annual yield as a semiannual bond equivalent yield before comparing.","v":{"k":"steps","d":[["Annual-pay YTM = 6%","given"],["(1.06)^0.5 − 1 = 2.956%","semiannual rate"],["× 2","annualise"],["SABEY = 5.91%","comparable"]]}},{"s":"fi","t":"Credit Risk","n":"Structural vs Reduced-Form Models","b":"Structural models treat equity as a call option on firm assets: default occurs when asset value falls below debt. They are intuitive and use market data, but require unobservable asset values. Reduced-form models treat default as a statistical event driven by observable variables, without modelling the firm's balance sheet — more tractable but less economically grounded.","q":"How do structural models conceptualise equity?","a":"As a call option on the firm's assets with a strike equal to the face value of debt — default occurs when assets fall below that level.","v":{"k":"cmp","h":["Structural","Reduced-form"],"d":[["Default is","Asset value < debt","A statistical event"],["Needs","Asset value","Observable variables"],["Grounding","Economic","Empirical"]]}},{"s":"dv","t":"Derivative Instrument and Derivative Market Features","n":"What a Derivative Is","b":"A contract whose value derives from an underlying asset, rate, or index. It transfers risk without transferring ownership of the underlying, and it requires little or no initial capital relative to the exposure obtained. That leverage is the source of both its usefulness for hedging and its capacity to destroy institutions using it for speculation.","q":"What makes derivatives capital-efficient?","a":"They provide exposure to an underlying without requiring the full purchase price, so a small outlay controls a large notional position.","v":{"k":"flow","d":["Underlying asset","Contract derives value","Risk transferred","Ownership unchanged"]}},{"s":"dv","t":"Derivative Instrument and Derivative Market Features","n":"Exchange-Traded vs Over-the-Counter","b":"Exchange-traded derivatives are standardised, cleared centrally, marked to market daily, and transparent — liquidity is high but terms are fixed. OTC derivatives are customised to the exact exposure, but carry counterparty risk and are less transparent. Post-crisis reform pushed much OTC activity into central clearing, blurring the historical distinction.","q":"What is the main trade-off between exchange-traded and OTC derivatives?","a":"Standardisation and reduced counterparty risk on exchanges versus customisation to precise needs, with counterparty exposure, over the counter.","v":{"k":"cmp","h":["Exchange-traded","OTC"],"d":[["Terms","Standardised","Customised"],["Counterparty risk","Clearing house","Bilateral"],["Transparency","High","Lower"],["Liquidity","High","Variable"]]}},{"s":"dv","t":"Forward Commitment and Contingent Claim Features and Instruments","n":"Forwards","b":"A forward commits both parties to trade an asset at a set price on a future date. No cash changes hands at inception, so the contract begins with zero value, and value accumulates to one side as the underlying price moves. Being OTC, forwards are customisable but expose each party to the other's default.","q":"Why does a forward contract have zero value at inception?","a":"The forward price is set so neither party has an advantage, making the present value of the obligation equal for both sides.","v":{"k":"tline","d":[["t=0","contract agreed, no cash","+"],["t=T","exchange at forward price","-"]]}},{"s":"dv","t":"Forward Commitment and Contingent Claim Features and Instruments","n":"Futures","b":"Economically a forward, structurally very different. Futures are standardised, exchange-traded, and marked to market daily, with gains and losses settled in cash each day through a margin account. Daily settlement means credit exposure never accumulates beyond one day, which is why futures survived crises that destroyed bilateral forward books.","q":"How does daily settlement reduce credit risk?","a":"Gains and losses are exchanged each day, so exposure never accumulates beyond a single day's price movement rather than building to expiry.","v":{"k":"cmp","h":["Forward","Future"],"d":[["Settlement","At expiry","Daily"],["Credit exposure","Accumulates","One day"],["Customisation","Full","None"],["Venue","OTC","Exchange"]]}},{"s":"dv","t":"Forward Commitment and Contingent Claim Features and Instruments","n":"Swaps","b":"A swap exchanges cash flow streams over time — most commonly fixed for floating interest payments. It is economically equivalent to a series of forward contracts, which is why it can be valued as a portfolio of forwards. Swaps let issuers convert floating-rate debt to fixed without refinancing, separating the funding decision from the rate exposure.","q":"Why is a swap equivalent to a series of forwards?","a":"Each exchange date represents a separate agreement to trade one cash flow for another at a predetermined rate, exactly as a forward would.","v":{"k":"flow","d":["Pay fixed","Receive floating","Net settled","= series of forwards"]}},{"s":"dv","t":"Forward Commitment and Contingent Claim Features and Instruments","n":"Options: Rights, Not Obligations","b":"The critical asymmetry. The buyer pays a premium for a right and can walk away; the seller receives the premium and is obligated if exercised. Buyers have limited loss and unlimited or large upside. Sellers have limited gain — the premium — and potentially unlimited loss. This asymmetry is why option sellers require margin and buyers do not.","q":"Why must option sellers post margin while buyers need not?","a":"Buyers' maximum loss is the premium already paid, while sellers face potentially unlimited losses and must demonstrate capacity to perform.","v":{"k":"plot","x":"Underlying price","y":"Profit","s":[{"n":"Long call","p":[[8,26],[45,26],[92,86]]},{"n":"Short call","p":[[8,74],[45,74],[92,14]]}],"note":"Buyer's loss is capped at the premium"}},{"s":"dv","t":"Derivative Benefits, Risks, and Issuer and Investor Uses","n":"Why Derivatives Exist","b":"They allow risk to be transferred to whoever is best able to bear it, achieve exposures cheaply, improve price discovery by revealing expectations, and complete markets where the cash instrument is unavailable or costly. The economic case is transfer efficiency: a farmer and a food manufacturer both reduce risk through the same contract.","q":"How do derivatives improve price discovery?","a":"They aggregate expectations about future prices into observable quotes, often revealing information faster than the underlying cash market.","v":{"k":"grid","h":["Benefit","Mechanism"],"d":[["Risk transfer","To willing bearers"],["Cost efficiency","Low capital outlay"],["Price discovery","Aggregates expectations"],["Market completion","Exposures otherwise unavailable"]]}},{"s":"dv","t":"Derivative Benefits, Risks, and Issuer and Investor Uses","n":"Risks of Derivatives","b":"Leverage magnifies losses as readily as gains. Basis risk arises when the hedge instrument imperfectly tracks the exposure. Liquidity risk can prevent exit at a fair price. Counterparty risk applies to OTC contracts. And complexity risk is real — instruments can be misunderstood by the people using them, which is a recurring cause of institutional failure.","q":"What is basis risk?","a":"The risk that the hedging instrument's price does not move exactly with the hedged exposure, leaving residual unhedged risk.","v":{"k":"grid","h":["Risk","Source"],"d":[["Leverage","Small capital, large exposure"],["Basis","Imperfect hedge match"],["Liquidity","Cannot exit fairly"],["Counterparty","OTC default"],["Complexity","Misunderstanding"]]}},{"s":"dv","t":"Derivative Benefits, Risks, and Issuer and Investor Uses","n":"Issuer vs Investor Uses","b":"Issuers use derivatives to manage the risks their business creates: swapping floating debt to fixed, hedging commodity input costs, or hedging foreign currency revenues. Investors use them to gain or modify exposure, hedge portfolio risk, or express views on volatility and direction efficiently. The same instrument serves opposite functions depending on who holds it.","q":"How does an issuer typically use an interest rate swap?","a":"To convert floating-rate debt to fixed, locking in interest cost without refinancing the underlying borrowing.","v":{"k":"cmp","h":["Issuer use","Investor use"],"d":[["Goal","Manage business risk","Modify exposure"],["Example","Swap floating to fixed","Hedge portfolio beta"],["Driver","Operating exposure","Portfolio view"]]}},{"s":"dv","t":"Arbitrage, Replication, and the Cost of Carry in Pricing Derivatives","n":"The Law of One Price","b":"Two assets with identical future cash flows must have the same price today, or a riskless profit exists. This principle prices every derivative in the curriculum: build a portfolio replicating the derivative's payoff, and the derivative must cost what the portfolio costs. Arbitrage requires no capital and no risk, so it is eliminated quickly.","q":"How does replication determine a derivative's price?","a":"If a portfolio of the underlying and borrowing reproduces the derivative's payoff exactly, the derivative must cost the same or arbitrage exists.","v":{"k":"flow","d":["Build replicating portfolio","Same payoff","Same price","Else arbitrage"]}},{"s":"dv","t":"Arbitrage, Replication, and the Cost of Carry in Pricing Derivatives","n":"Cost of Carry","f":"F₀ = S₀(1 + r)^T − FV(benefits) + FV(costs)","b":"The forward price is today's spot compounded at the risk-free rate, adjusted for what holding the asset costs or yields. Storage and insurance are costs that raise the forward price. Dividends, coupons and convenience yield are benefits that lower it. Every forward pricing question in the curriculum is this single equation with different terms populated.","q":"How do dividends affect a forward price on a stock?","a":"They reduce it, because the forward buyer forgoes dividends the spot holder would receive, lowering the price of deferred delivery.","v":{"k":"steps","d":[["Spot = 100","today"],["Compound at 5% for 1yr","105"],["− dividends 3","102"],["Forward price = 102","result"]]}},{"s":"dv","t":"Arbitrage, Replication, and the Cost of Carry in Pricing Derivatives","n":"Contango and Backwardation","b":"Contango means forward prices exceed spot — the normal state when carry costs dominate, and rolling long positions forward loses money. Backwardation means forwards below spot, arising when convenience yield is high because holders value physical availability, typically during shortages. Roll yield is positive in backwardation and negative in contango.","q":"Why does a long futures position lose money rolling in contango?","a":"Each expiring contract must be replaced by a more expensive longer-dated one, producing a negative roll yield.","v":{"k":"plot","x":"Contract maturity","y":"Price","s":[{"n":"Contango","p":[[8,42],[40,55],[70,66],[92,74]]},{"n":"Backwardation","p":[[8,74],[40,63],[70,52],[92,44]]}],"note":"Roll yield is negative in contango, positive in backwardation"}},{"s":"dv","t":"Pricing and Valuation of Forward Contracts","n":"Price vs Value","b":"The forward price is fixed at inception and does not change. The forward value changes daily as the spot price moves — it is the gain or loss on the position if marked to market. At inception value is zero; at expiry the long's value is spot minus the agreed forward price. Confusing the two is a common exam error.","q":"What is the value of a forward at expiry to the long?","a":"The spot price at expiry minus the contracted forward price — positive if the underlying rose above the agreed level.","v":{"k":"cmp","h":["Forward price","Forward value"],"d":[["Set","At inception","Changes daily"],["At t=0","Agreed level","Zero"],["At expiry","Unchanged","Spot − forward price"]]}},{"s":"dv","t":"Pricing and Valuation of Futures Contracts","n":"Marking to Market","b":"Each day, the futures position is revalued and the gain or loss transferred between margin accounts. This resets the contract value to zero daily, which is why a futures position's value is simply the day's price change rather than an accumulated amount. When margin falls below the maintenance level, a call requires restoration to the initial level.","q":"Why does a futures contract's value reset to zero each day?","a":"Daily settlement transfers the gain or loss in cash, so no accumulated value remains embedded in the contract.","v":{"k":"steps","d":[["Initial margin posted","day 0"],["Price moves, gain/loss settled","daily"],["Balance < maintenance","margin call"],["Restore to initial margin","required"]]}},{"s":"dv","t":"Pricing and Valuation of Futures Contracts","n":"Futures vs Forward Prices","b":"They differ when interest rates correlate with the underlying price. If the underlying rises when rates rise, futures gains are reinvested at higher rates while losses are funded cheaply — an advantage that makes futures prices exceed forward prices. Negative correlation reverses it. With uncorrelated rates, the two prices are equal.","q":"When do futures prices exceed forward prices?","a":"When the underlying price is positively correlated with interest rates, since daily settlement gains are reinvested at higher rates.","v":{"k":"grid","h":["Correlation with rates","Futures vs forward"],"d":[["Positive","Futures higher"],["Zero","Equal"],["Negative","Futures lower"]]}},{"s":"dv","t":"Pricing and Valuation of Interest Rates and Other Swaps","n":"Pricing an Interest Rate Swap","b":"The swap rate is the fixed rate making the present value of the fixed leg equal that of the floating leg at inception, so the swap starts with zero value. It is effectively a weighted average of forward rates over the swap's life. As rates move afterwards, value accrues to one counterparty and the swap becomes an asset to them.","q":"How is the swap fixed rate determined?","a":"It is set so the present values of the fixed and floating legs are equal at inception, giving the swap zero initial value.","v":{"k":"flow","d":["PV fixed leg","= PV floating leg","Swap rate solved","Value = 0 at inception"]}},{"s":"dv","t":"Pricing and Valuation of Interest Rates and Other Swaps","n":"Swap as Bond Combination","b":"A pay-fixed swap is economically equivalent to issuing a fixed-rate bond and buying a floating-rate bond. This decomposition explains its risk: the position gains when rates rise, because the fixed liability becomes relatively cheap. It also gives the valuation route — value the two bonds and take the difference.","q":"What is a pay-fixed swap equivalent to?","a":"Being short a fixed-rate bond and long a floating-rate bond, which gains value when interest rates rise.","v":{"k":"cmp","h":["Pay fixed swap","Equivalent position"],"d":[["Fixed leg","Pay","Short fixed bond"],["Floating leg","Receive","Long floating bond"],["Rates rise","Gain","Gain"]]}},{"s":"dv","t":"Pricing and Valuation of Options","n":"Moneyness","b":"A call is in the money when spot exceeds strike, at the money when they are equal, and out of the money when spot is below. Puts reverse this. Moneyness determines intrinsic value, and it drives how the option behaves — deep in-the-money options track the underlying nearly one for one, while far out-of-the-money options barely respond.","q":"When is a put option in the money?","a":"When the spot price is below the strike price, so exercising to sell at the strike would produce a gain.","v":{"k":"cmp","h":["Call","Put"],"d":[["In the money","S > X","S < X"],["At the money","S = X","S = X"],["Out of the money","S < X","S > X"]]}},{"s":"dv","t":"Pricing and Valuation of Options","n":"Intrinsic and Time Value","f":"Option premium = Intrinsic value + Time value","b":"Intrinsic value is what you would gain exercising immediately, never negative because you can decline. Time value is the remainder — the price of the possibility that the option moves further into the money before expiry. Time value decays toward zero at expiry, accelerating as expiry approaches, and is greatest for at-the-money options.","q":"Why is time value highest for at-the-money options?","a":"Uncertainty about final moneyness is greatest there, so the possibility of favourable movement is worth the most.","v":{"k":"plot","x":"Time to expiry →","y":"Time value","s":[{"n":"Time decay","p":[[8,6],[32,20],[58,42],[80,66],[92,80]]}],"note":"Decay accelerates as expiry approaches"}},{"s":"dv","t":"Pricing and Valuation of Options","n":"Determinants of Option Value","b":"Six inputs. Underlying price and strike set intrinsic value. Time to expiry raises value for both calls and puts by widening the range of outcomes. Volatility raises both, because the buyer benefits from upside without bearing full downside. The risk-free rate raises calls and lowers puts. Cash flows on the underlying lower calls and raise puts.","q":"Why does higher volatility raise both call and put values?","a":"Option payoffs are asymmetric — the holder captures favourable moves while unfavourable ones cost only the premium — so wider dispersion is valuable.","v":{"k":"grid","h":["Increase in","Call","Put"],"d":[["Underlying price","Up","Down"],["Strike price","Down","Up"],["Volatility","Up","Up"],["Time to expiry","Up","Up"],["Risk-free rate","Up","Down"]]}},{"s":"dv","t":"Pricing and Valuation of Options","n":"European vs American Exercise","b":"European options exercise only at expiry; American options exercise any time. The early exercise right cannot reduce value, so American options are worth at least as much. For non-dividend-paying stocks, early exercise of a call is never optimal — selling the option captures time value that exercising destroys. American puts can justify early exercise.","q":"Why is early exercise of a call on a non-dividend stock never optimal?","a":"Exercising forfeits remaining time value; selling the option instead realises both intrinsic and time value.","v":{"k":"cmp","h":["European","American"],"d":[["Exercise","At expiry only","Any time"],["Value","Lower or equal","Higher or equal"],["Early call exercise","N/A","Rarely optimal"]]}},{"s":"dv","t":"Option Replication Using Put–Call Parity","n":"Put-Call Parity","f":"C + PV(X) = P + S","b":"A call plus a risk-free bond maturing at the strike equals a put plus the underlying. Both sides produce identical payoffs at expiry, so arbitrage forces equal prices today. The relationship lets any one instrument be synthesised from the other three, and any violation is a direct arbitrage opportunity requiring no view on direction.","q":"How do you synthesise a long stock position?","a":"Buy a call, sell a put at the same strike and expiry, and hold a bond with present value equal to the strike.","v":{"k":"cmp","h":["Fiduciary call","Protective put"],"d":[["Components","Call + PV(X) bond","Put + stock"],["Payoff if S > X","S","S"],["Payoff if S < X","X","X"]]}},{"s":"dv","t":"Option Replication Using Put–Call Parity","n":"Put-Call Forward Parity","f":"C + PV(X) = P + PV(F₀)","b":"Replace the underlying with a forward contract on it and parity still holds, substituting the present value of the forward price for the spot price. This version is useful where holding the physical asset is impractical — commodities with storage costs, or assets that cannot be shorted directly. The logic is unchanged; only the replication instrument differs.","q":"When is put-call forward parity more useful than standard parity?","a":"When holding or shorting the underlying directly is impractical or costly, such as with storable commodities.","v":{"k":"flow","d":["Standard parity uses spot","Substitute forward","PV(F₀) replaces S","Same arbitrage logic"]}},{"s":"dv","t":"Valuing a Derivative Using a One-Period Binomial Model","n":"The Binomial Model","b":"Assume the underlying can take one of two values next period. Construct a portfolio of the underlying and borrowing that replicates the option payoff in both states — since it matches in every state, it must cost the same as the option. No probability estimate is needed, which is the model's most counterintuitive and important feature.","q":"Why do actual probabilities not appear in binomial option pricing?","a":"The replicating portfolio matches the option payoff in every state, so its cost determines the price regardless of how likely each state is.","v":{"k":"tree","root":"S₀ = 100","up":"S⁺ = 120, call = 20","dn":"S⁻ = 85, call = 0","pu":"up factor 1.20","pd":"down factor 0.85"}},{"s":"dv","t":"Valuing a Derivative Using a One-Period Binomial Model","n":"Risk-Neutral Probabilities","f":"π = [(1 + r) − d] / (u − d)","b":"Risk-neutral probabilities are the weights that make the underlying's expected return equal the risk-free rate. They are a computational device, not a belief about the world — nobody claims investors are risk neutral. They work because the replicating portfolio argument has already removed risk preferences from the problem entirely.","q":"Are risk-neutral probabilities real probabilities?","a":"No. They are computational weights derived from arbitrage-free pricing, not estimates of how likely each outcome actually is.","v":{"k":"steps","d":[["u = 1.20, d = 0.85","factors"],["r = 5%","risk-free"],["(1.05 − 0.85)/(1.20 − 0.85)","formula"],["π = 0.571","risk-neutral"]]}},{"s":"dv","t":"Valuing a Derivative Using a One-Period Binomial Model","n":"The Hedge Ratio","f":"h = (C⁺ − C⁻) / (S⁺ − S⁻)","b":"The hedge ratio is the number of underlying units needed per option to create a riskless portfolio — the option's delta in the binomial setting. It ranges from zero to one for calls and from minus one to zero for puts. Delta hedging in practice requires continuous rebalancing, because the ratio changes as the underlying moves.","q":"What does the hedge ratio represent?","a":"The units of the underlying required per option to make the combined position riskless — the option's delta.","v":{"k":"steps","d":[["C⁺ = 20, C⁻ = 0","option payoffs"],["S⁺ = 120, S⁻ = 85","underlying"],["(20 − 0)/(120 − 85)","hedge ratio"],["h = 0.571","units per option"]]}},{"s":"dv","t":"Derivative Instrument and Derivative Market Features","n":"Credit Derivatives","b":"A credit default swap transfers credit risk without transferring the bond. The buyer pays a periodic premium and receives compensation if a defined credit event occurs. CDS allow hedging credit exposure, taking a negative view on credit without shorting bonds, and they provide market-implied default probabilities that often move before ratings do.","q":"What does a CDS buyer receive on a credit event?","a":"Compensation for the loss on the reference obligation, either through physical delivery or a cash settlement based on recovery value.","v":{"k":"flow","d":["Buyer pays premium","No default → premium kept","Default → payout","Risk transferred"]}},{"s":"dv","t":"Derivative Benefits, Risks, and Issuer and Investor Uses","n":"Hedging vs Speculation","b":"The instrument does not determine the purpose — the existing exposure does. A farmer selling wheat futures against a growing crop is hedging; the same trade without a crop is speculation. Analysts must therefore look at the whole position, since a derivative examined in isolation reveals nothing about whether risk is being reduced or created.","q":"How do you determine whether a derivative position is a hedge?","a":"By examining the pre-existing exposure — a hedge offsets a position already held, while the identical trade without that exposure creates risk.","v":{"k":"quad","x":["No exposure","Existing exposure"],"y":["Same direction","Opposite direction"],"d":["Speculation","Hedge","Speculation","Increased risk"]}},{"s":"dv","t":"Pricing and Valuation of Options","n":"Option Strategies: Covered Call and Protective Put","b":"A covered call sells a call against stock owned, generating premium income while capping upside — appropriate when expecting a flat market. A protective put buys a put against stock owned, paying premium for downside protection while retaining upside — insurance with an explicit cost. Both modify the return distribution rather than the expected return.","q":"What does a covered call give up?","a":"Upside beyond the strike price, in exchange for premium income received today.","v":{"k":"plot","x":"Stock price","y":"Profit","s":[{"n":"Covered call","p":[[8,14],[50,58],[70,70],[92,70]]},{"n":"Protective put","p":[[8,26],[45,26],[92,80]]}],"note":"One caps upside, the other floors downside"}},{"s":"dv","t":"Arbitrage, Replication, and the Cost of Carry in Pricing Derivatives","n":"Limits to Arbitrage","b":"Textbook arbitrage assumes free shorting, no transaction costs, and unlimited capital. In practice, short sale constraints, bid-ask spreads, margin requirements, and the risk that a mispricing widens before it converges all limit arbitrage. This is why observable pricing discrepancies can persist — they exist within, not outside, the bounds set by these frictions.","q":"Why can mispricings persist despite arbitrage?","a":"Transaction costs, short-sale constraints, capital limits, and the risk of divergence before convergence make small discrepancies unprofitable to exploit.","v":{"k":"grid","h":["Friction","Effect"],"d":[["Transaction costs","Narrows profitable band"],["Short constraints","Blocks one side"],["Margin needs","Limits size"],["Divergence risk","Forces early exit"]]}},{"s":"dv","t":"Forward Commitment and Contingent Claim Features and Instruments","n":"Interest Rate Options and Caps","b":"An interest rate call pays when the reference rate exceeds the strike, protecting a floating-rate borrower. A series of these forms a cap. An interest rate put protects a floating-rate lender, and a series forms a floor. A collar combines buying a cap and selling a floor, funding protection by giving up benefit from falling rates.","q":"How does an interest rate collar reduce hedging cost?","a":"Selling the floor generates premium that offsets the cost of buying the cap, at the price of forgoing benefit if rates fall.","v":{"k":"plot","x":"Reference rate","y":"Effective cost","s":[{"n":"Unhedged","p":[[8,12],[50,50],[92,90]]},{"n":"Collared","p":[[8,30],[35,30],[65,66],[92,66]]}],"note":"Cap limits the top, floor limits the bottom"}},{"s":"dv","t":"Pricing and Valuation of Forward Contracts","n":"Forward Rate Agreements","b":"An FRA fixes an interest rate for a future period on a notional amount. It settles in cash at the start of the period for the present value of the rate difference, so no principal is exchanged. Borrowers buy FRAs to lock in a future borrowing cost; the notation denotes the start month and the end month of the period covered.","q":"What does a 3×9 FRA cover?","a":"A six-month period beginning in three months and ending in nine, with settlement occurring at the three-month point.","v":{"k":"tline","d":[["Today","FRA agreed","+"],["Month 3","settlement, period starts","-"],["Month 9","period ends","+"]]}},{"s":"dv","t":"Derivative Instrument and Derivative Market Features","n":"Notional vs Market Value","b":"Notional amount is the reference size on which payments are calculated; market value is what the contract is actually worth. Global derivative notionals run to hundreds of trillions, which sounds alarming until you note that gross market value is a small fraction — most notional exposure offsets. Confusing the two overstates systemic risk substantially.","q":"Why does derivative notional overstate economic exposure?","a":"Notional is only a calculation reference; actual exposure is the market value, and most positions offset against each other.","v":{"k":"bars","d":[["Notional outstanding",100],["Gross market value",3],["Net exposure",1]],"u":"relative scale, illustrative"}},{"s":"ai","t":"Alternative Investment Features, Methods, and Structures","n":"What Makes an Investment Alternative","b":"Not the asset itself but the characteristics: illiquidity, limited regulation and disclosure, complex structures, performance-based fees, restricted redemption, and difficulty valuing positions. Property, private companies and commodities all exist in conventional form too — what makes an allocation alternative is the vehicle and terms through which it is held.","q":"What defines an alternative investment?","a":"Structural characteristics — illiquidity, limited transparency, complex fee structures and restricted redemption — rather than the underlying asset class itself.","v":{"k":"grid","h":["Feature","Alternative"],"d":[["Liquidity","Restricted"],["Disclosure","Limited"],["Fees","Performance-based"],["Valuation","Estimated"],["Redemption","Gated"]]}},{"s":"ai","t":"Alternative Investment Features, Methods, and Structures","n":"Three Investment Methods","b":"Fund investment delegates entirely to a manager — simplest, most diversified, highest fee load. Co-investment allows investing alongside the fund in specific deals, reducing fees and increasing control while requiring capability to evaluate individual transactions. Direct investment gives full control and no fund fees but demands substantial internal expertise and deal access.","q":"What is the main advantage of co-investment?","a":"Lower fees and greater control over specific deals, while retaining the manager's sourcing and diligence capability.","v":{"k":"scale","l":"Least control","r":"Most control","d":["Fund investment","Co-investment","Direct investment"]}},{"s":"ai","t":"Alternative Investment Features, Methods, and Structures","n":"Partnership Structure","b":"The general partner manages the fund, sources deals and bears unlimited liability; limited partners provide capital with liability capped at their commitment. Capital is committed rather than transferred, then drawn down through capital calls as deals arise. Undrawn commitments create obligations that must be planned for — a failure to fund a call carries severe penalties.","q":"What is the difference between committed and drawn capital?","a":"Committed capital is pledged in advance; drawn capital is what has actually been called and deployed, with the remainder held as an obligation.","v":{"k":"flow","d":["LP commits capital","GP calls as needed","Deployed to deals","Returned with gains"]}},{"s":"ai","t":"Alternative Investment Features, Methods, and Structures","n":"Fee Structures","b":"Management fees typically run 1–2%, charged on committed capital during the investment period and on invested capital thereafter — the base matters enormously. Performance fees are usually 20% of profits above a hurdle rate. High water marks prevent charging twice for recovering the same losses, protecting investors from paying for volatility.","q":"Why does a high water mark protect investors?","a":"It prevents performance fees on gains that merely recover previous losses, so investors do not pay twice for the same performance.","v":{"k":"plot","x":"Time","y":"Fund value","s":[{"n":"Fund value","p":[[8,50],[30,72],[50,44],[72,68],[92,88]]},{"n":"High water mark","p":[[8,50],[30,72],[72,72],[92,88]]}],"note":"Fees only on gains above the previous peak"}},{"s":"ai","t":"Alternative Investment Performance and Returns","n":"Why IRR Not Time-Weighted Return","b":"Private funds control the timing of capital calls and distributions, so the manager's decisions include when to deploy capital. Since the manager controls the cash flows, money-weighted IRR correctly attributes that timing to them — the opposite of public markets, where time-weighted return is used precisely because managers do not control flows.","q":"Why do private funds report IRR rather than time-weighted returns?","a":"The manager controls the timing of capital calls and distributions, so money-weighted return correctly captures decisions they actually made.","v":{"k":"cmp","h":["Public manager","Private fund GP"],"d":[["Controls flows?","No","Yes"],["Metric","Time-weighted","IRR"],["Rationale","Isolate selection","Include timing"]]}},{"s":"ai","t":"Alternative Investment Performance and Returns","n":"Multiple of Invested Capital","f":"MOIC = (Distributions + Residual value) / Paid-in capital","b":"MOIC ignores time entirely, which is both its weakness and its use. IRR can be flattered by early exits or subscription line financing that delays capital calls; MOIC cannot. Reading both together is standard: high IRR with low MOIC signals quick small wins, while high MOIC with modest IRR signals patient value creation.","q":"Why report MOIC alongside IRR?","a":"MOIC ignores timing, so it exposes when a high IRR was produced by quick exits or delayed capital calls rather than by value creation.","v":{"k":"cmp","h":["High IRR, low MOIC","Low IRR, high MOIC"],"d":[["Pattern","Fast small exits","Patient compounding"],["Timing effect","Flattering","Diluting"],["Read together","Yes","Yes"]]}},{"s":"ai","t":"Alternative Investment Performance and Returns","n":"The J-Curve","b":"Private fund returns start negative. Fees are charged from day one, investments are held at cost, and no exits have occurred — so reported IRR is deeply negative in early years. As portfolio companies mature and exit, returns turn positive and the curve rises. Judging a fund before year four or five is judging the fee drag, not the strategy.","q":"Why do private fund returns start negative?","a":"Fees and expenses are incurred immediately while investments remain at cost and no realisations have occurred, so early reported returns are negative.","v":{"k":"plot","x":"Fund life (years)","y":"Net IRR","s":[{"n":"J-curve","p":[[8,34],[26,16],[46,38],[68,68],[92,86]]}],"note":"Early fees precede realisations"}},{"s":"ai","t":"Alternative Investment Performance and Returns","n":"Distribution Waterfalls","b":"European or whole-of-fund waterfalls return all capital plus the preferred return to limited partners before the general partner receives carried interest — safer for LPs. American or deal-by-deal waterfalls pay carry on each successful exit, which advantages the GP. Clawback provisions recover excess carry if later losses mean the GP was overpaid.","q":"Which waterfall structure favours limited partners?","a":"The European whole-of-fund structure, which returns all capital and the preferred return before any carried interest is paid.","v":{"k":"cmp","h":["European","American"],"d":[["Carry timing","After full return","Per deal"],["Favours","Limited partners","General partner"],["Clawback need","Lower","Higher"]]}},{"s":"ai","t":"Alternative Investment Performance and Returns","n":"Valuation Challenges","b":"Illiquid assets are marked using appraisals or models rather than transactions, which introduces smoothing — reported values lag reality and understate true volatility. This artificially lowers measured standard deviation and correlation with public markets, inflating Sharpe ratios and diversification benefits. Adjust for smoothing before comparing alternatives to liquid assets.","q":"Why do alternative investments appear less volatile than they are?","a":"Appraisal-based valuations smooth reported returns, understating true volatility and correlation with public markets.","v":{"k":"plot","x":"Time","y":"Value","s":[{"n":"True value","p":[[8,50],[25,80],[42,32],[60,72],[78,40],[92,66]]},{"n":"Reported (smoothed)","p":[[8,50],[25,60],[42,54],[60,60],[78,54],[92,60]]}],"note":"Smoothing understates real volatility"}},{"s":"ai","t":"Investments in Private Capital: Equity and Debt","n":"Private Equity Strategies","b":"Venture capital funds early-stage companies with high failure rates and occasional enormous winners — returns are driven by a handful of outcomes. Growth equity funds expansion in established businesses. Leveraged buyouts acquire mature cash-generative companies using substantial debt, creating value through operational improvement, multiple expansion and debt paydown.","q":"What are the three value creation levers in a buyout?","a":"Operational improvement in earnings, multiple expansion on exit, and deleveraging as debt is repaid from cash flow.","v":{"k":"scale","l":"Earliest stage","r":"Most mature","d":["Venture","Growth equity","Buyout"]}},{"s":"ai","t":"Investments in Private Capital: Equity and Debt","n":"Exit Routes","b":"A trade sale to a strategic buyer often achieves the highest price because synergies justify a premium. An IPO gives partial liquidity and public market pricing but leaves residual exposure and lock-ups. A secondary sale to another financial sponsor is quick and clean. Recapitalisation returns capital through new borrowing while retaining ownership.","q":"Why do trade sales often achieve the highest exit prices?","a":"Strategic buyers can realise synergies unavailable to financial buyers, allowing them to pay a premium and still generate a return.","v":{"k":"grid","h":["Exit route","Characteristic"],"d":[["Trade sale","Synergy premium"],["IPO","Partial, lock-up"],["Secondary sale","Quick, clean"],["Recapitalisation","Cash out, keep stake"]]}},{"s":"ai","t":"Investments in Private Capital: Equity and Debt","n":"Private Debt","b":"Direct lending provides senior secured loans to mid-market companies that banks have retreated from — floating rate, covenant-protected, and the largest private debt segment. Mezzanine sits between senior debt and equity with higher yield and often equity warrants. Distressed debt buys the obligations of troubled companies, aiming to profit from restructuring.","q":"Why has direct lending grown?","a":"Post-crisis regulation reduced bank appetite for mid-market lending, creating a funding gap that non-bank lenders filled at attractive spreads.","v":{"k":"stack","d":[["Senior direct lending","secured, floating"],["Unitranche","blended"],["Mezzanine","+ warrants"],["Distressed","restructuring play"]]}},{"s":"ai","t":"Real Estate and Infrastructure","n":"Real Estate Investment Forms","b":"A two-by-two: equity or debt, private or public. Private equity real estate is direct ownership. Private debt is mortgages. Public equity is REITs. Public debt is mortgage-backed securities. Each has different liquidity, leverage and correlation characteristics — public forms correlate more with equity markets, private forms with the underlying property cycle.","q":"Why do REITs correlate more with equities than direct property?","a":"They trade continuously on exchanges, so short-term prices reflect equity market sentiment rather than only underlying property values.","v":{"k":"quad","x":["Private","Public"],"y":["Equity","Debt"],"d":["Direct ownership","REITs","Mortgages","MBS"]}},{"s":"ai","t":"Real Estate and Infrastructure","n":"Property Valuation Approaches","b":"The income approach capitalises net operating income at a market cap rate, or discounts projected cash flows — the standard for income-producing property. The cost approach values land plus replacement cost less depreciation, useful for unusual properties. The sales comparison approach uses recent transactions of similar assets, requiring genuinely comparable evidence.","q":"How does the direct capitalisation method value a property?","a":"By dividing stabilised net operating income by a market capitalisation rate derived from comparable transactions.","v":{"k":"steps","d":[["NOI = $1.2m","stabilised income"],["Cap rate = 6%","market derived"],["1.2 / 0.06","calculation"],["Value = $20m","result"]]}},{"s":"ai","t":"Real Estate and Infrastructure","n":"Real Estate Investment Trusts","b":"REITs must distribute most taxable income as dividends, which secures pass-through tax treatment but leaves little retained capital for growth — expansion requires issuing equity or debt. This makes REITs sensitive to capital market conditions, and rising rates hurt twice: through higher financing costs and through competition from bond yields.","q":"Why must REITs regularly access capital markets?","a":"High mandatory distributions leave little retained earnings, so growth must be funded by issuing new equity or debt.","v":{"k":"flow","d":["Rent collected","Most distributed","Little retained","Growth needs new capital"]}},{"s":"ai","t":"Real Estate and Infrastructure","n":"Infrastructure Characteristics","b":"Long-lived physical assets providing essential services — transport, utilities, telecommunications. Cash flows are typically stable, regulated or contracted, and often inflation-linked, which suits liability matching. The trade-offs are regulatory risk, since returns depend on political decisions, and extreme illiquidity given holding periods measured in decades.","q":"Why does infrastructure suit long-horizon investors?","a":"Stable, often inflation-linked contracted cash flows over decades match long-dated liabilities, compensating for the illiquidity.","v":{"k":"grid","h":["Feature","Implication"],"d":[["Long asset life","Decade horizons"],["Regulated returns","Political risk"],["Inflation linkage","Liability matching"],["Essential service","Demand stability"]]}},{"s":"ai","t":"Real Estate and Infrastructure","n":"Brownfield vs Greenfield","b":"Brownfield investments acquire existing operating assets — cash flow starts immediately, construction risk is absent, and returns are lower. Greenfield investments build new assets, taking construction, permitting and demand risk in exchange for higher expected returns. The risk profiles differ enough that they suit different investors entirely.","q":"What risks does greenfield infrastructure carry that brownfield does not?","a":"Construction, permitting and initial demand risk, since the asset does not yet exist or has no operating history.","v":{"k":"cmp","h":["Brownfield","Greenfield"],"d":[["Asset","Operating","To be built"],["Cash flow","Immediate","Delayed"],["Risk","Lower","Construction, demand"],["Return","Lower","Higher"]]}},{"s":"ai","t":"Natural Resources","n":"Commodity Return Components","f":"Total return = Spot return + Roll yield + Collateral yield","b":"Commodity futures returns have three parts. Spot return reflects the price change of the underlying. Roll yield arises from rolling expiring contracts and is negative in contango, positive in backwardation. Collateral yield is interest earned on the cash backing the futures position. Roll yield frequently dominates over long horizons.","q":"Which return component is often overlooked in commodity investing?","a":"Roll yield, which can be substantially negative in persistent contango and erode returns regardless of spot price direction.","v":{"k":"bars","d":[["Spot return",6],["Roll yield",-4],["Collateral yield",3],["Total",5]],"u":"% illustrative"}},{"s":"ai","t":"Natural Resources","n":"Why Hold Commodities","b":"Commodities provide inflation protection, since they are inputs whose prices drive inflation rather than responding to it. They diversify because their drivers — weather, geopolitics, supply disruption — differ from equity earnings drivers. They produce no cash flow, so returns depend entirely on price movement and the mechanics of futures positioning.","q":"Why do commodities hedge inflation better than most assets?","a":"They are inputs to production, so their prices drive measured inflation rather than being eroded by it.","v":{"k":"flow","d":["Commodity prices rise","Input costs rise","Measured inflation rises","Holder is compensated"]}},{"s":"ai","t":"Natural Resources","n":"Timberland and Farmland","b":"Both combine an income stream with land appreciation. Timberland is unusual because harvest timing is flexible — trees keep growing if prices are poor, so the owner can wait out weak markets, which few assets permit. Farmland generates crop income plus land value. Both offer inflation linkage and low correlation with financial assets.","q":"What makes timberland's return profile unusual?","a":"Harvest timing is discretionary — the standing crop continues growing, so the owner can defer sale through weak price periods.","v":{"k":"cmp","h":["Timberland","Farmland"],"d":[["Income","Harvest, flexible","Crop, annual"],["Appreciation","Land + biological growth","Land"],["Timing option","Yes","Limited"]]}},{"s":"ai","t":"Hedge Funds","n":"Hedge Fund Categories","b":"Equity strategies include long-short, market neutral and dedicated short bias. Event-driven strategies trade merger arbitrage, distressed situations and activist positions. Relative value exploits pricing discrepancies in convertible arbitrage and fixed income. Macro strategies take directional positions on rates, currencies and commodities based on economic views.","q":"What distinguishes relative value from macro strategies?","a":"Relative value exploits pricing discrepancies between related instruments, while macro takes directional positions based on economic views.","v":{"k":"grid","h":["Category","Approach"],"d":[["Equity hedge","Long-short selection"],["Event-driven","Corporate events"],["Relative value","Pricing discrepancies"],["Macro","Directional views"]]}},{"s":"ai","t":"Hedge Funds","n":"Fund Terms and Liquidity","b":"Lock-up periods prevent redemption for an initial term. Notice periods require advance warning. Gates limit total redemptions in any period. Side pockets isolate illiquid positions from ordinary redemption. Each protects the manager from forced selling, and each transfers liquidity risk to investors — which becomes acutely visible during stress.","q":"What purpose does a redemption gate serve?","a":"It caps withdrawals in any period, preventing forced liquidation of positions at distressed prices whe
