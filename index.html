        <div class="hero-meta">
          <span class="hero-subject">${d.subject}</span>
          <span class="hero-count">Drill ${idx + 1} / ${order.length}</span>
        </div>
        <h2>${d.name}</h2>
        <p class="hero-idea">${d.setup}</p>
      </div>
    </div>

    <div class="wrap">
      <section class="block">
        <div class="prompt">
          <div class="prompt-label">The question</div>
          <div>${d.change}</div>
        </div>
        <div class="predict" id="predict">${rows}</div>

        <div class="score" id="scoreBar">
          <div class="score-body">
            <div class="score-label" id="scoreLabel">Answered</div>
            <div class="score-value" id="scoreValue">0 of ${d.items.length}</div>
            <div class="score-track"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>
          </div>
          <button class="score-btn" id="checkBtn" disabled>Check</button>
        </div>
      </section>

      <section class="block" id="afterBlock">
        <div class="locked" id="lockedNote">Answer the lines above and check them to unlock the principle and the exam trap.</div>
        <div id="revealBlock" hidden>
          <div class="block-head"><h3>The principle</h3></div>
          <div class="principle">${d.principle}</div>
          <div class="block-head" style="margin-top:30px"><h3>Exam trap</h3></div>
          <div class="trap"><div class="trap-label">${ICON.trap}<span>What this question is really testing</span></div><p>${d.trap}</p></div>
          ${links ? `<div class="block-head" style="margin-top:30px"><h3>Work the numbers</h3></div>
            <p class="prose">Once the direction makes sense, these calculators let you see the magnitude.</p>
            <div class="links">${links}</div>` : ''}
        </div>
      </section>

      ${pagerHtml(idx, order)}
    </div>
  </article>`;

  document.title = d.name + ' — CFA Level I Concept Lab';
  window.scrollTo({ top: 0, behavior: 'auto' });

  const answers = new Array(d.items.length).fill(null);
  let checked = false;

  function refreshCount() {
    const n = answers.filter(a => a !== null).length;
    $('scoreValue').textContent = `${n} of ${d.items.length}`;
    $('scoreFill').style.width = (n / d.items.length * 100) + '%';
    $('checkBtn').disabled = n === 0;
  }

  els.main.querySelectorAll('.dir').forEach(btn => {
    btn.addEventListener('click', () => {
      if (checked) return;
      const i = +btn.dataset.i, k = +btn.dataset.k;
      answers[i] = k;
      els.main.querySelectorAll(`.dir[data-i="${i}"]`).forEach(b => b.classList.toggle('picked', +b.dataset.k === k));
      refreshCount();
    });
  });

  $('checkBtn').addEventListener('click', () => {
    if (!checked) {
      checked = true;
      let correct = 0;
      d.items.forEach((it, i) => {
        const row = els.main.querySelector(`.prow[data-i="${i}"]`);
        const ok = answers[i] === it.answer;
        if (ok) correct++;
        row.classList.add('done');
        if (!ok) row.classList.add('miss');
        row.querySelectorAll('.dir').forEach(b => {
          const k = +b.dataset.k;
          b.disabled = true;
          b.classList.remove('picked');
          if (k === it.answer) b.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>'), b.classList.add('answer');
          else if (k === answers[i]) b.insertAdjacentHTML('beforeend', '<span class="mark">✕</span>'), b.classList.add('wrongpick');
        });
        const why = row.querySelector('.why');
        why.hidden = false;
        why.querySelector('[data-tag]').textContent = ok ? 'Correct' : (answers[i] === null ? 'Not answered' : 'Not quite');
      });
      state.drillsDone.set(d.id, { correct, total: d.items.length });
      $('scoreLabel').textContent = 'Score';
      $('scoreValue').textContent = `${correct} of ${d.items.length} correct`;
      $('scoreFill').style.width = (correct / d.items.length * 100) + '%';
      const btn = $('checkBtn');
      btn.textContent = 'Try again';
      btn.classList.add('ghost');
      $('lockedNote').hidden = true;
      $('revealBlock').hidden = false;
      renderList(); renderProgress(); wireLinks();
    } else {
      openDrill(d.id);
    }
  });

  refreshCount();
  wireLinks();
}

  document.title = e.name + ' \u2014 CFA Level I Concept Lab';

function fmtUnit(val, unit) {
  if (!unit) return String(val);
  if (unit === '$' || unit === '$M') return val + ' ' + unit;
  if (unit === '%' || unit === '×') return val + unit;
  return val + ' ' + unit;
}

function readVals(c) {

  return v;
}

function update(c) {

    $('roBreak').innerHTML = r.breakdown;
    $('readingText').innerHTML = r.insight;
    if (c.chart) drawChart(c, v);
  } catch (err) { console.error(err); }

const SERIES = ['#1B4269', '#6B7A8A', '#5E8BB3', '#0F1419', '#AFC5D9'];

function toRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function reskin(datasets) {
  return datasets.map((d, i) => {
    const col = SERIES[i % SERIES.length];
    const out = Object.assign({}, d);
    out.borderColor = col;
    out.borderWidth = d.borderWidth || 2;
    if (typeof d.backgroundColor === 'string') {
      if (d.backgroundColor === 'transparent') out.backgroundColor = 'transparent';
      else {
        const m = d.backgroundColor.match(/rgba?\(([^)]+)\)/);
        const parts = m ? m[1].split(',') : [];
        const a = parts.length === 4 ? parseFloat(parts[3]) : 0.08;
        out.backgroundColor = toRgba(col, isNaN(a) ? 0.08 : a);
      }
    }
    if (d.pointBackgroundColor) out.pointBackgroundColor = col;
    if (d.pointBorderColor) out.pointBorderColor = col;
    return out;
  });
}

function drawChart(c, v) {
  const canvas = $('chartCanvas');
  if (!canvas) return;
  const data = c.chart(v);
  const note = $('chartNote');
  if (note) note.textContent = data.caption || '';
  const grid = 'rgba(198,208,218,.55)', tick = '#6B7A8A';
  const small = window.innerWidth < 600;
  if (state.chart) { state.chart.destroy(); state.chart = null; }

  state.chart = new Chart(canvas, {
    type: data.type || 'line',
    data: data.labels ? { labels: data.labels, datasets: reskin(data.datasets) } : { datasets: reskin(data.datasets) },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 260 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: data.datasets.length > 1 || !!(data.datasets[0] && data.datasets[0].label),
          labels: { color: '#4C5B6B', font: { family: "'Inter', sans-serif", size: 11 }, boxWidth: 14, boxHeight: 2, padding: 14 }
        },
        tooltip: {
          backgroundColor: '#0A1628', titleColor: '#FFFFFF', bodyColor: '#C9D6E3',
          titleFont: { family: "'Inter', sans-serif", size: 12, weight: '600' },
          bodyFont: { family: "'IBM Plex Mono', monospace", size: 11 },
          padding: 10, cornerRadius: 4, borderColor: '#14304F', borderWidth: 1, displayColors: false
        }
      },
      scales: {
        x: {
          type: data.xType || undefined,
          ticks: { color: tick, font: { family: "'Inter', sans-serif", size: 10 }, maxTicksLimit: small ? 6 : 10, maxRotation: 0, autoSkip: true },
          grid: { color: grid, drawTicks: false }, border: { color: '#C6D0DA' },
          title: { display: !small && !!data.xLabel, text: data.xLabel, color: tick, font: { family: "'Inter', sans-serif", size: 11, weight: '500' } }
        },
        y: {
          ticks: { color: tick, font: { family: "'IBM Plex Mono', monospace", size: 10 }, maxTicksLimit: 7 },
          grid: { color: grid, drawTicks: false }, border: { display: false },
          title: { display: !small && !!data.yLabel, text: data.yLabel, color: tick, font: { family: "'Inter', sans-serif", size: 11, weight: '500' } }
        }
      }
    }
  });
}

<script>
/* ===== SHORTS DATA (subjects + card deck) ===== */
const SHORTS_SUBJECTS=[{"id": "eth", "name": "Ethical & Professional Standards", "short": "Ethics", "w": "15–20%", "wn": 17.5, "c": "#3E2A5B"}, {"id": "qm", "name": "Quantitative Methods", "short": "Quant", "w": "6–9%", "wn": 7.5, "c": "#16505A"}, {"id": "ec", "name": "Economics", "short": "Econ", "w": "6–9%", "wn": 7.5, "c": "#5C3A1E"}, {"id": "fsa", "name": "Financial Statement Analysis", "short": "FSA", "w": "11–14%", "wn": 12.5, "c": "#24405F"}, {"id": "ci", "name": "Corporate Issuers", "short": "Corp Issuers", "w": "6–9%", "wn": 7.5, "c": "#52441F"}, {"id": "eq", "name": "Equity Investments", "short": "Equity", "w": "11–14%", "wn": 12.5, "c": "#602436"}, {"id": "fi", "name": "Fixed Income", "short": "Fixed Income", "w": "11–14%", "wn": 12.5, "c": "#1C4A38"}, {"id": "dv", "name": "Derivatives", "short": "Derivatives", "w": "5–8%", "wn": 6.5, "c": "#4E2650"}, {"id": "ai", "name": "Alternative Investments", "short": "Alternatives", "w": "7–10%", "wn": 8.5, "c": "#37441D"}, {"id": "pm", "name": "Portfolio Management", "short": "Portfolio Mgmt", "w": "8–12%", "wn": 10.0, "c": "#2A2A5E"}];
const SHORTS_CARDS=[{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Why Ethics Precedes Regulation","b":"Finance sells a product you cannot inspect before buying. Hand over savings and you are buying a promise, so the industry rests on trust rather than verification. Regulation always lags — rules get written after the last scandal, and the next one takes a new shape. Ethical conduct is the part that scales ahead of the rulebook. Legal is the floor, not the standard.","q":"Why can't regulation substitute for ethical conduct?","a":"Regulation is reactive and cannot anticipate every situation. Ethical judgement fills the gaps, and conduct can be fully legal while still breaching professional standards.","v":{"k":"scale","l":"Bare minimum","r":"Full trust","d":["Law","Regulation","Code & Standards","Ethical judgement"]}},{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Ethics, Morals, Laws","b":"Three circles that overlap but never coincide. Morals are personal beliefs about right conduct. Ethics are shared behavioural principles of a community or profession. Laws are the enforceable subset a state chose to codify. Something can be legal and unethical (regulatory arbitrage), or ethical and illegal. The CFA exam lives in the gap where conduct is lawful but still violates the Standards.","q":"Where do most exam ethics violations sit?","a":"In the space where conduct is technically legal but breaches the Code and Standards — legality is never a defence.","v":{"k":"venn","a":"Laws\nenforceable","b":"Ethics\nprofession's norms","ab":"Codified\nduties"}},{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Stakeholders, Not Just Clients","b":"An ethical decision framework asks who is affected before it asks what is allowed. Clients are obvious. Less obvious: your employer, colleagues, the counterparty, other market participants, and the profession itself. Standards are organised around exactly this — harm to markets sits in II, harm to clients in III, harm to employer in IV. Identify the injured party and the standard usually names itself.","q":"How does identifying the harmed party help on the exam?","a":"The Standards are grouped by who is harmed — market, client, employer, or designation — so naming the victim points directly at the right standard.","v":{"k":"flow","d":["Who is affected?","Market → II","Client → III","Employer → IV"]}},{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Ethical Decision-Making Framework","b":"Under pressure people do not reason, they rationalise. The framework slows that down: identify facts, stakeholders and conflicts; consider alternatives and consequences; seek outside guidance; act; then reflect. Situational influences — a bonus deadline, a demanding boss, a culture where everyone does it — overwhelm personal codes far more often than bad character does. Certainty about your own ethics is itself a risk factor.","q":"What most commonly causes ethical failure in honest professionals?","a":"Situational influences — incentives, time pressure, loyalty and organisational culture — rather than defective character.","v":{"k":"flow","d":["Identify","Consider","Decide & act","Reflect"]}},{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Situational Influences","b":"Three forces bend good people. Money and prestige, which reframe a violation as a reward you have earned. Loyalty to colleagues, which makes silence feel like decency. And the bystander effect, where responsibility dissolves because someone senior surely knows. Each narrows the frame to the immediate and the internal. The antidote is a pre-committed standard applied before the pressure arrives, not during it.","q":"Why is loyalty to colleagues an ethical risk?","a":"It reframes concealment as decency, so the professional stays silent about conduct they would report in a stranger.","v":{"k":"bars","d":[["Money & prestige",90],["Loyalty to peers",80],["Time pressure",70],["Bad character",20]],"u":"relative pull"}},{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Framework vs Compliance Approach","b":"A compliance approach asks only whether a rule was broken, which invites box-ticking and blindness to novel conduct. An ethical decision-making framework asks whether the action can be defended to stakeholders and disclosed publicly. Compliance is necessary but static; the framework adapts. The CFA position is that firms need both — rules for the known, judgement for everything else.","q":"What is the weakness of a pure compliance approach?","a":"It only catches conduct already covered by a rule, so novel or technically permitted harms go undetected.","v":{"k":"cmp","h":["Compliance only","Ethical framework"],"d":[["Question","Is it against a rule?","Can it be defended?"],["Scope","Known conduct","Novel conduct too"],["Failure mode","Box-ticking","Needs judgement"]]}},{"s":"eth","t":"Ethics and Trust in the Investment Profession","n":"Costs of Ethical Failure","b":"The direct cost of misconduct — fines, restitution — is usually the smallest line. Reputation loss drives client redemptions; increased regulation raises costs for every firm in the sector, including the innocent ones. At the market level, eroded trust widens spreads and raises the cost of capital for all issuers. Misconduct is a negative externality, which is precisely why the profession self-polices.","q":"Why does one firm's misconduct raise costs for competitors?","a":"It erodes trust market-wide and triggers broader regulation, so the entire sector faces higher compliance costs and cost of capital.","v":{"k":"flow","d":["Misconduct","Trust falls","Regulation rises","All firms pay"]}},{"s":"eth","t":"Code of Ethics and Standards of Professional Conduct","n":"The Code's Six Commitments","b":"Six commitments with the Standards as the operating manual beneath them. Act with integrity, competence and diligence. Place the profession and clients above self. Use reasonable care and independent judgement. Practise professionally and encourage others to. Promote market integrity. Maintain competence. Note the hierarchy in the second commitment — profession and client, then employer, then self. It resolves most conflicts.","q":"When client and employer interests conflict, whose come first?","a":"The client's. The Code places the profession and clients above the member's own interests, and duty to clients outranks duty to employer.","v":{"k":"stack","d":[["Clients & profession","first"],["Employer","second"],["Self","last"]]}},{"s":"eth","t":"Code of Ethics and Standards of Professional Conduct","n":"The Seven Standards","b":"Learn the skeleton before the detail: I Professionalism, II Integrity of Capital Markets, III Duties to Clients, IV Duties to Employers, V Investment Analysis and Recommendations, VI Conflicts of Interest, VII Responsibilities as a Member or Candidate. Most exam errors are misfiling, not misjudging — candidates spot the violation but pick the wrong standard. Sort by who was harmed.","q":"An analyst spreads false rumours to move a price. Which standard?","a":"Standard II(B) Market Manipulation — the harm is to market integrity rather than to a specific client.","v":{"k":"grid","h":["#","Standard","Harm to"],"d":[["I","Professionalism","Profession"],["II","Capital Markets","Market"],["III","Duties to Clients","Client"],["IV","Duties to Employers","Employer"],["V","Analysis & Recs","Client"],["VI","Conflicts","Client"],["VII","Member Conduct","Designation"]]}},{"s":"eth","t":"Code of Ethics and Standards of Professional Conduct","n":"Who the Standards Bind","b":"The Code and Standards apply to CFA Institute members and to candidates enrolled in the programme — including candidates who never sit the exam. They apply globally, to all professional conduct, regardless of employer or local law. Applying to candidates matters: a registered candidate who cheats on an unrelated professional matter is still subject to disciplinary action.","q":"Do the Standards apply to a candidate who is not yet a member?","a":"Yes. Enrolled candidates are bound from registration, worldwide, regardless of whether they ultimately sit or pass the exam.","v":{"k":"venn","a":"Members","b":"Candidates","ab":"Bound by the\nCode & Standards"}},{"s":"eth","t":"Code of Ethics and Standards of Professional Conduct","n":"Disciplinary Process","b":"The Professional Conduct Programme investigates via the Disciplinary Review Committee. Triggers include self-disclosure on the annual Professional Conduct Statement, written complaints, media reports, and exam-day irregularities. Sanctions escalate: private censure, public censure, suspension of membership or candidacy, and revocation of the charter. Members may accept the finding or request a hearing panel.","q":"What are the possible sanctions, from lightest to heaviest?","a":"Private censure, public censure, suspension of membership or candidacy, then revocation of the CFA charter.","v":{"k":"scale","l":"Lightest","r":"Heaviest","d":["Private censure","Public censure","Suspension","Revocation"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(A) Knowledge of the Law","b":"Working across jurisdictions with conflicting rules, follow the strictest of applicable law, the Code and Standards — never the most convenient. Looser local law means the Code governs; stricter local law governs instead. Ignorance is no defence, so stay informed. On discovering an ongoing violation, dissociate: stop participating and escalate through compliance. Reporting to regulators is not required; continuing to participate always violates.","q":"Local law permits what the Code prohibits. What now?","a":"Follow the Code — the stricter of applicable law or the Code and Standards always governs.","v":{"k":"flow","d":["Compare law vs Code","Pick the stricter","Apply it"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(A) Dissociation in Practice","b":"Dissociation is active, not passive. Remove your name from the report, refuse to sign off, decline to participate, and document your objection in writing to supervisors and compliance. If the firm will not act, resignation may be required. What does not count: quietly disagreeing, staying on the team, or continuing to take the fee while privately objecting. Silence reads as participation.","q":"Is reporting the violation to regulators required?","a":"Not required by the Standards, though it may be encouraged or required by local law. Dissociation from the conduct is what is mandatory.","v":{"k":"cmp","h":["Dissociation","Not dissociation"],"d":[["Name","Removed from report","Left on, privately objecting"],["Record","Written objection filed","Verbal grumble"],["Role","Steps off the work","Stays for the fee"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(B) Independence & Objectivity","b":"A mining company flies you to a remote site on a chartered jet, adds a resort stay and a gift bag. Nothing says be kind to us — but the standard targets anything that could reasonably be seen to compromise judgement. Modest gifts from clients are acceptable if disclosed to your employer. Anything from a company you cover is a problem. Take the site visit; pay your own way.","q":"An issuer offers its corporate jet for a site visit. Compliant move?","a":"Decline and pay your own way commercially. Accepting travel from a covered company threatens the appearance of independence even if analysis would not change.","v":{"k":"cmp","h":["Acceptable","Problem"],"d":[["From client, modest","Yes, disclose","—"],["From covered issuer","—","Yes"],["Travel","Commercial, self-paid","Corporate jet"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(B) Pressure From Inside the Firm","b":"Independence is threatened as often from within as from issuers. Investment banking pressuring research to soften a rating; a portfolio manager leaning on an analyst who downgraded a holding; compensation tied to banking revenue. The remedy is structural — firewalls, reporting lines that bypass banking, and compensation not linked to deal flow. Personal integrity alone is not a compliance procedure.","q":"How should a firm protect research independence from its banking arm?","a":"Structural separation — information barriers, research reporting lines independent of banking, and analyst compensation not tied to deal revenue.","v":{"k":"flow","d":["Banking pressure","Firewall","Independent research","Rating stands"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(B) Issuer-Paid Research","b":"Issuer-paid research is not banned, but it is structurally conflicted, so it requires a flat fee agreed before the work and disclosed prominently. What is prohibited: compensation contingent on the conclusion, on the rating, or on the share price reaction. Analysts must reach independent conclusions and disclose the arrangement in the report itself, not in a footnote.","q":"How must issuer-paid research be compensated?","a":"By a flat fee set in advance and disclosed, never contingent on the rating, conclusion, or subsequent share price move.","v":{"k":"cmp","h":["Permitted","Prohibited"],"d":[["Fee type","Flat, pre-agreed","Contingent on rating"],["Disclosure","Prominent in report","Buried or absent"],["Conclusion","Independent","Steered by issuer"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(C) Misrepresentation","b":"Three sins with one root: creating a false impression. Overstating your qualifications or your firm's services. Guaranteeing returns that are not guaranteed — you may describe a genuinely guaranteed product, never imply certainty about markets. And plagiarism, which candidates underestimate: using another's charts, models or wording without attribution violates even when your own analysis is excellent.","q":"Is using a well-known third-party model uncredited a violation?","a":"Yes — plagiarism under I(C). Only factual data from recognised statistical sources may be used without specific attribution.","v":{"k":"flow","d":["Overstating ability","False guarantees","Plagiarism","All = false impression"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(C) Plagiarism Edge Cases","b":"Attribution rules have a tidy shape. Factual data from recognised bodies — a central bank, a statistics agency — needs no specific citation. Everything else does: another analyst's projections, charts, models, or phrasing. Using your own firm's prior research is permitted, but you may not attribute it to an author who has left and no longer stands behind it. Keep records supporting any reused work.","q":"May you republish your firm's old report under your own name?","a":"You may use the firm's research, but you cannot claim work as your own that was authored by a departed analyst, and you must have support for the conclusions.","v":{"k":"cmp","h":["No citation needed","Citation required"],"d":[["Central bank data","Yes","—"],["Statistics agency","Yes","—"],["Another's forecast","—","Yes"],["Charts & models","—","Yes"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"I(D) Misconduct","b":"This standard reaches beyond the desk. It covers dishonesty, fraud and deceit, plus any conduct reflecting adversely on professional reputation, integrity or competence. Personal bankruptcy alone is not misconduct; bankruptcy involving fraudulent conduct is. Drinking at lunch is not misconduct; showing up to manage portfolios impaired is, because competence is compromised. The test is the professional reflection, not the private choice.","q":"Is personal bankruptcy a violation of I(D)?","a":"Not by itself. It becomes a violation only where it involves fraudulent or deceitful conduct that reflects on professional integrity.","v":{"k":"cmp","h":["Not misconduct","Misconduct"],"d":[["Bankruptcy","Ordinary insolvency","Involving fraud"],["Alcohol","Personal time","Impaired at work"],["Test","Private matter","Reflects on competence"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"II(A) Material Nonpublic Information","b":"Two tests, both must hold. Material: a reasonable investor would want it, or it would move the price. Nonpublic: not yet disseminated to the marketplace generally — telling thirty analysts on a private call is still nonpublic. If both hold, you may not act or cause others to act. Ambiguity about materiality is itself a signal to disclose publicly or refrain from trading.","q":"Is information shared on a private call with thirty analysts public?","a":"No. Selective disclosure to a limited group is not general dissemination, so the information remains nonpublic.","v":{"k":"quad","x":["Public","Nonpublic"],"y":["Immaterial","Material"],"d":["Trade freely","Trade freely","Trade freely","Do not trade"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"II(A) The Mosaic Theory","b":"The defence that saves diligent analysts. Combining material public information with nonmaterial nonpublic information — colour from suppliers, store traffic counts, tone in management's voice — to reach a material conclusion is permitted. The conclusion may be market-moving and it is still yours. What is prohibited is receiving a single material nonpublic fact. Keep records of the pieces so the mosaic is provable.","q":"Why is the mosaic theory permitted?","a":"The analyst's conclusion is created from public and nonmaterial pieces through skill, rather than obtained as a material nonpublic fact.","v":{"k":"venn","a":"Material\npublic info","b":"Nonmaterial\nnonpublic info","ab":"Mosaic\nconclusion — allowed"}},{"s":"eth","t":"Guidance for Standards I–VII","n":"II(A) Firewalls and Watch Lists","b":"Firms control inside information structurally. Information barriers separate deal teams from research and trading. Restricted lists bar firm and personal trading in named securities. Watch lists are confidential and monitor trading without advertising the deal. Review employee and proprietary trades against them. Physical and electronic separation matters — shared drives and open-plan seating defeat the policy.","q":"Why keep watch lists confidential rather than publish them?","a":"Circulating the list would itself signal pending deals, so it is kept confidential and used to monitor trading quietly.","v":{"k":"cmp","h":["Restricted list","Watch list"],"d":[["Visibility","Circulated widely","Confidential"],["Effect","Blocks trading","Monitors trading"],["Signals deal?","Less sensitive","Would signal — hence secret"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"II(B) Market Manipulation","b":"Two flavours. Information-based: spreading rumours, pumping a position, misleading disclosures to move price. Transaction-based: wash trades, matched orders, painting the tape, or cornering to create artificial price or volume. Intent is the hinge — legitimate trading strategies that happen to move prices are fine. Manipulation seeks to deceive other participants about supply, demand, or value.","q":"What distinguishes manipulation from a large legitimate trade?","a":"Intent to deceive. Manipulation aims to create artificial price or volume signals; a large trade executed for genuine investment reasons does not.","v":{"k":"cmp","h":["Information-based","Transaction-based"],"d":[["Method","False rumours","Wash trades"],["Also","Pump and dump","Matched orders"],["Effect","Misleads on value","Fakes volume"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"II(B) Legitimate Trading Defences","b":"Not every price impact is manipulation. Providing liquidity as a market maker, hedging a genuine exposure, executing a large legitimate order, and exploiting a real arbitrage are all permitted even where price moves visibly. The exam signal is fabricated activity — trades with no economic purpose, or statements the maker knows to be false. Ask what the trade would achieve if nobody were watching.","q":"Is arbitrage that moves prices manipulation?","a":"No. Exploiting a genuine pricing discrepancy is legitimate; manipulation requires an intent to deceive or create artificial prices.","v":{"k":"flow","d":["Trade has economic purpose?","Yes → legitimate","No → manipulation"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(A) Loyalty, Prudence and Care","b":"You owe clients the care you would owe your own capital, and their interests come before yours and your employer's. The subtle exam point is identifying the client. For a pension fund, the client is the beneficiaries, not the plan sponsor or the finance director who hired you. Follow the plan documents, not the sponsor's preferences, when the two diverge.","q":"Who is the client when managing a corporate pension plan?","a":"The plan beneficiaries. Duty runs to them rather than to the sponsoring company or the executives who awarded the mandate.","v":{"k":"flow","d":["Sponsor hires you","Client = beneficiaries","Plan documents govern"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(A) Soft Dollars and Brokerage","b":"Client brokerage belongs to the client, so it must buy execution quality and research that benefits that client. Paying above-market commissions to a broker who sends you referrals, or to fund your firm's office equipment, converts client money into a firm subsidy. Directed brokerage instructed by the client is permitted, but you should inform them it may cost best execution.","q":"May a manager use client commissions to buy office equipment?","a":"No. Client brokerage must purchase execution and research benefiting the client; using it for general firm overhead breaches the duty of loyalty.","v":{"k":"cmp","h":["Permitted use","Breach"],"d":[["Buys","Execution & research","Firm overhead"],["Benefits","The client","The manager"],["Client-directed","Allowed, with warning","—"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(A) Proxy Voting","b":"Voting rights have economic value, so they must be exercised in the clients' informed interest under a written policy. Blanket automatic support for management is a failure to act. Cost-benefit analysis is allowed — routine votes in tiny positions need not consume research budget — but the policy must say so and be disclosed to clients along with voting records on request.","q":"Is voting all proxies with management acceptable?","a":"No. Proxies must be voted in clients' interests after informed consideration, guided by a disclosed policy, not by default deference to management.","v":{"k":"flow","d":["Written policy","Cost-benefit test","Vote in client interest","Disclose record"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(B) Fair Dealing","b":"Fair does not mean equal. Different service levels for different fee tiers are permitted if disclosed and available to all. What is prohibited is disadvantaging any client in the dissemination of a recommendation or change. Shorten the gap between decision and communication, distribute simultaneously where possible, and bar anyone who received early notice from acting before clients do.","q":"Can premium clients receive more service than others?","a":"Yes, if the tiers are disclosed and available to all clients. What is prohibited is disadvantaging clients in the timing of recommendations and changes.","v":{"k":"cmp","h":["Fair","Unfair"],"d":[["Service tiers","Disclosed, available","Secret preference"],["Rec timing","Simultaneous","Favoured clients first"],["Rating change","All told together","Leaked early"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(B) Allocating Hot Issues","b":"Oversubscribed IPOs and partial fills test fair dealing hardest. Use a pre-established written allocation policy: pro rata by order size across suitable accounts, or an objective rotation. Never allocate by relationship, fee level, or after seeing the first-day pop. Cross-check that performance accounts and employee accounts are not systematically receiving the better fills.","q":"How should a partially filled block be allocated?","a":"Pro rata across all suitable participating accounts under a written pre-trade policy, never on the basis of relationship or after observing performance.","v":{"k":"flow","d":["Pre-set policy","Order placed","Partial fill","Pro rata allocation"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(C) Suitability","b":"In an advisory relationship, build a written investment policy statement covering objectives, constraints, risk tolerance and time horizon, update it at least annually, and judge every recommendation in the context of the total portfolio. A high-risk holding can be suitable inside a diversified portfolio and unsuitable standalone. For an unsolicited trade outside strategy, document that the client was warned.","q":"Is a speculative stock automatically unsuitable for a conservative client?","a":"No. Suitability is judged against the total portfolio, so a small speculative position may be appropriate within an otherwise conservative allocation.","v":{"k":"flow","d":["Gather objectives","Write IPS","Test vs portfolio","Update annually"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(C) Suitability for Index Products","b":"Where the manager runs to a stated mandate rather than for an individual, suitability shifts. A fund manager's obligation is to the stated strategy in the prospectus, not to each investor's circumstances. Drifting into unrelated exposures to chase returns is style drift and violates III(C), even when the drift performs well. The mandate is the standard, and results do not excuse departures.","q":"Does profitable style drift breach the Standards?","a":"Yes. A pooled manager must invest per the stated mandate; deviating breaches suitability regardless of whether the departure made money.","v":{"k":"cmp","h":["Individual client","Pooled mandate"],"d":[["Standard","Client IPS","Stated strategy"],["Test","Total portfolio fit","Mandate consistency"],["Drift","Update IPS","Violation"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(D) Performance Presentation","b":"Presentations must be fair, accurate and complete. The recurring traps: showing only surviving accounts, presenting a model or backtested record as if it were realised, quoting gross returns without labelling them, and cherry-picking a flattering period. Include terminated accounts, state the basis clearly, and keep the data supporting every figure. Brief summaries are allowed if a full presentation is offered.","q":"What is wrong with showing only currently open accounts?","a":"Survivorship bias makes the record look better than reality. Terminated accounts must be included for the presentation to be fair and complete.","v":{"k":"bars","d":[["All accounts (true)",62],["Survivors only",89]],"u":"reported return, illustrative"}},{"s":"eth","t":"Guidance for Standards I–VII","n":"III(E) Preservation of Confidentiality","b":"Client information stays confidential during and after the relationship, and after the client's death. Three exceptions release you: illegal activity by the client, disclosure required by law, or the client's own permission. A fourth situation is not an exception but is treated as compatible — cooperating with a CFA Institute Professional Conduct Programme investigation is permitted.","q":"Does confidentiality end when the client leaves?","a":"No. It survives the relationship and the client's death, subject only to legal requirements, client permission, or illegal client activity.","v":{"k":"grid","h":["Situation","Disclose?"],"d":[["Client left the firm","No"],["Client died","No"],["Required by law","Yes"],["Client permits","Yes"],["Client illegal activity","Yes"],["PCP investigation","Yes"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"IV(A) Loyalty to Employer","b":"While employed, act for your employer's benefit: do not deprive it of your skills, do not divulge confidential information, and do not compete without written consent. Independent practice for compensation requires disclosure and consent before it begins. Preparation to leave is permitted; using the employer's resources, client lists, models or time to build the competing venture is not.","q":"May you plan a competing firm while still employed?","a":"Planning is permitted, but soliciting clients, taking records or models, or using employer resources before resignation violates IV(A).","v":{"k":"cmp","h":["Allowed before leaving","Not allowed"],"d":[["Planning","Yes","—"],["Client list","—","Taking it"],["Models & files","—","Copying them"],["Public info recall","Yes","—"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"IV(A) After You Resign","b":"Once the employment ends, the constraints narrow sharply. Absent a non-compete agreement, you may contact former clients using publicly available information and your own memory. You may not use records taken from the former employer, nor recreate files from copies made while employed. Simple knowledge in your head is yours; documents and data are the firm's property.","q":"Can a departed employee contact former clients?","a":"Yes, absent a non-compete, using public information and personal recollection — but never using records or files taken from the former employer.","v":{"k":"scale","l":"Yours","r":"Employer's","d":["Memory","Public directories","Firm client list","Firm models"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"IV(B) Additional Compensation","b":"Any arrangement that competes with, or could conflict with, your employer's interest requires written consent from all parties before acceptance. The classic case is a client offering a performance bonus — a beach house for beating the benchmark. It is not prohibited; it is prohibited undisclosed, because it distorts how you allocate attention across the employer's other clients.","q":"A client offers a private performance bonus. What is required?","a":"Written consent from all parties, including the employer, before accepting — the arrangement is permitted only once disclosed.","v":{"k":"flow","d":["Offer received","Disclose in writing","All parties consent","Accept"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"IV(C) Responsibilities of Supervisors","b":"Supervision is a duty, not a courtesy. Members with authority must make reasonable efforts to prevent and detect violations by anyone under them, whether or not those people are CFA members. Delegation does not transfer responsibility. If the firm has no adequate compliance system, decline supervisory responsibility in writing until one exists — accepting the role means accepting the liability.","q":"What should a supervisor do if compliance procedures are inadequate?","a":"Recommend improvements and decline supervisory responsibility in writing until an adequate compliance system is in place.","v":{"k":"flow","d":["Adequate system?","No → decline in writing","Yes → detect & prevent"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"IV(C) Detection vs Prevention","b":"A compliant supervisor does both halves. Prevention: distribute the compliance manual, train staff, and design procedures suited to the business. Detection: review trades, monitor personal accounts, and act on red flags rather than accepting explanations. Once a violation is suspected, launch a prompt investigation and place limits on the person's activity — relying on their assurance is itself a supervisory failure.","q":"An employee explains away a suspicious trade. Is that enough?","a":"No. The supervisor must investigate promptly and restrict the employee's activities during the review rather than accepting assurances.","v":{"k":"cmp","h":["Prevention","Detection"],"d":[["Tools","Manual, training","Trade review"],["Timing","Before","Ongoing"],["On red flag","Update procedures","Investigate & restrict"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"V(A) Diligence and Reasonable Basis","b":"Every recommendation needs research support proportional to its complexity and risk. When relying on third-party research or an external manager, you must review their assumptions, process, and quality — you cannot outsource the diligence with the analysis. Group reports are the tricky case: you may leave your name on a consensus view you disagree with, provided the report has a reasonable basis.","q":"Must you remove your name from a team report you disagree with?","a":"No, provided the report has a reasonable and adequate basis. Personal disagreement with a well-supported conclusion is not a violation.","v":{"k":"scale","l":"Light basis","r":"Deep basis","d":["Simple rebalance","Model portfolio","Concentrated bet","Illiquid alternative"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"V(A) Relying on Others","b":"Using someone else's work is permitted after reasonable due diligence on the source. Test the assumptions, sample the methodology, check the credentials and review process, and confirm the data is current. Quantitative models get special attention: understand the inputs, the sensitivity, and the conditions under which the model breaks. A model you cannot explain cannot form a reasonable basis.","q":"What must you check before relying on a quantitative model?","a":"The inputs, assumptions, and sensitivities — including the conditions under which the model fails — so the reliance itself is reasonably grounded.","v":{"k":"flow","d":["Source credentials","Test assumptions","Stress the model","Then rely"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"V(B) Communication With Clients","b":"Distinguish fact from opinion, and disclose the basic format and general principles of your process, including any material change to it. Identify the risks and limitations of the analysis — a projection that ignores liquidity risk is incomplete, not merely optimistic. Communication covers every channel: emails, calls, media appearances and social posts all fall under the standard.","q":"What must be disclosed alongside a recommendation?","a":"The basic process and principles used, the distinction between fact and opinion, and the significant limitations and risks of the analysis.","v":{"k":"cmp","h":["Fact","Opinion"],"d":[["Revenue rose 8%","Reported figure","—"],["Margins will expand","—","Forecast"],["Label required","Cite source","Flag as estimate"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"V(C) Record Retention","b":"Keep the records that support your analysis, recommendations and actions. Where local regulation is silent, CFA Institute recommends seven years. Records belong to the firm, not to you: departing employees must leave originals and copies behind and cannot rebuild files from retained material at the new employer. Reconstructing support after the fact does not satisfy the standard.","q":"How long should records be kept absent a local requirement?","a":"Seven years, as recommended by CFA Institute, and the records remain the employer's property when the employee departs.","v":{"k":"tline","d":[["Research done","record created","+"],["Year 1–6","retain","+"],["Year 7","minimum retention ends","+"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"VI(A) Disclosure of Conflicts","b":"Disclose fully and fairly anything that could reasonably impair objectivity or interfere with duties — to clients, prospective clients, and your employer. Standard triggers: personal ownership in a recommended security, a board seat, the firm's market-making or banking relationship with the issuer, and referral arrangements. Disclosure must be prominent and in plain language, delivered before the client acts.","q":"Does disclosure cure a conflict?","a":"Disclosure allows clients to judge the conflict, but duties of loyalty and fair dealing still apply — some conflicts must be avoided, not merely disclosed.","v":{"k":"flow","d":["Identify conflict","Disclose prominently","Plain language","Before client acts"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"VI(B) Priority of Transactions","b":"The order is fixed: clients first, then the employer, then yourself. Personal trades that could disadvantage a client are prohibited. Firms enforce this with blackout periods around client trades, pre-clearance for employee accounts, and duplicate confirmations to compliance. Beneficial ownership extends the rule — accounts of immediate family in your household are treated as yours.","q":"Are family accounts covered by priority of transactions?","a":"Yes, where you have beneficial ownership — immediate family accounts in your household are treated as personal accounts.","v":{"k":"stack","d":[["Clients","first"],["Employer","second"],["Self & family","last"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"VI(B) Family Accounts Nuance","b":"One exception cuts the other way. Where a family member is a fee-paying client, they must be treated exactly like any other client — not disadvantaged to avoid the appearance of favouritism. Excluding your mother's account from a good allocation because she is family is itself a fair dealing breach. Beneficial ownership, not blood relation, determines which rule applies.","q":"May you exclude a family member's fee-paying account from an allocation?","a":"No. Fee-paying family clients must receive the same treatment as any other client; disadvantaging them breaches fair dealing.","v":{"k":"cmp","h":["Beneficial ownership","Fee-paying client"],"d":[["Treated as","Your own account","Any other client"],["Priority","Last","Equal, first"],["Example","Joint household account","Mother's advisory account"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"VI(C) Referral Fees","b":"Disclose to clients, prospects and your employer any compensation received or paid for referrals, in any form — cash, reciprocal business, or in-kind services. Disclosure must come before the client engages the service so it can inform the decision. The nature and estimated value of the arrangement should be stated, and updated if it changes materially.","q":"When must a referral arrangement be disclosed?","a":"Before the client engages the referred service, with the nature and value of the compensation stated so the client can weigh the recommendation.","v":{"k":"flow","d":["Referral arranged","Disclose before engagement","Client decides"]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"VII(A) Conduct in the Programme","b":"Protect the integrity of the CFA Programme and its exams. Prohibited: disclosing exam content, cheating, breaching testing rules, or misrepresenting your candidacy. Permitted and often confused: expressing personal opinions about CFA Institute or its policies, and discussing curriculum topics or general preparation strategy. Criticism is fine; leaking exam content is not.","q":"Can a candidate publicly criticise CFA Institute policy?","a":"Yes. Expressing opinions about the organisation or its policies is permitted; disclosing exam content or violating testing rules is not.","v":{"k":"cmp","h":["Permitted","Prohibited"],"d":[["Opinions on CFAI","Yes","—"],["Discussing curriculum","Yes","—"],["Exam questions","—","Disclosing"],["Testing rules","—","Breaching"]]}},{"s":"eth","t":"Guidance for Standards I–VII","n":"VII(B) Reference to the CFA Designation","b":"Use the marks accurately. You are a CFA charterholder or a Level II candidate — never a CFA, never CFA Level II. The letters are an adjective following your name in the same font size, and the designation implies no performance advantage. Candidacy exists only while enrolled and registered; passing a level does not make you a permanent candidate.","q":"Is 'John Smith, CFA Level II' acceptable?","a":"No. The correct form is 'John Smith, a Level II candidate in the CFA Program' — the marks cannot be modified by a level.","v":{"k":"cmp","h":["Correct","Incorrect"],"d":[["Charterholder","Jane Roe, CFA","Jane Roe, C.F.A. holder"],["Candidate","Level II candidate in the CFA Program","John Smith, CFA Level II"],["Typeface","Same size as name","Enlarged letters"]]}},{"s":"eth","t":"Introduction to the Global Investment Performance Standards (GIPS)","n":"What GIPS Solves","b":"Before GIPS, firms could show only their winning accounts and call it a track record. GIPS is a voluntary global ethical standard for calculating and presenting performance so prospective clients can compare firms honestly. It attacks representative-account cherry-picking, survivorship bias, and selective period reporting. Compliance is at the firm level and must cover the entire firm.","q":"Can a single strategy claim GIPS compliance on its own?","a":"No. Compliance is claimed at the firm level and must apply firm-wide; partial or product-level compliance is not permitted.","v":{"k":"flow","d":["Define the firm","Include all portfolios","Build composites","Claim compliance"]}},{"s":"eth","t":"Introduction to the Global Investment Performance Standards (GIPS)","n":"Composites","b":"The core mechanism. A composite groups every fee-paying discretionary portfolio managed to a similar strategy — all of them, not the good ones. Firms must include each such portfolio in at least one composite, and terminated portfolios stay in the historical record up to their final full measurement period. This is what kills survivorship bias structurally rather than by promise.","q":"Are terminated portfolios removed from a composite's history?","a":"No. They remain in the composite for the periods they were managed, through the last full measurement period, preventing survivorship bias.","v":{"k":"cmp","h":["Included","Excluded"],"d":[["Fee-paying discretionary","Yes","—"],["Terminated accounts","Yes, historically","—"],["Non-discretionary","—","Yes"],["Model portfolios","—","Yes"]]}},{"s":"eth","t":"Introduction to the Global Investment Performance Standards (GIPS)","n":"Who Can Claim Compliance","b":"Only investment management firms, asset owners, and verifiers operate under GIPS — plan sponsors and software vendors cannot claim it. The firm must be defined as a distinct business entity. Compliance requires meeting all applicable requirements of the standards, and a firm cannot claim partial compliance or state that it complies except for certain composites.","q":"May a firm claim compliance 'except for' one composite?","a":"No. Partial compliance statements are prohibited; the firm either meets all applicable requirements firm-wide or cannot claim compliance.","v":{"k":"scale","l":"Cannot claim","r":"Can claim","d":["Software vendor","Plan sponsor","Asset owner","Investment firm"]}},{"s":"eth","t":"Introduction to the Global Investment Performance Standards (GIPS)","n":"The Nine Sections","b":"GIPS organises into fundamentals of compliance, input data, calculation methodology, composite construction, disclosure, presentation and reporting, real estate, private equity, and wrap or SMA portfolios. The last three are asset-class overlays on the general rules. For Level I, know the structure and the purpose of each section rather than the detailed calculation requirements.","q":"Why do real estate and private equity get separate sections?","a":"Their valuation and cash flow characteristics differ enough that the general calculation and disclosure rules need asset-class-specific provisions.","v":{"k":"stack","d":[["Fundamentals of compliance","1"],["Input data & calculation","2–3"],["Composite construction","4"],["Disclosure & presentation","5–6"],["Asset class provisions","7–9"]]}},{"s":"eth","t":"Introduction to the Global Investment Performance Standards (GIPS)","n":"Verification","b":"Verification is voluntary, performed by an independent third party, and applies to the whole firm rather than to individual composites. It tests whether the firm's policies and procedures for composite construction and performance calculation comply with GIPS. It does not certify the accuracy of any single composite's returns, and a firm may claim compliance without being verified.","q":"Does verification certify a specific composite's returns?","a":"No. It assesses firm-wide policies and procedures for compliance; it is voluntary and cannot be applied to a single composite alone.","v":{"k":"cmp","h":["Verification does","Verification does not"],"d":[["Scope","Whole firm","Single composite"],["Tests","Policies & procedures","Return accuracy"],["Required?","Voluntary","—"]]}},{"s":"eth","t":"Ethics Application","n":"Reading Ethics Vignettes","b":"A method that beats intuition. Read the question first so you know what is being tested. Identify the actor and their role — analyst, supervisor, candidate. Ask who was harmed to locate the standard. Then check whether disclosure or consent was obtained, since many scenarios turn on that single fact rather than on the underlying act being prohibited.","q":"What single fact resolves the most ethics vignettes?","a":"Whether adequate disclosure and consent were obtained — many activities are permitted when disclosed and violations only when concealed.","v":{"k":"flow","d":["Read question first","Identify actor","Who was harmed?","Disclosure obtained?"]}},{"s":"eth","t":"Ethics Application","n":"Permitted With Disclosure","b":"A cluster of activities is legitimate once disclosed and consented to: additional compensation from clients, outside consulting work, referral fees, personal ownership in a covered security, service on a board, and differentiated service levels. Answer choices that say 'must not' for these are usually wrong. The violation is concealment, not the activity.","q":"Which conflicts are cured by disclosure and consent?","a":"Additional compensation, outside work, referral fees, personal holdings, board seats, and service tiers — the breach lies in concealing them.","v":{"k":"grid","h":["Activity","Prohibited?"],"d":[["Referral fee","No — disclose"],["Board seat","No — disclose"],["Personal holding","No — disclose"],["Outside consulting","No — consent"],["Trading on MNPI","Yes, always"],["Plagiarism","Yes, always"]]}},{"s":"eth","t":"Ethics Application","n":"Never Cured by Disclosure","b":"The opposite cluster. Trading on material nonpublic information, market manipulation, plagiarism, misrepresenting qualifications, guaranteeing returns, and breaching confidentiality remain violations no matter how loudly you announce them. Disclosure works for conflicts of interest. It does nothing for conduct that harms the market or deceives outright.","q":"Why can't disclosure fix insider trading?","a":"The harm falls on the market and other participants who cannot consent, so disclosure to a client does not remedy the breach.","v":{"k":"cmp","h":["Disclosure works","Disclosure fails"],"d":[["Type","Conflict of interest","Deception or market harm"],["Who consents","The client","Nobody can"],["Example","Board seat","Insider trading"]]}},{"s":"eth","t":"Ethics Application","n":"The Most-Missed Answer Pattern","b":"When two answers both look defensible, prefer the one requiring more action rather than more restraint. The Standards rarely accept passive good intentions: dissociate rather than disagree quietly, investigate rather than accept an explanation, disclose rather than assume it is obvious, document rather than remember. If an option involves writing something down, it is often correct.","q":"Between quietly disagreeing and formally objecting, which satisfies the Standards?","a":"Formal written objection and dissociation. Passive disagreement while continuing to participate is treated as participation.","v":{"k":"scale","l":"Insufficient","r":"Compliant","d":["Disagree privately","Raise verbally","Object in writing","Dissociate & document"]}},{"s":"qm","t":"Rates and Returns","n":"Interest Rate as Three Things","b":"One number wearing three hats. As a required rate of return, it is what you demand to part with money. As a discount rate, it converts future cash to present value. As an opportunity cost, it is the return abandoned by consuming now. All three are the same figure viewed from different sides of the transaction — which is why one rate does all the work in valuation.","q":"Name the three interpretations of an interest rate.","a":"Required rate of return, discount rate, and opportunity cost of current consumption — three views of a single number.","v":{"k":"flow","d":["Required return","Discount rate","Opportunity cost"]}},{"s":"qm","t":"Rates and Returns","n":"Building Up the Nominal Rate","f":"r = Real risk-free + Inflation premium + Default + Liquidity + Maturity","b":"Start with the real risk-free rate, the pure price of time with no inflation and no risk. Add an inflation premium to get the nominal risk-free rate — roughly a T-bill. Then stack risk premiums: default risk, liquidity risk for assets hard to sell quickly, and maturity risk because long bonds swing more when rates move. Each layer answers a distinct worry.","q":"Which premium compensates for price volatility from longer maturity?","a":"The maturity risk premium — longer-dated instruments have greater price sensitivity to interest rate changes.","v":{"k":"stack","d":[["Maturity premium","price swings"],["Liquidity premium","hard to sell"],["Default premium","credit risk"],["Inflation premium","purchasing power"],["Real risk-free rate","price of time"]]}},{"s":"qm","t":"Rates and Returns","n":"Holding Period Return","f":"HPR = (P₁ − P₀ + D₁) / P₀","b":"The simplest return: everything that arrived divided by what you put in. Price change plus income, over the starting price. It makes no assumption about the period length, which is its strength and its trap — a 12% HPR means nothing until you know whether it took a month or a decade. Chain them multiplicatively to link periods, never additively.","q":"How do you link two holding period returns?","a":"Multiply the growth factors: (1+R₁)(1+R₂) − 1. Returns compound, so they cannot simply be added.","v":{"k":"tline","d":[["t=0","pay P₀","-"],["t=1","receive D₁ + P₁","+"]]}},{"s":"qm","t":"Rates and Returns","n":"Arithmetic vs Geometric Mean Return","f":"Geometric = [(1+R₁)…(1+Rₙ)]^(1/n) − 1","b":"Arithmetic mean answers what a typical single year looked like and is the better estimate of next period's expected return. Geometric mean answers what you actually earned compounding through, and is always lower when returns vary — the gap widens with volatility. Lose 50% then gain 50% and the arithmetic mean says zero while your capital is down 25%.","q":"Which mean is always lower, and when are they equal?","a":"Geometric is always lower; they are equal only when every period return is identical, since the gap grows with return variability.","v":{"k":"bars","d":[["Arithmetic mean",0],["Geometric mean",-25]],"u":"% after +50 then −50"}},{"s":"qm","t":"Rates and Returns","n":"Harmonic Mean and Cost Averaging","f":"Harmonic = n / Σ(1/Xᵢ)","b":"The mean for rates expressed per unit — most usefully, the average price paid when investing a fixed amount each period. Buy $1,000 of a stock monthly and your average cost is the harmonic mean of prices, not the arithmetic mean, because you buy more shares when cheap. Ordering is fixed: harmonic ≤ geometric ≤ arithmetic, with equality only if all values match.","q":"What is the average cost under a fixed-dollar purchase plan?","a":"The harmonic mean of the purchase prices, which is lower than the arithmetic mean because more shares are bought at low prices.","v":{"k":"scale","l":"Lowest","r":"Highest","d":["Harmonic","Geometric","Arithmetic"]}},{"s":"qm","t":"Rates and Returns","n":"Money-Weighted vs Time-Weighted Return","b":"Money-weighted return is the IRR of the portfolio's cash flows — it reflects when the client added or withdrew money, so it measures the investor's actual experience. Time-weighted return strips out those flows by chaining sub-period returns, isolating the manager's skill. Because managers do not control deposits, GIPS and performance evaluation use time-weighted.","q":"Why does performance reporting prefer time-weighted return?","a":"It removes the effect of client-controlled cash flows, isolating the manager's decisions from the timing of deposits and withdrawals.","v":{"k":"cmp","h":["Money-weighted","Time-weighted"],"d":[["Measures","Investor experience","Manager skill"],["Cash flow effect","Included","Removed"],["Method","IRR","Chained sub-returns"]]}},{"s":"qm","t":"Rates and Returns","n":"Annualising and Effective Rates","f":"EAR = (1 + r/m)^m − 1","b":"A stated annual rate is meaningless without its compounding frequency. Effective annual rate translates any quoted rate into the single number you can compare across instruments. As frequency rises, EAR rises but with diminishing steps, converging to the continuous limit e^r − 1. Comparing a monthly-compounded loan to a quarterly one without converting is a standard exam trap.","q":"Does more frequent compounding always raise the effective rate?","a":"Yes, but with diminishing increments, approaching the continuous compounding limit of e^r − 1.","v":{"k":"bars","d":[["Annual",6.0],["Semiannual",6.09],["Quarterly",6.14],["Monthly",6.17],["Continuous",6.18]],"u":"EAR % on 6% stated"}},{"s":"qm","t":"Rates and Returns","n":"Gross, Net, Pre-tax and Real Returns","b":"Four adjustments, applied in order. Gross return is before fees. Net return subtracts management and administrative fees. After-tax return then removes tax on income and gains. Real return finally strips inflation, revealing the change in purchasing power. Comparisons across investors are only valid when the same adjustments have been applied to both sides.","q":"What does real return isolate that nominal return hides?","a":"The change in purchasing power — real return removes inflation, showing what the money can actually buy.","v":{"k":"flow","d":["Gross","− fees = Net","− tax = After-tax","− inflation = Real"]}},{"s":"qm","t":"Time Value of Money in Finance","n":"Present Value as a Machine","f":"PV = FV / (1 + r)^n","b":"Every valuation in the curriculum is this equation wearing a costume. A bond is a series of coupons plus par, discounted. A stock is dividends discounted forever. A project is cash flows discounted at the cost of capital. The only things that change are what the cash flows are called, how many there are, and which rate is appropriate.","q":"What unites bond, equity, and project valuation?","a":"All three discount expected future cash flows to present value; only the cash flow definition and the discount rate differ.","v":{"k":"tline","d":[["t=1","CF₁ ÷ (1+r)","+"],["t=2","CF₂ ÷ (1+r)²","+"],["t=3","CF₃ ÷ (1+r)³","+"]]}},{"s":"qm","t":"Time Value of Money in Finance","n":"Perpetuity and Growing Perpetuity","f":"PV = CF / r    ·    PV = CF₁ / (r − g)","b":"An infinite stream still has finite value because distant cash flows discount to almost nothing. The growing version underpins the dividend discount model and terminal values everywhere. Two rules save marks: the numerator must be next period's cash flow, not this period's, and g must be less than r or the formula returns a meaningless negative price.","q":"Why must g be less than r in a growing perpetuity?","a":"If growth equalled or exceeded the discount rate the series would not converge, and the formula would produce a negative or infinite value.","v":{"k":"plot","x":"Growth rate g","y":"Value","s":[{"n":"PV as g → r","p":[[5,15],[25,22],[45,35],[65,58],[80,88]]}],"note":"Value explodes as g approaches r"}},{"s":"qm","t":"Time Value of Money in Finance","n":"Annuity Due vs Ordinary Annuity","f":"PV(due) = PV(ordinary) × (1 + r)","b":"Ordinary annuities pay at period end — most bonds and loans. Annuities due pay at the start — rent, insurance premiums, some leases. Each due payment arrives one period earlier, so it discounts one period less, making the annuity due worth exactly (1+r) times more. Setting the calculator to the wrong mode is among the most common avoidable errors.","q":"How do you convert an ordinary annuity PV to an annuity due?","a":"Multiply by (1 + r), because every payment arrives one period earlier and is discounted one period less.","v":{"k":"cmp","h":["Ordinary","Due"],"d":[["Payment timing","End of period","Start of period"],["Example","Bond coupon","Rent"],["Value","Lower","× (1+r) higher"]]}},{"s":"qm","t":"Time Value of Money in Finance","n":"Implied Return and Growth","b":"The TVM equation has five variables, so any one can be solved from the other four. Given a price today, a value later, and the number of periods, the implied growth rate falls out as (FV/PV)^(1/n) − 1. This is how you back out a required return from a bond price, or the growth a share price is already embedding.","q":"Given PV, FV and n, how do you find the implied rate?","a":"Rearrange to r = (FV/PV)^(1/n) − 1 — the constant periodic rate that links the two values.","v":{"k":"steps","d":[["PV = 100, FV = 161, n = 5","given"],["161 / 100 = 1.61","ratio"],["1.61^(1/5) = 1.10","annual factor"],["r = 10%","implied rate"]]}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Measurement Scales","b":"Four scales, increasing in information. Nominal labels with no order — sector classifications. Ordinal ranks without meaningful gaps — fund star ratings, where five stars is not twice three. Interval has equal gaps but an arbitrary zero, like temperature. Ratio has a true zero, permitting ratios — price, return, and volume. Applying arithmetic to ordinal data is a classic misuse.","q":"Why can't you average fund star ratings meaningfully?","a":"Star ratings are ordinal: the intervals between ranks are not equal, so arithmetic operations on them are not meaningful.","v":{"k":"scale","l":"Least information","r":"Most information","d":["Nominal","Ordinal","Interval","Ratio"]}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Variance and Standard Deviation","f":"s² = Σ(Xᵢ − X̄)² / (n − 1)","b":"Squaring deviations does two jobs: it stops positives and negatives cancelling, and it penalises large misses disproportionately. Standard deviation returns the answer to the original units so it can be compared with the mean. Sample variance divides by n−1 rather than n — one degree of freedom is consumed estimating the mean, and dividing by n would bias the estimate downward.","q":"Why divide sample variance by n − 1?","a":"Estimating the mean from the sample consumes one degree of freedom; dividing by n would systematically understate the true variance.","v":{"k":"bell","lo":-1,"hi":1,"note":"±1 standard deviation ≈ 68% of a normal distribution"}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Downside Deviation and Target Semideviation","b":"Standard deviation punishes upside surprises equally with losses, which no investor actually minds. Target semideviation measures dispersion only below a chosen threshold, capturing the risk people care about. It matters most for asymmetric return distributions — options strategies, hedge funds, credit — where a symmetric measure flatters the strategy by ignoring the shape of the tail.","q":"When does downside deviation differ most from standard deviation?","a":"For asymmetric return distributions, where upside and downside dispersion differ — symmetric measures then understate genuine loss risk.","v":{"k":"cmp","h":["Standard deviation","Target semideviation"],"d":[["Counts","All deviations","Below target only"],["Symmetry","Assumes it","Does not"],["Best for","Normal returns","Skewed returns"]]}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Skewness","b":"Skewness measures asymmetry. Positive skew has a long right tail: frequent small losses, occasional large gains — a lottery ticket, or a long option position. Negative skew has a long left tail: steady small gains punctuated by disasters — selling insurance, carry trades, credit. Investors generally dislike negative skew because the rare event is the ruinous one.","q":"Which strategies typically exhibit negative skew?","a":"Strategies collecting steady premiums with occasional large losses — selling options, carry trades, and credit-sensitive positions.","v":{"k":"plot","x":"Return","y":"Frequency","s":[{"n":"Negative skew","p":[[5,4],[20,10],[45,55],[62,90],[78,40],[92,8]]}],"note":"Long left tail: rare, large losses"}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Kurtosis","b":"Kurtosis measures tail weight, not peakedness alone. A normal distribution has kurtosis 3, so excess kurtosis is kurtosis minus 3. Leptokurtic distributions have excess above zero: fatter tails and more extreme outcomes than normal. Asset returns are reliably leptokurtic, which is why models assuming normality understate the frequency of crises.","q":"What does positive excess kurtosis imply for risk models?","a":"Fatter tails than normal, so models assuming normality understate the probability and frequency of extreme outcomes.","v":{"k":"bell","lo":-2.5,"hi":2.5,"note":"Fat tails: extreme outcomes more likely than normal implies"}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Coefficient of Variation","f":"CV = s / X̄","b":"Standard deviation alone cannot compare investments with different means — 5% volatility means something different on a 3% return than on a 30% return. CV expresses risk per unit of return, making comparisons scale-free. Lower is better. It breaks down when the mean is near zero or negative, where the ratio becomes unstable or meaningless.","q":"When does the coefficient of variation fail?","a":"When the mean return is near zero or negative, the ratio becomes unstable or loses interpretation.","v":{"k":"bars","d":[["Fund A: 3% ret, 5% sd",1.67],["Fund B: 30% ret, 15% sd",0.5]],"u":"CV (lower is better)"}},{"s":"qm","t":"Statistical Measures of Asset Returns","n":"Correlation and Its Limits","f":"ρ = Cov(X,Y) / (σₓ σᵧ)","b":"Correlation standardises covariance to a −1 to +1 scale, describing linear association only. Three traps: it says nothing about nonlinear relationships, it is highly sensitive to outliers, and it never implies causation — spurious correlation is common in financial data, especially with small samples or shared trends over time.","q":"Why can correlation near zero still hide a strong relationship?","a":"Correlation captures only linear association; a strong nonlinear relationship, such as a U-shape, can produce near-zero correlation.","v":{"k":"scale","l":"ρ = −1","r":"ρ = +1","d":["Perfect inverse","Uncorrelated","Perfect direct"]}},{"s":"qm","t":"Probability Trees and Conditional Expectations","n":"Conditional Probability and Bayes","f":"P(A|B) = P(B|A) × P(A) / P(B)","b":"Bayes updates a prior belief with new evidence. The counterintuitive part is base rates: if only 1% of firms commit fraud and your test is 90% accurate, most positive flags are still false positives, because the large innocent population produces more errors than the small guilty one produces hits. Investors routinely overreact to signals for exactly this reason.","q":"Why do most positive test results mislead when the base rate is low?","a":"The large unaffected population generates more false positives than the small affected population generates true positives.","v":{"k":"tree","root":"1,000 firms","up":"10 fraud → 9 flagged","dn":"990 clean → 99 flagged","pu":"1% base rate","pd":"99%"}},{"s":"qm","t":"Probability Trees and Conditional Expectations","n":"Expected Value and Total Probability","f":"E(X) = Σ P(sᵢ) × X(sᵢ)","b":"Expected value is a probability-weighted average across mutually exclusive, exhaustive scenarios. The total probability rule lets you build it in layers: condition on the economy, then on the company within each economy, then combine. Probability trees make this visible and are the standard exam format — the branch probabilities at each node must sum to one.","q":"What must be true of the scenarios in an expected value calculation?","a":"They must be mutually exclusive and exhaustive, with probabilities summing to one.","v":{"k":"tree","root":"E(EPS)","up":"Expansion 60% → $3.00","dn":"Recession 40% → $1.00","pu":"0.60","pd":"0.40"}},{"s":"qm","t":"Portfolio Mathematics","n":"Portfolio Variance","f":"σ²ₚ = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂","b":"Portfolio risk is not the weighted average of risks — the covariance term is what makes diversification real. When correlation is below 1, the third term shrinks and portfolio volatility falls below the weighted average. At ρ = −1 the risk can be driven to zero with the right weights. Correlation, not the number of holdings, does the work.","q":"Why is portfolio volatility below the weighted average of components?","a":"Because the covariance term shrinks when correlation is below one, so imperfectly correlated assets partly offset each other.","v":{"k":"plot","x":"Correlation ρ","y":"Portfolio risk","s":[{"n":"σₚ","p":[[5,8],[30,32],[55,55],[80,76],[95,90]]}],"note":"Lower ρ means lower portfolio risk"}},{"s":"qm","t":"Portfolio Mathematics","n":"Covariance vs Correlation","f":"Cov(X,Y) = ρ σₓ σᵧ","b":"Covariance carries the direction of co-movement but its magnitude depends on the units of both variables, so a covariance of 0.004 is uninterpretable alone. Dividing by both standard deviations produces correlation, bounded and comparable. Use covariance inside variance calculations; use correlation to describe and compare relationships.","q":"Why is covariance hard to interpret directly?","a":"Its magnitude depends on the units and scale of both variables, so it cannot be compared across pairs until standardised into correlation.","v":{"k":"flow","d":["Covariance","÷ σₓ σᵧ","Correlation (−1 to +1)"]}},{"s":"qm","t":"Portfolio Mathematics","n":"Safety-First and Roy's Criterion","f":"SFRatio = (E(Rₚ) − R_L) / σₚ","b":"Roy's safety-first criterion picks the portfolio minimising the probability of falling below a threshold return. Maximise the SFRatio, which counts standard deviations between expected return and the shortfall level. Note the structure: replace the threshold with the risk-free rate and it becomes the Sharpe ratio. Same geometry, different reference point.","q":"How does the safety-first ratio relate to the Sharpe ratio?","a":"They are identical in form; Sharpe uses the risk-free rate as the reference point while safety-first uses the investor's minimum acceptable return.","v":{"k":"cmp","h":["Safety-first","Sharpe"],"d":[["Reference","Threshold return R_L","Risk-free rate"],["Goal","Minimise shortfall risk","Maximise excess per risk"],["Form","Identical","Identical"]]}},{"s":"qm","t":"Simulation Methods","n":"Monte Carlo Simulation","b":"Specify distributions for the uncertain inputs, draw thousands of random scenarios, and build a distribution of outcomes rather than a single point estimate. It handles path dependency and complex payoffs that closed-form maths cannot. The limitation is fundamental: output quality is bounded by the input assumptions, and simulation is not analytical proof — it explores a model, not reality.","q":"What is the key limitation of Monte Carlo simulation?","a":"It only reflects the assumed input distributions and model structure — garbage in, garbage out, with no analytical proof of the result.","v":{"k":"flow","d":["Specify distributions","Draw random scenarios","Repeat thousands","Distribution of outcomes"]}},{"s":"qm","t":"Simulation Methods","n":"Bootstrap Resampling","b":"Where Monte Carlo assumes a distribution, bootstrapping uses the one you actually observed. Repeatedly resample the historical dataset with replacement, computing the statistic each time, to build an empirical sampling distribution. It requires no normality assumption, which suits financial returns. Its weakness is dependence on the sample: if history omitted a crisis, the bootstrap will too.","q":"How does bootstrapping differ from Monte Carlo?","a":"Bootstrapping resamples observed data with replacement rather than drawing from an assumed distribution, so it requires no distributional assumption.","v":{"k":"cmp","h":["Monte Carlo","Bootstrap"],"d":[["Input","Assumed distribution","Observed sample"],["Assumption","Distributional form","None"],["Weakness","Wrong assumption","Unrepresentative sample"]]}},{"s":"qm","t":"Estimation and Inference","n":"Sampling Error and the Central Limit Theorem","f":"σ_X̄ = σ / √n","b":"The central limit theorem is why statistics works: for samples above roughly 30, the distribution of sample means is approximately normal regardless of the population's shape. The standard error shrinks with the square root of n, so quadrupling the sample only halves the error. Precision is expensive, which is why large improvements in confidence require large increases in data.","q":"How much must sample size grow to halve the standard error?","a":"It must quadruple, since standard error falls with the square root of n.","v":{"k":"bars","d":[["n = 25",20],["n = 100",10],["n = 400",5]],"u":"standard error (σ=100)"}},{"s":"qm","t":"Estimation and Inference","n":"Confidence Intervals","f":"X̄ ± (critical value) × standard error","b":"A 95% confidence interval does not say there is a 95% chance the true mean lies inside it — the true mean is fixed. It says that 95% of intervals constructed this way from repeated samples would contain it. Wider intervals mean less precision. Use z when the population variance is known or n is large; use t otherwise.","q":"What does a 95% confidence level actually describe?","a":"The long-run frequency with which intervals built this way capture the true parameter — not the probability the parameter lies in one specific interval.","v":{"k":"bell","lo":-1.96,"hi":1.96,"note":"95% of the distribution lies between ±1.96 standard errors"}},{"s":"qm","t":"Estimation and Inference","n":"Sampling Biases","b":"Four ways a sample lies. Data-snooping: testing enough rules until one works by chance. Sample selection bias: excluding observations that are hard to obtain. Survivorship, its most common form: measuring only funds still alive. Look-ahead bias: using data unavailable at the decision date. Time-period bias: r
