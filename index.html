<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFA L1 — Formula Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f1a;
    --surface: #141828;
    --surface2: #1c2235;
    --border: #2a3050;
    --accent: #f0c040;
    --accent2: #5b8ff9;
    --accent3: #52d9a0;
    --red: #ff6b6b;
    --orange: #ff9f43;
    --text: #e8eaf6;
    --muted: #7b82a8;
    --t1: #ff6b6b;
    --t2: #ff9f43;
    --t3: #f0c040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    background: linear-gradient(180deg, #0a0d18 0%, var(--bg) 100%);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 18px 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .filter-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--accent2); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  /* SEARCH */
  .search-wrap { margin-left: auto; }
  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    width: 200px;
    outline: none;
    transition: border 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent2); }
  .search-wrap input::placeholder { color: var(--muted); }

  /* MAIN LAYOUT */
  .main { display: flex; min-height: calc(100vh - 160px); }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .formula-item {
    padding: 11px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .formula-item:hover { background: var(--surface); border-left-color: var(--border); }
  .formula-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .formula-item .rank {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    width: 24px;
    flex-shrink: 0;
  }
  .formula-item .name {
    font-size: 0.82rem;
    font-weight: 500;
    line-height: 1.3;
    flex: 1;
  }
  .formula-item .tier-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tier-T1 { background: var(--t1); }
  .tier-T2 { background: var(--t2); }
  .tier-T3 { background: var(--t3); }
  .tier-calc { background: var(--accent2); }
  .section-header {
    padding: 10px 20px 4px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* DETAIL PANEL */
  .detail {
    flex: 1;
    overflow-y: auto;
    padding: 36px 44px;
  }
  .detail-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    gap: 12px;
    text-align: center;
  }
  .detail-empty .icon { font-size: 3rem; opacity: 0.3; }
  .detail-empty p { font-size: 0.9rem; }

  .formula-header { margin-bottom: 28px; }
  .formula-header .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .tag {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag-subject { background: rgba(91,143,249,0.15); color: var(--accent2); border: 1px solid rgba(91,143,249,0.3); }
  .tag-t1 { background: rgba(255,107,107,0.15); color: var(--t1); border: 1px solid rgba(255,107,107,0.3); }
  .tag-t2 { background: rgba(255,159,67,0.15); color: var(--t2); border: 1px solid rgba(255,159,67,0.3); }
  .tag-t3 { background: rgba(240,192,64,0.15); color: var(--t3); border: 1px solid rgba(240,192,64,0.3); }
  .tag-calc { background: rgba(91,143,249,0.2); color: #8ab4ff; border: 1px solid rgba(91,143,249,0.4); }
  .stars { color: var(--accent); font-size: 0.85rem; }
  .formula-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .reading-ref { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

  /* FORMULA DISPLAY BOX */
  .formula-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 28px;
    font-family: 'DM Mono', monospace;
    font-size: 1.3rem;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.5px;
    line-height: 1.6;
    position: relative;
    overflow: hidden;
  }
  .formula-box::before {
    content: 'FORMULA';
    position: absolute;
    top: 8px; left: 12px;
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
  }
  .formula-box .sub {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 8px;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0;
  }

  /* INTERACTIVE SECTION */
  .interactive-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .interactive-section h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .inputs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }
  .input-group label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .input-group label span { color: var(--accent2); font-family: 'DM Mono', monospace; }
  .input-group input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    margin-bottom: 4px;
  }
  .input-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .input-group .val {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent);
    text-align: right;
  }
  .input-group input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: border 0.2s;
  }
  .input-group input[type="number"]:focus { border-color: var(--accent2); }

  /* RESULT */
  .result-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: var(--surface2);
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .result-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .result-value {
    font-family: 'DM Mono', monospace;
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--accent3);
    margin-left: auto;
  }
  .result-breakdown {
    width: 100%;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 6px;
    line-height: 1.8;
  }
  .result-breakdown b { color: var(--text); }

  /* INSIGHT BOX */
  .insight-box {
    background: rgba(91,143,249,0.07);
    border: 1px solid rgba(91,143,249,0.2);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 0.82rem;
    line-height: 1.6;
    color: #aab8e0;
    margin-bottom: 20px;
  }
  .insight-box b { color: var(--accent2); }

  /* EXAM TIP */
  .exam-tip {
    background: rgba(240,192,64,0.07);
    border: 1px solid rgba(240,192,64,0.2);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: #d4b96a;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .exam-tip::before { content: '📝 EXAM TIP — '; font-weight: 700; color: var(--accent); }

  /* CHART */
  .chart-wrap { margin-top: 16px; }
  canvas { max-width: 100%; border-radius: 8px; }

  /* FOOTER */
  .footer-bar {
    padding: 12px 40px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--surface);
  }
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: 120px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    border-radius: 2px;
    transition: width 0.4s;
  }

  /* HIDDEN */
  .hidden { display: none !important; }

  @media (max-width: 700px) {
    .sidebar { width: 220px; }
    .detail { padding: 20px; }
    header { padding: 20px; }
    .filter-bar { padding: 12px 20px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>CFA L1 <span>Formula</span> Explorer</h1>
    <p>35 formulas · Interactive calculators · Exam-focused insights</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <div style="font-size:0.72rem;color:var(--muted)">Progress</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div id="progressText" style="font-size:0.72rem;color:var(--muted)">0 / 35 viewed</div>
  </div>
</header>

<div class="filter-bar">
  <span class="filter-label">Filter</span>
  <button class="filter-btn active" data-filter="all">All (35)</button>
  <button class="filter-btn" data-filter="calc">🖩 Calculator</button>
  <button class="filter-btn" data-filter="T1">🔴 Tier 1</button>
  <button class="filter-btn" data-filter="T2">🟠 Tier 2</button>
  <button class="filter-btn" data-filter="T3">🟡 Tier 3</button>
  <div class="sep"></div>
  <button class="filter-btn" data-filter="Fixed Income">Fixed Income</button>
  <button class="filter-btn" data-filter="Portfolio Mgmt">Portfolio</button>
  <button class="filter-btn" data-filter="Equity">Equity</button>
  <button class="filter-btn" data-filter="FSA">FSA</button>
  <button class="filter-btn" data-filter="Quant">Quant</button>
  <button class="filter-btn" data-filter="Corporate Issuers">Corporate</button>
  <button class="filter-btn" data-filter="Derivatives">Derivatives</button>
  <div class="sep"></div>
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="Search formulas…"></div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="detail" id="detail">
    <div class="detail-empty">
      <div class="icon">∑</div>
      <p>Select a formula from the sidebar to begin</p>
      <p style="font-size:0.75rem;margin-top:4px;">Use filters to narrow by subject or tier</p>
    </div>
  </div>
</div>

<div class="footer-bar">
  <span>CFA Level 1 — Formula Reference Tool</span>
  <span id="viewedCount">0 viewed</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ===== FORMULA DATA =====
const formulas = [
  // ---- CALCULATOR FORMULAS ----
  {
    id: 'bond-pricing',
    rank: '#1', tier: 'calc', subject: 'Fixed Income',
    name: 'Bond Pricing & YTM',
    stars: '⭐⭐⭐⭐⭐',
    reading: 'Reading 42 – Introduction to Fixed-Income Valuation',
    expression: 'Price = Σ [C / (1+r)^t] + [FV / (1+r)^n]',
    subExpression: 'C = coupon payment, r = YTM/2 (semi-annual), n = total periods, FV = face value',
    why: 'Most tested calculation question in the entire exam',
    insight: 'Bond price moves <b>inversely</b> with yield. When YTM > coupon rate, the bond trades at a <b>discount</b>. When YTM < coupon rate, it trades at a <b>premium</b>. At YTM = coupon rate, price = par.',
    examTip: 'On the BA II Plus: N = periods (semi-annual × 2), I/Y = YTM/2, PMT = coupon/2, FV = 1000. Solve for PV. The PV will show as negative — just flip the sign.',
    inputs: [
      { id: 'bond_face', label: 'Face Value (FV)', sym: 'FV', type: 'number', min: 100, max: 10000, step: 100, val: 1000 },
      { id: 'bond_coupon', label: 'Annual Coupon Rate (%)', sym: 'c', type: 'range', min: 0, max: 15, step: 0.25, val: 6 },
      { id: 'bond_ytm', label: 'YTM (%)', sym: 'r', type: 'range', min: 0.5, max: 20, step: 0.25, val: 8 },
      { id: 'bond_years', label: 'Years to Maturity', sym: 'n', type: 'range', min: 1, max: 30, step: 1, val: 10 },
    ],
    calc: (v) => {
      const FV = v.bond_face, c = v.bond_coupon/100/2, r = v.bond_ytm/100/2, n = v.bond_years*2;
      const pv_coupons = c * FV * (1 - Math.pow(1+r,-n)) / r;
      const pv_fv = FV / Math.pow(1+r,n);
      const price = pv_coupons + pv_fv;
      return { value: `$${price.toFixed(2)}`, breakdown: `PV of Coupons: <b>$${pv_coupons.toFixed(2)}</b> + PV of Face Value: <b>$${pv_fv.toFixed(2)}</b> = <b>$${price.toFixed(2)}</b>`, label: 'Bond Price' };
    },
    chart: (v) => {
      const FV = v.bond_face, c = v.bond_coupon/100/2, n = v.bond_years*2;
      const yields = [], prices = [];
      for(let r = 1; r <= 20; r += 0.5) {
        const ri = r/100/2;
        const p = c * FV * (1 - Math.pow(1+ri,-n)) / ri + FV / Math.pow(1+ri,n);
        yields.push(r.toFixed(1)+'%');
        prices.push(p.toFixed(2));
      }
      return { labels: yields, datasets: [{ label: 'Bond Price', data: prices, borderColor: '#f0c040', backgroundColor: 'rgba(240,192,64,0.08)', tension: 0.4, pointRadius: 2 }], xLabel: 'YTM (%)', yLabel: 'Price ($)' };
    }
  },
  {
    id: 'npv-irr',
    rank: '#2', tier: 'calc', subject: 'Corporate Issuers',
    name: 'NPV & IRR',
    stars: '⭐⭐⭐⭐⭐',
    reading: 'Reading 32 – Capital Budgeting',
    expression: 'NPV = Σ [CFt / (1+r)^t] − C0',
    subExpression: 'IRR: the discount rate that makes NPV = 0',
    why: 'Appears in both Corporate Issuers and Equity',
    insight: '<b>Decision rule:</b> Accept project if NPV > 0, or if IRR > required return (hurdle rate). When NPV and IRR conflict, <b>always use NPV</b> — it gives the correct wealth maximization answer.',
    examTip: 'On BA II Plus CF worksheet: CF0 = initial outflow (negative), C01, C02… = subsequent cash flows. NPV key requires you to enter I (discount rate) first. IRR key solves directly after CFs are entered.',
    inputs: [
      { id: 'npv_r', label: 'Discount Rate (%)', sym: 'r', type: 'range', min: 1, max: 30, step: 0.5, val: 10 },
      { id: 'npv_c0', label: 'Initial Investment ($)', sym: 'C0', type: 'number', min: 0, max: 100000, step: 1000, val: 10000 },
      { id: 'npv_cf1', label: 'CF Year 1 ($)', sym: 'CF1', type: 'number', min: 0, max: 50000, step: 500, val: 3000 },
      { id: 'npv_cf2', label: 'CF Year 2 ($)', sym: 'CF2', type: 'number', min: 0, max: 50000, step: 500, val: 4000 },
      { id: 'npv_cf3', label: 'CF Year 3 ($)', sym: 'CF3', type: 'number', min: 0, max: 50000, step: 500, val: 5000 },
      { id: 'npv_cf4', label: 'CF Year 4 ($)', sym: 'CF4', type: 'number', min: 0, max: 50000, step: 500, val: 5000 },
    ],
    calc: (v) => {
      const r = v.npv_r/100;
      const cfs = [v.npv_cf1, v.npv_cf2, v.npv_cf3, v.npv_cf4];
      let pv = 0;
      let bd = '';
      cfs.forEach((cf, i) => { const p = cf/Math.pow(1+r,i+1); pv += p; bd += `Year ${i+1}: $${cf} → PV = <b>$${p.toFixed(0)}</b>  `; });
      const npv = pv - v.npv_c0;
      return { value: `NPV: $${npv.toFixed(0)}`, breakdown: bd + `<br>NPV = $${pv.toFixed(0)} − $${v.npv_c0} = <b>$${npv.toFixed(0)}</b> → ${npv>=0?'✅ Accept':'❌ Reject'}`, label: 'NPV' };
    }
  },
  {
    id: 'pv-fv',
    rank: '#3', tier: 'calc', subject: 'Quant/TVM',
    name: 'PV / FV / Annuity',
    stars: '⭐⭐⭐⭐⭐',
    reading: 'Reading 1 – The Time Value of Money',
    expression: 'FV = PV × (1+r)^n\nPV = FV / (1+r)^n\nPV Annuity = PMT × [1−(1+r)^−n]/r',
    subExpression: 'r = periodic rate, n = number of periods, PMT = periodic payment',
    why: 'Foundation of everything — bonds, equity, leases',
    insight: 'The <b>time value of money</b> is the backbone of all CFA valuations. A dollar today is worth more than a dollar tomorrow because it can be invested. The discount rate r captures both time preference and risk.',
    examTip: 'Always check your P/Y setting on BA II Plus — it should be 1 (annual) unless specified otherwise. Annuity due (payments at beginning) requires setting BGN mode: [2nd][BGN][2nd][SET].',
    inputs: [
      { id: 'tvm_pv', label: 'Present Value ($)', sym: 'PV', type: 'number', min: 0, max: 100000, step: 100, val: 1000 },
      { id: 'tvm_r', label: 'Annual Rate (%)', sym: 'r', type: 'range', min: 0.5, max: 20, step: 0.5, val: 5 },
      { id: 'tvm_n', label: 'Years (n)', sym: 'n', type: 'range', min: 1, max: 30, step: 1, val: 10 },
      { id: 'tvm_pmt', label: 'Annual Payment (PMT)', sym: 'PMT', type: 'number', min: 0, max: 10000, step: 100, val: 0 },
    ],
    calc: (v) => {
      const r = v.tvm_r/100, n = v.tvm_n;
      const fv_lump = v.tvm_pv * Math.pow(1+r, n);
      const fv_ann = v.tvm_pmt > 0 ? v.tvm_pmt * (Math.pow(1+r,n)-1)/r : 0;
      const total = fv_lump + fv_ann;
      return { value: `FV = $${total.toFixed(2)}`, breakdown: `FV of lump sum: <b>$${fv_lump.toFixed(2)}</b>${v.tvm_pmt>0?` + FV of annuity: <b>$${fv_ann.toFixed(2)}</b>`:''}`, label: 'Future Value' };
    },
    chart: (v) => {
      const r = v.tvm_r/100;
      const labels = [], data = [];
      for(let i = 0; i <= v.tvm_n; i++) {
        labels.push('Yr '+i);
        const fv_lump = v.tvm_pv * Math.pow(1+r, i);
        const fv_ann = v.tvm_pmt > 0 ? v.tvm_pmt * (Math.pow(1+r,i)-1)/r : 0;
        data.push((fv_lump + fv_ann).toFixed(2));
      }
      return { labels, datasets: [{ label: 'Portfolio Value', data, borderColor: '#52d9a0', backgroundColor: 'rgba(82,217,160,0.08)', fill: true, tension: 0.4, pointRadius: 2 }], xLabel: 'Year', yLabel: 'Value ($)' };
    }
  },
  {
    id: 'ear',
    rank: '#5', tier: 'calc', subject: 'Quant',
    name: 'EAR from APR',
    stars: '⭐⭐⭐⭐',
    reading: 'Reading 1 – The Time Value of Money',
    expression: 'EAR = (1 + APR/m)^m − 1',

    stars: '⭐⭐⭐',
    reading: 'Reading 36 – Equity Valuation: Concepts and Basic Tools',
    expression: 'FCFE = NI + NCC − FCInv − WCInv + Net Borrowing',
    subExpression: 'FCFF = NI + NCC + Int×(1−t) − FCInv − WCInv',
    why: 'Free cash flow measures for equity and firm valuation',
    insight: 'FCFF is cash available to <b>all capital providers</b> (debt + equity). FCFE is what\'s left for equity holders. The relationship: FCFE = FCFF − Int×(1−t) + Net Borrowing. Use FCFF with WACC; use FCFE with cost of equity.',
    examTip: 'NCC = non-cash charges like D&A (add back since subtracted from NI). FCInv = capex − disposals. WCInv = increase in working capital (cash outflow). Common trap: increasing WC is a cash USE.',
    inputs: [
      { id: 'fc_ni', label: 'Net Income ($)', sym: 'NI', type: 'number', min: 0, max: 500000, step: 5000, val: 100000 },
      { id: 'fc_ncc', label: 'Non-Cash Charges D&A ($)', sym: 'NCC', type: 'number', min: 0, max: 100000, step: 1000, val: 20000 },
      { id: 'fc_fcinv', label: 'Fixed Capital Investment ($)', sym: 'FCInv', type: 'number', min: 0, max: 200000, step: 5000, val: 30000 },
      { id: 'fc_wcinv', label: 'Working Capital Investment ($)', sym: 'WCInv', type: 'number', min: 0, max: 50000, step: 1000, val: 5000 },

      return { value: `FCFE = $${fcfe.toLocaleString()}`, breakdown: `$${v.fc_ni.toLocaleString()} + $${v.fc_ncc.toLocaleString()} − $${v.fc_fcinv.toLocaleString()} − $${v.fc_wcinv.toLocaleString()} + $${v.fc_nb.toLocaleString()} = <b>$${fcfe.toLocaleString()}</b>`, label: 'FCFE' };
    }
  },
  {
    id: 'cv',
    rank: '#20', tier: 'T2', subject: 'Quant',
    name: 'Coefficient of Variation',
    stars: '⭐⭐⭐⭐',
    reading: 'Reading 3 – Statistical Measures of Asset Returns',
    expression: 'CV = Std Dev / Mean',
    subExpression: 'Risk per unit of return — lower CV is better',
    why: 'Compares risk across assets with different return levels',
    insight: 'CV is the <b>relative measure of dispersion</b> — it normalizes std dev by the mean return. Unlike std dev alone, CV lets you compare risk across assets with very different return scales. Useful when deciding between, say, a high-return high-volatility vs a low-return low-volatility investment.',
    examTip: 'Lower CV = better risk/return trade-off. CV is most useful when comparing investments with different means. Do NOT use CV when mean is zero or negative.',
    inputs: [
      { id: 'cv_sd', label: 'Standard Deviation (%)', sym: 'σ', type: 'range', min: 0.1, max: 50, step: 0.5, val: 15 },
      { id: 'cv_mean', label: 'Mean Return (%)', sym: 'μ', type: 'range', min: 0.1, max: 30, step: 0.5, val: 10 },
    ],
    calc: (v) => {
      const cv = v.cv_sd / v.cv_mean;
      return { value: `CV = ${cv.toFixed(3)}`, breakdown: `CV = ${v.cv_sd}% / ${v.cv_mean}% = <b>${cv.toFixed(3)}</b><br>${cv < 1 ? '✅ Low relative risk' : cv < 2 ? '⚠️ Moderate relative risk' : '❌ High relative risk'}`, label: 'Coefficient of Variation' };

  {
    id: 'roe-roa',
    rank: '#22', tier: 'T2', subject: 'FSA',
    name: 'ROE / ROA',
    stars: '⭐⭐⭐⭐',
    reading: 'Reading 27 – Financial Analysis Techniques',
    expression: 'ROE = NI / Avg Equity\nROA = NI / Avg Total Assets',
    subExpression: 'ROE = ROA × Equity Multiplier (leverage link)',
    why: 'Core profitability metrics; foundation of DuPont analysis',
    insight: 'The gap between ROE and ROA reveals financial leverage. If ROE > ROA, the firm is using <b>debt to amplify returns to equity holders</b>. This is the equity multiplier in action. High leverage amplifies both gains and losses.',
    examTip: 'Avg equity and avg assets = (beginning + ending) / 2. If not specified, use ending balance. The spread ROE − ROA is a quick signal of leverage: bigger gap = more debt.',
    inputs: [
      { id: 'rr_ni', label: 'Net Income ($)', sym: 'NI', type: 'number', min: 0, max: 500000, step: 5000, val: 80000 },
      { id: 'rr_eq', label: 'Avg Equity ($)', sym: 'Equity', type: 'number', min: 1, max: 2000000, step: 50000, val: 500000 },
      { id: 'rr_assets', label: 'Avg Total Assets ($)', sym: 'Assets', type: 'number', min: 1, max: 5000000, step: 100000, val: 1500000 },
    ],
    calc: (v) => {
      const roe = v.rr_ni / v.rr_eq;
      const roa = v.rr_ni / v.rr_assets;
      const em = v.rr_assets / v.rr_eq;
      return { value: `ROE = ${(roe*100).toFixed(2)}%`, breakdown: `ROE = $${v.rr_ni.toLocaleString()} / $${v.rr_eq.toLocaleString()} = <b>${(roe*100).toFixed(2)}%</b><br>ROA = $${v.rr_ni.toLocaleString()} / $${v.rr_assets.toLocaleString()} = <b>${(roa*100).toFixed(2)}%</b><br>Equity Multiplier = ${em.toFixed(2)}x → ROE / ROA = ${(roe/roa).toFixed(2)}x ✓`, label: 'ROE' };
    }
  },
  {
    id: 'accrued',
    rank: '#34', tier: 'T3', subject: 'Fixed Income',
    name: 'Accrued Interest',
    stars: '⭐⭐',
    reading: 'Reading 42 – Introduction to Fixed-Income Valuation',
    expression: 'AI = (Days Settled / Days in Period) × Coupon',
    subExpression: 'Full Price = Flat Price (quoted) + Accrued Interest',
    why: 'Determines the actual cash price paid for a bond between coupon dates',
    insight: 'Bonds trade on a <b>flat (clean) price</b>, but the buyer pays the <b>full (dirty) price</b> which includes accrued interest since the last coupon. This compensates the seller for holding the bond between coupon dates.',
    examTip: 'Day count conventions: US government bonds use Actual/Actual. Corporate bonds use 30/360 (assume 30-day months, 360-day year). This affects AI calculation.',
    inputs: [
      { id: 'ai_days', label: 'Days Since Last Coupon', sym: 'Days', type: 'range', min: 0, max: 182, step: 1, val: 45 },
      { id: 'ai_period', label: 'Days in Coupon Period', sym: 'Period', type: 'range', min: 90, max: 184, step: 1, val: 182 },
      { id: 'ai_coupon', label: 'Semi-Annual Coupon ($)', sym: 'C/2', type: 'number', min: 0, max: 100, step: 5, val: 30 },
      { id: 'ai_flat', label: 'Flat (Quoted) Price ($)', sym: 'Flat', type: 'number', min: 800, max: 1200, step: 10, val: 980 },
    ],
    calc: (v) => {
      const ai = (v.ai_days / v.ai_period) * v.ai_coupon;
      const full = v.ai_flat + ai;
      return { value: `AI = $${ai.toFixed(4)}`, breakdown: `AI = (${v.ai_days}/${v.ai_period}) × $${v.ai_coupon} = <b>$${ai.toFixed(4)}</b><br>Full Price = $${v.ai_flat} + $${ai.toFixed(4)} = <b>$${full.toFixed(4)}</b>`, label: 'Accrued Interest' };
    }
  },
  {
    id: 'dupont5',
    rank: '#3', tier: 'T1', subject: 'FSA',
    name: 'DuPont 5-Part',
    stars: '⭐⭐⭐⭐⭐',
    reading: 'Reading 27 – Financial Analysis Techniques',
    expression: 'ROE = Tax Burden × Interest Burden × EBIT Margin × Asset Turnover × Equity Multiplier',
    subExpression: '= (NI/EBT) × (EBT/EBIT) × (EBIT/Rev) × (Rev/Assets) × (Assets/Equity)',
    why: 'Extended decomposition for deeper FSA analysis',
    insight: 'The 5-part DuPont separates <b>tax effects</b> (NI/EBT) and <b>interest burden</b> (EBT/EBIT) from operating performance. A company reducing ROE purely by paying more interest (higher debt) shows up clearly as a drop in the interest burden component.',
    examTip: 'Components 3+4 = operating ROA (EBIT/Assets). Components 1×2 convert operating to net income. Component 5 is leverage. Each one can be benchmarked separately.',
    inputs: [
      { id: 'dp5_ni', label: 'Net Income ($)', sym: 'NI', type: 'number', min: 0, max: 10000, step: 100, val: 400 },
      { id: 'dp5_ebt', label: 'EBT ($)', sym: 'EBT', type: 'number', min: 1, max: 10000, step: 100, val: 500 },
      { id: 'dp5_ebit', label: 'EBIT ($)', sym: 'EBIT', type: 'number', min: 1, max: 10000, step: 100, val: 600 },
      { id: 'dp5_rev', label: 'Revenue ($)', sym: 'Rev', type: 'number', min: 1, max: 50000, step: 500, val: 5000 },
      { id: 'dp5_assets', label: 'Total Assets ($)', sym: 'A', type: 'number', min: 1, max: 50000, step: 500, val: 8000 },
      { id: 'dp5_equity', label: 'Equity ($)', sym: 'E', type: 'number', min: 1, max: 50000, step: 500, val: 3000 },
    ],
    calc: (v) => {
      const tb = v.dp5_ni/v.dp5_ebt, ib = v.dp5_ebt/v.dp5_ebit;
      const em2 = v.dp5_ebit/v.dp5_rev, at = v.dp5_rev/v.dp5_assets, lev = v.dp5_assets/v.dp5_equity;

// ===== STATE =====
let currentFilter = 'all';
let currentSearch = '';
let activeId = null;
let viewed = new Set();
let charts = {};

// ===== RENDER SIDEBAR =====
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const filtered = formulas.filter(f => {
    const matchFilter = currentFilter === 'all' || f.tier === currentFilter || f.subject === currentFilter;
    const matchSearch = !currentSearch || f.name.toLowerCase().includes(currentSearch.toLowerCase()) || f.subject.toLowerCase().includes(currentSearch.toLowerCase());
    return matchFilter && matchSearch;
  });

  const groups = { calc: [], T1: [], T2: [], T3: [] };
  filtered.forEach(f => { if(groups[f.tier]) groups[f.tier].push(f); });

  const labels = { calc: '🖩 Calculator', T1: '🔴 Tier 1 — Critical', T2: '🟠 Tier 2 — Important', T3: '🟡 Tier 3 — Useful' };
  let html = '';
  Object.entries(groups).forEach(([tier, items]) => {
    if(items.length === 0) return;
    html += `<div class="section-header">${labels[tier]}</div>`;
    items.forEach(f => {
      const isViewed = viewed.has(f.id);
      html += `<div class="formula-item${activeId===f.id?' active':''}" data-id="${f.id}">
        <span class="rank">${f.rank}</span>
        <span class="name" style="${isViewed?'color:var(--text)':'color:var(--muted)'}">${f.name}</span>
        <span class="tier-dot tier-${tier}"></span>
      </div>`;
    });
  });
  if(!html) html = '<div style="padding:20px;color:var(--muted);font-size:0.82rem;">No formulas match your filter.</div>';
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('.formula-item').forEach(el => {
    el.addEventListener('click', () => selectFormula(el.dataset.id));
  });
}

// ===== RENDER DETAIL =====
function selectFormula(id) {
  activeId = id;
  viewed.add(id);
  updateProgress();
  renderSidebar();

  const f = formulas.find(x => x.id === id);
  if(!f) return;

  const tierTag = f.tier === 'calc' ? `<span class="tag tag-calc">🖩 Calculator</span>` :
    f.tier === 'T1' ? `<span class="tag tag-t1">🔴 Tier 1</span>` :
    f.tier === 'T2' ? `<span class="tag tag-t2">🟠 Tier 2</span>` :
    `<span class="tag tag-t3">🟡 Tier 3</span>`;

  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="formula-header">
      <div class="meta">
        ${tierTag}
        <span class="tag tag-subject">${f.subject}</span>
        <span class="stars">${f.stars}</span>
      </div>
      <h2>${f.name}</h2>
      <div class="reading-ref">${f.reading}</div>
    </div>

    <div class="formula-box">
      ${f.expression.replace(/\n/g,'<br>')}
      <div class="sub">${f.subExpression}</div>
    </div>

    <div class="insight-box">${f.insight}</div>
    <div class="exam-tip">${f.examTip}</div>

    <div class="interactive-section">
      <h3>Interactive Calculator</h3>
      <div class="inputs-grid" id="inputsGrid"></div>
      <div class="result-row">
        <span class="result-label" id="resultLabel">Result</span>
        <div style="flex:1"></div>
        <span class="result-value" id="resultValue">—</span>
      </div>
      <div class="result-breakdown" id="resultBreakdown"></div>
    </div>

    ${f.chart ? '<div class="interactive-section"><h3>Visual Chart</h3><div class="chart-wrap"><canvas id="formulaChart" height="200"></canvas></div></div>' : ''}
  `;

  buildInputs(f);
  computeAndRender(f);
}

function buildInputs(f) {
  const grid = document.getElementById('inputsGrid');
  grid.innerHTML = '';
  f.inputs.forEach(inp => {
    const div = document.createElement('div');
    div.className = 'input-group';
    if(inp.type === 'range') {
      div.innerHTML = `<label>${inp.label} <span>(${inp.sym})</span></label>
        <input type="range" id="${inp.id}" min="${inp.min}" max="${inp.max}" step="${inp.step}" value="${inp.val}">
        <div class="val" id="${inp.id}_val">${inp.val}</div>`;
    } else {
      div.innerHTML = `<label>${inp.label} <span>(${inp.sym})</span></label>
        <input type="number" id="${inp.id}" min="${inp.min}" max="${inp.max}" step="${inp.step}" value="${inp.val}">`;
    }
    grid.appendChild(div);
  });

  f.inputs.forEach(inp => {
    const el = document.getElementById(inp.id);
    el.addEventListener('input', () => {
      if(inp.type === 'range') document.getElementById(inp.id+'_val').textContent = el.value;
      computeAndRender(f);
    });
    el.addEventListener('change', () => computeAndRender(f));
  });
}

function getValues(f) {
  const v = {};
  f.inputs.forEach(inp => {
    v[inp.id] = parseFloat(document.getElementById(inp.id).value) || 0;
  });
  return v;
}

function computeAndRender(f) {
  try {
    const v = getValues(f);
    const result = f.calc(v);
    document.getElementById('resultValue').textContent = result.value;
    document.getElementById('resultBreakdown').innerHTML = result.breakdown;
    document.getElementById('resultLabel').textContent = result.label;
    if(f.chart) renderChart(f, v);
  } catch(e) {
    document.getElementById('resultValue').textContent = 'Error';
  }
}

function renderChart(f, v) {
  const data = f.chart(v);
  const ctx = document.getElementById('formulaChart');
  if(!ctx) return;
  if(charts['main']) { charts['main'].destroy(); }
  charts['main'] = new Chart(ctx, {
    type: data.type || 'line',
    data: { labels: data.labels, datasets: data.datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#7b82a8', font: { family: 'DM Sans', size: 11 } } }
      },
      scales: {
        x: { ticks: { color: '#7b82a8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: data.xLabel, color: '#7b82a8', font: { size: 11 } } },
        y: { ticks: { color: '#7b82a8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: data.yLabel, color: '#7b82a8', font: { size: 11 } } }
      }
    }
  });
}

function updateProgress() {
  const pct = (viewed.size / formulas.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${viewed.size} / ${formulas.length} viewed`;
  document.getElementById('viewedCount').textContent = `${viewed.size} viewed`;
}

// ===== FILTERS =====
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderSidebar();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  renderSidebar();
});

// ===== INIT =====
renderSidebar();
</script>
</body>
</html>
