esults specific to an unrepresentative window.","q":"Which bias inflates historical fund returns most reliably?","a":"Survivorship bias — dead and merged funds disappear from the sample, leaving only the winners in the measured record.","v":{"k":"grid","h":["Bias","Cause"],"d":[["Data-snooping","Testing until something works"],["Selection","Hard data excluded"],["Survivorship","Failures removed"],["Look-ahead","Used unavailable data"],["Time-period","Unrepresentative window"]]}},{"s":"qm","t":"Estimation and Inference","n":"Student's t-Distribution","b":"When the population variance is unknown and estimated from a small sample, extra uncertainty enters, so the t-distribution has fatter tails than the normal. Critical values are therefore larger and intervals wider — a conservative correction. Degrees of freedom equal n − 1, and as they rise the t converges on the normal, becoming nearly identical above about 30 observations.","q":"Why does the t-distribution have fatter tails than the normal?","a":"It accounts for the additional uncertainty of estimating the population variance from the sample, requiring wider intervals.","v":{"k":"plot","x":"Standard deviations","y":"Density","s":[{"n":"t (fatter tails)","p":[[5,10],[25,32],[50,80],[75,32],[95,10]]}],"note":"t → normal as degrees of freedom rise"}},{"s":"qm","t":"Hypothesis Testing","n":"Framing the Hypotheses","b":"The null is the statement of no effect, and it always contains the equality. The alternative is what you would need evidence to conclude. Tests are built to be hard on the alternative, so failing to reject is not proof the null is true — merely that evidence was insufficient. State hypotheses before seeing the data, or the whole procedure is compromised.","q":"Does failing to reject the null prove the null is true?","a":"No. It means the evidence was insufficient to reject it, which is not the same as establishing that it holds.","v":{"k":"cmp","h":["Null H₀","Alternative Hₐ"],"d":[["Contains","Equality","Strict inequality"],["Role","Assumed true","Requires evidence"],["Outcome","Reject or fail to reject","Never 'accepted'"]]}},{"s":"qm","t":"Hypothesis Testing","n":"Type I and Type II Errors","b":"Type I rejects a true null — a false positive, whose probability is the significance level α that you choose. Type II fails to reject a false null — a false negative, probability β. The two trade off: tightening α to avoid false alarms raises the chance of missing real effects. Only a larger sample reduces both simultaneously. Power equals 1 − β.","q":"How can both error types be reduced at once?","a":"Only by increasing the sample size — changing α alone shifts the trade-off between the two errors rather than reducing both.","v":{"k":"quad","x":["H₀ true","H₀ false"],"y":["Fail to reject","Reject"],"d":["Type I error (α)","Correct — power","Correct","Type II error (β)"]}},{"s":"qm","t":"Hypothesis Testing","n":"p-Value","b":"The p-value is the smallest significance level at which the null would be rejected — the probability of observing a result at least this extreme if the null were true. Reject when p is below α. It is not the probability the null is true, and it says nothing about the size or economic importance of the effect.","q":"Does a very small p-value mean the effect is large?","a":"No. It indicates statistical significance only; economic significance depends on the magnitude of the effect and the costs of acting on it.","v":{"k":"bell","lo":-1.65,"hi":1.65,"note":"Shaded tails = p-value region; smaller p sits further out"}},{"s":"qm","t":"Hypothesis Testing","n":"Choosing the Test Statistic","b":"Match the statistic to the parameter. Testing a single mean with unknown variance uses t. Testing a variance uses chi-square. Comparing two variances uses F. Comparing two means requires knowing whether the samples are independent or paired — paired tests use differences and are far more powerful when the pairing is genuine.","q":"Which test compares the variances of two populations?","a":"The F-test, formed as the ratio of the two sample variances with the larger in the numerator.","v":{"k":"grid","h":["Testing","Statistic"],"d":[["One mean, σ unknown","t"],["Two independent means","t"],["Paired observations","t on differences"],["One variance","Chi-square"],["Two variances","F"]]}},{"s":"qm","t":"Parametric and Non-Parametric Tests of Independence","n":"When to Go Non-Parametric","b":"Parametric tests assume a distributional form and test parameters. Use non-parametric alternatives when that assumption fails, when data are ranked or ordinal rather than measured, or when the sample is very small. The trade-off is power: with no distributional structure to exploit, non-parametric tests need more data to detect the same effect.","q":"What is the cost of using a non-parametric test?","a":"Lower statistical power — without distributional assumptions, more data is needed to detect an effect of the same size.","v":{"k":"cmp","h":["Parametric","Non-parametric"],"d":[["Assumes","Distribution form","Little or nothing"],["Data","Interval or ratio","Ranks or ordinal too"],["Power","Higher","Lower"]]}},{"s":"qm","t":"Parametric and Non-Parametric Tests of Independence","n":"Chi-Square Test of Independence","b":"Used on contingency tables of counts to ask whether two categorical variables are related — for example whether sector membership is independent of credit rating. Compare observed frequencies with those expected under independence; a large gap rejects independence. It shows association only, never direction or causation, and needs adequate expected counts in each cell.","q":"What does a chi-square test of independence conclude?","a":"Whether two categorical variables are associated — it establishes neither the direction of the relationship nor causation.","v":{"k":"grid","h":["","Rated A","Rated B"],"d":[["Observed","40","60"],["Expected","55","45"],["Gap","−15","+15"]]}},{"s":"qm","t":"Simple Linear Regression","n":"What Regression Estimates","f":"Yᵢ = b₀ + b₁Xᵢ + εᵢ","b":"Ordinary least squares chooses the intercept and slope that minimise the sum of squared residuals. The slope is the estimated change in the dependent variable per unit change in the independent one, holding the model's assumptions. Squaring residuals means large errors dominate the fit, which is why a single outlier can swing the line substantially.","q":"What does OLS minimise?","a":"The sum of squared residuals — the squared vertical distances between observed values and the fitted line.","v":{"k":"plot","x":"X (independent)","y":"Y (dependent)","s":[{"n":"Fitted line","p":[[8,15],[30,38],[52,55],[74,72],[92,88]]}],"note":"OLS minimises squared vertical distances"}},{"s":"qm","t":"Simple Linear Regression","n":"Coefficient of Determination","f":"R² = Explained variation / Total variation","b":"R² is the fraction of the dependent variable's variation explained by the model. In simple linear regression it equals the squared correlation coefficient. High R² does not validate a model — it can reflect a spurious relationship, and a low R² can still accompany an economically meaningful and statistically significant slope.","q":"Does a high R² establish that a model is correct?","a":"No. It measures explained variation only; the relationship may be spurious, and significance of the slope is a separate question.","v":{"k":"donut","d":[["Explained (R²)",64],["Unexplained",36]]}},{"s":"qm","t":"Simple Linear Regression","n":"Regression Assumptions","b":"Four conditions underpin valid inference: the relationship is linear in parameters, the independent variable is not random and is uncorrelated with the error, errors have constant variance across observations, and errors are independent and normally distributed. Financial data routinely violates constant variance and independence — volatility clusters, and errors persist through time.","q":"Which regression assumption does volatility clustering violate?","a":"Homoskedasticity — constant error variance — because periods of high volatility produce systematically larger residuals.","v":{"k":"grid","h":["Assumption","Common violation"],"d":[["Linearity","Nonlinear payoffs"],["Constant variance","Volatility clustering"],["Independent errors","Serial correlation"],["Normal errors","Fat tails"]]}},{"s":"qm","t":"Introduction to Big Data Techniques","n":"The Four Vs of Big Data","b":"Volume, the sheer quantity. Velocity, the speed of arrival, sometimes real time. Variety, the mix of structured tables, semi-structured logs and unstructured text or images. Veracity, the reliability question that matters most in finance — alternative data is often noisy, biased, and inconsistently collected, so cleaning consumes more effort than modelling.","q":"Which of the four Vs matters most for investment use?","a":"Veracity. Alternative data is frequently noisy and biased, so data quality determines whether any signal extracted is trustworthy.","v":{"k":"grid","h":["V","Question"],"d":[["Volume","How much?"],["Velocity","How fast?"],["Variety","What forms?"],["Veracity","Can we trust it?"]]}},{"s":"qm","t":"Introduction to Big Data Techniques","n":"Supervised vs Unsupervised Learning","b":"Supervised learning trains on labelled data to predict an outcome — classifying bonds as likely to default given known past defaults. Unsupervised learning has no labels and finds structure instead: clustering companies into groups, or reducing dimensions. Deep learning uses layered neural networks and can operate under either regime, handling images and text.","q":"What distinguishes supervised from unsupervised learning?","a":"Supervised learning trains on labelled target data to predict outcomes; unsupervised learning finds structure in unlabelled data.","v":{"k":"cmp","h":["Supervised","Unsupervised"],"d":[["Data","Labelled","Unlabelled"],["Goal","Predict a target","Find structure"],["Example","Default prediction","Clustering peers"]]}},{"s":"qm","t":"Introduction to Big Data Techniques","n":"Overfitting","b":"A model that memorises the training data rather than learning the pattern performs beautifully in-sample and fails out-of-sample. The defence is partitioning data into training, validation and test sets, and holding the test set untouched until the end. In finance the risk is severe because the signal-to-noise ratio is low and the temptation to keep tuning is high.","q":"How is overfitting detected?","a":"By evaluating on data held out from training — strong in-sample performance with weak out-of-sample results signals overfitting.","v":{"k":"plot","x":"Model complexity","y":"Error","s":[{"n":"Out-of-sample error","p":[[8,80],[28,42],[50,28],[72,52],[92,88]]}],"note":"Error rises again once the model starts memorising noise"}},{"s":"ec","t":"The Firm and Market Structures","n":"The Four Market Structures","b":"A spectrum defined by how much pricing power a seller holds. Perfect competition: many firms, identical products, zero pricing power, free entry. Monopolistic competition: many firms, differentiated products, some power. Oligopoly: few firms, interdependent decisions. Monopoly: one firm, high barriers. Everything else — profits, advertising, long-run outcomes — follows from where a market sits.","q":"What single factor orders the four market structures?","a":"Pricing power, which derives from the number of sellers, product differentiation, and barriers to entry.","v":{"k":"scale","l":"No pricing power","r":"Full pricing power","d":["Perfect competition","Monopolistic competition","Oligopoly","Monopoly"]}},{"s":"ec","t":"The Firm and Market Structures","n":"Profit Maximisation Rule","f":"Produce where MR = MC","b":"One rule governs every structure. Produce each unit whose marginal revenue covers its marginal cost, and stop when they meet. What differs is the demand curve. Under perfect competition demand is horizontal so MR equals price. Everywhere else the firm faces a downward-sloping curve, so selling one more unit lowers the price on all units and MR falls below price.","q":"Why does MR fall below price when demand slopes downward?","a":"Selling an extra unit requires cutting the price on all units sold, so the revenue gained is less than the price of the marginal unit.","v":{"k":"plot","x":"Quantity","y":"Price / Cost","s":[{"n":"Demand","p":[[8,88],[50,52],[92,16]]},{"n":"MR","p":[[8,88],[50,20],[70,2]]},{"n":"MC","p":[[10,20],[50,42],[92,80]]}],"note":"Optimal output where MR meets MC"}},{"s":"ec","t":"The Firm and Market Structures","n":"Perfect Competition in the Long Run","b":"Short-run economic profits attract entry. Entry expands supply, pushing price down until it equals minimum average total cost and economic profit reaches zero. Zero economic profit does not mean zero accounting profit — the firm still earns its opportunity cost of capital. Free entry and exit is the mechanism, which is why barriers are the decisive variable elsewhere.","q":"Does zero economic profit mean the firm earns nothing?","a":"No. Economic profit excludes the opportunity cost of capital, so a firm earning zero economic profit is still earning its required return.","v":{"k":"flow","d":["Economic profit","Firms enter","Price falls","Profit → zero"]}},{"s":"ec","t":"The Firm and Market Structures","n":"Monopoly and Price Discrimination","b":"A monopolist restricts output to raise price, creating deadweight loss. Price discrimination recovers part of that loss by charging different buyers different prices — first degree captures each buyer's maximum willingness to pay, second degree prices by quantity purchased, third degree by identifiable group such as student or senior fares. It requires market power and the ability to prevent resale.","q":"What two conditions make price discrimination possible?","a":"Market power to set prices, and the ability to segment buyers while preventing resale between them.","v":{"k":"grid","h":["Degree","Basis"],"d":[["First","Each buyer's max willingness"],["Second","Quantity purchased"],["Third","Identifiable group"]]}},{"s":"ec","t":"The Firm and Market Structures","n":"Oligopoly and Interdependence","b":"Few enough firms that each must anticipate the others' reactions. The kinked demand curve model explains price rigidity: rivals match cuts but ignore increases, so raising price loses share and cutting price gains little. The Cournot model has firms competing on quantity, Stackelberg gives one firm a first-mover advantage, and Nash equilibrium describes a stable set of mutual best responses.","q":"Why does the kinked demand model predict sticky prices?","a":"Rivals match price cuts but not increases, so deviation in either direction reduces profit and firms hold price constant.","v":{"k":"plot","x":"Quantity","y":"Price","s":[{"n":"Kinked demand","p":[[10,90],[45,60],[92,44]]}],"note":"Kink at the prevailing price makes deviation unattractive"}},{"s":"ec","t":"The Firm and Market Structures","n":"Measuring Market Concentration","f":"HHI = Σ (market share %)²","b":"N-firm concentration ratio sums the largest firms' shares — simple but blind to the distribution among them and to mergers within the group. The Herfindahl-Hirschman Index squares each share, so it rises with inequality and reacts properly to mergers. Neither measure captures barriers to entry, which is why a concentrated but contestable market may still be competitive.","q":"Why is HHI preferred to the concentration ratio?","a":"Squaring shares makes HHI sensitive to the distribution of market power and to mergers among large firms, which the concentration ratio misses.","v":{"k":"cmp","h":["Concentration ratio","HHI"],"d":[["Method","Sum of top N shares","Sum of squared shares"],["Merger sensitivity","Poor","Good"],["Entry barriers","Ignored","Ignored"]]}},{"s":"ec","t":"The Firm and Market Structures","n":"Elasticity and Total Revenue","f":"Elasticity = %ΔQ / %ΔP","b":"When demand is elastic, a price cut raises total revenue because quantity responds more than proportionally. When inelastic, a price cut lowers revenue. At unit elasticity revenue peaks. Elasticity rises with the availability of substitutes, the share of income spent, and the time allowed to adjust — which is why short-run energy demand is inelastic and long-run demand is not.","q":"Should a firm facing inelastic demand cut prices?","a":"No. With inelastic demand, quantity responds less than proportionally, so a price cut reduces total revenue.","v":{"k":"plot","x":"Quantity","y":"Total revenue","s":[{"n":"Revenue","p":[[8,20],[30,58],[50,72],[70,58],[92,20]]}],"note":"Revenue peaks at unit elasticity"}},{"s":"ec","t":"The Firm and Market Structures","n":"Economies and Diseconomies of Scale","b":"Long-run average cost falls as output rises when fixed costs spread, specialisation deepens, and bargaining power grows. Beyond the minimum efficient scale, coordination costs, bureaucracy and communication failures push average cost back up. The shape of this curve determines how many firms an industry can support — steep economies of scale create natural concentration.","q":"What causes diseconomies of scale?","a":"Coordination and communication costs, bureaucracy, and management complexity rising faster than the benefits of size.","v":{"k":"plot","x":"Output","y":"Long-run average cost","s":[{"n":"LRAC","p":[[8,85],[30,45],[52,32],[74,48],[92,80]]}],"note":"Minimum efficient scale at the trough"}},{"s":"ec","t":"Understanding Business Cycles","n":"Phases of the Business Cycle","b":"Recovery, expansion, slowdown, contraction. Output, employment and capacity utilisation move together but not simultaneously. The critical asymmetry: contractions tend to be shorter and sharper than expansions, and recognition lags mean the phase is usually identified only in hindsight. Investment decisions must therefore work off leading indicators rather than confirmed turning points.","q":"Why are business cycle phases identified late?","a":"Data reporting and revision lags mean turning points are typically confirmed only well after they occur, forcing reliance on leading indicators.","v":{"k":"plot","x":"Time","y":"Output","s":[{"n":"Cycle","p":[[5,30],[25,68],[45,88],[62,58],[78,32],[95,62]]}],"note":"Expansions are longer; contractions sharper"}},{"s":"ec","t":"Understanding Business Cycles","n":"Inventory-Sales Ratio","b":"A sensitive early signal. As sales slow before firms notice, unsold goods accumulate and the inventory-sales ratio rises — a lagging response to a leading problem. Firms then cut production, amplifying the downturn. In recovery the ratio falls sharply as sales outpace stock, and firms must rebuild inventory, amplifying the upswing. Inventories magnify the cycle.","q":"What does a rising inventory-sales ratio signal?","a":"Sales are slowing faster than production adjusts, typically preceding production cuts that deepen a downturn.","v":{"k":"flow","d":["Sales slow","Inventories build","Production cut","Downturn deepens"]}},{"s":"ec","t":"Understanding Business Cycles","n":"Leading, Coincident, Lagging Indicators","b":"Leading indicators turn before the economy: building permits, stock prices, new orders, the yield curve slope, consumer expectations. Coincident indicators move with it: industrial production, personal income, employees on payrolls. Lagging indicators confirm afterwards: average duration of unemployment, inventory-sales ratio, unit labour costs. Only leading indicators support positioning ahead of a turn.","q":"Give three leading economic indicators.","a":"Building permits, new orders for capital goods, and the slope of the yield curve — each turns before aggregate output does.","v":{"k":"grid","h":["Type","Example"],"d":[["Leading","Building permits"],["Leading","Yield curve slope"],["Coincident","Industrial production"],["Coincident","Payroll employment"],["Lagging","Unemployment duration"],["Lagging","Unit labour costs"]]}},{"s":"ec","t":"Understanding Business Cycles","n":"Types of Unemployment","b":"Frictional unemployment is people between jobs — unavoidable and even healthy, reflecting search. Structural unemployment is a skills or location mismatch, which persists and requires retraining. Cyclical unemployment moves with the business cycle and is what policy targets. The natural rate is frictional plus structural: the level consistent with stable inflation.","q":"Which unemployment type does monetary policy address?","a":"Cyclical unemployment. Frictional and structural unemployment together form the natural rate and are not reduced by demand stimulus.","v":{"k":"stack","d":[["Cyclical","policy-addressable"],["Structural","skills mismatch"],["Frictional","job search"]]}},{"s":"ec","t":"Understanding Business Cycles","n":"Measuring Inflation","f":"Real = Nominal − Inflation (approx.)","b":"Headline inflation includes food and energy; core excludes them because they are volatile and often supply-driven, making core a better guide to underlying trend. A Laspeyres index using a fixed basket overstates inflation through substitution bias, new-product bias and quality bias. Chained indices update weights to reduce substitution bias.","q":"Why do central banks watch core rather than headline inflation?","a":"Food and energy prices are volatile and supply-driven, so core inflation better reveals the persistent underlying trend that policy can influence.","v":{"k":"cmp","h":["Headline","Core"],"d":[["Includes","Food & energy","Excludes them"],["Volatility","High","Lower"],["Use","Cost of living","Policy trend"]]}},{"s":"ec","t":"Understanding Business Cycles","n":"Cost-Push vs Demand-Pull Inflation","b":"Demand-pull comes from aggregate demand outrunning capacity — output and prices both rise, and policy tightening addresses it cleanly. Cost-push comes from input prices or wages rising, shifting supply back: prices rise while output falls, producing stagflation. This is the hard case, because tightening deepens the output loss and loosening entrenches the inflation.","q":"Why is cost-push inflation harder for policymakers?","a":"It raises prices while reducing output, so tightening worsens the recession and easing entrenches inflation — there is no clean response.","v":{"k":"cmp","h":["Demand-pull","Cost-push"],"d":[["Source","Excess demand","Input costs"],["Output","Rises","Falls"],["Policy","Tighten","No clean answer"]]}},{"s":"ec","t":"Fiscal Policy","n":"Fiscal Policy Tools","b":"Government spending and taxation, used to influence aggregate demand. Spending is the more direct lever but slower to enact and deploy. Tax changes reach households faster but their effect depends on how much is spent rather than saved. Automatic stabilisers — progressive taxes and unemployment benefits — act without legislation and are often the fastest-acting element.","q":"What makes automatic stabilisers valuable?","a":"They respond immediately to changing conditions without legislative action, avoiding the recognition and action lags of discretionary policy.","v":{"k":"cmp","h":["Discretionary","Automatic"],"d":[["Needs law","Yes","No"],["Speed","Slow","Immediate"],["Example","Stimulus package","Unemployment benefit"]]}},{"s":"ec","t":"Fiscal Policy","n":"The Fiscal Multiplier","f":"Multiplier = 1 / [1 − MPC(1 − t)]","b":"A dollar of spending circulates: the recipient spends part, the next recipient spends part of that, and so on. The multiplier is larger when the marginal propensity to consume is high and the tax rate low. Leakages through saving, taxes and imports shrink it. This is why stimulus targeted at lower-income households is more potent — their MPC is higher.","q":"What reduces the size of the fiscal multiplier?","a":"Leakages — higher saving, higher tax rates, and higher imports each remove money from the domestic spending chain.","v":{"k":"flow","d":["Government spends $1","Recipient spends MPC","Next spends MPC²","Total > $1"]}},{"s":"ec","t":"Fiscal Policy","n":"Ricardian Equivalence","b":"The proposition that debt-financed tax cuts do not stimulate: rational households anticipate the future taxes needed to repay and save the windfall instead of spending it. If it held fully, deficit spending would be neutral. Empirically it holds only partially — liquidity-constrained households do spend — but it explains why stimulus effects are weaker than simple multipliers imply.","q":"Under Ricardian equivalence, why is a tax cut ineffective?","a":"Households anticipate higher future taxes to service the debt and save the tax cut rather than spending it.","v":{"k":"flow","d":["Tax cut today","Households expect future tax","They save it","No demand boost"]}},{"s":"ec","t":"Fiscal Policy","n":"Crowding Out and Policy Lags","b":"Heavy government borrowing can raise interest rates and displace private investment — crowding out — though the effect is muted when the economy has slack. Three lags degrade fiscal policy: recognition of the problem, action to legislate a response, and impact once implemented. Together they explain why discretionary fiscal stimulus often arrives after the recession it targeted.","q":"Name the three lags affecting fiscal policy.","a":"Recognition lag in identifying the problem, action lag in legislating a response, and impact lag before the policy affects output.","v":{"k":"tline","d":[["Downturn begins","recognition lag","-"],["Problem identified","action lag","-"],["Policy passed","impact lag","-"],["Effect arrives","often too late","+"]]}},{"s":"ec","t":"Monetary Policy","n":"Functions and Qualities of Money","b":"Money is a medium of exchange, a unit of account, and a store of value. It works when it is readily acceptable, durable, portable, divisible and hard to counterfeit. Fiat money has no intrinsic value and rests entirely on confidence in the issuer — which is why central bank credibility is not soft rhetoric but the foundation of the system.","q":"Why does central bank credibility matter mechanically?","a":"Fiat money holds value only through confidence in the issuer, so credibility is what makes the medium of exchange function.","v":{"k":"flow","d":["Medium of exchange","Unit of account","Store of value"]}},{"s":"ec","t":"Monetary Policy","n":"Money Creation and the Multiplier","f":"Money multiplier = 1 / reserve requirement","b":"Banks hold a fraction of deposits as reserves and lend the rest, which is redeposited and lent again. A 10% reserve requirement implies a theoretical multiplier of 10. Reality falls short because banks hold excess reserves and the public holds cash. When confidence collapses, the multiplier shrinks and central bank expansion fails to reach the real economy.","q":"Why does actual money creation fall short of the theoretical multiplier?","a":"Banks hold excess reserves and the public holds currency outside the banking system, both of which break the redeposit chain.","v":{"k":"flow","d":["$100 deposit","$90 lent","$81 lent","Total ≈ $1,000"]}},{"s":"ec","t":"Monetary Policy","n":"The Quantity Theory of Money","f":"MV = PY","b":"Money supply times velocity equals price level times real output. Assume velocity and real output are stable and money growth translates directly into inflation — the monetarist conclusion. The assumptions are the weak point: velocity is not stable, particularly during financial stress when money is hoarded, which is why large monetary expansions have not always produced proportional inflation.","q":"Which assumption in MV = PY breaks in practice?","a":"Stable velocity. Velocity falls when money is hoarded during stress, breaking the direct link from money growth to inflation.","v":{"k":"steps","d":[["M × V","money times turnover"],["= P × Y","prices times real output"],["V, Y stable →","ΔM drives ΔP"],["V unstable →","link breaks"]]}},{"s":"ec","t":"Monetary Policy","n":"Central Bank Tools","b":"Three levers. The policy rate is the primary instrument, signalling the cost of short-term funds. Open market operations buy or sell securities to adjust reserves and steer rates toward target. Reserve requirements are blunt and rarely adjusted in developed markets. Beyond these sit unconventional tools — quantitative easing and forward guidance — used when rates approach zero.","q":"Which tool is the central bank's primary instrument?","a":"The policy interest rate, supported by open market operations that steer market rates toward the target level.","v":{"k":"grid","h":["Tool","Use"],"d":[["Policy rate","Primary signal"],["Open market ops","Steer rates daily"],["Reserve requirement","Blunt, rarely used"],["QE & guidance","At the zero bound"]]}},{"s":"ec","t":"Monetary Policy","n":"The Neutral Rate and Policy Stance","f":"Neutral rate ≈ trend real growth + target inflation","b":"The neutral policy rate neither stimulates nor restrains. Below it, policy is expansionary; above it, contractionary. Judging the stance requires comparing the actual rate to this benchmark rather than to zero — a 4% policy rate is loose if neutral is 6%. The neutral rate is unobservable and drifts, which is the central difficulty of practical policy.","q":"Is a 2% policy rate expansionary?","a":"It depends on the neutral rate. Policy is expansionary only when the rate sits below neutral, which is unobservable and changes over time.","v":{"k":"scale","l":"Expansionary","r":"Contractionary","d":["Rate < neutral","Neutral rate","Rate > neutral"]}},{"s":"ec","t":"Monetary Policy","n":"Central Bank Credibility and Independence","b":"Effective central banks share three features: independence from short-term political pressure, credibility so announcements move expectations without action, and transparency so markets can anticipate reactions. Credibility is the most valuable — a trusted commitment to a target anchors inflation expectations, which does much of the stabilisation work before any rate change occurs.","q":"Why does credibility reduce the need for policy action?","a":"A credible target anchors inflation expectations, so wage and price setting adjusts without requiring actual rate changes.","v":{"k":"flow","d":["Credible target","Expectations anchored","Wages & prices adjust","Less action needed"]}},{"s":"ec","t":"Monetary Policy","n":"Limits of Monetary Policy","b":"Rates near zero leave little conventional room, and pushing them negative distorts bank profitability. In a liquidity trap, additional reserves are hoarded rather than lent, so transmission fails. Monetary policy also cannot address structural unemployment or supply shocks. When demand is weak and rates are already low, fiscal policy carries more of the burden.","q":"Why does monetary policy fail in a liquidity trap?","a":"Additional reserves are hoarded rather than lent or spent, so expanding the money supply does not raise aggregate demand.","v":{"k":"flow","d":["Rates near zero","Reserves hoarded","No new lending","Transmission fails"]}},{"s":"ec","t":"Introduction to Geopolitics","n":"Cooperation and Globalisation","b":"Two axes describe a state's posture. Cooperation ranges from cooperative rule-following to non-cooperative unilateral action. Globalisation ranges from open integration with global markets to autarky and self-sufficiency. Combining them gives four archetypes — globalisation, multilateralism, bilateralism and autarky — each with distinct implications for trade, capital flows and risk premiums.","q":"What two axes define geopolitical archetypes?","a":"The degree of cooperation with other states, and the degree of globalisation or openness to cross-border flows.","v":{"k":"quad","x":["Non-cooperative","Cooperative"],"y":["Autarky","Globalised"],"d":["Globalisation (hegemony)","Multilateralism","Autarky","Bilateralism"]}},{"s":"ec","t":"Introduction to Geopolitics","n":"Geopolitical Risk and Its Speed","b":"Three types by tempo. Event risk arrives on a known date — an election, a treaty deadline. Exogenous risk is unanticipated and sudden, such as an invasion. Thematic risk builds slowly over years: demographic decline, climate change, technological decoupling. Markets price event risk reasonably well, underprice exogenous risk by definition, and systematically discount thematic risk.","q":"Which geopolitical risk type do markets most consistently underprice?","a":"Thematic risk. Slow-building trends lack a trigger date, so they are discounted relative to their eventual impact.","v":{"k":"scale","l":"Fast","r":"Slow","d":["Exogenous shock","Event risk","Thematic risk"]}},{"s":"ec","t":"International Trade","n":"Comparative Advantage","b":"Absolute advantage means producing more efficiently in absolute terms. Comparative advantage means producing at lower opportunity cost — giving up less of the alternative good. Trade is mutually beneficial whenever opportunity costs differ, even if one country is worse at everything. This counterintuitive result is the entire theoretical case for trade, and it turns on relative rather than absolute efficiency.","q":"Can a country with no absolute advantage still gain from trade?","a":"Yes. Gains arise from differences in opportunity cost, so a country less efficient at everything still has a comparative advantage in something.","v":{"k":"cmp","h":["Absolute advantage","Comparative advantage"],"d":[["Compares","Output per input","Opportunity cost"],["Trade gains?","Not required","Required"],["Basis","Absolute efficiency","Relative efficiency"]]}},{"s":"ec","t":"International Trade","n":"Ricardian and Heckscher-Ohlin Models","b":"Both explain comparative advantage but locate its source differently. The Ricardian model attributes it to technology differences in labour productivity. Heckscher-Ohlin attributes it to differences in factor endowments — capital-abundant countries export capital-intensive goods. Heckscher-Ohlin adds a distributional prediction: trade benefits the abundant factor and harms the scarce one, which explains trade politics.","q":"What does Heckscher-Ohlin predict about income distribution?","a":"Trade raises returns to the abundant factor and lowers returns to the scarce factor, creating domestic winners and losers.","v":{"k":"cmp","h":["Ricardian","Heckscher-Ohlin"],"d":[["Source","Technology","Factor endowments"],["Factors","Labour only","Capital and labour"],["Distribution","Silent","Winners and losers"]]}},{"s":"ec","t":"International Trade","n":"Tariffs, Quotas and Subsidies","b":"A tariff raises the domestic price, cutting imports and generating government revenue with a deadweight loss. A quota caps quantity, producing the same price effect but transferring the revenue to whoever holds the licence — quota rents may leave the country entirely. An export subsidy lowers the world price and costs the treasury. All three protect producers and tax consumers.","q":"What is the key difference between a tariff and an equivalent quota?","a":"A tariff generates revenue for the government, while a quota creates rents that may accrue to foreign exporters or licence holders instead.","v":{"k":"grid","h":["Measure","Who gains revenue"],"d":[["Tariff","Government"],["Quota","Licence holder"],["Voluntary restraint","Foreign exporter"],["Subsidy","Nobody — treasury pays"]]}},{"s":"ec","t":"International Trade","n":"Trading Blocs","b":"Increasing integration in five steps. A free trade area removes internal tariffs. A customs union adds a common external tariff. A common market adds free movement of labour and capital. An economic union harmonises institutions and policy. A monetary union adopts a single currency, surrendering independent monetary policy — the deepest and least reversible commitment.","q":"What distinguishes a customs union from a free trade area?","a":"A customs union adds a common external tariff against non-members, while a free trade area only removes internal tariffs.","v":{"k":"stack","d":[["Monetary union","single currency"],["Economic union","common policy"],["Common market","free factor movement"],["Customs union","common external tariff"],["Free trade area","no internal tariffs"]]}},{"s":"ec","t":"Capital Flows and the FX Market","n":"Balance of Payments","f":"Current account + Capital account + Financial account = 0","b":"The accounts must sum to zero. A current account deficit — importing more goods and services than exported — is necessarily financed by a financial account surplus, meaning net capital inflow. This is an accounting identity, not a judgement: a deficit financed by productive investment differs entirely from one financed by short-term borrowing.","q":"What must accompany a current account deficit?","a":"An offsetting financial account surplus — net capital inflows finance the excess of imports over exports as an accounting identity.","v":{"k":"cmp","h":["Current account","Financial account"],"d":[["Records","Goods, services, income","Asset ownership"],["Deficit here","Must be financed","By a surplus here"],["Relationship","Accounting identity","Sums to zero"]]}},{"s":"ec","t":"Capital Flows and the FX Market","n":"Reading an Exchange Rate Quote","b":"A quote of USD/EUR 1.10 means one euro buys 1.10 dollars: the base currency is the denominator, the price currency the numerator. If the number rises, the base currency has appreciated. Getting this backwards inverts every subsequent calculation, so establish which currency is being priced before touching the arithmetic.","q":"In USD/EUR 1.10, which currency is the base?","a":"The euro. The base currency appears second in the notation and is the one being priced, in this case at 1.10 dollars each.","v":{"k":"flow","d":["USD/EUR 1.10","EUR is base","1 EUR = 1.10 USD","Rate ↑ = EUR stronger"]}},{"s":"ec","t":"Capital Flows and the FX Market","n":"Spot, Forward and Cross Rates","b":"The spot rate settles in two business days. The forward rate is contracted today for future settlement, quoted as points added to spot. A cross rate is built from two quotes sharing a common currency — multiply or divide so the shared currency cancels. Forward points reflect the interest rate differential, not a forecast of where spot will go.","q":"What determines forward points?","a":"The interest rate differential between the two currencies, enforced by covered interest rate parity — not an expectation of future spot.","v":{"k":"steps","d":[["USD/GBP = 1.25","given"],["USD/EUR = 1.10","given"],["Divide to cancel USD","1.25 / 1.10"],["EUR/GBP = 1.136","cross rate"]]}},{"s":"ec","t":"Capital Flows and the FX Market","n":"Exchange Rate Regimes","b":"A spectrum of commitment. Formal dollarisation and currency boards surrender monetary independence entirely. Fixed and crawling pegs commit to a rate but retain some discretion. Managed float intervenes without a stated target. Free float leaves the rate to the market. The trade-off is the policy trilemma: fixed rate, free capital flows, and independent monetary policy — pick two.","q":"What is the policy trilemma?","a":"A country can have only two of: a fixed exchange rate, free capital movement, and independent monetary policy.","v":{"k":"scale","l":"No independence","r":"Full independence","d":["Dollarisation","Currency board","Fixed peg","Managed float","Free float"]}},{"s":"ec","t":"Exchange Rate Calculations","n":"Covered Interest Rate Parity","f":"F/S = (1 + i_price) / (1 + i_base)","b":"An arbitrage-enforced relationship, not a theory. Borrowing in a low-rate currency, converting, investing at a higher rate, and hedging with a forward must return exactly the risk-free rate — otherwise free money exists. The currency with the higher interest rate trades at a forward discount. Because arbitrage enforces it, covered parity holds tightly in liquid markets.","q":"Which currency trades at a forward discount?","a":"The one with the higher interest rate. Its forward price is lower than spot, offsetting the interest advantage exactly.","v":{"k":"flow","d":["Borrow low-rate currency","Convert at spot","Invest at high rate","Hedge forward → risk-free"]}},{"s":"ec","t":"Exchange Rate Calculations","n":"Uncovered Parity and PPP","b":"Uncovered interest rate parity drops the forward hedge and asserts that expected currency depreciation offsets the interest differential — it rests on expectations, so it fails persistently, which is what makes the carry trade profitable. Purchasing power parity says exchange rates adjust so identical goods cost the same everywhere. Both hold poorly short-term and better over long horizons.","q":"Why does the carry trade earn returns?","a":"Because uncovered interest rate parity fails empirically — high-rate currencies do not depreciate enough to offset the interest differential.","v":{"k":"cmp","h":["Covered parity","Uncovered parity"],"d":[["Hedged?","Yes, forward","No"],["Enforced by","Arbitrage","Expectations"],["Holds?","Tightly","Poorly short-term"]]}},{"s":"ec","t":"Exchange Rate Calculations","n":"Bid-Ask Spreads in FX","b":"Dealers quote a bid at which they buy the base currency and an ask at which they sell it. You always transact at the worse side. Spreads widen with volatility, in illiquid currency pairs, at longer forward tenors, and around market closes. For cross rates built from two quotes, the spreads compound, which is why direct quotes are cheaper when available.","q":"Why is trading a cross rate indirectly more expensive?","a":"Two bid-ask spreads are crossed rather than one, so the combined transaction cost compounds.","v":{"k":"scale","l":"Narrow","r":"Wide","d":["Major pair, spot","Minor pair","Long forward","Illiquid cross"]}},{"s":"ec","t":"Exchange Rate Calculations","n":"Real Exchange Rate","f":"Real rate = Nominal × (Foreign price level / Domestic price level)","b":"The nominal rate says how many units of currency; the real rate says how much stuff. A currency can appreciate nominally while depreciating in real terms if domestic inflation runs higher. Competitiveness depends on the real rate, which is why high-inflation countries lose export share even when the nominal rate holds steady.","q":"Can a currency appreciate nominally and depreciate in real terms?","a":"Yes. If domestic inflation exceeds foreign inflation by more than the nominal appreciation, real purchasing power and competitiveness decline.","v":{"k":"flow","d":["Nominal rate","× relative price levels","Real rate","Drives competitiveness"]}},{"s":"fsa","t":"Introduction to Financial Statement Analysis","n":"What the Three Statements Answer","b":"Each answers a different question. The income statement asks whether the business was profitable over a period. The balance sheet asks what it owns and owes at a single instant. The cash flow statement asks where cash actually moved. Profit is an opinion shaped by accrual judgements; cash is closer to a fact. Analysis lives in the gap between the two.","q":"Why can a profitable company run out of cash?","a":"Accrual accounting records revenue when earned rather than collected, so growing receivables and inventory can consume cash even while profits rise.","v":{"k":"grid","h":["Statement","Question","Period"],"d":[["Income","Was it profitable?","Over time"],["Balance sheet","What is owned/owed?","Instant"],["Cash flow","Where did cash go?","Over time"]]}},{"s":"fsa","t":"Introduction to Financial Statement Analysis","n":"The Framework of Analysis","b":"Six steps that stop analysis drifting. State the purpose and questions. Collect data — statements, filings, industry context. Process it into ratios and common-size statements. Analyse and interpret. Report conclusions. Update as new information arrives. Most weak analysis skips step one, producing pages of ratios with no question they were meant to answer.","q":"What is the most commonly skipped step in financial analysis?","a":"Stating the purpose and the specific questions to be answered, without which the ratio work has no interpretive anchor.","v":{"k":"flow","d":["Define purpose","Collect data","Process","Interpret & report"]}},{"s":"fsa","t":"Introduction to Financial Statement Analysis","n":"Auditor's Opinion Types","b":"Unqualified means the statements present fairly under the applicable framework — the clean opinion. Qualified flags a specific exception. Adverse says the statements are not fairly presented, which is severe. Disclaimer means the auditor could not form an opinion, often from scope limitation. A going concern paragraph can appear within an unqualified opinion and is a major red flag.","q":"Which opinion signals the auditor could not reach a conclusion?","a":"A disclaimer of opinion, typically arising from a scope limitation that prevented sufficient audit evidence being obtained.","v":{"k":"scale","l":"Clean","r":"Severe","d":["Unqualified","Unqualified + emphasis","Qualified","Adverse","Disclaimer"]}},{"s":"fsa","t":"Introduction to Financial Statement Analysis","n":"Beyond the Statements","b":"The notes explain accounting policies, segment detail, and contingencies — often where the real information sits. Management commentary or MD&A gives management's narrative, useful but unaudited and self-interested. Proxy statements reveal compensation structure and governance. Press releases and earnings calls come first but carry the most spin. Weight sources by how much scrutiny they survived.","q":"Why are the notes often more informative than the statements?","a":"They disclose accounting policy choices, segment detail and contingencies that determine how the headline numbers should be interpreted.","v":{"k":"scale","l":"Most scrutiny","r":"Least scrutiny","d":["Audited statements","Notes","MD&A","Earnings call"]}},{"s":"fsa","t":"Analyzing Income Statements","n":"Revenue Recognition","b":"The five-step model: identify the contract, identify performance obligations, determine the transaction price, allocate it to obligations, and recognise revenue as each obligation is satisfied. The judgement concentrates in obligation identification and timing. Recognising over time versus at a point changes reported growth substantially, so compare policy across peers before comparing growth rates.","q":"At what point is revenue recognised under the five-step model?","a":"When control of the promised good or service transfers and the performance obligation is satisfied, either over time or at a point in time.","v":{"k":"flow","d":["Identify contract","Identify obligations","Set & allocate price","Recognise on satisfaction"]}},{"s":"fsa","t":"Analyzing Income Statements","n":"Gross, Operating and Net Margin","f":"Gross = GP/Rev · Operating = EBIT/Rev · Net = NI/Rev","b":"Three margins, three questions. Gross margin measures pricing power and production efficiency. Operating margin adds overhead discipline and is the cleanest cross-company comparison because it precedes financing and tax. Net margin includes capital structure and tax choices, so differences may reflect leverage rather than business quality.","q":"Why is operating margin best for comparing competitors?","a":"It excludes financing and tax effects, isolating operating performance from capital structure and jurisdiction differences.","v":{"k":"flow","d":["Revenue","− COGS = Gross","− Opex = Operating","− Int & tax = Net"]}},{"s":"fsa","t":"Analyzing Income Statements","n":"Basic vs Diluted EPS","f":"Basic EPS = (NI − Preferred div) / Weighted avg shares","b":"Basic EPS uses the weighted average shares actually outstanding. Diluted EPS assumes all potentially dilutive securities converted — options, convertible bonds, convertible preferred. Antidilutive securities that would raise EPS are excluded. Diluted is the conservative figure and the one to use; a wide gap signals heavy option issuance or convertible debt.","q":"Are antidilutive securities included in diluted EPS?","a":"No. Securities whose conversion would increase EPS are excluded, so diluted EPS is never higher than basic EPS.","v":{"k":"cmp","h":["Basic","Diluted"],"d":[["Shares","Actually outstanding","Plus dilutive converts"],["Antidilutive","N/A","Excluded"],["Value","Higher","Lower — use this"]]}},{"s":"fsa","t":"Analyzing Income Statements","n":"Common-Size Income Statement","b":"Express every line as a percentage of revenue and comparisons across time and companies become possible regardless of scale. It exposes trends invisible in absolute numbers: gross margin drifting down while revenue grows, or SG&A creeping up as a share of sales. This is the fastest structural diagnostic available and should precede ratio analysis.","q":"What does common-sizing an income statement reveal?","a":"Structural shifts in cost and margin composition as a share of revenue, independent of company size or growth in absolute terms.","v":{"k":"bars","d":[["Revenue",100],["COGS",62],["Gross profit",38],["SG&A",22],["Operating income",16]],"u":"% of revenue"}},{"s":"fsa","t":"Analyzing Balance Sheets","n":"Measurement Bases","b":"Assets do not share a measurement basis. Some sit at historical cost less depreciation — property, plant and equipment. Some at fair value — trading securities and many derivatives. Some at the lower of cost or net realisable value — inventory. The balance sheet is therefore a mixed-attribute document, and total assets is a sum of numbers measured on different scales.","q":"Why is total assets a mixed-attribute figure?","a":"Different assets are measured on different bases — historical cost, fair value, or lower of cost and net realisable value — so the total sums inconsistent measures.","v":{"k":"grid","h":["Asset","Measured at"],"d":[["PP&E","Cost less depreciation"],["Inventory","Lower of cost / NRV"],["Trading securities","Fair value"],["Goodwill","Cost less impairment"]]}},{"s":"fsa","t":"Analyzing Balance Sheets","n":"Classifying Financial Assets","b":"Classification drives where gains appear. Amortised cost applies to debt held to collect contractual cash flows. Fair value through profit or loss puts unrealised gains straight into net income. Fair value through other comprehensive income routes them around the income statement into equity. Two identical securities can produce very different earnings depending only on stated intent.","q":"Where do unrealised gains appear under FVOCI?","a":"In other comprehensive income within equity, bypassing net income until realisation or, for some instruments, permanently.","v":{"k":"grid","h":["Classification","Gains flow to"],"d":[["Amortised cost","Neither until sale"],["FVPL","Net income"],["FVOCI","Other comprehensive income"]]}},{"s":"fsa","t":"Analyzing Balance Sheets","n":"Goodwill","b":"Goodwill arises only in acquisitions, as the excess of purchase price over the fair value of identifiable net assets. It is not amortised; it is tested for impairment at least annually. Internally generated goodwill is never recognised, which means an acquisitive company shows goodwill that an equally valuable organic competitor does not — a comparability problem in asset-based ratios.","q":"Why does goodwill impair comparability between peers?","a":"It appears only through acquisition, so an acquisitive firm carries goodwill that an organically grown competitor of equal value does not.","v":{"k":"flow","d":["Purchase price","− fair value of net assets","= Goodwill","Tested, not amortised"]}},{"s":"fsa","t":"Analyzing Balance Sheets","n":"Common-Size Balance Sheet","b":"Express each item as a percentage of total assets. The structure it reveals is diagnostic: a rising receivables share may signal collection problems or aggressive revenue recognition; a rising inventory share may signal obsolescence; a rising goodwill share signals an acquisition-led strategy whose integration risk belongs in the analysis.","q":"What might a rising receivables share of assets indicate?","a":"Deteriorating collections or increasingly aggressive revenue recognition, both of which warrant checking days sales outstanding.","v":{"k":"donut","d":[["Receivables",22],["Inventory",18],["PP&E",35],["Goodwill",15],["Other",10]]}},{"s":"fsa","t":"Analyzing Statements of Cash Flows I","n":"The Three Sections","b":"Operating covers the core business — the section that should fund the company. Investing covers capital expenditure and acquisitions or disposals. Financing covers debt, equity and dividends. The healthy signature is positive operating cash flow, negative investing as the firm reinvests, and financing that varies with the strategy. Persistent negative operating cash flow is the hard warning.","q":"What does a mature, healthy cash flow profile look like?","a":"Positive operating cash flow funding negative investing cash flow, with financing reflecting deliberate capital structure decisions rather than survival needs.","v":{"k":"bars","d":[["Operating",78],["Investing",-45],["Financing",-25]],"u":"typical healthy profile"}},{"s":"fsa","t":"Analyzing Statements of Cash Flows I","n":"Direct vs Indirect Method","b":"The direct method lists actual cash receipts and payments and is more informative. The indirect method starts from net income and reconciles to cash by adding back non-cash charges and adjusting working capital. Almost every company uses indirect because it is cheaper to prepare, and its reconciliation shows exactly where accruals diverged from cash.","q":"Why is the indirect method analytically useful despite being less direct?","a":"Its reconciliation from net income exposes the specific accrual and working capital items causing profit to diverge from cash.","v":{"k":"cmp","h":["Direct","Indirect"],"d":[["Starts from","Cash receipts","Net income"],["Shows","Actual flows","Reconciliation"],["Common?","Rare","Almost universal"]]}},{"s":"fsa","t":"Analyzing Statements of Cash Flows I","n":"Working Capital and Cash","b":"The reconciliation logic is mechanical. An increase in a current asset consumes cash — you funded inventory or extended credit. An increase in a current liability provides cash — you delayed payment. Reverse both for decreases. Rapid growth therefore consumes cash even when profitable, which is why fast-growing companies raise capital despite reporting profits.","q":"Why does rising inventory reduce operating cash flow?","a":"Cash was spent building the asset but no expense has been recognised, so the increase is deducted in the reconciliation from net income.","v":{"k":"grid","h":["Change","Effect on cash"],"d":[["Receivables up","Cash down"],["Inventory up","Cash down"],["Payables up","Cash up"],["Payables down","Cash down"]]}},{"s":"fsa","t":"Analyzing Statements of Cash Flows II","n":"IFRS vs US GAAP Classification","b":"US GAAP is rigid: interest paid and received and dividends received are operating; dividends paid are financing. IFRS permits choice — interest and dividends paid may sit in operating or financing, and interest and dividends received in operating or investing. The consequence is that operating cash flow is not directly comparable across frameworks without checking policy.","q":"Where does US GAAP classify interest paid?","a":"In operating activities, whereas IFRS permits classification as either operating or financing.","v":{"k":"cmp","h":["US GAAP","IFRS"],"d":[["Interest paid","Operating","Operating or financing"],["Interest received","Operating","Operating or investing"],["Dividends paid","Financing","Operating or financing"]]}},{"s":"fsa","t":"Analyzing Statements of Cash Flows II","n":"Free Cash Flow to the Firm","f":"FCFF = CFO + Interest×(1−t) − CapEx","b":"Cash available to all capital providers before financing decisions. Start from operating cash flow, add back after-tax interest because it is a return to debtholders rather than a cost of operations, and subtract capital expenditure required to maintain the business. FCFF is capital-structure neutral, which is why it pairs with WACC in valuation.","q":"Why is after-tax interest added back to compute FCFF?","a":"Interest is a distribution to debt providers, and FCFF measures cash available to all capital providers before financing effects.","v":{"k":"steps","d":[["Operating cash flow","start"],["+ Interest × (1 − t)","undo financing"],["− Capital expenditure","maintain assets"],["= FCFF","to all providers"]]}},{"s":"fsa","t":"Analyzing Statements of Cash Flows II","n":"Free Cash Flow to Equity","f":"FCFE = CFO − CapEx + Net borrowing","b":"Cash available to shareholders after debt service and reinvestment. Because it is computed after financing flows, it is discounted at the cost of equity rather than WACC, and it is far more volatile than FCFF — a single large debt repayment can turn it negative in a healthy company. Match the cash flow to the discount rate or the valuation is meaningless.","q":"Which discount rate pairs with FCFE?","a":"The cost of equity, since FCFE is measured after debt service and belongs to shareholders alone.","v":{"k":"cmp","h":["FCFF","FCFE"],"d":[["Belongs to","All providers","Equity only"],["Discount at","WACC","Cost of equity"],["Volatility","Lower","Higher"]]}},{"s":"fsa","t":"Analyzing Statements of Cash Flows II","n":"Cash Flow Quality","b":"Compare operating cash flow to net income over several years. Persistently below net income suggests earnings are not converting to cash — growing receivables, capitalised costs, or aggressive recognition. Also examine composition: cash flow generated by stretching payables or liquidating inventory is not repeatable. Sustainable operating cash flow comes from margin and volume, not from working capital squeezes.","q":"What does operating cash flow persistently below net income suggest?","a":"Earnings are not converting to cash, pointing to aggressive revenue recognition, growing receivables, or capitalised costs.","v":{"k":"plot","x":"Year","y":"Amount","s":[{"n":"Net income","p":[[8,45],[32,58],[56,70],[80,84]]},{"n":"Operating cash flow","p":[[8,42],[32,40],[56,34],[80,26]]}],"note":"Widening gap is the warning"}},{"s":"fsa","t":"Analysis of Inventories","n":"Cost Flow Assumptions","b":"FIFO assumes the oldest units sell first, leaving recent costs on the balance sheet — inventory near current value, COGS understated when prices rise. LIFO assumes the newest sell first, giving current costs in COGS and stale inventory values. Weighted average sits between. IFRS prohibits LIFO entirely; US GAAP permits it, which is a major comparability break.","q":"Under rising prices, which method reports the highest net income?","a":"FIFO, because older lower costs flow into COGS while recent higher costs remain in inventory.","v":{"k":"cmp","h":["FIFO","LIFO"],"d":[["COGS (prices rising)","Lower","Higher"],["Net income","Higher","Lower"],["Inventory value","Current","Stale"],["IFRS","Allowed","Prohibited"]]}},{"s":"fsa","t":"Analysis of Inventories","n":"The LIFO Reserve","f":"FIFO inventory = LIFO inventory + LIFO reserve","b":"US GAAP requires LIFO users to disclose the reserve, which is the difference between LIFO and FIFO inventory values. This is the bridge that makes cross-framework comparison possible: add the reserve to inventory, and adjust COGS by the change in the reserve, to restate a LIFO company onto a FIFO basis. Remember the deferred tax effect on equity.","q":"How do you convert LIFO COGS to a FIFO basis?","a":"Subtract the increase in the LIFO reserve from LIFO COGS for the period, which removes the difference in cost flow assumption.","v":{"k":"steps","d":[["LIFO inventory 400","reported"],["+ LIFO reserve 120","disclosed"],["= FIFO inventory 520","comparable"],["COGS − Δreserve","adjust flows"]]}},{"s":"fsa","t":"Analysis of Inventories","n":"LIFO Liquidation","b":"When a LIFO firm sells more units than it purchases, old low-cost layers enter COGS. Margins jump and profits rise, but the gain is not operational — it is the release of decades-old costs, and it cannot recur. Analysts strip it out. It often coincides with declining sales, so an earnings improvement driven by liquidation is usually masking deterioration.","q":"Why should LIFO liquidation gains be excluded from analysis?","a":"They arise from selling old low-cost inventory layers rather than from operations, are non-recurring, and often accompany declining sales.","v":{"k":"flow","d":["Sales exceed purchases","Old cheap layers used","Margins jump","Not repeatable"]}},{"s":"fsa","t":"Analysis of Inventories","n":"Inventory Write-Downs","b":"IFRS carries inventory at the lower of cost and net realisable value, and permits reversal of a prior write-down up to the original cost if value recovers. US GAAP generally prohibits reversal, so the write-down is permanent. Reversals boost income in the recovery period under IFRS only, creating an earnings difference with no economic counterpart.","q":"Can inventory write-downs be reversed?","a":"Under IFRS yes, up to the original cost if net realisable value recovers. Under US GAAP reversal is generally prohibited.","v":{"k":"cmp","h":["IFRS","US GAAP"],"d":[["Carrying basis","Lower of cost/NRV","Lower of cost/market"],["Reversal","Permitted","Generally prohibited"],["Income effect","Recovers","Permanent loss"]]}},{"s":"fsa","t":"Analysis of Long-Term Assets","n":"Capitalising vs Expensing","b":"Capitalising spreads cost over future periods, raising current profit, assets and equity, and shifting the outflow from operating to investing cash flow. Expensing does the opposite. Total cost over the asset's life is identical — only the timing and classification differ. Aggressive capitalisation is one of the most common earnings management techniques and shows up in the cash flow statement first.","q":"How does capitalising costs affect operating cash flow?","a":"It increases reported operating cash flow, because the outflow is reclassified to investing activities while total cash is unchanged.","v":{"k":"cmp","h":["Capitalise","Expense"],"d":[["Current profit","Higher","Lower"],["Assets","Higher","Lower"],["Operating CF","Higher","Lower"],["Total cost","Same","Same"]]}},{"s":"fsa","t":"Analysis of Long-Term Assets","n":"Research and Development","b":"US GAAP expenses research and development as incurred, with a narrow exception for software after technological feasibility. IFRS expenses research but requires capitalisation of development costs once specific criteria are met. A pharmaceutical or software firm therefore reports materially different assets and margins across frameworks despite identical economics.","q":"How does IFRS treat development costs?","a":"They must be capitalised once technical feasibility and intent to complete are demonstrated, whereas research costs are always expensed.","v":{"k":"cmp","h":["IFRS","US GAAP"],"d":[["Research","Expense","Expense"],["Development","Capitalise if criteria met","Expense"],["Software","Capitalise","After feasibility"]]}},{"s":"fsa","t":"Analysis of Long-Term Assets","n":"Depreciation Methods","b":"Straight line spreads cost evenly and is the most common. Declining balance front-loads depreciation, lowering early profits and raising later ones. Units of production ties charges to actual usage. Method choice does not change total depreciation, only its timing — so it changes reported earnings trajectory without changing economics or cash.","q":"How does an accelerated method affect the earnings profile?","a":"It lowers early-year earnings and raises later-year earnings relative to straight line, with total depreciation unchanged.","v":{"k":"plot","x":"Year","y":"Depreciation expense","s":[{"n":"Straight line","p":[[10,50],[35,50],[60,50],[88,50]]},{"n":"Declining balance","p":[[10,88],[35,58],[60,38],[88,24]]}],"note":"Same total, different timing"}},{"s":"fsa","t":"Analysis of Long-Term Assets","n":"Estimates Drive Depreciation","b":"Three estimates control the charge: useful life, salvage value, and method. Extending useful life or raising salvage value reduces annual depreciation and raises profit, with no cash effect and no external validation required. When a company's depreciation as a share of gross PP&E falls without a change in asset mix, the estimates are worth investigating.","q":"How can management raise profit without changing operations?","a":"By extending estimated useful lives or raising salvage values, which lowers annual depreciation with no effect on cash.","v":{"k":"bars","d":[["10-year life",100],["15-year life",67],["20-year life",50]],"u":"annual depreciation (indexed)"}},{"s":"fsa","t":"Analysis of Long-Term Assets","n":"Impairment","b":"IFRS compares carrying value to recoverable amount, the higher of fair value less costs to sell and value in use, and permits reversal of impairment for assets other than goodwill. US GAAP applies a two-step test using undiscounted cash flows first, and prohibits reversal. IFRS therefore recognises impairments earlier and can unwind them.","q":"Which framework permits reversing an impairment?","a":"IFRS allows reversal for assets other than goodwill; US GAAP prohibits reversal of impairment losses entirely.","v":{"k":"cmp","h":["IFRS","US GAAP"],"d":[["Test","Recoverable amount","Undiscounted CF first"],["Timing","Earlier","Later"],["Reversal","Allowed (not goodwill)","Prohibited"]]}},{"s":"fsa","t":"Analysis of Long-Term Assets","n":"Revaluation Model","b":"IFRS permits carrying PP&E and intangibles at fair value with regular revaluation. Increases go to a revaluation surplus in other comprehensive income unless reversing a prior loss; decreases hit profit or loss once the surplus is exhausted. US GAAP does not permit revaluation, so historical cost is the only basis and asset-based ratios diverge across frameworks.","q":"Where does a revaluation increase appear under IFRS?","a":"In other comprehensive income as a revaluation surplus, unless it reverses a previously recognised decrease that went through profit or loss.","v":{"k":"flow","d":["Asset value rises","Revaluation surplus","In equity via OCI","Not in net income"]}},{"s":"fsa","t":"Topics in Long-Term Liabilities and Equity","n":"Bonds Issued at a Discount or Premium","b":"A bond issued below par carries a coupon below the market rate; the discount is amortised, so interest expense exceeds the cash coupon and the carrying value rises toward par. A premium bond works in reverse. Under the effective interest method, expense equals carrying value times market yield at issuance — the coupon rate never determines expense after issuance.","q":"For a discount bond, how does interest expense compare to the coupon paid?","a":"Interest expense exceeds the cash coupon, because discount amortisation is added and the carrying value accretes toward par.","v":{"k":"plot","x":"Time to maturity","y":"Carrying value","s":[{"n":"Discount bond","p":[[8,72],[35,80],[62,90],[92,100]]},{"n":"Premium bond","p":[[8,128],[35,119],[62,109],[92,100]]}],"note":"Both converge to par at maturity"}},{"s":"fsa","t":"Topics in Long-Term Liabilities and Equity","n":"Debt Covenants","b":"Affirmative covenants require actions — maintaining insurance, filing statements, keeping ratios above thresholds. Negative covenants prohibit actions — additional borrowing, asset sales, dividends above a limit. Covenants are usually defined on adjusted accounting measures, which gives management an incentive to manage exactly those measures as thresholds approach.","q":"Why do covenants create earnings management incentives?","a":"They are defined on accounting measures, so approaching a threshold gives management strong motive to influence the reported figures.","v":{"k":"cmp","h":["Affirmative","Negative"],"d":[["Nature","Must do","Must not do"],["Example","Maintain coverage ratio","No additional debt"],["Breach effect","Technical default","Technical default"]]}},{"s":"fsa","t":"Topics in Long-Term Liabilities and Equity","n":"Lease Accounting","b":"Under IFRS 16, lessees recognise a right-of-use asset and a lease liability for essentially all leases, replacing rent expense with depreciation plus interest. This front-loads total expense and moves the cash outflow partly to financing. US GAAP retains a finance and operating distinction for expense presentation, though both appear on the balance sheet.","q":"How does capitalising a lease change the expense profile?","a":"Straight-line rent is replaced by depreciation plus interest, which front-loads total expense because interest is highest early on.","v":{"k":"plot","x":"Lease year","y":"Total expense","s":[{"n":"Operating (rent)","p":[[10,50],[38,50],[66,50],[92,50]]},{"n":"Capitalised","p":[[10,72],[38,60],[66,48],[92,36]]}],"note":"Same total, front-loaded"}},{"s":"fsa","t":"Topics in Long-Term Liabilities and Equity","n":"Pension Plan Types","b":"A defined contribution plan fixes the employer's payment and places investment risk on the employee — accounting is simple, expense equals contribution. A defined benefit plan promises a future payout and leaves the employer bearing investment and longevity risk, requiring actuarial assumptions on discount rate, salary growth and mortality. Small assumption changes move the obligation materially.","q":"Who bears investment risk in a defined benefit plan?","a":"The employer, which has promised a specified future benefit regardless of how plan assets perform.","v":{"k":"cmp","h":["Defined contribution","Defined benefit"],"d":[["Risk borne by","Employee","Employer"],["Expense","Contribution made","Actuarial estimate"],["Balance sheet","Minimal","Funded status"]]}},{"s":"fsa","t":"Topics in Long-Term Liabilities and Equity","n":"Funded Status","f":"Funded status = Plan assets − Benefit obligation","b":"A surplus appears as an asset, a deficit as a liability. The obligation is a present value, so the discount rate assumption drives it — raising the assumed rate shrinks the reported liability without changing a single promised payment. Comparing pension assumptions across peers is one of the highest-yield checks in credit analysis.","q":"How does raising the pension discount rate affect reported figures?","a":"It lowers the present value of the obligation, improving funded status and reducing pension expense without changing actual promised benefits.","v":{"k":"bars","d":[["Discount rate 4%",100],["Discount rate 5%",88],["Discount rate 6%",78]],"u":"reported obligation (indexed)"}},{"s":"fsa","t":"Analysis of Income Taxes","n":"Accounting Profit vs Taxable Income","b":"Two sets of books for two purposes. Accounting profit follows the reporting framework and aims to reflect economics; taxable income follows tax law and aims to raise revenue. Differences are permanent — never reversing, such as tax-exempt income — or temporary, reversing over time. Only temporary differences create deferred tax assets and liabilities.","q":"Which differences give rise to deferred taxes?","a":"Only temporary differences, which reverse in future periods. Permanent differences affect the effective rate but create no deferred balance.","v":{"k":"cmp","h":["Permanent","Temporary"],"d":[["Reverses?","Never","Yes"],["Creates DTA/DTL","No","Yes"],["Example","Tax-exempt interest","Accelerated depreciation"]]}},{"s":"fsa","t":"Analysis of Income Taxes","n":"Deferred Tax Assets and Liabilities","b":"A deferred tax liability arises when tax is deferred to later periods — most commonly accelerated depreciation for tax and straight line for reporting. A deferred tax asset arises when tax is paid early or losses are carried forward. Deferred tax liabilities that never reverse in practice, because the firm keeps investing, are often treated as equity by analysts.","q":"Why might analysts reclassify a deferred tax liability as equity?","a":"If continuous reinvestment means the liability perpetually rolls forward and never reverses into a cash payment, it does not behave like debt.","v":{"k":"flow","d":["Tax depreciation faster","Tax paid later","Deferred tax liability","May never reverse"]}},{"s":"fsa","t":"Analysis of Income Taxes","n":"Valuation Allowance","b":"A deferred tax asset only has value if future taxable profit exists to absorb it. When realisation is not probable, a valuation allowance reduces the carrying amount, lowering income. Because the judgement is management's, both establishing and releasing the allowance are used to manage earnings — a large release inflating profit deserves close attention.","q":"What triggers a valuation allowance against a deferred tax asset?","a":"Doubt that sufficient future taxable income will exist to utilise the asset, making realisation less than probable.","v":{"k":"flow","d":["DTA recognised","Future profit doubtful","Valuation allowance","Income reduced"]}},{"s":"fsa","t":"Analysis of Income Taxes","n":"Effective vs Statutory Tax Rate","f":"Effective rate = Tax expense / Pre-tax income","b":"The reconciliation between the statutory rate and the effective rate is one of the most informative disclosures available. Persistent large gaps reveal foreign earnings in low-tax jurisdictions, tax credits, or permanent differences. A rate that is unusually low and driven by non-recurring items should be normalised before forecasting.","q":"What does the tax rate reconciliation disclose?","a":"The specific items bridging statutory and effective rates — foreign rate differentials, credits, and permanent differences — showing which are sustainable.","v":{"k":"steps","d":[["Statutory rate 25%","baseline"],["− foreign rate benefit 4%","jurisdiction mix"],["− tax credits 3%","incentives"],["= effective rate 18%","reported"]]}},{"s":"fsa","t":"Financial Reporting Quality","n":"The Quality Spectrum","b":"Two dimensions combine. Reporting quality asks whether the numbers faithfully represent economics. Earnings quality asks whether the underlying results are sustainable and adequate. The spectrum runs from high-quality decision-useful reporting, through low-quality but compliant reporting, to biased choices, then to fabricated transactions and fictitious reporting.","q":"Can a company have high reporting quality but low earnings quality?","a":"Yes. The reporting may faithfully represent economics that are simply poor — accurate numbers describing unsustainable or inadequate results.","v":{"k":"scale","l":"Fraudulent","r":"High quality","d":["Fictitious","Biased choices","Compliant but low","Decision-useful"]}},{"s":"fsa","t":"Financial Reporting Quality","n":"Conditions for Misreporting","b":"Three conditions recur, and all three are usually present. Opportunity — weak internal controls, a passive board, or ineffective auditors. Motivation — meeting analyst forecasts, hitting covenant thresholds, or protecting equity-linked compensation. Rationalisation — the belief it is temporary, everyone does it, or the numbers will catch up next quarter.","q":"Name the three conditions typically present in misreporting.","a":"Opportunity from weak oversight, motivation from targets or compensation, and rationalisation that justifies the conduct internally.","v":{"k":"flow","d":["Opportunity","Motivation","Rationalisation","Misreporting"]}},{"s":"fsa","t":"Financial Reporting Quality","n":"Warning Signs","b":"Cluster the signals. Cash flow persistently trailing net income. Receivables or inventory growing faster than sales. Repeated one-off charges that are anything but. Changes in accounting estimates or auditors without clear explanation. Aggressive revenue recognition, capitalised operating costs, and off-balance-sheet arrangements. Single flags mean little; convergence of several is the signal.","q":"Which single indicator most often precedes accounting problems?","a":"A widening gap between net income and operating cash flow sustained over multiple periods, indicating earnings that do not convert to cash.","v":{"k":"grid","h":["Signal","Suggests"],"d":[["CF below NI","Weak conversion"],["Receivables > sales growth","Recognition risk"],["Recurring one-offs","Cost hiding"],["Auditor change","Disagreement"],["Rising capitalisation","Expense deferral"]]}},{"s":"fsa","t":"Financial Analysis Techniques","n":"Categories of Ratios","b":"Five families, five questions. Activity ratios ask how efficiently assets are used. Liquidity ratios ask whether short-term obligations can be met. Solvency ratios ask whether long-term debt is sustainable. Profitability ratios ask how much of revenue survives to profit. Valuation ratios ask what the market is paying. Choose the family before choosing the ratio.","q":"Which ratio family addresses long-term debt sustainability?","a":"Solvency ratios, such as debt-to-equity and interest coverage, which assess the capacity to service long-term obligations.","v":{"k":"grid","h":["Family","Question"],"d":[["Activity","Efficient use of assets?"],["Liquidity","Can we pay this year?"],["Solvency","Can we carry the debt?"],["Profitability","How much survives?"],["Valuation","What is it worth?"]]}},{"s":"fsa","t":"Financial Analysis Techniques","n":"Current, Quick and Cash Ratios","b":"Three liquidity measures of increasing severity. The current ratio includes all current assets, inventory included. The quick ratio excludes inventory, which may be slow or unsaleable. The cash ratio counts only cash and marketable securities. For a business with obsolescence risk, the gap between current and quick ratios is where the real question lives.","q":"Why exclude inventory from the quick ratio?","a":"Inventory may take time to convert to cash and may not sell at carrying value, so it is the least reliable current asset in a stress scenario.","v":{"k":"scale","l":"Most inclusive","r":"Most severe","d":["Current ratio","Quick ratio","Cash ratio"]}},{"s":"fsa","t":"Financial Analysis Techniques","n":"The Cash Conversion Cycle","f":"CCC = DSO + DOH − DPO","b":"How many days cash is tied up between paying suppliers and collecting from customers. Days sales outstanding plus days inventory on hand, minus days payables outstanding. A shorter cycle frees cash. Some businesses run it negative — collecting before paying suppliers — which funds growth from the supply chain rather than from capital.","q":"What does a negative cash conversion cycle mean?","a":"The company collects from customers before paying suppliers, so growth is financed by the supply chain rather than by external capital.","v":{"k":"tline","d":[["Buy inventory","DOH begins","-"],["Pay supplier","DPO ends","-"],["Sell goods","DSO begins","+"],["Collect cash","cycle ends","+"]]}},{"s":"fsa","t":"Financial Analysis Techniques","n":"DuPont Decomposition","f":"ROE = Net margin × Asset turnover × Leverage","b":"Three drivers behind one number. Net margin measures profitability, asset turnover measures efficiency, and the equity multiplier measures leverage. Two companies with identical ROE can be entirely different businesses — one earning it through margin, another through borrowing. ROE rising while margin and turnover fall is a leverage story, and leverage is not a durable advantage.","q":"Why decompose ROE rather than use it directly?","a":"Identical ROE can arise from margin, efficiency, or leverage — decomposition reveals which, and whether the source is sustainable.","v":{"k":"flow","d":["Net margin","× Asset turnover","× Equity multiplier","= ROE"]}},{"s":"fsa","t":"Financial Analysis Techniques","n":"Five-Way DuPont","f":"ROE = Tax burden × Interest burden × EBIT margin × Turnover × Leverage","b":"The extended version splits net margin into tax burden, interest burden and operating margin. This separates operating performance from financing and tax effects, so a declining interest burden ratio flags rising interest costs eating profit, while a stable EBIT margin confirms operations are intact. It isolates exactly which lever moved.","q":"What does a falling interest burden ratio indicate?","a":"Interest expense is consuming a growing share of EBIT, reducing ROE for reasons unrelated to operating performance.","v":{"k":"bars","d":[["Tax burden",0.75],["Interest burden",0.85],["EBIT margin",0.14],["Asset turnover",1.2],["Leverage",2.1]],"u":"component values"}},{"s":"fsa","t":"Financial Analysis Techniques","n":"Coverage Ratios","f":"Interest coverage = EBIT / Interest expense","b":"Coverage asks whether earnings can service debt, which matters more to a lender than the debt lev
