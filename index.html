n many investors redeem at once.","v":{"k":"scale","l":"Most liquid","r":"Least liquid","d":["Monthly with notice","Annual redemption","Multi-year lock-up","Side pocket"]}},{"s":"ai","t":"Hedge Funds","n":"Fund of Funds","b":"A fund of funds allocates across managers, offering diversification, access to closed funds, and professional due diligence. The cost is a second fee layer on top of underlying manager fees, which is a substantial drag. It suits investors lacking the scale or expertise to build a direct manager programme, and it dilutes strong manager performance.","q":"What is the principal drawback of a fund of funds?","a":"An additional fee layer on top of underlying manager fees, which materially reduces net returns.","v":{"k":"bars","d":[["Gross return",12.0],["After manager fees",8.5],["After FoF fees",6.8]],"u":"% illustrative"}},{"s":"ai","t":"Introduction to Digital Assets","n":"Distributed Ledger Technology","b":"A blockchain is a shared, append-only record validated by a network rather than a central authority. Permissionless networks allow anyone to participate and validate; permissioned networks restrict access to approved parties. The core innovation is achieving consensus without trusting any single participant, at the cost of substantial computational or capital resources.","q":"What problem does distributed ledger technology solve?","a":"Reaching agreement on a shared record without a trusted central authority, at the cost of significant computational or staking resources.","v":{"k":"cmp","h":["Permissionless","Permissioned"],"d":[["Access","Open","Restricted"],["Validators","Anyone","Approved"],["Use case","Public currency","Enterprise records"]]}},{"s":"ai","t":"Introduction to Digital Assets","n":"Types of Digital Assets","b":"Cryptocurrencies are intended as media of exchange or stores of value. Stablecoins peg to a reference asset, backed by fiat reserves, other crypto, or algorithms — the algorithmic variety has failed repeatedly. Tokens represent rights: utility tokens grant access to a service, security tokens represent ownership claims, and NFTs represent unique items.","q":"What is the weakness of algorithmic stablecoins?","a":"The peg depends on market incentives rather than reserves, so it can break irrecoverably under stress when confidence fails.","v":{"k":"grid","h":["Type","Purpose"],"d":[["Cryptocurrency","Exchange, store of value"],["Stablecoin","Pegged value"],["Utility token","Service access"],["Security token","Ownership claim"],["NFT","Unique item"]]}},{"s":"ai","t":"Introduction to Digital Assets","n":"Investment Characteristics of Digital Assets","b":"Digital assets generate no cash flow, so traditional valuation cannot apply — value rests on adoption, network effects and scarcity assumptions. Volatility is extreme, correlations with equities have risen rather than provided diversification, custody carries irreversible loss risk, and regulatory treatment remains unsettled across jurisdictions.","q":"Why is valuing digital assets particularly difficult?","a":"They produce no cash flows, so discounted cash flow methods do not apply and value depends on adoption and scarcity assumptions.","v":{"k":"grid","h":["Characteristic","Implication"],"d":[["No cash flow","No DCF valuation"],["High volatility","Large drawdowns"],["Rising correlation","Less diversification"],["Custody risk","Irreversible loss"],["Regulation","Unsettled"]]}},{"s":"ai","t":"Alternative Investment Features, Methods, and Structures","n":"Diversification Benefits and Their Limits","b":"Alternatives are held largely for low correlation with traditional assets. Two cautions apply. Measured correlation is understated by appraisal smoothing, so true diversification is lower than reported. And correlations rise in crises — precisely when diversification is needed, alternatives often fall alongside equities as leverage unwinds across the system.","q":"Why do correlations rise during market stress?","a":"Leveraged investors sell whatever is liquid to meet margin calls, transmitting selling pressure across otherwise unrelated asset classes.","v":{"k":"plot","x":"Market stress →","y":"Correlation","s":[{"n":"Alternatives vs equities","p":[[8,22],[38,34],[64,60],[92,86]]}],"note":"Diversification weakens when most needed"}},{"s":"ai","t":"Alternative Investment Performance and Returns","n":"Survivorship and Backfill Bias","b":"Hedge fund indexes are built from voluntary reporting, which creates two distortions. Survivorship bias removes failed funds from the record. Backfill bias lets a fund join an index and add its favourable prior history retrospectively. Together they inflate reported index returns substantially, so headline hedge fund performance overstates the investable experience.","q":"How does backfill bias inflate index returns?","a":"Funds join an index only after a good run and add that history retrospectively, so the index includes track records selected for success.","v":{"k":"bars","d":[["Reported index",9.5],["Less backfill",7.2],["Less survivorship",5.8]],"u":"% annual return, illustrative"}},{"s":"ai","t":"Investments in Private Capital: Equity and Debt","n":"Due Diligence on Managers","b":"Manager selection dominates outcomes in private markets because dispersion between top and bottom quartile is enormous — far wider than in public equity. Diligence covers track record attribution, team stability, process discipline, alignment through personal commitment, operational infrastructure, and valuation policy. Past returns from a departed team mean nothing.","q":"Why does manager selection matter more in private markets?","a":"The dispersion between top and bottom quartile managers is far wider than in public markets, so selection drives most of the outcome.","v":{"k":"bars","d":[["Public equity dispersion",22],["Private equity dispersion",78]],"u":"top vs bottom quartile gap"}},{"s":"ai","t":"Real Estate and Infrastructure","n":"Real Estate Risk Categories","b":"Core properties are stabilised, well-let and low-leverage, delivering income with modest appreciation. Core-plus adds mild repositioning. Value-add involves renovation, releasing or repositioning, with meaningful execution risk. Opportunistic includes development and distressed situations with high leverage. Expected returns and loss potential rise together across the spectrum.","q":"What distinguishes value-add from core real estate?","a":"Value-add requires active intervention — renovation, releasing or repositioning — introducing execution risk in exchange for higher expected returns.","v":{"k":"scale","l":"Lowest risk","r":"Highest risk","d":["Core","Core-plus","Value-add","Opportunistic"]}},{"s":"ai","t":"Hedge Funds","n":"Leverage in Hedge Funds","b":"Leverage is obtained through margin borrowing, derivatives, and repo financing. It magnifies returns and losses, but the sharper risk is forced deleveraging: when losses trigger margin calls, positions must be sold into falling markets, converting a paper loss into a realised one. Strategy leverage varies hugely — relative value strategies use the most.","q":"Why do relative value strategies use high leverage?","a":"They exploit small pricing discrepancies, so meaningful returns require large positions financed with borrowed capital.","v":{"k":"flow","d":["Losses occur","Margin call","Forced selling","Losses deepen"]}},{"s":"ai","t":"Natural Resources","n":"Commodity Sectors and Drivers","b":"Energy responds to geopolitics and production decisions. Industrial metals track construction and manufacturing demand, making them cyclical. Precious metals respond to real rates and safe-haven demand. Agriculture responds to weather and harvest cycles. Livestock has its own biological cycle. Treating commodities as one asset class obscures very different drivers.","q":"Why should commodity sectors be analysed separately?","a":"Their return drivers differ fundamentally — weather, geopolitics, industrial demand and monetary conditions affect sectors in unrelated ways.","v":{"k":"grid","h":["Sector","Primary driver"],"d":[["Energy","Geopolitics, supply"],["Industrial metals","Construction cycle"],["Precious metals","Real rates, safe haven"],["Agriculture","Weather, harvest"]]}},{"s":"ai","t":"Alternative Investment Features, Methods, and Structures","n":"Liquidity Planning for Commitments","b":"Committing capital creates a future obligation of uncertain timing. Investors must hold sufficient liquid assets to meet calls, which creates cash drag. The denominator effect compounds this: when public markets fall, the private allocation rises as a percentage of a smaller portfolio, breaching targets without any private transaction occurring.","q":"What is the denominator effect?","a":"Falling public market values shrink the total portfolio, mechanically raising the private allocation percentage above target without any private market change.","v":{"k":"steps","d":[["Portfolio 100, private 20","20% target"],["Public assets fall 25%","total = 80"],["Private still 20","now 25%"],["Over target","no transaction occurred"]]}},{"s":"ai","t":"Introduction to Digital Assets","n":"Digital Asset Investment Vehicles","b":"Direct holding requires managing private keys, where loss is irreversible and there is no recovery mechanism. Custodial services shift that risk to a counterparty. Exchange-traded products and funds provide regulated exposure without custody responsibility, at the cost of fees and sometimes tracking error. Futures-based products additionally incur roll costs.","q":"What risk do futures-based digital asset products add?","a":"Roll cost — persistent contango means each contract roll occurs at a higher price, eroding returns relative to spot.","v":{"k":"cmp","h":["Direct holding","Fund or ETP"],"d":[["Custody","Self-managed","Delegated"],["Loss risk","Irreversible","Counterparty"],["Cost","Network fees","Management fee"]]}},{"s":"ai","t":"Investments in Private Capital: Equity and Debt","n":"Secondary Market for Private Funds","b":"Limited partners can sell fund interests before term end, historically at substantial discounts and now in a large established market. Buyers acquire seasoned portfolios with visible assets and shorter remaining duration, mitigating the J-curve. Sellers gain liquidity from an otherwise locked position. Pricing depends on portfolio quality, remaining commitments and market conditions.","q":"Why do secondary buyers face a shallower J-curve?","a":"They acquire funds that are already invested and maturing, so distributions begin sooner and the early fee-drag period has passed.","v":{"k":"flow","d":["LP needs liquidity","Sells fund interest","Buyer gets seasoned assets","Shorter J-curve"]}},{"s":"ai","t":"Hedge Funds","n":"Evaluating Hedge Fund Returns","b":"Standard risk measures mislead here. Sharpe ratios are inflated by smoothed valuations and by strategies with negatively skewed returns that look stable until they are not. Examine maximum drawdown, the shape of the return distribution, leverage employed, and how returns behaved in past stress periods rather than relying on volatility alone.","q":"Why can a high Sharpe ratio mislead for hedge funds?","a":"Negatively skewed strategies and smoothed valuations understate volatility, producing attractive ratios that hide large tail risk.","v":{"k":"grid","h":["Instead of","Examine"],"d":[["Volatility","Maximum drawdown"],["Sharpe ratio","Return skew"],["Average return","Stress period behaviour"],["Reported values","Valuation policy"]]}},{"s":"pm","t":"Portfolio Management: An Overview","n":"The Portfolio Perspective","b":"Judge an investment by what it does to the whole portfolio, not by its own risk. A volatile asset that moves against your existing holdings reduces total risk. This is why a security cannot be called risky in isolation — only its contribution matters, and that depends entirely on correlation with everything else you own.","q":"Why can't an asset be judged risky in isolation?","a":"Its effect on portfolio risk depends on correlation with existing holdings — a volatile asset with low correlation can reduce total risk.","v":{"k":"cmp","h":["Individual view","Portfolio view"],"d":[["Measure","Own volatility","Contribution"],["Key input","Standard deviation","Correlation"],["Conclusion","Asset is risky","May reduce risk"]]}},{"s":"pm","t":"Portfolio Management: An Overview","n":"Diversification Ratio","b":"Diversification works because assets do not move together. Combining imperfectly correlated assets produces portfolio risk lower than the weighted average of individual risks — the only reliable free lunch in finance. Benefit rises as correlation falls, and is maximised at correlation of negative one, where risk can theoretically be eliminated entirely.","q":"At what correlation does diversification produce no benefit?","a":"Correlation of +1, where portfolio standard deviation equals the weighted average of the individual standard deviations.","v":{"k":"plot","x":"Correlation","y":"Portfolio risk","s":[{"n":"Two-asset risk","p":[[8,12],[30,38],[55,60],[80,76],[92,84]]}],"note":"Lower correlation, lower portfolio risk"}},{"s":"pm","t":"Portfolio Management: An Overview","n":"The Portfolio Management Process","b":"Three stages, always in this order. Planning produces the investment policy statement from the client's objectives and constraints. Execution allocates assets and selects securities. Feedback monitors, rebalances and reports performance. The process is a loop — changed circumstances feed back into a revised policy statement rather than ad hoc trading.","q":"What is the correct sequence of the portfolio management process?","a":"Planning, then execution, then feedback — with feedback returning to revise the plan as circumstances change.","v":{"k":"flow","d":["Planning: IPS","Execution: allocate","Feedback: monitor","Revise plan"]}},{"s":"pm","t":"Portfolio Management: An Overview","n":"Types of Investors","b":"Each investor type has a characteristic profile. Defined benefit pensions have long horizons and defined liabilities. Endowments and foundations are perpetual with spending requirements. Insurers face liability-driven constraints and heavy regulation. Banks manage interest rate risk. Individuals have finite horizons, tax exposure and human capital considerations.","q":"Why do endowments typically tolerate more risk than insurers?","a":"Endowments have perpetual horizons and no fixed liabilities, while insurers must match defined claims under regulatory capital constraints.","v":{"k":"grid","h":["Investor","Horizon","Risk tolerance"],"d":[["DB pension","Long","Moderate"],["Endowment","Perpetual","High"],["Insurer","Liability-linked","Low"],["Bank","Short","Low"],["Individual","Finite","Varies"]]}},{"s":"pm","t":"Portfolio Risk and Return: Part I","n":"Risk Aversion and Utility","f":"U = E(R) − ½ A σ²","b":"Utility rises with expected return and falls with variance, scaled by the risk aversion coefficient A. A higher A means variance is penalised more heavily, so the investor demands more return per unit of risk. Risk-neutral investors have A of zero and care only about expected return; risk seekers have negative A.","q":"What does a higher risk aversion coefficient imply?","a":"Variance is penalised more heavily in the utility function, so the investor requires greater compensation for bearing risk.","v":{"k":"plot","x":"Standard deviation","y":"Expected return","s":[{"n":"Low risk aversion","p":[[10,20],[45,32],[85,48]]},{"n":"High risk aversion","p":[[10,20],[45,52],[80,88]]}],"note":"Indifference curves: steeper means more averse"}},{"s":"pm","t":"Portfolio Risk and Return: Part I","n":"Portfolio Variance","f":"σ²p = w1²σ1² + w2²σ2² + 2w1w2ρσ1σ2","b":"The first two terms are the individual risks. The third term carries the entire diversification story — when correlation is low or negative, that term shrinks or turns negative, pulling portfolio variance below the weighted average. Everything in modern portfolio theory descends from this single covariance term.","q":"Which term in the two-asset variance formula creates the diversification benefit?","a":"The covariance term — when correlation is below one it reduces portfolio variance below the weighted average of individual variances.","v":{"k":"steps","d":[["Own variances","always positive"],["Covariance term","depends on ρ"],["ρ < 1","term shrinks"],["ρ < 0","term negative"]]}},{"s":"pm","t":"Portfolio Risk and Return: Part I","n":"The Minimum Variance Frontier","b":"For every level of expected return there is one portfolio with the lowest possible risk. Plot them all and you get the minimum variance frontier. Only the upper half is rational to hold — portfolios below the minimum variance point offer lower return for the same risk, so nobody should own them.","q":"Why is only the upper portion of the minimum variance frontier called efficient?","a":"Portfolios below the global minimum variance point are dominated — an alternative offers higher return at the same level of risk.","v":{"k":"plot","x":"Standard deviation","y":"Expected return","s":[{"n":"Efficient frontier","p":[[22,50],[32,66],[52,78],[80,90]]},{"n":"Dominated portion","p":[[22,50],[34,36],[58,24],[86,14]]}],"note":"Global minimum variance point at the left tip"}},{"s":"pm","t":"Portfolio Risk and Return: Part I","n":"The Capital Allocation Line","b":"Introduce a risk-free asset and the opportunity set becomes a straight line from the risk-free rate through the tangency portfolio. Every investor holds some combination of these two — the tangency portfolio and the risk-free asset — differing only in proportions. Risk preference determines the mix, not the composition of the risky portfolio.","q":"What is the two-fund separation theorem?","a":"All investors hold the same optimal risky portfolio combined with the risk-free asset, varying only the proportion according to risk tolerance.","v":{"k":"plot","x":"Standard deviation","y":"Expected return","s":[{"n":"Capital allocation line","p":[[4,26],[48,60],[92,94]]},{"n":"Efficient frontier","p":[[18,42],[48,60],[86,74]]}],"note":"Tangency point is the optimal risky portfolio"}},{"s":"pm","t":"Portfolio Risk and Return: Part I","n":"Borrowing and Lending Portfolios","b":"Left of the tangency point you lend — holding some risk-free asset alongside the risky portfolio. Right of it you borrow at the risk-free rate and invest more than your capital in the risky portfolio, moving up the line. In practice borrowing rates exceed lending rates, so the line kinks downward beyond the tangency point.","q":"Why does the capital allocation line kink in practice?","a":"Investors borrow at a higher rate than the risk-free lending rate, so the leveraged portion of the line has a flatter slope.","v":{"k":"scale","l":"Lending: hold cash","r":"Borrowing: leverage","d":["100% risk-free","Mixed","Tangency","Levered"]}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"Systematic and Unsystematic Risk","b":"Unsystematic risk is firm-specific and disappears as holdings are added — the market pays nothing for bearing it because it can be diversified away for free. Systematic risk comes from economy-wide factors and cannot be eliminated at any level of diversification. Only systematic risk earns a return premium.","q":"Why does unsystematic risk earn no risk premium?","a":"It can be eliminated costlessly through diversification, so the market does not compensate investors for choosing to bear it.","v":{"k":"plot","x":"Number of securities","y":"Portfolio risk","s":[{"n":"Total risk","p":[[6,92],[20,58],[42,40],[70,34],[92,32]]},{"n":"Systematic floor","p":[[6,32],[92,32]]}],"note":"Firm-specific risk falls away; systematic remains"}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"The Capital Market Line","b":"When all investors share the same expectations, the tangency portfolio becomes the market portfolio and the capital allocation line becomes the capital market line. Its slope is the market Sharpe ratio — the reward per unit of total risk. It applies only to efficient portfolios, which is the distinction from the security market line.","q":"What does the slope of the capital market line represent?","a":"The market Sharpe ratio — excess return per unit of total risk available to efficiently diversified portfolios.","v":{"k":"cmp","h":["Capital market line","Security market line"],"d":[["X axis","Total risk (σ)","Beta"],["Applies to","Efficient portfolios","All assets"],["Slope","Sharpe ratio","Market premium"]]}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"Beta","f":"βi = Cov(Ri, Rm) / σ²m","b":"Beta measures how much an asset's return moves with the market — its share of systematic risk. Beta above one amplifies market moves, below one dampens them. Since it is covariance scaled by market variance, it captures only the portion of an asset's risk that diversification cannot remove.","q":"What does a beta of 1.4 mean?","a":"The asset is expected to move 1.4% for every 1% market move, carrying 40% more systematic risk than the market.","v":{"k":"bars","d":[["Utility",0.6],["Market",1.0],["Industrial",1.2],["Technology",1.5]],"u":"beta, illustrative"}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"The Capital Asset Pricing Model","f":"E(Ri) = Rf + βi[E(Rm) − Rf]","b":"Required return equals the risk-free rate plus beta times the market risk premium. The model rests on strong assumptions — homogeneous expectations, frictionless markets, unlimited risk-free borrowing — that plainly fail in reality. It survives because it gives a single, testable, defensible number for the cost of equity.","q":"Which risk does CAPM price?","a":"Only systematic risk measured by beta; unsystematic risk is assumed diversified away and earns no premium.","v":{"k":"steps","d":[["Rf = 4%","risk-free base"],["Beta = 1.2","systematic risk"],["Premium = 5%","market compensation"],["4 + 1.2(5) = 10%","required return"]]}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"The Security Market Line","b":"Plot required return against beta and CAPM becomes a straight line through the risk-free rate. Assets plotting above the line are undervalued — they offer more return than their systematic risk requires. Assets below are overvalued. This vertical distance from the line is Jensen's alpha, the cleanest definition of manager skill.","q":"What does it mean for a security to plot above the security market line?","a":"It offers a higher expected return than its beta requires, indicating undervaluation and positive alpha.","v":{"k":"plot","x":"Beta","y":"Expected return","s":[{"n":"Security market line","p":[[4,24],[50,56],[92,88]]},{"n":"Undervalued asset","p":[[46,74],[50,56]]}],"note":"Vertical gap from the line is alpha"}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"Performance Measures Compared","b":"Sharpe ratio divides excess return by total risk — use when the portfolio is the entire holding. Treynor divides by beta — use when it is one sleeve of a diversified whole. Jensen's alpha is return above CAPM prediction. M-squared restates Sharpe in percentage terms for direct comparison against the market.","q":"When is Treynor more appropriate than Sharpe?","a":"When the portfolio is one component of a larger diversified holding, so only its systematic risk contribution is relevant.","v":{"k":"grid","h":["Measure","Risk used","Use when"],"d":[["Sharpe","Total σ","Whole portfolio"],["Treynor","Beta","One sleeve"],["Jensen α","Beta","Testing skill"],["M²","Total σ","Comparing to market"]]}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"Sharpe Ratio","f":"Sharpe = (Rp − Rf) / σp","b":"Excess return per unit of total risk. It is the most used and most abused ratio in finance: it assumes returns are normally distributed, so strategies with negative skew — selling options, credit, illiquid holdings — produce flattering ratios that conceal severe tail risk right up until the tail arrives.","q":"Why can the Sharpe ratio mislead for option-selling strategies?","a":"It assumes normal returns, but these strategies produce many small gains and rare large losses, so standard deviation understates true risk.","v":{"k":"bell","lo":-95,"hi":-40,"note":"Negative skew: rare large losses in the left tail"}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"The Investment Policy Statement","b":"The governing document, written before any investment decision. It records objectives, constraints, roles, benchmarks and review procedures. Its real function is behavioural: when markets fall and panic argues for selling, the IPS is the pre-committed reasoning of a calmer version of the same investor. Draft it in calm markets, not turbulent ones.","q":"What is the behavioural purpose of an IPS?","a":"It records decisions made in calm conditions, providing a pre-committed reference that resists emotional decisions during market stress.","v":{"k":"stack","d":[["Objectives","return and risk"],["Constraints","the five"],["Asset allocation","strategic policy"],["Governance","roles, review"]]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"Risk Objectives: Willingness and Ability","b":"Willingness is psychological — how the client feels about loss. Ability is financial — whether the portfolio can absorb loss without failing its purpose. When they conflict, the lower governs, and the adviser educates rather than simply overriding. High willingness with low ability is the dangerous combination that requires firm counsel.","q":"Which prevails when willingness and ability to take risk conflict?","a":"The lower of the two governs, with the adviser educating the client about the gap rather than overriding it.","v":{"k":"quad","x":["Low ability","High ability"],"y":["Low willingness","High willingness"],"d":["Educate, take less","Assess further","Conservative","Take more risk"]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"The Five Constraints","b":"Liquidity: near-term cash needs that must not require forced selling. Time horizon: how long until the money is needed, possibly in multiple stages. Tax: the after-tax return is the only one that matters. Legal and regulatory: trust terms, prudence rules, restrictions. Unique circumstances: everything else the client requires.","q":"Name the five IPS constraints.","a":"Liquidity, time horizon, tax considerations, legal and regulatory factors, and unique circumstances.","v":{"k":"grid","h":["Constraint","Question"],"d":[["Liquidity","Cash needed soon?"],["Horizon","Needed when?"],["Tax","After-tax return?"],["Legal","Restrictions?"],["Unique","Anything else?"]]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"Strategic Asset Allocation","b":"The long-term policy mix of asset classes, set from the IPS and expected to deliver the required return within the risk tolerance. It explains the large majority of return variation over time — far more than security selection. Getting the allocation right and leaving it alone outperforms most attempts at tactical cleverness.","q":"Why does strategic asset allocation dominate outcomes?","a":"Asset class exposures explain most of the variation in portfolio returns over time, far exceeding the contribution of security selection.","v":{"k":"donut","d":[["Asset allocation",80],["Security selection",12],["Timing and other",8]]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"Rebalancing","b":"Drift from target allocation means unintended risk exposure — a bull market quietly raises equity weight and therefore portfolio risk. Rebalancing sells winners and buys losers, which is emotionally difficult and mechanically contrarian. Calendar rebalancing is simple; percentage-range triggers respond to actual drift and generally trade less.","q":"Why is rebalancing psychologically difficult?","a":"It requires selling recent winners and buying recent losers, contradicting the momentum instinct that markets encourage.","v":{"k":"flow","d":["Equities outperform","Weight drifts up","Risk rises unintended","Rebalance back"]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"Risk Budgeting","b":"Instead of allocating capital, allocate risk. Determine total acceptable portfolio risk, then distribute it across asset classes, strategies or managers according to expected reward per unit consumed. A small allocation to a highly volatile strategy can consume a large share of the risk budget — capital weights hide this entirely.","q":"How does risk budgeting differ from capital allocation?","a":"It allocates units of risk rather than currency, revealing that small volatile positions can consume a disproportionate share of total risk.","v":{"k":"cmp","h":["Capital weight","Risk contribution"],"d":[["Bonds","60%","15%"],["Equities","35%","65%"],["Alternatives","5%","20%"]]}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Cognitive Errors vs Emotional Biases","b":"Cognitive errors are faults of reasoning — bad information processing, statistical mistakes, memory failures. They respond to education, evidence and better process. Emotional biases arise from feelings and impulse; they resist correction and are usually best accommodated within a portfolio rather than argued away.","q":"Why are emotional biases harder to correct than cognitive errors?","a":"They stem from feeling rather than faulty reasoning, so evidence and education rarely change them — accommodation often works better.","v":{"k":"cmp","h":["Cognitive error","Emotional bias"],"d":[["Source","Faulty reasoning","Feeling"],["Remedy","Education","Accommodation"],["Example","Anchoring","Loss aversion"]]}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Belief Perseverance Biases","b":"Conservatism clings to prior views when new evidence arrives. Confirmation bias seeks only supporting evidence. Representativeness classifies by superficial similarity, ignoring base rates. Illusion of control overestimates influence over outcomes. Hindsight bias remembers past events as more predictable than they were, corrupting the record you learn from.","q":"What makes hindsight bias particularly damaging?","a":"It corrupts the record used for learning, making past outcomes seem predictable and preventing genuine improvement in judgement.","v":{"k":"grid","h":["Bias","Effect"],"d":[["Conservatism","Underweights new data"],["Confirmation","Filters evidence"],["Representativeness","Ignores base rates"],["Illusion of control","Overstates influence"],["Hindsight","Distorts learning"]]}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Information Processing Biases","b":"Anchoring fixes on an initial number — a purchase price, an old forecast — and adjusts insufficiently from it. Mental accounting separates money into buckets treated differently despite fungibility. Framing lets the presentation of identical information change the decision. Availability overweights whatever comes to mind easily, usually recent or vivid events.","q":"How does mental accounting harm portfolio decisions?","a":"Treating money in separate buckets prevents viewing the portfolio as a whole, undermining diversification and overall risk management.","v":{"k":"grid","h":["Bias","Trigger"],"d":[["Anchoring","Initial number"],["Mental accounting","Money buckets"],["Framing","Presentation"],["Availability","Vivid memory"]]}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Loss Aversion","b":"Losses hurt roughly twice as much as equivalent gains please, which produces the disposition effect: selling winners too early to bank the pleasure, holding losers too long to avoid realising the pain. The result is a portfolio that systematically keeps its worst positions and disposes of its best — precisely inverted.","q":"What is the disposition effect?","a":"Selling winning positions too early and holding losing positions too long, driven by the asymmetric pain of realising losses.","v":{"k":"plot","x":"Gain or loss","y":"Felt value","s":[{"n":"Value function","p":[[8,10],[30,32],[50,50],[70,62],[92,70]]}],"note":"Losses steeper than gains: asymmetric pain"}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Overconfidence","b":"Prediction overconfidence sets confidence intervals far too narrow. Certainty overconfidence overstates the probability of being right. Both produce excessive trading, under-diversification and concentrated bets. Overconfidence is strongest in those with some expertise but not enough to know its limits — the most dangerous point on the curve.","q":"What portfolio behaviours does overconfidence produce?","a":"Excessive trading, under-diversification and concentrated positions, since risk and the chance of error are both underestimated.","v":{"k":"plot","x":"Actual knowledge","y":"Confidence","s":[{"n":"Confidence","p":[[8,26],[26,86],[50,44],[74,58],[92,70]]},{"n":"Justified level","p":[[8,14],[92,74]]}],"note":"Peak overconfidence at modest expertise"}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Status Quo, Endowment and Regret Aversion","b":"Status quo bias defaults to doing nothing. Endowment effect values what you own above what you would pay for it — inherited holdings are held far too long. Regret aversion avoids decisions that might later be regretted, producing both paralysis and herding, since following the crowd feels less regrettable when wrong.","q":"How does regret aversion encourage herding?","a":"Being wrong alongside everyone else feels less regrettable than being wrong alone, so investors follow the crowd.","v":{"k":"grid","h":["Bias","Portfolio effect"],"d":[["Status quo","No rebalancing"],["Endowment","Holds inherited stock"],["Regret aversion","Paralysis, herding"],["Self-control","Under-saving"]]}},{"s":"pm","t":"Introduction to Risk Management","n":"Risk Management Is Not Risk Minimisation","b":"The goal is taking the right risks in the right amounts, not avoiding risk. An organisation that eliminates risk eliminates return. Risk management defines tolerance, measures exposures against it, and modifies exposures that fall outside — a continuous process of alignment between risk taken and risk intended.","q":"What is the objective of risk management?","a":"Aligning actual risk exposures with intended tolerance, taking the right risks in appropriate size rather than minimising risk.","v":{"k":"flow","d":["Define tolerance","Measure exposure","Compare","Modify"]}},{"s":"pm","t":"Introduction to Risk Management","n":"Risk Governance","b":"Risk governance is the senior-level framework: setting overall risk tolerance, allocating it across the organisation, and ensuring oversight independent of risk takers. An enterprise-wide view is essential because risks that look unrelated in separate divisions can prove highly correlated when a common factor moves against all of them at once.","q":"Why is an enterprise-wide risk view necessary?","a":"Risks that appear independent within divisions may share common drivers, concentrating exposure that only a consolidated view reveals.","v":{"k":"stack","d":[["Board","sets tolerance"],["Risk committee","allocates"],["Risk function","measures"],["Business units","take risk"]]}},{"s":"pm","t":"Introduction to Risk Management","n":"Risk Tolerance vs Risk Capacity","b":"Capacity is the objective ability to bear loss — determined by capital, liquidity and time. Tolerance is the chosen willingness to do so. Capacity is a hard ceiling that cannot be exceeded regardless of appetite; tolerance is a decision made beneath it. Confusing the two is how institutions fail.","q":"Can risk tolerance exceed risk capacity?","a":"No — capacity is an objective limit set by resources, so tolerance must be set at or below it regardless of appetite.","v":{"k":"scale","l":"Zero risk","r":"Capacity ceiling","d":["Conservative","Chosen tolerance","Capacity limit"]}},{"s":"pm","t":"Introduction to Risk Management","n":"Financial and Non-Financial Risks","b":"Financial risks come from markets: market risk from price movement, credit risk from counterparty failure, liquidity risk from inability to transact at fair value. Non-financial risks include operational, model, settlement, regulatory, legal and solvency risk. Non-financial risks are harder to quantify and frequently cause the largest single-event losses.","q":"Why are non-financial risks often underestimated?","a":"They lack the data history needed for quantitative modelling, so they are excluded from measures that appear comprehensive.","v":{"k":"grid","h":["Financial","Non-financial"],"d":[["Market","Operational"],["Credit","Model"],["Liquidity","Regulatory"],["","Solvency"]]}},{"s":"pm","t":"Introduction to Risk Management","n":"Value at Risk","b":"VaR states the minimum loss expected over a period at a given probability — a 5% one-day VaR of two million means losses exceed two million on roughly one day in twenty. It says nothing about how much worse that day could be, and it assumes the future resembles the estimation period.","q":"What does VaR fail to tell you?","a":"The magnitude of losses beyond the threshold — it gives the cutoff point, not the size of the tail behind it.","v":{"k":"bell","lo":-100,"hi":-72,"note":"VaR marks the cutoff; the tail beyond is unmeasured"}},{"s":"pm","t":"Introduction to Risk Management","n":"Methods of Modifying Risk","b":"Four options. Avoid the risk by not taking the position. Accept it, possibly with reserves or diversification. Transfer it through insurance or to a third party. Shift it with derivatives, changing the payoff distribution. Choice depends on cost against benefit — hedging is never free and can exceed the risk it removes.","q":"What is the difference between transferring and shifting risk?","a":"Transfer moves risk to another party through insurance; shifting uses derivatives to change the shape of the payoff distribution.","v":{"k":"grid","h":["Method","Tool"],"d":[["Avoid","Do not transact"],["Accept","Reserves, diversify"],["Transfer","Insurance"],["Shift","Derivatives"]]}},{"s":"pm","t":"Portfolio Risk and Return: Part I","n":"Correlation and the Efficient Frontier","b":"The shape of the frontier depends entirely on correlation. At correlation of one the frontier is a straight line — no diversification. As correlation falls the curve bows leftward, offering more return for less risk. At negative one it reaches the vertical axis, where a riskless combination becomes theoretically possible.","q":"How does falling correlation change the efficient frontier?","a":"The frontier bows further left, offering higher return at lower risk for the same pair of assets.","v":{"k":"plot","x":"Standard deviation","y":"Expected return","s":[{"n":"ρ = 1","p":[[20,28],[56,58],[90,88]]},{"n":"ρ = 0","p":[[20,28],[36,60],[90,88]]},{"n":"ρ = −1","p":[[20,28],[6,58],[90,88]]}],"note":"Lower correlation bows the frontier leftward"}},{"s":"pm","t":"Portfolio Management: An Overview","n":"Pooled Investment Vehicles","b":"Mutual funds price once daily at net asset value and transact with the fund itself. Exchange-traded funds trade intraday on exchange, using creation and redemption baskets to keep price near NAV. Separately managed accounts give direct ownership and tax control. Hedge and private funds impose restricted redemption in exchange for strategy flexibility.","q":"How do ETFs stay close to net asset value?","a":"Authorised participants create and redeem shares in kind, arbitraging any gap between market price and underlying value.","v":{"k":"grid","h":["Vehicle","Liquidity","Ownership"],"d":[["Mutual fund","Daily NAV","Fund shares"],["ETF","Intraday","Fund shares"],["SMA","Varies","Direct"],["Hedge fund","Restricted","LP interest"]]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"Return Objectives: Required vs Desired","b":"Required return is what the portfolio must achieve to meet essential goals — funding a liability, sustaining spending. Desired return is what the client would like. When desired return demands risk beyond capacity, the honest response is to revise the goal or extend the horizon, not to accept unsupportable risk.","q":"What should an adviser do when desired return exceeds risk capacity?","a":"Revise the objective, extend the horizon or increase contributions — not accept risk beyond what the client can bear.","v":{"k":"cmp","h":["Required","Desired"],"d":[["Basis","Essential goals","Aspiration"],["Flexibility","Low","High"],["If unattainable","Revise plan","Reduce target"]]}},{"s":"pm","t":"Introduction to Risk Management","n":"Sensitivity and Scenario Measures","b":"Sensitivity measures show the effect of one variable moving — duration for rates, beta for equity, delta and gamma for options. Scenario analysis moves many variables together under a coherent narrative, including historical replays of past crises. Sensitivity answers what if this moves; scenario answers what if everything moves at once.","q":"Why supplement sensitivity measures with scenario analysis?","a":"Sensitivity isolates single variables, while real stress moves many correlated variables simultaneously in ways single-factor measures miss.","v":{"k":"cmp","h":["Sensitivity","Scenario"],"d":[["Variables","One","Many"],["Example","Duration","2008 replay"],["Strength","Precise","Realistic"]]}},{"s":"pm","t":"The Behavioral Biases of Individuals","n":"Detecting Biases in Practice","b":"Exam questions describe behaviour and ask you to name the bias. The reliable method: identify whether the error is in reasoning or in feeling. Reasoning errors are cognitive and correctable with data. Feeling-driven behaviour — fear, attachment, pride, regret — is emotional and usually managed through accommodation rather than argument.","q":"What is the quickest way to classify a described bias?","a":"Ask whether the error comes from faulty reasoning, which is cognitive, or from feeling, which is emotional.","v":{"k":"flow","d":["Read behaviour","Reasoning or feeling?","Cognitive vs emotional","Educate or accommodate"]}},{"s":"pm","t":"Portfolio Risk and Return: Part II","n":"Practical Limitations of CAPM","b":"Beta estimates vary with the period and index chosen, making them unstable. The theoretical market portfolio includes every asset and is unobservable, so proxies are used instead. Empirically, size, value and momentum explain returns that beta alone does not. Multifactor models exist precisely because a single factor proved insufficient.","q":"Why did multifactor models emerge?","a":"Empirical evidence showed size, value and momentum explained return variation that beta alone could not capture.","v":{"k":"grid","h":["CAPM limitation","Consequence"],"d":[["Unstable beta","Estimate risk"],["Unobservable market","Proxy needed"],["Missing factors","Multifactor models"],["Strong assumptions","Poor fit"]]}},{"s":"pm","t":"Basics of Portfolio Planning and Construction","n":"Tactical and Dynamic Allocation","b":"Strategic allocation is the long-term policy. Tactical allocation makes short-term deviations from it to exploit perceived mispricing, within pre-set bands. Dynamic allocation adjusts systematically as conditions or the horizon change. Any deviation should be deliberate, bounded and documented — undocumented drift is not tactical, it is neglect.","q":"How does tactical allocation differ from drift?","a":"Tactical deviation is deliberate, bounded by pre-set limits and documented; drift is unintended movement away from target.","v":{"k":"scale","l":"Fixed policy","r":"Active deviation","d":["Strategic","Dynamic","Tactical","Drift (unintended)"]}}];
</script>
<script>
/* =====================================================================
   SHORTS — reels-style micro-learning mode
   Self-contained IIFE. Reuses SHORTS_SUBJECTS / SHORTS_CARDS data defined just above.
   Namespaced storage keys (cfaShorts.*) so nothing collides with the
   rest of Concept Lab.
   ===================================================================== */
(function(){
"use strict";
if (typeof SHORTS_CARDS === 'undefined' || typeof SHORTS_SUBJECTS === 'undefined') return;

const SM={}; SHORTS_SUBJECTS.forEach(s=>SM[s.id]=s);

/* ---------- storage (fails quietly) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let seen=new Set(store.get('cfaShorts.seen',[]));
let again=new Set(store.get('cfaShorts.again',[]));
let liked=new Set(store.get('cfaShorts.liked',[]));
let subs=new Set(store.get('cfaShorts.subs',SHORTS_SUBJECTS.map(s=>s.id)));
let mode=store.get('cfaShorts.mode','seq');       // seq | mix | shuffle | review | formula
let goal=store.get('cfaShorts.goal',{d:'',n:0});

/* ---------- streak ---------- */
let streak = store.get('cfaShorts.streak',0);
(function(){
  const today=new Date().toDateString();
  let last=store.get('cfaShorts.last','');
  if(last!==today){
    const y=new Date(Date.now()-864e5).toDateString();
    streak=(last===y)?streak+1:(last?1:streak||1);
    store.set('cfaShorts.streak',streak); store.set('cfaShorts.last',today);
  }
  if(goal.d!==today){goal={d:today,n:0};store.set('cfaShorts.goal',goal);}
})();
const DAILY=25;

/* ================= SVG VISUAL ENGINE ================= */
const MOB = Math.min(window.innerWidth||9999, 9999) < 720;
const W = MOB ? 400 : 680;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||13}" fill-opacity="${o.o==null?.72:o.o}" text-anchor="${o.a||'start'}" letter-spacing="${o.ls||.3}" font-weight="${o.w||400}">${esc(t)}</text>`;
const TL=(x,y,lines,o={})=>lines.map((ln,j)=>T(x,y+j*(o.lh||15),ln,o)).join('');
const L=(x1,y1,x2,y2,o=.28,w=1)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-opacity="${o}" stroke-width="${w}"/>`;
const R=(x,y,w,h,o=.14,f=1)=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" ${f?`fill="currentColor" fill-opacity="${o}"`:`fill="none" stroke="currentColor" stroke-opacity="${o}"`} rx="2"/>`;
const fit=(px,size)=>Math.max(5,Math.floor(px/(size*0.545)));
const wrap=(s,n)=>{const w=String(s).split(' ');const o=[];let c='';for(const x of w){if((c+' '+x).trim().length>n){if(c)o.push(c.trim());c=x}else c+=' '+x}if(c.trim())o.push(c.trim());return o.length?o:['']};
const wp=(s,px,size)=>wrap(s,fit(px,size));
const svg=(h,inner)=>`<svg viewBox="0 0 ${W} ${Math.round(h)}" xmlns="http://www.w3.org/2000/svg" color="var(--sh-paper)"><defs><marker id="shAr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="currentColor" fill-opacity=".55"/></marker></defs>${inner}</svg>`;
const S1=MOB?12:13.5, S2=MOB?10.5:11.5;

const V={
bars(v){const d=v.d||[];const lw=W*0.37,bw=W-lw-44,rh=30;
  const vals=d.map(r=>+r[1]),mx=Math.max(...vals.map(Math.abs),1);
  const neg=vals.some(x=>x<0),zx=neg?lw+bw/2:lw,half=neg?bw/2:bw;let s='';
  d.forEach((r,i)=>{const y=18+i*rh,val=+r[1],len=Math.abs(val)/mx*half;
    s+=T(lw-9,y+14,wp(r[0],lw-12,S2)[0],{a:'end',s:S2});
    s+=R(val<0?zx-len:zx,y,len,19,val<0?.30:.52);
    s+=T(val<0?zx-len-6:zx+len+6,y+14,(Math.round(val*100)/100),{a:val<0?'end':'start',s:S2-.5,o:.6});});
  const bot=18+d.length*rh;s+=L(zx,12,zx,bot-8,.3);
  if(v.u)s+=T(lw,bot+13,v.u,{s:S2-.5,o:.42});
  return svg(bot+(v.u?20:6),s)},

cmp(v){const rows=v.d||[];const c1=W*0.35,c2=W*0.69,cw=W*0.30;
  const hl=[wp(v.h[0],cw,S2),wp(v.h[1],cw,S2)];
  const hm=Math.max(hl[0].length,hl[1].length);
  let s=TL(c1,12,hl[0],{a:'middle',s:S2,o:.85,w:700,lh:13})+TL(c2,12,hl[1],{a:'middle',s:S2,o:.85,w:700,lh:13});
  let y=12+(hm-1)*13+10; s+=L(0,y,W,y,.28); y+=18;
  rows.forEach((r,i)=>{const la=wp(r[1],cw,S1),lb=wp(r[2],cw,S1);const n=Math.max(la.length,lb.length,1);
    s+=T(0,y,r[0],{s:S2-.5,o:.55,w:600});
    s+=TL(c1,y+15,la,{a:'middle',s:S1,o:.94,lh:15});
    s+=TL(c2,y+15,lb,{a:'middle',s:S1,o:.94,lh:15});
    y+=Math.max(n*15,15)+21;});
  return svg(y-10,s)},

flow(v){const d=v.d||[];const n=d.length;const gap=10,bw=(W-gap*(n-1))/n;let s='',y=26;
  d.forEach((t,i)=>{const x=i*(bw+gap);const ls=wp(t,bw-14,S1);const h=Math.max(40,ls.length*15+18);
    s+=R(x,y,bw,h,.14);s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="8" fill="none" stroke="currentColor" stroke-opacity=".3"/>`;
    s+=TL(x+bw/2,y+h/2-(ls.length-1)*7.5+4,ls,{a:'middle',s:S1,o:.94,lh:15});
    if(i<n-1)s+=`<path d="M${x+bw+2},${y+h/2} L${x+bw+gap-2},${y+h/2}" stroke="currentColor" stroke-opacity=".5" stroke-width="1.6" marker-end="url(#shAr)"/>`;
    y=y;});
  const maxh=Math.max(...d.map(t=>Math.max(40,wp(t,bw-14,S1).length*15+18)));
  return svg(26+maxh+14,s)},

stack(v){const d=v.d||[];let s='',y=8;const rh=(h)=>h;
  d.forEach((r,i)=>{const ls=wp(r[0],W*0.62,S1+.5),sub=r[1]?wp(r[1],W*0.3,S2):[];
    const h=Math.max(34,ls.length*16+8);
    s+=R(0,y,W,h,.10+i*.05);s+=`<rect x="0" y="${y}" width="${W}" height="${h}" rx="6" fill="none" stroke="currentColor" stroke-opacity=".22"/>`;
    s+=TL(14,y+h/2-(ls.length-1)*8+5,ls,{s:S1+.5,o:.95,lh:16});
    if(sub.length)s+=T(W-14,y+h/2+4,sub[0],{a:'end',s:S2,o:.5});
    y+=h+7;});
  return svg(y-1,s)},

scale(v){const d=v.d||[];const x0=14,x1=W-14,n=d.length;
  let s=L(x0,60,x1,60,.34,1.6);
  s+=`<path d="M${x1-8},53 L${x1},60 L${x1-8},67" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.6"/>`;
  d.forEach((t,i)=>{const x=x0+(x1-x0)*(i/(n-1||1));s+=L(x,54,x,66,.42,1.4);
    const ls=wp(t,(x1-x0)/n+18,S2);s+=TL(x,86,ls,{a:'middle',s:S2,o:.9,lh:13});});
  s+=T(x0,26,v.l||'',{s:S1,o:.55});s+=T(x1,26,v.r||'',{a:'end',s:S1,o:.55});
  const maxl=Math.max(...d.map(t=>wp(t,(x1-x0)/n+18,S2).length));
  return svg(86+maxl*13+4,s)},

quad(v){const cx=W/2,cy=96,hw=W*0.42,hh=76;
  let s=L(cx-hw,cy,cx+hw,cy,.3)+L(cx,cy-hh,cx,cy+hh,.3);
  const cells=[[cx-hw/2,cy-hh/2],[cx+hw/2,cy-hh/2],[cx-hw/2,cy+hh/2],[cx+hw/2,cy+hh/2]];
  (v.d||[]).forEach((t,i)=>{const [x,y]=cells[i];const ls=wp(t,hw-16,S1);
    s+=TL(x,y-(ls.length-1)*7.5+3,ls,{a:'middle',s:S1,o:.94,lh:15});});
  s+=T(cx-hw,cy-hh-8,v.x?v.x[0]:'',{s:S2,o:.5})+T(cx+hw,cy-hh-8,v.x?v.x[1]:'',{a:'end',s:S2,o:.5});
  s+=`<g transform="translate(${cx-hw-10},${cy+hh}) rotate(-90)">${T(0,0,v.y?v.y[0]:'',{s:S2,o:.5})}</g>`;
  s+=`<g transform="translate(${cx-hw-10},${cy-hh}) rotate(-90)">${T(0,0,v.y?v.y[1]:'',{a:'end',s:S2,o:.5})}</g>`;
  return svg(cy+hh+16,s)},

tree(v){const cx=W/2,y0=20,y1=100;
  let s=T(cx,y0,v.root||'',{a:'middle',s:S1+.5,o:.95,w:700});
  const x1=W*0.26,x2=W*0.74;
  s+=`<path d="M${cx},${y0+8} L${x1},${y1-24}" stroke="currentColor" stroke-opacity=".4" stroke-width="1.4" fill="none"/>`;
  s+=`<path d="M${cx},${y0+8} L${x2},${y1-24}" stroke="currentColor" stroke-opacity=".4" stroke-width="1.4" fill="none"/>`;
  const lu=wp(v.up||'',W*0.4,S1),ld=wp(v.dn||'',W*0.4,S1);
  s+=TL(x1,y1,lu,{a:'middle',s:S1,o:.94,lh:15});s+=TL(x2,y1,ld,{a:'middle',s:S1,o:.94,lh:15});
  if(v.pu)s+=T(x1,y1-30,v.pu,{a:'middle',s:S2,o:.55});
  if(v.pd)s+=T(x2,y1-30,v.pd,{a:'middle',s:S2,o:.55});
  return svg(y1+Math.max(lu.length,ld.length)*15+8,s)},

plot(v){const x0=30,x1=W-14,y0=16,y1=140;
  let s=L(x0,y1,x1,y1,.3)+L(x0,y0,x0,y1,.3);
  const cols=['currentColor'];
  (v.s||[]).forEach((series,si)=>{
    const pts=(series.p||[]).map(p=>`${x0+(p[0]/100)*(x1-x0)},${y1-(p[1]/100)*(y1-y0)}`).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-opacity="${.85-si*.28}" stroke-width="1.8"/>`;
    (series.p||[]).forEach(p=>{s+=`<circle cx="${x0+(p[0]/100)*(x1-x0)}" cy="${y1-(p[1]/100)*(y1-y0)}" r="2.2" fill="currentColor" fill-opacity="${.7-si*.2}"/>`;});
  });
  if(v.x)s+=T((x0+x1)/2,y1+22,v.x,{a:'middle',s:S2,o:.5});
  if(v.y)s+=`<g transform="translate(10,${(y0+y1)/2}) rotate(-90)">${T(0,0,v.y,{a:'middle',s:S2,o:.5})}</g>`;
  let h=y1+ (v.x?30:10);
  if(v.note){const nl=wp(v.note,x1-x0,S2);s+=TL(x0,h+10,nl,{s:S2,o:.5,lh:13});h+=10+nl.length*13;}
  const legend=(v.s||[]).filter(x=>x.n);
  if(legend.length>1){let ly=h+12;legend.forEach((sr,si)=>{s+=R(x0,ly-8,10,3,.85-si*.28);s+=T(x0+16,ly-3,sr.n,{s:S2,o:.7});ly+=15});h=ly-4;}
  return svg(h+6,s)},

nd(x,y,t){return T(x,y,t,{a:'middle',s:S2,o:.8})},

tline(v){const d=v.d||[];const x0=14,x1=W-14,sp=(x1-x0)/(d.length-1||1),y=96;
  let s=L(x0,y,x1,y,.32,1.5),mu=1,md=1;
  d.forEach((r,i)=>{const X=x0+i*sp,up=r[2]!=='-';
    const a=i===0?'start':(i===d.length-1?'end':'middle');
    const ls=wp(r[1],sp*0.94,S1);
    s+=L(X,y,X,up?y-40:y+40,.5,1.5);
    s+=`<path d="${up?`M${X-5},${y-35} L${X},${y-44} L${X+5},${y-35}`:`M${X-5},${y+35} L${X},${y+44} L${X+5},${y+35}`}" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.5"/>`;
    if(up){s+=TL(X,y-52-(ls.length-1)*14,ls,{a,s:S1,o:.92,lh:14});mu=Math.max(mu,ls.length);
      s+=T(X,y+18,r[0],{a,s:S2-1,o:.5});}
    else{s+=TL(X,y+58,ls,{a,s:S1,o:.92,lh:14});md=Math.max(md,ls.length);
      s+=T(X,y-12,r[0],{a,s:S2-1,o:.5});}});
  return svg(y+58+md*14+6,s)},

bell(v){const x0=W*0.07,x1=W-x0,base=138;
  const f=t=>base-94*Math.exp(-Math.pow((t-50)/17,2)/2),px=t=>x0+(t/100)*(x1-x0);
  let pts='';for(let t=0;t<=100;t+=1.5)pts+=`${px(t)},${f(t)} `;
  const lo=Math.max(0,(v.lo<0?v.lo+100:v.lo)),hi=Math.min(100,(v.hi<0?v.hi+100:v.hi));
  let sh=`M${px(lo)},${base} `;for(let t=lo;t<=hi;t+=1.5)sh+=`L${px(t)},${f(t)} `;sh+=`L${px(hi)},${base} Z`;
  let s=`<path d="${sh}" fill="currentColor" fill-opacity=".26"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-opacity=".8" stroke-width="1.8"/>`;
  s+=L(x0,base,x1,base,.32)+L(px(50),base,px(50),f(50),.22);
  let h=base+14;
  if(v.note){const nl=wp(v.note,W-x0*2,S2);s+=TL(x0,base+24,nl,{s:S2,o:.5,lh:13});h=base+24+nl.length*13;}
  return svg(h,s)},

donut(v){const d=v.d||[];const r=W*0.16,rr=r*0.55,cx=r+6,cy=r+8;
  const lx=cx+r+W*0.06, lw=W-lx-W*0.13;
  let s='',ang=-Math.PI/2;const tot=d.reduce((a,b)=>a+b[1],0)||1;
  d.forEach((seg,i)=>{const a2=ang+(seg[1]/tot)*Math.PI*2,big=(a2-ang)>Math.PI?1:0;
    const p=(rad,a)=>`${cx+rad*Math.cos(a)},${cy+rad*Math.sin(a)}`;
    s+=`<path d="M${p(r,ang)} A${r},${r} 0 ${big} 1 ${p(r,a2)} L${p(rr,a2)} A${rr},${rr} 0 ${big} 0 ${p(rr,ang)} Z" fill="currentColor" fill-opacity="${.62-i*.15}" stroke="var(--navy-950)" stroke-width="1.5"/>`;ang=a2;});
  let y=24;
  d.forEach((seg,i)=>{const ls=wp(seg[0],lw,S1);
    s+=R(lx,y-10,11,11,.62-i*.15);
    s+=TL(lx+18,y,ls,{s:S1,o:.92,lh:15});
    s+=T(W-2,y,seg[1]+'%',{a:'end',s:S2,o:.6});
    y+=ls.length*15+11;});
  return svg(Math.max(cy+r+10,y),s)},

grid(v){const rows=v.d||[];const cols=v.h.length;
  const fr=cols===2?[0.44,0.56]:cols===3?[0.40,0.31,0.29]:new Array(cols).fill(1/cols);
  const xs=[];let acc=0;fr.forEach(f=>{xs.push(acc*W);acc+=f});
  const ws=fr.map(f=>f*W-10);
  const hl=v.h.map((c,i)=>c?wp(c,ws[i],S2-1):['']);
  const hm=Math.max(1,...hl.map(l=>l.length));
  let s='';hl.forEach((l,i)=>{if(v.h[i])s+=TL(xs[i]+3,12,l,{s:S2-1,o:.9,w:700,ls:1.1,lh:12})});
  let y=12+(hm-1)*12+8;s+=L(0,y,W,y,.28);y+=19;
  rows.forEach((r,i)=>{const ls=r.map((c,j)=>wp(c,ws[j],S1));
    const n=Math.max(...ls.map(l=>l.length));
    ls.forEach((l,j)=>s+=TL(xs[j]+3,y,l,{s:S1,o:j?.86:.95,lh:15}));
    y+=n*15+11;if(i<rows.length-1)s+=L(0,y-7,W,y-7,.08);});
  return svg(y-3,s)},

steps(v){const d=v.d||[];let s='',y=6;
  d.forEach((r,i)=>{const a=wp(r[0],W-56,S1+.5),b=r[1]?wp(r[1],W-56,S2):[];
    const bh=Math.max(34,a.length*16+b.length*14+10);
    s+=`<circle cx="14" cy="${y+16}" r="12.5" fill="none" stroke="currentColor" stroke-opacity=".38"/>`;
    s+=T(14,y+21,String(i+1),{a:'middle',s:S2,o:.75,w:700});
    s+=TL(38,y+15,a,{s:S1+.5,o:.95,lh:16});
    if(b.length)s+=TL(38,y+15+a.length*16,b,{s:S2,o:.5,lh:14});
    if(i<d.length-1)s+=L(14,y+30,14,y+bh+2,.22);
    y+=bh+8;});
  return svg(y,s)},

venn(v){const r=W*0.155,cy=r+16,c1=W/2-r*0.56,c2=W/2+r*0.56;
  let s=`<circle cx="${c1}" cy="${cy}" r="${r}" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".38"/>`;
  s+=`<circle cx="${c2}" cy="${cy}" r="${r}" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-opacity=".38"/>`;
  const la=wp(v.a||'',r*1.0,S1-.5),lb=wp(v.b||'',r*1.0,S1-.5),lab=v.ab?wp(v.ab,r*0.85,S2-1):[];
  s+=TL(c1-r*0.46,cy-(la.length-1)*7+5,la,{a:'middle',s:S1-.5,o:.92,lh:14});
  s+=TL(c2+r*0.46,cy-(lb.length-1)*7+5,lb,{a:'middle',s:S1-.5,o:.92,lh:14});
  if(lab.length)s+=TL(W/2,cy-(lab.length-1)*6.5+4,lab,{a:'middle',s:S2-1,o:.9,lh:13});
  return svg(cy+r+12,s)}
};
function renderVis(v){ if(!v||!V[v.k])return ''; try{return `<div class="sh-vis">${V[v.k](v)}</div>`}catch(e){return ''} }

/* ================= FEED ================= */
const feed=document.getElementById('shFeed');
let order=[], idx=0;

function pool(){
  let c=SHORTS_CARDS.map((c,i)=>({...c,i})).filter(c=>subs.has(c.s));
  if(mode==='review') c=c.filter(c=>again.has(c.i));
  if(mode==='formula') c=c.filter(c=>c.f);
  return c;
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function examMix(list){
  const by={};list.forEach(c=>(by[c.s]=by[c.s]||[]).push(c));
  Object.keys(by).forEach(k=>by[k]=shuffled(by[k]));
  const wts={};let tot=0;
  Object.keys(by).forEach(k=>{const w=SM[k].wn;wts[k]=w;tot+=w});
  const credit={};Object.keys(by).forEach(k=>credit[k]=0);
  const out=[];const total=list.length;
  for(let n=0;n<total;n++){
    let best=null,bv=-1;
    for(const k in by){ if(!by[k].length)continue;
      credit[k]+=wts[k]/tot;
      if(credit[k]>bv){bv=credit[k];best=k} }
    if(!best)break;
    credit[best]-=1; out.push(by[best].shift());
  }
  return out;
}

function build(keepPos){
  let list=pool();
  if(mode==='shuffle') list=shuffled(list);
  else if(mode==='mix') list=examMix(list);
  order=list;
  feed.innerHTML = order.length ? order.map(cardHTML).join('') :
    `<div class="sh-empty"><p>${mode==='review'?'Nothing marked for review yet. Tap "Again" on a card you want to see again.':mode==='formula'?'No formula cards in the selected subjects.':'No subjects selected. Open Subjects and pick at least one.'}</p></div>`;
  bindCards();
  const p=keepPos?Math.min(store.get('cfaShorts.pos',0),order.length-1):0;
  feed.scrollTop=Math.max(0,p)*feed.clientHeight;
  idx=Math.max(0,p); updateChrome();
}

function cardHTML(c){
  const s=SM[c.s];
  const isLiked=liked.has(c.i);
  return `<section class="sh-card" data-i="${c.i}" style="background:linear-gradient(170deg,${s.c} 0%,${s.c} 14%,var(--navy-950) 88%)">
    <div class="sh-eyebrow"><b>${esc(s.short)}</b><span class="sh-sep">/</span><span>${esc(c.t)}</span>
      <span class="sh-like${isLiked?' sh-liked':''}" data-like="${c.i}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.5-8.8C.7 8 2 4.5 5.3 4c2-.3 3.7.7 4.7 2.3C11 4.7 12.7 3.7 14.7 4 18 4.5 19.3 8 17.5 11.2 15 15.6 12 20 12 20z"/></svg></span>
    </div>
    <h1>${esc(c.n)}</h1>
    ${c.f?`<div class="sh-formula">${esc(c.f)}</div>`:''}
    ${renderVis(c.v)}
    <div class="sh-body">${esc(c.b)}</div>
    <div class="sh-spacer"></div>
    <div class="sh-quiz">
      <div class="sh-q">${esc(c.q)}</div>
      <button class="sh-reveal">Show answer</button>
      <div class="sh-a">${esc(c.a)}</div>
      <div class="sh-rate">
        <button data-r="again">Again</button>
        <button data-r="got" class="sh-got">Got it</button>
      </div>
    </div>
    <div class="sh-burst"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.5-8.8C.7 8 2 4.5 5.3 4c2-.3 3.7.7 4.7 2.3C11 4.7 12.7 3.7 14.7 4 18 4.5 19.3 8 17.5 11.2 15 15.6 12 20 12 20z"/></svg></div>
  </section>`;
}

function bindCards(){
  feed.querySelectorAll('.sh-quiz').forEach(q=>{
    q.querySelector('.sh-reveal')?.addEventListener('click',()=>q.classList.add('sh-open'));
    q.querySelectorAll('.sh-rate button').forEach(b=>b.addEventListener('click',()=>{
      const i=+q.closest('.sh-card').dataset.i;
      if(b.dataset.r==='again')again.add(i);else again.delete(i);
      store.set('cfaShorts.again',[...again]);
      q.querySelectorAll('.sh-rate button').forEach(x=>x.classList.remove('sh-done'));
      b.classList.add('sh-done');
    }));
  });
  feed.querySelectorAll('.sh-like').forEach(el=>el.addEventListener('click',()=>toggleLike(el)));
  feed.querySelectorAll('.sh-card').forEach(card=>{
    let lastTap=0;
    card.addEventListener('click',e=>{
      if(e.target.closest('.sh-quiz')||e.target.closest('.sh-like'))return;
      const now=Date.now();
      if(now-lastTap<320){ likeCard(card,true); }
      lastTap=now;
    });
  });
  io.disconnect();feed.querySelectorAll('.sh-card').forEach(c=>io.observe(c));
}
function toggleLike(el){
  const i=+el.dataset.like;
  const card=el.closest('.sh-card');
  const nowLiked=!liked.has(i);
  if(nowLiked){liked.add(i);el.classList.add('sh-liked');likeCard(card,false);}
  else{liked.delete(i);el.classList.remove('sh-liked');}
  store.set('cfaShorts.liked',[...liked]);
}
function likeCard(card,fromDoubleTap){
  const i=+card.dataset.i;
  if(fromDoubleTap && !liked.has(i)){
    liked.add(i);store.set('cfaShorts.liked',[...liked]);
    card.querySelector('.sh-like')?.classList.add('sh-liked');
  }
  const burst=card.querySelector('.sh-burst');
  if(!burst)return;
  burst.classList.remove('sh-go'); void burst.offsetWidth; burst.classList.add('sh-go');
}

const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.intersectionRatio<0.55){ e.target.classList.remove('sh-in'); return; }
    e.target.classList.add('sh-in');
    const i=+e.target.dataset.i;
    if(!seen.has(i)){seen.add(i);store.set('cfaShorts.seen',[...seen]);
      goal.n++;store.set('cfaShorts.goal',goal);}
    idx=[...feed.children].indexOf(e.target);
    store.set('cfaShorts.pos',idx);
    updateChrome();
  });
},{threshold:[0.55],root:feed});

/* ---------- chrome ---------- */
const railEl=document.getElementById('shRail');
function updateChrome(){
  const c=order[idx];
  document.getElementById('shCount').textContent =
    order.length? `${idx+1} / ${order.length}  ·  ${seen.size} seen` : '—';
  const pct=Math.min(1,goal.n/DAILY);
  const circ=2*Math.PI*14, fg=document.querySelector('#shRing .sh-fg');
  fg.setAttribute('stroke-dasharray',circ);
  fg.setAttribute('stroke-dashoffset',circ*(1-pct));
  document.getElementById('shRingN').textContent = goal.n>=DAILY?'✓':goal.n;
  document.getElementById('shStreakN').textContent = streak;
  railEl.querySelectorAll('.sh-band').forEach(b=>b.classList.toggle('sh-act',c&&b.dataset.s===c.s));
  const h=document.getElementById('shHint');
  if(idx>0){h.style.opacity=0}
}
function buildRail(){
  railEl.innerHTML=SHORTS_SUBJECTS.map(s=>{
    const n=SHORTS_CARDS.filter(c=>c.s===s.id).length;
    return `<div class="sh-band" data-s="${s.id}" style="background:${s.c};height:${Math.max(14,n*0.9)}px;border:1px solid rgba(255,255,255,.3)" title="${s.name}"></div>`
  }).join('');
  railEl.querySelectorAll('.sh-band').forEach(b=>b.addEventListener('click',()=>jumpSubject(b.dataset.s)));
}
function jumpSubject(sid){
  const t=order.findIndex(c=>c.s===sid);
  if(t>=0)feed.scrollTo({top:t*feed.clientHeight,behavior:'smooth'});
}

/* ---------- subjects sheet ---------- */
function buildSubs(){
  document.getElementById('shSlist').innerHTML=SHORTS_SUBJECTS.map(s=>{
    const all=SHORTS_CARDS.map((c,i)=>({...c,i})).filter(c=>c.s===s.id);
    const done=all.filter(c=>seen.has(c.i)).length;
    const pct=all.length?Math.round(done/all.length*100):0;
    return `<div class="sh-srow ${subs.has(s.id)?'sh-on':''}" data-s="${s.id}">
      <div class="sh-dot" style="background:${s.c};border:1px solid rgba(255,255,255,.4)"></div>
      <div class="sh-nm">${s.name}<div class="sh-wt">${s.w} exam weight · ${all.length} cards</div>
        <div class="sh-pbar"><i style="width:${pct}%"></i></div></div>
      <div class="sh-pg">${done}/${all.length}</div><div class="sh-chk"></div></div>`
  }).join('');
  document.querySelectorAll('#shSlist .sh-srow').forEach(r=>r.addEventListener('click',()=>{
    const id=r.dataset.s;
    if(subs.has(id))subs.delete(id);else subs.add(id);
    if(!subs.size)subs.add(id);
    store.set('cfaShorts.subs',[...subs]);r.classList.toggle('sh-on',subs.has(id));
  }));
}

/* ---------- search ---------- */
document.getElementById('shSearchInput').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  const res=document.getElementById('shResults');
  if(q.length<2){res.innerHTML='';return}
  const hits=SHORTS_CARDS.map((c,i)=>({...c,i}))
    .filter(c=>(c.n+' '+c.t+' '+c.b+' '+(c.f||'')).toLowerCase().includes(q)).slice(0,40);
  res.innerHTML=hits.length?hits.map(c=>`<div class="sh-srow" data-i="${c.i}">
    <div class="sh-dot" style="background:${SM[c.s].c}"></div>
    <div class="sh-nm">${esc(c.n)}<div class="sh-wt">${esc(SM[c.s].short)} · ${esc(c.t)}</div></div></div>`).join('')
    :`<div class="sh-wt" style="padding:12px 0">No matches.</div>`;
  res.querySelectorAll('.sh-srow').forEach(r=>r.addEventListener('click',()=>{
    const i=+r.dataset.i;
    if(!subs.has(SHORTS_CARDS[i].s)){subs.add(SHORTS_CARDS[i].s);store.set('cfaShorts.subs',[...subs]);build(false)}
    const t=order.findIndex(c=>c.i===i);
    closeSheet('shSheetSearch');
    if(t>=0)setTimeout(()=>feed.scrollTo({top:t*feed.clientHeight,behavior:'auto'}),60);
  }));
});

/* ---------- wiring ---------- */
const openSheet=id=>document.getElementById(id).classList.add('sh-open');
const closeSheet=id=>document.getElementById(id).classList.remove('sh-open');
document.getElementById('shBtnSubs').onclick=()=>{buildSubs();openSheet('shSheetSubs')};
document.getElementById('shCloseSubs').onclick=()=>{closeSheet('shSheetSubs');build(false)};
document.getElementById('shBtnSearch').onclick=()=>{openSheet('shSheetSearch');setTimeout(()=>document.getElementById('shSearchInput').focus(),120)};
document.getElementById('shCloseSearch').onclick=()=>closeSheet('shSheetSearch');
document.getElementById('shSelAll').onclick=()=>{subs=new Set(SHORTS_SUBJECTS.map(s=>s.id));store.set('cfaShorts.subs',[...subs]);buildSubs()};
document.getElementById('shSelNone').onclick=()=>{subs=new Set([SHORTS_SUBJECTS[0].id]);store.set('cfaShorts.subs',[...subs]);buildSubs()};
document.getElementById('shBtnShuffle').onclick=()=>{mode='shuffle';store.set('cfaShorts.mode',mode);closeSheet('shSheetSubs');build(false);flash('Shuffled')};
document.getElementById('shBtnFormula').onclick=()=>{mode=mode==='formula'?'seq':'formula';store.set('cfaShorts.mode',mode);closeSheet('shSheetSubs');build(false);flash(mode==='formula'?'Formulas only':'All cards')};
document.getElementById('shBtnMix').onclick=()=>{mode=mode==='mix'?'seq':'mix';store.set('cfaShorts.mode',mode);build(false);flash(mode==='mix'?'Exam-weighted mix':'Curriculum order')};
document.getElementById('shBtnReview').onclick=()=>{mode=mode==='review'?'seq':'review';store.set('cfaShorts.mode',mode);build(false);flash(mode==='review'?`Review queue (${again.size})`:'All cards')};
document.getElementById('shBtnReset').onclick=()=>{
  if(!confirm('Clear seen cards, review queue and daily progress for Shorts?'))return;
  seen=new Set();again=new Set();goal={d:new Date().toDateString(),n:0};
  store.set('cfaShorts.seen',[]);store.set('cfaShorts.again',[]);store.set('cfaShorts.goal',goal);
  buildSubs();updateChrome();flash('Progress reset')};
document.querySelectorAll('#shortsView .sh-sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('sh-open')}));

function flash(t){const h=document.getElementById('shHint');h.textContent=t;h.style.opacity=1;
  clearTimeout(flash.t);flash.t=setTimeout(()=>h.style.opacity=0,1600)}

document.addEventListener('keydown',e=>{
  const view=document.getElementById('shortsView');
  if(!view.classList.contains('sh-open'))return;
  if(document.querySelector('#shortsView .sh-sheet.sh-open')){
    if(e.key==='Escape'){document.querySelectorAll('#shortsView .sh-sheet').forEach(s=>s.classList.remove('sh-open'))}
    return;
  }
  const k=e.key;
  if(k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();feed.scrollBy({top:feed.clientHeight,behavior:'smooth'})}
  if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();feed.scrollBy({top:-feed.clientHeight,behavior:'smooth'})}
  if(k==='Enter'){feed.children[idx]?.querySelector('.sh-quiz')?.classList.add('sh-open')}
  if(k==='Escape'){closeShorts()}
});
window.addEventListener('resize',()=>{ if(feed) feed.scrollTop=idx*feed.clientHeight});

/* ---------- open / close ---------- */
let built=false;
function openShorts(){
  const view=document.getElementById('shortsView');
  view.classList.add('sh-open');
  document.body.classList.add('sh-lock');
  if(!built){ buildRail(); build(true); built=true; }
  else { updateChrome(); }
}
function closeShorts(){
  document.getElementById('shortsView').classList.remove('sh-open');
  document.body.classList.remove('sh-lock');
}
document.getElementById('shBack').addEventListener('click',closeShorts);

const shortsBtn=document.querySelector('.mode-btn[data-mode="shorts"]');
if(shortsBtn) shortsBtn.addEventListener('click',openShorts);

})();

</script>
