el itself. Interest coverage below roughly two is uncomfortable; below one means operating profit does not cover interest. Fixed charge coverage extends this to lease payments and other fixed obligations, giving a fuller picture for asset-light businesses.","q":"Why do lenders prefer coverage ratios to debt levels?","a":"Coverage measures the ability to service obligations from earnings, which determines default risk more directly than the absolute quantity of debt.","v":{"k":"scale","l":"Distressed","r":"Comfortable","d":["< 1×","1–2×","2–4×","> 4×"]}},{"s":"fsa","t":"Financial Analysis Techniques","n":"Limitations of Ratio Analysis","b":"Ratios compare only within comparable accounting policies, so IFRS versus US GAAP, LIFO versus FIFO, and different depreciation estimates break comparability before the arithmetic begins. Conglomerates resist industry benchmarking. Seasonal businesses distort year-end balance sheet ratios. And no ratio has an absolute correct value — context and trend carry the meaning.","q":"What must be checked before comparing two companies' ratios?","a":"That accounting policies, frameworks and estimates are comparable, and that the businesses face similar industry and seasonal conditions.","v":{"k":"grid","h":["Limitation","Effect"],"d":[["Policy differences","False gaps"],["Conglomerates","No clean peer"],["Seasonality","Year-end distortion"],["No absolute norm","Context required"]]}},{"s":"fsa","t":"Introduction to Financial Statement Modeling","n":"Building a Forecast","b":"Start with revenue, driven by volume and price or by market size and share. Forecast costs by separating fixed from variable so operating leverage behaves correctly. Link the balance sheet through working capital ratios and capital expenditure. Then check that the model reconciles: the three statements must tie, and the balance sheet must balance without a plug.","q":"Why separate fixed from variable costs in a forecast?","a":"Operating leverage depends on the split — fixed costs make margins expand with volume growth and contract sharply on decline.","v":{"k":"flow","d":["Forecast revenue","Split fixed/variable costs","Link working capital","Reconcile statements"]}},{"s":"fsa","t":"Introduction to Financial Statement Modeling","n":"Behavioural Bias in Forecasting","b":"Four biases distort models predictably. Overconfidence produces forecast ranges that are too narrow. Illusion of control makes detailed models feel more accurate than they are. Conservatism anchors to prior estimates and updates too slowly on new evidence. Confirmation bias filters data toward the existing thesis. Explicit scenario ranges are the standard defence.","q":"How does overconfidence typically show up in a model?","a":"As forecast ranges that are too narrow, understating the genuine uncertainty around key drivers.","v":{"k":"grid","h":["Bias","Effect on model"],"d":[["Overconfidence","Ranges too narrow"],["Illusion of control","Detail mistaken for accuracy"],["Conservatism","Updates too slowly"],["Confirmation","Filters contrary data"]]}},{"s":"fsa","t":"Introduction to Financial Statement Modeling","n":"Competitive Position and Margins","b":"A forecast of margins is implicitly a forecast about competition. Assuming margins persist assumes barriers hold. Porter's framework supplies the discipline: rivalry, new entrants, substitutes, and the bargaining power of buyers and suppliers each compress margins over time. Extrapolating current margins into perpetuity is the single most common modelling error.","q":"What assumption is embedded in a flat long-run margin forecast?","a":"That competitive barriers hold indefinitely — that rivalry, entry, and buyer power will not erode profitability over the forecast horizon.","v":{"k":"plot","x":"Years forward","y":"Operating margin","s":[{"n":"Naive extrapolation","p":[[8,70],[35,70],[62,70],[92,70]]},{"n":"Competitive erosion","p":[[8,70],[35,60],[62,50],[92,44]]}],"note":"Barriers rarely hold indefinitely"}},{"s":"ci","t":"Organizational Forms, Corporate Issuer Features, and Ownership","n":"Organisational Forms","b":"Sole proprietorships and general partnerships offer simplicity and pass-through taxation but unlimited liability — personal assets are exposed. Limited partnerships shield limited partners while the general partner remains fully liable. Corporations grant limited liability and perpetual existence at the cost of separated ownership and control, plus potential double taxation.","q":"What does a corporation trade away for limited liability?","a":"Separation of ownership from control, creating agency conflicts, plus potential double taxation of profits and dividends.","v":{"k":"grid","h":["Form","Liability","Taxation"],"d":[["Sole proprietor","Unlimited","Pass-through"],["General partnership","Unlimited","Pass-through"],["Limited partnership","Mixed","Pass-through"],["Corporation","Limited","Often double"]]}},{"s":"ci","t":"Organizational Forms, Corporate Issuer Features, and Ownership","n":"Public vs Private Issuers","b":"Public companies have shares trading on an exchange, dispersed ownership, mandatory disclosure and continuous price discovery. Private companies have concentrated ownership, limited disclosure, illiquid shares and valuation only at transaction points. Private status reduces short-term pressure but raises the cost of capital, because investors demand compensation for illiquidity and opacity.","q":"Why do private companies typically face a higher cost of capital?","a":"Investors demand additional return for illiquidity and reduced disclosure, since exit is uncertain and information is limited.","v":{"k":"cmp","h":["Public","Private"],"d":[["Ownership","Dispersed","Concentrated"],["Disclosure","Mandatory","Limited"],["Liquidity","Continuous","Episodic"],["Cost of capital","Lower","Higher"]]}},{"s":"ci","t":"Organizational Forms, Corporate Issuer Features, and Ownership","n":"Going Public and Going Private","b":"Routes to public markets include the traditional IPO, a direct listing without new capital raised, and a SPAC merger. Routes to private status include leveraged buyouts, management buyouts, and going-private transactions. Each changes the shareholder base, the disclosure burden, and often the governance structure — not merely the venue where shares trade.","q":"How does a direct listing differ from an IPO?","a":"A direct listing places existing shares on an exchange without issuing new shares or raising capital, and typically without underwriters.","v":{"k":"flow","d":["Private","IPO / direct listing / SPAC","Public","LBO / MBO → private again"]}},{"s":"ci","t":"Investors and Other Stakeholders","n":"Debt and Equity Claims Compared","b":"Debtholders hold a fixed contractual claim with priority in liquidation and a capped upside — the best case is being repaid. Equity holders hold a residual claim, last in line but with unlimited upside. This asymmetry drives behaviour: equity holders favour risk because they capture the gains, while debtholders resist it because they bear losses without sharing gains.","q":"Why do equity holders prefer more risk than debtholders?","a":"Equity captures unlimited upside while downside is limited by the residual claim, whereas debt has capped upside and bears default losses.","v":{"k":"plot","x":"Firm value","y":"Payoff","s":[{"n":"Debt","p":[[8,8],[40,40],[62,52],[92,52]]},{"n":"Equity","p":[[8,4],[52,4],[92,52]]}],"note":"Equity is a residual, option-like claim"}},{"s":"ci","t":"Investors and Other Stakeholders","n":"Stakeholder Groups","b":"Shareholders want value maximisation. Debtholders want stability and capital preservation. Managers want compensation and job security. Employees want stability and progression. Customers want quality and continuity. Suppliers want reliable payment. Governments want compliance and tax. Governance exists precisely because these objectives conflict rather than align.","q":"Why is stakeholder management a governance problem?","a":"Stakeholder objectives conflict, so mechanisms are needed to arbitrate between them rather than assuming interests naturally align.","v":{"k":"grid","h":["Stakeholder","Wants"],"d":[["Shareholders","Value maximisation"],["Debtholders","Stability, repayment"],["Managers","Pay, security"],["Employees","Stability, growth"],["Suppliers","Reliable payment"]]}},{"s":"ci","t":"Investors and Other Stakeholders","n":"Principal-Agent Conflicts","b":"Three recur. Manager versus shareholder: empire building, excessive perquisites, and risk aversion that protects the job rather than the value. Controlling versus minority shareholder: related-party transactions and self-dealing that extract value from the minority. Shareholder versus debtholder: taking risk after the debt is priced, transferring value from lenders to owners.","q":"How do shareholders expropriate value from debtholders?","a":"By increasing risk or leverage after debt is issued and priced, capturing the upside while lenders bear the increased default probability.","v":{"k":"grid","h":["Conflict","Mechanism"],"d":[["Manager vs shareholder","Empire building"],["Controlling vs minority","Related-party deals"],["Shareholder vs debtholder","Risk shifting"]]}},{"s":"ci","t":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","n":"Internal Governance Mechanisms","b":"The board is the primary mechanism: independence, relevant expertise, and separation of chair from chief executive determine whether oversight is real. Audit, compensation and nomination committees should be independently staffed. Compensation design aligns incentives when tied to long-term value, and misaligns them when tied to short-term share price or accounting targets.","q":"Why separate the chair and chief executive roles?","a":"Combining them means the executive effectively leads the body overseeing them, weakening independent challenge and accountability.","v":{"k":"stack","d":[["Shareholders","elect"],["Board of directors","oversee"],["Committees","audit, comp, nomination"],["Management","execute"]]}},{"s":"ci","t":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","n":"External Governance Mechanisms","b":"Outside the company, several forces discipline management. The market for corporate control threatens takeover of underperformers. Auditors verify reporting. Regulators enforce rules. Creditors impose covenants. Analysts and short sellers scrutinise claims. Shareholder activists force change. Each is imperfect alone; governance quality depends on how many operate effectively together.","q":"How does the market for corporate control discipline managers?","a":"Persistent underperformance depresses the share price, inviting a takeover that typically replaces incumbent management.","v":{"k":"flow","d":["Underperformance","Share price falls","Takeover threat","Management replaced"]}},{"s":"ci","t":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","n":"Shareholder Rights and Voting","b":"Statutory voting gives one vote per share per matter. Cumulative voting lets a shareholder concentrate all votes on one candidate, which strengthens minority representation on the board. Dual-class share structures separate cash flow rights from control rights, entrenching founders and creating an insider-minority conflict that ordinary voting cannot resolve.","q":"How does cumulative voting protect minority shareholders?","a":"It allows all votes to be concentrated on a single director candidate, making minority board representation achievable.","v":{"k":"cmp","h":["Statutory","Cumulative"],"d":[["Votes","One per share per seat","Total concentrable"],["Favours","Majority","Minority"],["Board effect","Majority sweeps","Minority seat possible"]]}},{"s":"ci","t":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","n":"Risks of Poor Governance","b":"Weak governance produces predictable damage: value destroyed by poor capital allocation, related-party transactions extracting value, accounting failures, reputational loss, and ultimately a higher cost of capital as investors price the risk of expropriation. The benefits of strong governance are the mirror image — better allocation, lower financing costs, and stronger operational performance.","q":"How does governance quality affect the cost of capital?","a":"Investors demand a premium for expropriation and reporting risk, so weak governance raises the cost of both debt and equity.","v":{"k":"bars","d":[["Strong governance",7.5],["Average",9.0],["Weak governance",11.5]],"u":"illustrative cost of equity %"}},{"s":"ci","t":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","n":"ESG Considerations","b":"Environmental, social and governance factors enter analysis as sources of financial risk rather than as ethics. Approaches range from negative screening that excludes sectors, to positive screening, thematic investing, engagement with management, and full ESG integration into valuation. Governance is generally the factor with the clearest and most direct link to financial outcomes.","q":"Which ESG factor has the clearest financial linkage?","a":"Governance, because board effectiveness, control quality, and alignment directly affect capital allocation and reporting reliability.","v":{"k":"scale","l":"Exclusionary","r":"Integrated","d":["Negative screening","Positive screening","Engagement","Full integration"]}},{"s":"ci","t":"Working Capital and Liquidity","n":"Sources of Liquidity","b":"Primary sources are ordinary: cash on hand, collections from customers, and committed credit lines. Secondary sources signal stress: liquidating assets, renegotiating debt, filing for protection. The critical distinction is that drawing on secondary sources usually damages the business, so a company relying on them is already in difficulty regardless of reported ratios.","q":"Why does relying on secondary liquidity sources signal distress?","a":"They typically impair the business — selling assets, renegotiating terms, or restructuring — rather than arising from normal operations.","v":{"k":"cmp","h":["Primary","Secondary"],"d":[["Examples","Cash, collections, credit line","Asset sales, renegotiation"],["Effect on business","None","Damaging"],["Signal","Normal","Distress"]]}},{"s":"ci","t":"Working Capital and Liquidity","n":"Drags and Pulls on Liquidity","b":"Drags delay cash inflows: obsolete inventory, slow collections, tight credit limits imposed by lenders. Pulls accelerate outflows: suppliers shortening terms, early payment requirements, reduced credit lines. Both compress the cash conversion cycle from the wrong direction, and both intensify precisely when the business is already under pressure.","q":"What is the difference between a drag and a pull on liquidity?","a":"A drag delays cash inflows, such as slow collections; a pull accelerates cash outflows, such as suppliers shortening payment terms.","v":{"k":"cmp","h":["Drags (inflow delayed)","Pulls (outflow accelerated)"],"d":[["Cause","Slow collections","Shorter supplier terms"],["Cause","Obsolete inventory","Reduced credit line"],["Effect","Cash arrives late","Cash leaves early"]]}},{"s":"ci","t":"Working Capital and Liquidity","n":"Managing the Cash Conversion Cycle","b":"Three levers, each with a limit. Collect faster through discounts and tighter terms, but aggressive collection loses customers. Hold less inventory through better forecasting, but stockouts cost sales. Pay suppliers later, but stretching terms damages relationships and may forfeit early payment discounts worth more than the financing saved.","q":"Why is stretching payables not free financing?","a":"It forfeits early payment discounts and strains supplier relationships, and the implied annualised cost of a missed discount is often very high.","v":{"k":"flow","d":["Collect faster","Hold less inventory","Pay later","Shorter cycle"]}},{"s":"ci","t":"Working Capital and Liquidity","n":"Short-Term Funding Options","b":"Bank lines of credit range from uncommitted, which the bank may withdraw, to committed and revolving facilities that are reliable but carry fees. Commercial paper suits large high-grade issuers and is cheap but refinancing risk is real. Secured borrowing pledges receivables or inventory. Factoring sells receivables outright, transferring collection risk at a discount.","q":"What is the weakness of an uncommitted line of credit?","a":"The bank can withdraw it at discretion, typically precisely when the borrower most needs it, so it is unreliable in stress.","v":{"k":"scale","l":"Least reliable","r":"Most reliable","d":["Uncommitted line","Commercial paper","Committed line","Revolving facility"]}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"Types of Capital Investment","b":"Maintenance projects sustain existing operations and are rarely optional. Expansion projects grow capacity and carry the most forecast risk. New product or market ventures are the highest uncertainty. Regulatory and compliance projects must proceed regardless of return. Categorising first matters, because the analytical rigour appropriate to each differs sharply.","q":"Which project category is evaluated on return least?","a":"Regulatory and compliance investments, which must proceed regardless of return, though the least-cost compliant option should still be chosen.","v":{"k":"grid","h":["Type","Discretion"],"d":[["Maintenance","Low"],["Regulatory","None"],["Expansion","High"],["New venture","High"]]}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"Capital Allocation Principles","b":"Four rules keep analysis honest. Use incremental after-tax cash flows, not accounting profit. Ignore sunk costs entirely — money already spent is irrelevant to a forward decision. Include opportunity costs of resources already owned. Include externalities, both cannibalisation of existing products and positive spillovers to other lines.","q":"Should the cost of land already owned enter a project analysis?","a":"Yes — at its opportunity cost, meaning its current market value or best alternative use, not its historical purchase price.","v":{"k":"grid","h":["Include","Exclude"],"d":[["Incremental cash flows","Sunk costs"],["Opportunity costs","Financing costs"],["Cannibalisation","Accounting allocations"]]}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"Net Present Value","f":"NPV = Σ CFₜ / (1 + r)ᵗ − Initial outlay","b":"NPV measures value created in currency terms and is the theoretically correct rule: accept positive NPV, and when ranking mutually exclusive projects, choose the highest. It assumes reinvestment at the cost of capital, which is realistic. Its output is directly additive across projects, which is why it aggregates cleanly to firm value.","q":"Why does NPV dominate other capital allocation rules?","a":"It measures absolute value creation, assumes realistic reinvestment at the cost of capital, and is additive across projects.","v":{"k":"tline","d":[["t=0","−1,000 outlay","-"],["t=1–4","+350 per year","+"],["NPV at 10%","+109","+"]]}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"IRR and Its Traps","b":"IRR is the discount rate making NPV zero — intuitive because it is a percentage, but flawed. It assumes reinvestment at the IRR itself, which overstates returns on high-IRR projects. Non-conventional cash flows with sign changes can produce multiple IRRs or none. And IRR ignores scale, so it can favour a small project over a far more valuable large one.","q":"When do NPV and IRR rankings conflict?","a":"With mutually exclusive projects differing in scale or cash flow timing — NPV should govern because it measures absolute value created.","v":{"k":"cmp","h":["NPV","IRR"],"d":[["Output","Currency value","Percentage"],["Reinvestment","At cost of capital","At IRR"],["Scale","Captured","Ignored"],["Multiple answers","No","Possible"]]}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"Real Options in Projects","b":"Static NPV assumes the decision is made once and never revisited. Real options value the flexibility that actually exists: to expand if demand exceeds expectations, to abandon if it disappoints, to defer until uncertainty resolves, or to switch inputs or outputs. Flexibility has positive value, so ignoring it systematically understates good projects.","q":"Why does static NPV understate flexible projects?","a":"It ignores the value of managerial options to expand, abandon, defer or switch, all of which have positive value under uncertainty.","v":{"k":"grid","h":["Real option","Value when"],"d":[["Expand","Demand exceeds forecast"],["Abandon","Outcome disappoints"],["Defer","Uncertainty is high"],["Switch","Input prices move"]]}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"Common Allocation Mistakes","b":"Predictable errors recur. Basing decisions on accounting metrics rather than cash flow. Inconsistent treatment of inflation — nominal cash flows discounted at real rates. Failing to consider all alternatives. Overhead misallocation that penalises new projects. Ignoring cannibalisation. And pet-project bias, where sponsorship substitutes for analysis.","q":"What is the inflation consistency rule?","a":"Discount nominal cash flows at nominal rates and real cash flows at real rates; mixing the two systematically distorts NPV.","v":{"k":"cmp","h":["Correct","Error"],"d":[["Cash flows","Nominal","Nominal"],["Discount rate","Nominal","Real"],["Result","Accurate","Overstated NPV"]]}},{"s":"ci","t":"Capital Structure","n":"Modigliani-Miller Without Taxes","b":"In a world with no taxes, no bankruptcy costs and symmetric information, capital structure is irrelevant — firm value is set by the assets, not by how they are financed. Adding debt raises the cost of equity exactly enough to leave WACC unchanged. The proposition is obviously unrealistic, and that is its purpose: it identifies which frictions actually matter.","q":"Why does the cost of equity rise with leverage under MM?","a":"Additional debt increases the risk borne by residual claimants, and the higher required return offsets the cheaper debt exactly, leaving WACC unchanged.","v":{"k":"plot","x":"Debt / Equity","y":"Cost of capital","s":[{"n":"Cost of equity","p":[[8,45],[38,58],[68,72],[92,86]]},{"n":"WACC","p":[[8,52],[38,52],[68,52],[92,52]]},{"n":"Cost of debt","p":[[8,28],[92,28]]}],"note":"WACC flat without taxes or distress costs"}},{"s":"ci","t":"Capital Structure","n":"Adding Taxes and Distress Costs","b":"Interest is tax deductible, so debt creates a tax shield and firm value rises with leverage — MM with taxes alone implies all-debt financing. Introducing financial distress costs corrects this: beyond a point, the expected costs of bankruptcy, lost customers, and constrained investment exceed the shield, producing an optimal structure at the minimum of WACC.","q":"What creates an optimal capital structure?","a":"The trade-off between the interest tax shield, which rises with debt, and expected financial distress costs, which rise faster beyond a point.","v":{"k":"plot","x":"Leverage","y":"Firm value","s":[{"n":"Firm value","p":[[8,45],[30,68],[52,80],[74,66],[92,40]]}],"note":"Optimum where tax shield stops outpacing distress costs"}},{"s":"ci","t":"Capital Structure","n":"Pecking Order and Signalling","b":"Because managers know more than investors, financing choices carry information. Internal funds are preferred first, then debt, then equity last — issuing equity signals that management believes shares are overvalued, so the announcement typically depresses the price. This is why profitable firms often carry less debt than trade-off theory alone would predict.","q":"Why does an equity issue usually depress the share price?","a":"Investors infer management believes the shares are overvalued, since better-informed managers would otherwise use internal funds or debt.","v":{"k":"stack","d":[["Internal funds","first choice"],["Debt","second"],["Equity","last resort"]]}},{"s":"ci","t":"Capital Structure","n":"Static Trade-off Theory","f":"V_levered = V_unlevered + PV(tax shield) − PV(distress costs)","b":"The workhorse model. Firm value equals the unlevered value plus the present value of the tax shield minus the present value of expected financial distress costs. The optimum sits where the marginal shield equals the marginal distress cost. Businesses with stable cash flows and tangible assets can support more debt; volatile asset-light businesses cannot.","q":"Why can asset-heavy stable businesses carry more debt?","a":"Predictable cash flows lower the probability of distress, and tangible collateral reduces the losses lenders face if it occurs.","v":{"k":"scale","l":"Low debt capacity","r":"High debt capacity","d":["Early-stage tech","Cyclical manufacturer","Consumer staples","Regulated utility"]}},{"s":"ci","t":"Capital Structure","n":"Cost of Capital and Target Structure","f":"WACC = wₑ·rₑ + w_d·r_d·(1 − t)","b":"WACC weights each source by its market-value share, with debt taken after tax because interest is deductible. Use target weights rather than current ones for project analysis, since the firm will finance toward its target over time. Using book weights or the marginal financing source for a single project is a persistent and consequential error.","q":"Why use target rather than current capital structure weights?","a":"Financing decisions are made toward the long-run target, so a project should bear the cost of the capital mix that will actually fund it over its life.","v":{"k":"steps","d":[["Equity 60% at 11%","6.6%"],["Debt 40% at 6%, t=25%","1.8%"],["Sum","WACC = 8.4%"]]}},{"s":"ci","t":"Business Models","n":"What a Business Model Specifies","b":"Who the customer is, what value is offered, how it is delivered through channels and relationships, and how the firm captures value through pricing and cost structure. Two companies in the same industry with different models face different economics entirely — a subscription software firm and a licence-sale firm sell similar products with fundamentally different cash flow profiles.","q":"What are the core components of a business model?","a":"The target customer, the value proposition, the delivery channel and relationship, and the pricing and cost structure that captures value.","v":{"k":"flow","d":["Who is the customer?","What value?","How delivered?","How monetised?"]}},{"s":"ci","t":"Business Models","n":"Pricing Models","b":"Value-based pricing sets price by willingness to pay, capturing the most value but requiring segmentation. Cost-plus adds a margin to cost — simple, but ignores what buyers will pay. Penetration pricing sacrifices early margin to build share and works only where scale or network effects follow. Price discrimination and dynamic pricing extend these where segmentation is enforceable.","q":"When does penetration pricing make sense?","a":"When network effects or economies of scale mean early share converts into durable cost or value advantages that justify the initial margin sacrifice.","v":{"k":"grid","h":["Model","Basis"],"d":[["Value-based","Willingness to pay"],["Cost-plus","Cost + margin"],["Penetration","Share first"],["Dynamic","Real-time demand"]]}},{"s":"ci","t":"Business Models","n":"Network Effects and Platforms","b":"Direct network effects mean each new user makes the product more valuable to existing users — messaging apps. Indirect effects run across two sides: more buyers attract more sellers, which attracts more buyers. Platforms exploiting these tend toward winner-take-most outcomes, which is why early share is worth more than early profit in these markets.","q":"Why do platform markets tend to concentrate?","a":"Network effects mean value rises with scale, so an early leader becomes progressively more attractive, producing winner-take-most dynamics.","v":{"k":"flow","d":["More buyers","Attracts sellers","More selection","More buyers"]}},{"s":"ci","t":"Business Models","n":"Subscription and Recurring Revenue","b":"Subscription models trade lower upfront revenue for predictable recurring cash flow, which markets reward with higher multiples. The economics turn on three numbers: customer acquisition cost, churn rate, and lifetime value. Growth funded by acquisition spending can look like losses while building an annuity — or can simply be buying unprofitable customers.","q":"Which metrics determine whether a subscription model works?","a":"Customer acquisition cost relative to lifetime value, with churn determining how long the revenue stream persists.","v":{"k":"bars","d":[["Lifetime value",100],["Acquisition cost",33],["Net contribution",67]],"u":"per customer, illustrative"}},{"s":"ci","t":"Business Models","n":"Operating Leverage in Business Models","f":"DOL = %Δ EBIT / %Δ Sales","b":"A model heavy on fixed costs magnifies both directions: revenue growth flows disproportionately to profit, and revenue decline destroys it. Software has extreme operating leverage; a services firm with mostly variable staff costs has little. Operating leverage is a business model choice, not merely a cost accident, and it determines cyclical sensitivity.","q":"Why do high fixed-cost businesses show volatile earnings?","a":"Fixed costs do not fall with revenue, so profit changes by a larger percentage than sales in both directions.","v":{"k":"plot","x":"Sales change","y":"EBIT change","s":[{"n":"High fixed cost","p":[[10,4],[50,50],[90,94]]},{"n":"Low fixed cost","p":[[10,32],[50,50],[90,68]]}],"note":"Steeper line means higher operating leverage"}},{"s":"ci","t":"Capital Investments and Capital Allocation","n":"Payback and Discounted Payback","b":"Payback counts years until cumulative cash flow recovers the outlay. It is intuitive and useful as a liquidity or risk screen, but it ignores the time value of money and everything after the cutoff. Discounted payback fixes the first flaw but not the second. Neither should ever be the primary decision rule, only a supplementary constraint.","q":"What does payback period ignore even in discounted form?","a":"All cash flows occurring after the payback point, so a project with large late-stage returns can be rejected incorrectly.","v":{"k":"cmp","h":["Payback","Discounted payback"],"d":[["Time value","Ignored","Included"],["Post-cutoff flows","Ignored","Ignored"],["Best use","Liquidity screen","Liquidity screen"]]}},{"s":"ci","t":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","n":"Board Structures","b":"A one-tier board places executive and non-executive directors in a single body, common in the US and UK. A two-tier structure separates a supervisory board of non-executives from a management board of executives, common in Germany and the Netherlands. Two-tier structures enforce independence structurally; one-tier structures rely on committee composition and director independence.","q":"How does a two-tier board enforce independence?","a":"It separates supervision from management into distinct bodies, so oversight does not depend on the composition of a single mixed board.","v":{"k":"cmp","h":["One-tier","Two-tier"],"d":[["Structure","Single board","Supervisory + management"],["Independence","Via committees","Structural"],["Common in","US, UK","Germany, Netherlands"]]}},{"s":"ci","t":"Working Capital and Liquidity","n":"Evaluating Trade Credit Terms","f":"Cost ≈ (1 + discount/(1−discount))^(365/days) − 1","b":"Terms of 2/10 net 30 mean a 2% discount for paying in 10 days rather than 30. Forgoing it costs 2% for 20 days of financing, which annualises to over 44%. Almost no short-term borrowing is that expensive, so a company routinely forgoing discounts is signalling either poor treasury management or genuine liquidity stress.","q":"What does habitually forgoing trade discounts signal?","a":"Either weak working capital management or real liquidity constraints, since the implied annualised cost far exceeds normal borrowing rates.","v":{"k":"bars","d":[["Bank line",7],["Commercial paper",5],["Forgo 2/10 net 30",44]],"u":"annualised cost %"}},{"s":"eq","t":"Market Organization and Structure","n":"Functions of the Financial System","b":"Three jobs. Allow entities to save and borrow, raise equity, manage risks and exchange assets. Determine the rates of return that equate aggregate saving with aggregate borrowing. And allocate capital to its most productive uses. A well-functioning system achieves all three at low cost — operational efficiency — while prices reflect fundamental value, informational efficiency.","q":"What are the three functions of the financial system?","a":"Facilitating saving, borrowing and risk transfer; determining equilibrium rates of return; and allocating capital to its most productive uses.","v":{"k":"flow","d":["Match savers & borrowers","Set equilibrium returns","Allocate capital"]}},{"s":"eq","t":"Market Organization and Structure","n":"Assets and Contracts","b":"Securities include debt, equity and pooled vehicles. Currencies, commodities and real assets trade in spot and derivative form. Contracts split into forward commitments — forwards, futures, swaps — where both parties are obligated, and contingent claims like options where one side holds a right. Knowing which category an instrument falls into determines how it is priced and what risk it carries.","q":"What distinguishes a forward commitment from a contingent claim?","a":"Both parties are obligated under a forward commitment; a contingent claim gives one party a right without an obligation to exercise it.","v":{"k":"grid","h":["Category","Examples"],"d":[["Securities","Debt, equity, pooled"],["Currencies","Spot and forward FX"],["Real assets","Property, commodities"],["Forward commitments","Forwards, futures, swaps"],["Contingent claims","Options, credit derivatives"]]}},{"s":"eq","t":"Market Organization and Structure","n":"Long and Short Positions","b":"A long position profits from price increases and has limited downside — the asset can only fall to zero. A short position borrows and sells, profiting from decline, and its loss is theoretically unlimited because prices can rise without bound. Short sellers also owe dividends to the lender and face recall risk if the lender demands the shares back.","q":"Why is short selling riskier than a long position?","a":"Losses are theoretically unlimited since prices can rise without bound, and the position faces recall risk plus obligations to pay dividends.","v":{"k":"plot","x":"Asset price","y":"Profit","s":[{"n":"Long","p":[[8,10],[50,50],[92,90]]},{"n":"Short","p":[[8,90],[50,50],[92,10]]}],"note":"Short losses grow without limit as price rises"}},{"s":"eq","t":"Market Organization and Structure","n":"Leveraged Positions and Margin","f":"Leverage ratio = Position value / Equity","b":"Buying on margin borrows part of the purchase price, amplifying both gains and losses by the leverage ratio. The maintenance margin is the minimum equity percentage; falling below triggers a margin call requiring more cash or forced liquidation. Forced selling in falling markets is a key amplification channel from individual leverage to systemic stress.","q":"What happens when equity falls below the maintenance margin?","a":"A margin call is issued requiring additional funds; failure to meet it results in forced liquidation of the position.","v":{"k":"steps","d":[["Buy $100 with $40 equity","2.5× leverage"],["Price falls 20% to $80","equity = $20"],["Equity ratio 25%","below 30% maintenance"],["Margin call","add funds or liquidate"]]}},{"s":"eq","t":"Market Organization and Structure","n":"Order Types","b":"A market order executes immediately at the best available price, guaranteeing execution but not price. A limit order specifies a price, guaranteeing price but not execution. Stop orders activate only when price reaches a trigger, converting to market orders — which means in a fast-falling market a stop-loss can execute far below the trigger.","q":"What risk does a stop-loss order carry in a fast market?","a":"It becomes a market order once triggered, so execution can occur well below the stop price during a rapid decline.","v":{"k":"cmp","h":["Market order","Limit order"],"d":[["Guarantees","Execution","Price"],["Risk","Price uncertainty","May not fill"],["Use when","Speed matters","Price matters"]]}},{"s":"eq","t":"Market Organization and Structure","n":"Market Structures","b":"Quote-driven markets have dealers posting bid and ask prices and trading from inventory — common in bonds and currencies. Order-driven markets match buyer and seller orders directly through an order book, common in equities. Brokered markets use intermediaries to find counterparties for unique or illiquid assets such as property and large blocks.","q":"Which market structure suits illiquid unique assets?","a":"Brokered markets, where an intermediary searches for a counterparty because no continuous two-sided market exists.","v":{"k":"grid","h":["Structure","Typical use"],"d":[["Quote-driven","Bonds, FX"],["Order-driven","Listed equities"],["Brokered","Property, blocks"]]}},{"s":"eq","t":"Market Organization and Structure","n":"Characteristics of a Well-Functioning Market","b":"Complete markets offer instruments spanning the needed risk exposures. Operational efficiency means low transaction costs. Informational efficiency means prices reflect available information promptly. Liquidity ties these together — deep, narrow-spread markets where large trades move prices little. Regulation supports all four by enforcing disclosure and preventing manipulation.","q":"What does operational efficiency measure?","a":"The cost of trading — low commissions, narrow spreads and small market impact make a market operationally efficient.","v":{"k":"flow","d":["Complete","Operationally efficient","Informationally efficient","Liquid"]}},{"s":"eq","t":"Security Market Indexes","n":"Index Weighting Methods","b":"Price weighting sums prices and divides by a divisor, so high-priced shares dominate regardless of company size and stock splits require divisor adjustment. Market-cap weighting reflects economic importance but overweights whatever has already risen. Equal weighting requires constant rebalancing and tilts toward small companies. Fundamental weighting uses financial metrics to avoid momentum bias.","q":"What bias does market-cap weighting introduce?","a":"It automatically increases exposure to securities that have risen in price, embedding momentum and concentration risk.","v":{"k":"cmp","h":["Price-weighted","Cap-weighted"],"d":[["Driver","Share price","Market value"],["Bias","High-priced stocks","Recent winners"],["Rebalancing","On splits","Automatic"]]}},{"s":"eq","t":"Security Market Indexes","n":"Rebalancing and Reconstitution","b":"Rebalancing restores target weights within an index — required constantly for equal-weighted indexes and automatic for cap-weighted ones. Reconstitution changes which securities are members entirely. Both create predictable trading demand, which front-runners exploit, and both make index performance partly a function of construction rules rather than market returns.","q":"Why does an equal-weighted index require frequent rebalancing?","a":"Prices move continuously, so weights drift from equality immediately and must be reset to maintain the intended construction.","v":{"k":"cmp","h":["Rebalancing","Reconstitution"],"d":[["Changes","Weights","Membership"],["Frequency","Regular","Periodic"],["Cap-weighted need","Minimal","Yes"]]}},{"s":"eq","t":"Security Market Indexes","n":"Types of Indexes","b":"Broad market indexes cover the investable universe. Multi-market indexes span countries or regions. Sector indexes isolate industries and support rotation strategies. Style indexes split by size and value or growth characteristics. Fixed-income and alternative indexes face harder construction problems because constituents are illiquid and priced infrequently.","q":"Why are fixed-income indexes harder to construct?","a":"Bonds trade infrequently and are numerous with varying maturities, so pricing is often estimated rather than observed and turnover from maturity is constant.","v":{"k":"stack","d":[["Broad market","whole universe"],["Multi-market","regions"],["Sector","industries"],["Style","size, value/growth"]]}},{"s":"eq","t":"Market Efficiency","n":"Forms of Market Efficiency","b":"Weak form says prices reflect all past price and volume data, so technical analysis cannot generate abnormal returns. Semi-strong form adds all public information, defeating fundamental analysis on published data. Strong form adds private information, which would make even insider trading unprofitable — and is empirically rejected, since insiders do earn abnormal returns.","q":"Which form of efficiency is rejected by evidence?","a":"Strong form. Insiders demonstrably earn abnormal returns, showing prices do not reflect private information.","v":{"k":"stack","d":[["Strong form","+ private info — rejected"],["Semi-strong","+ public info"],["Weak form","past prices only"]]}},{"s":"eq","t":"Market Efficiency","n":"Efficiency and Active Management","b":"The more efficient the market, the harder active management is to justify after costs. But full efficiency is self-defeating: if nobody researched, prices would stop reflecting information. Markets are efficient because analysts compete to exploit inefficiency, so the equilibrium is a level of active management just sufficient to keep prices approximately right.","q":"Why is a perfectly efficient market logically unstable?","a":"If prices were perfectly efficient, nobody would pay to research, and without research prices would cease to reflect information.","v":{"k":"flow","d":["Analysts research","Prices correct","Returns to research fall","Research declines"]}},{"s":"eq","t":"Market Efficiency","n":"Market Anomalies","b":"Persistent patterns that appear to contradict efficiency. Time-series anomalies include January and momentum effects. Cross-sectional anomalies include size and value premiums. Event anomalies include post-earnings-announcement drift. Most weaken after publication, suggesting either data mining or arbitrage capture, and many vanish once transaction costs are applied.","q":"Why do anomalies often weaken after publication?","a":"Either they were data-mining artefacts, or investors trade to exploit them once known, arbitraging the pattern away.","v":{"k":"grid","h":["Type","Example"],"d":[["Time-series","January effect"],["Time-series","Momentum"],["Cross-sectional","Size, value"],["Event","Earnings drift"]]}},{"s":"eq","t":"Market Efficiency","n":"Behavioural Explanations","b":"Behavioural finance explains anomalies through systematic bias rather than rational pricing. Loss aversion makes investors hold losers too long. Overconfidence drives excessive trading. Herding produces momentum and bubbles. Anchoring slows adjustment to new information, explaining post-earnings drift. The debate is whether these are true inefficiencies or unmeasured risk factors.","q":"Which bias plausibly explains post-earnings-announcement drift?","a":"Anchoring and conservatism — investors adjust beliefs too slowly to new earnings information, so prices continue drifting afterwards.","v":{"k":"grid","h":["Bias","Market effect"],"d":[["Loss aversion","Holding losers"],["Overconfidence","Excess trading"],["Herding","Momentum, bubbles"],["Anchoring","Slow adjustment"]]}},{"s":"eq","t":"Overview of Equity Securities","n":"Common vs Preference Shares","b":"Common shares carry voting rights and a residual claim with unlimited upside and no guaranteed dividend. Preference shares typically have no vote but a fixed dividend with priority over common, sitting between debt and equity in the capital structure. Cumulative preference accrues missed dividends; participating preference shares also share in upside beyond the fixed rate.","q":"Where do preference shares sit in the capital structure?","a":"Between debt and common equity — senior to common in dividends and liquidation, but subordinate to all debt claims.","v":{"k":"stack","d":[["Debt","most senior"],["Preference shares","fixed dividend priority"],["Common equity","residual claim"]]}},{"s":"eq","t":"Overview of Equity Securities","n":"Private vs Public Equity","b":"Private equity comes in venture capital for early-stage companies, leveraged buyouts for mature ones, and private investment in public equity. Characteristics differ sharply from public markets: illiquidity, limited disclosure, long lock-up periods, weaker valuation transparency, and greater investor influence over management through board control and covenants.","q":"What advantage does private equity gain from concentrated ownership?","a":"Direct influence over management and strategy through board control, without the short-term reporting pressure of public markets.","v":{"k":"cmp","h":["Public equity","Private equity"],"d":[["Liquidity","Continuous","Locked up"],["Disclosure","Mandatory","Limited"],["Influence","Voting only","Board control"],["Valuation","Market price","Periodic estimate"]]}},{"s":"eq","t":"Overview of Equity Securities","n":"Depository Receipts","b":"A depository receipt lets investors hold foreign shares through a domestic instrument. Sponsored receipts involve the foreign company directly, giving holders voting rights and better disclosure. Unsponsored receipts are created by a depository bank without company involvement, and holders typically have no voting rights. Global and American depository receipts differ by listing venue.","q":"What do holders lose with an unsponsored depository receipt?","a":"Voting rights and company-provided disclosure, since the issuing company is not a party to the arrangement.","v":{"k":"cmp","h":["Sponsored","Unsponsored"],"d":[["Company involved","Yes","No"],["Voting rights","Usually","Usually not"],["Disclosure","Better","Limited"]]}},{"s":"eq","t":"Overview of Equity Securities","n":"Return on Equity and Book Value","f":"ROE = Net income / Average book equity","b":"Book value is the accounting residual, historical and often far from economic value — especially where intangibles dominate. ROE measures return on that base and is the primary link between profitability and the sustainable growth rate. A high ROE achieved with heavy leverage is a different proposition from one earned on modest borrowing.","q":"Why can book value diverge sharply from market value?","a":"Book value records historical cost and excludes internally generated intangibles, so it understates asset-light and brand-driven businesses.","v":{"k":"flow","d":["Net income","÷ book equity","= ROE","× retention = growth"]}},{"s":"eq","t":"Company Analysis: Past and Present","n":"Elements of Company Analysis","b":"Work through business model, industry position, financial performance, and forward drivers in that order. Understand how the company makes money before analysing whether it does so well. Historic financial analysis establishes the baseline, competitive analysis explains whether it persists, and only then do forecasts have foundations rather than being extrapolated trend lines.","q":"Why analyse the business model before the financials?","a":"The model explains what the numbers mean and which drivers matter, preventing analysis that extrapolates trends without understanding their source.","v":{"k":"flow","d":["Business model","Industry position","Financial history","Forward drivers"]}},{"s":"eq","t":"Company Analysis: Past and Present","n":"Cost Structure and Breakeven","f":"Breakeven units = Fixed costs / (Price − Variable cost per unit)","b":"The split between fixed and variable costs determines how profit responds to volume. High fixed cost businesses have high breakeven points and violent profit swings; variable-cost-heavy businesses are more resilient but capture less upside from growth. Breakeven analysis makes the operating leverage of a business model concrete and quantifiable.","q":"How does a high fixed-cost structure affect breakeven?","a":"It raises the breakeven volume and magnifies profit sensitivity, so results swing sharply in both directions with modest volume changes.","v":{"k":"plot","x":"Units sold","y":"Revenue / Cost","s":[{"n":"Revenue","p":[[8,8],[92,92]]},{"n":"Total cost","p":[[8,40],[92,76]]}],"note":"Breakeven where the lines cross"}},{"s":"eq","t":"Industry and Competitive Analysis","n":"Defining the Industry","b":"Classification systems group by principal business activity — GICS and similar schemes sort by what generates revenue. Two problems recur: conglomerates fit nowhere cleanly, and classification by product misses companies competing for the same customer need. Define the industry by the set of firms a customer would consider substitutes, not by an official code.","q":"What is the limitation of standard industry classification?","a":"It groups by revenue source rather than competitive substitution, so firms competing for the same customer need can appear in separate industries.","v":{"k":"flow","d":["Official code","Revenue source","But competition","= customer substitutes"]}},{"s":"eq","t":"Industry and Competitive Analysis","n":"Porter's Five Forces","b":"Five forces determine industry profitability. Rivalry among existing firms. Threat of new entrants, controlled by barriers. Threat of substitutes from outside the industry. Bargaining power of suppliers. Bargaining power of buyers. Where all five are weak, margins persist; where several are strong, competition transfers profit to customers and suppliers.","q":"What determines whether industry margins persist?","a":"The strength of the five forces — persistent margins require weak rivalry, high entry barriers, few substitutes, and limited buyer and supplier power.","v":{"k":"grid","h":["Force","Compresses margin when"],"d":[["Rivalry","Many similar firms"],["New entrants","Low barriers"],["Substitutes","Close alternatives"],["Supplier power","Concentrated inputs"],["Buyer power","Concentrated customers"]]}},{"s":"eq","t":"Industry and Competitive Analysis","n":"Barriers to Entry","b":"Economies of scale force entrants to arrive large or arrive uncompetitive. Network effects make late entry worthless. Regulatory licences and patents exclude directly. Switching costs lock customers in. Capital intensity deters. Brand builds slowly. The durability of a margin depends less on how high it is than on which of these protects it.","q":"Why do high margins without barriers not persist?","a":"They attract entry, which expands supply and competes the margin away until returns approach the cost of capital.","v":{"k":"bars","d":[["Regulatory licence",92],["Network effects",85],["Scale economies",70],["Brand",55],["Capital intensity",45]],"u":"barrier durability, illustrative"}},{"s":"eq","t":"Industry and Competitive Analysis","n":"Industry Life Cycle","b":"Embryonic industries have slow growth, high prices and high risk. Growth stages bring rapid expansion, falling prices and improving profitability. Shakeout brings overcapacity and consolidation. Maturity brings slow growth and consolidation around efficient producers. Decline brings falling demand and exit. Valuation multiples should reflect the stage, not the current growth rate.","q":"What characterises the shakeout phase?","a":"Growth slows while capacity built during expansion remains, producing overcapacity, price competition and consolidation.","v":{"k":"plot","x":"Time","y":"Industry growth","s":[{"n":"Life cycle","p":[[6,15],[26,72],[46,88],[64,50],[82,28],[95,12]]}],"note":"Embryonic → growth → shakeout → mature → decline"}},{"s":"eq","t":"Company Analysis: Forecasting","n":"Forecasting Revenue","b":"Two approaches. Top-down starts with the economy or market size and applies a share assumption — suitable for cyclical and commodity businesses. Bottom-up builds from units, prices, stores or customers — suitable where company-specific drivers dominate. A hybrid cross-checks one against the other, which catches assumptions that are internally consistent but collectively implausible.","q":"When is a top-down revenue forecast more appropriate?","a":"For cyclical or commodity businesses whose results are driven principally by market-wide demand and pricing rather than firm-specific factors.","v":{"k":"cmp","h":["Top-down","Bottom-up"],"d":[["Starts from","Market size","Units and price"],["Best for","Cyclicals","Company-specific drivers"],["Risk","Share assumption","Aggregation error"]]}},{"s":"eq","t":"Company Analysis: Forecasting","n":"Scenario Analysis","b":"A single point forecast conveys false precision. Building base, upside and downside cases forces explicit assumptions about the drivers that actually matter and reveals which ones the valuation is sensitive to. Sensitivity analysis varies one input at a time; scenario analysis varies coherent sets, which is more realistic because drivers correlate.","q":"Why is scenario analysis preferred to single-variable sensitivity?","a":"Drivers move together in reality, so coherent scenarios capture correlated changes that isolated sensitivity testing misses.","v":{"k":"bars","d":[["Downside",62],["Base",100],["Upside",138]],"u":"valuation, indexed to base"}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Three Categories of Valuation Model","b":"Present value models discount expected cash flows — dividends, free cash flow, or residual income. Multiplier models apply a market multiple to an accounting metric. Asset-based models value the balance sheet net of liabilities. Each suits different businesses: asset-based for holding companies, multiples for comparable peers, present value where cash flows are forecastable.","q":"When is an asset-based model most appropriate?","a":"For companies whose value resides in identifiable assets — holding companies, property and natural resource firms — rather than in going-concern cash flows.","v":{"k":"grid","h":["Model type","Best for"],"d":[["Present value","Forecastable cash flows"],["Multiples","Comparable peers"],["Asset-based","Asset-heavy holdings"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Dividend Discount Model","f":"V₀ = Σ Dₜ / (1 + r)ᵗ","b":"The purest present value model: a share is worth the dividends it will pay. It suits mature dividend-paying companies with stable payout policies and boards independent enough that dividends reflect earnings capacity. It fails for non-payers and for companies where buybacks substitute for dividends, which is where free cash flow models take over.","q":"When does the dividend discount model fail?","a":"When a company pays no dividends, or returns cash mainly through buybacks, so dividends do not reflect distributable cash flow.","v":{"k":"tline","d":[["t=1","D₁ discounted","+"],["t=2","D₂ discounted","+"],["t=∞","terminal value","+"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Gordon Growth Model","f":"V₀ = D₁ / (r − g)","b":"A single-stage model assuming dividends grow at a constant rate forever. Three requirements: growth must be below the required return, growth must be sustainable indefinitely, and the numerator is next year's dividend. Its extreme sensitivity to the denominator is its defining feature — a half-point change in g can move the value by a third.","q":"Why is the Gordon model highly sensitive to inputs?","a":"Value depends on the small difference between r and g, so a modest change in either produces a large proportional change in the denominator.","v":{"k":"bars","d":[["g = 3%",100],["g = 4%",125],["g = 5%",167]],"u":"value with r = 9%, indexed"}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Multistage Dividend Models","b":"Real companies do not grow at one rate forever. A two-stage model applies high growth for an explicit period then a stable terminal rate. Three-stage models add a transition phase where growth declines gradually, which is more realistic than an abrupt drop. The terminal value typically dominates, often exceeding 70% of total value.","q":"Why does terminal value dominate multistage models?","a":"Explicit forecast periods are short relative to a perpetual life, so most value sits in the terminal period despite heavier discounting.","v":{"k":"donut","d":[["Terminal value",74],["Explicit forecast",26]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Sustainable Growth Rate","f":"g = ROE × Retention ratio","b":"Growth funded internally is limited by profitability and retention. A company earning 15% on equity and retaining 60% can grow 9% without external funding. Growing faster requires debt or equity issuance. This links the income statement to growth assumptions and exposes forecasts where growth exceeds what the balance sheet can support.","q":"What must a company do to grow faster than its sustainable rate?","a":"Raise external capital through debt or equity issuance, or improve return on equity, since retained earnings alone cannot fund the growth.","v":{"k":"steps","d":[["ROE = 15%","profitability"],["Retention = 60%","policy"],["g = 0.15 × 0.60","calculation"],["g = 9%","internally fundable"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Free Cash Flow to Equity Valuation","b":"FCFE models value the cash actually available to shareholders after reinvestment and debt service, whether or not it is distributed. This makes them appropriate for non-dividend payers and for companies where payout policy is disconnected from cash generation. The trade-off is greater forecasting complexity and higher sensitivity to capital expenditure assumptions.","q":"Why use FCFE rather than dividends?","a":"FCFE measures distributable cash regardless of payout policy, which suits companies that pay no dividends or whose payout is unrelated to cash generation.","v":{"k":"flow","d":["Operating cash flow","− capex","+ net borrowing","= FCFE"]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Price Multiples","b":"P/E is the most used and most abused: it requires positive, meaningful earnings and is distorted by accounting choices and cyclical position. P/B suits financials where book value is meaningful. P/S resists manipulation because revenue is harder to manage but ignores profitability entirely. EV/EBITDA is capital structure neutral, which makes it the best cross-company comparator.","q":"Why is EV/EBITDA preferred for cross-company comparison?","a":"It is neutral to capital structure and to depreciation policy, allowing comparison of firms with different leverage and asset accounting.","v":{"k":"grid","h":["Multiple","Strength"],"d":[["P/E","Familiar, direct"],["P/B","Suits financials"],["P/S","Hard to manipulate"],["EV/EBITDA","Structure-neutral"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Justified vs Comparable Multiples","f":"Justified P/E = (D₁/E₁) / (r − g)","b":"Two ways to use multiples. The comparables approach applies a peer group multiple and asks whether the company is cheap relative to similar firms — but the whole peer group may be mispriced. The justified approach derives the multiple from fundamentals, showing what the multiple should be given payout, growth and risk, independent of market sentiment.","q":"What is the weakness of the comparables approach?","a":"It measures relative value only — if the entire peer group is overvalued, a company can look cheap while being expensive in absolute terms.","v":{"k":"cmp","h":["Comparables","Justified"],"d":[["Based on","Peer prices","Fundamentals"],["Answers","Relative value","Absolute value"],["Weakness","Group mispricing","Input sensitivity"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Enterprise Value","f":"EV = Market cap + Debt − Cash","b":"Enterprise value measures the cost of acquiring the whole business regardless of how it is financed. Cash is subtracted because an acquirer effectively receives it back; debt is added because it must be assumed or repaid. Pairing EV with EBIT or EBITDA maintains consistency — both represent claims of all capital providers.","q":"Why is cash subtracted in enterprise value?","a":"An acquirer effectively recovers the target's cash on completion, so it reduces the net cost of acquiring the operating business.","v":{"k":"steps","d":[["Market cap 800","equity value"],["+ Debt 300","must be assumed"],["− Cash 100","recovered"],["= EV 1,000","business value"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Asset-Based Valuation","b":"Value the assets at fair value and subtract liabilities. It works best for companies whose value resides in identifiable assets — property firms, holding companies, natural resources, and financial institutions marked to market. It works poorly where intangibles dominate, and it typically sets a floor value rather than a going-concern estimate.","q":"When does asset-based valuation understate a business?","a":"When value comes from intangibles, brand, human capital or growth options, which do not appear at fair value on the balance sheet.","v":{"k":"scale","l":"Poor fit","r":"Good fit","d":["Software firm","Consumer brand","Manufacturer","Property holding co"]}},{"s":"eq","t":"Market Organization and Structure","n":"Financial Intermediaries","b":"Brokers find counterparties without taking positions. Dealers take the other side from inventory and profit on the spread. Exchanges provide trading venues and rules. Clearing houses guarantee settlement through novation, standing between counterparties. Depositories hold securities. Each removes a specific friction, and the clearing house in particular converts counterparty risk into a mutualised system.","q":"How does a clearing house reduce counterparty risk?","a":"By interposing itself as counterparty to both sides through novation, guaranteeing settlement backed by margin and a default fund.","v":{"k":"flow","d":["Buyer","Clearing house","Seller"]}},{"s":"eq","t":"Market Efficiency","n":"Transaction Costs and Efficiency","b":"An anomaly is only exploitable if the gain exceeds the cost of capturing it. Explicit costs are commissions and fees. Implicit costs are the bid-ask spread, market impact from moving the price, and opportunity cost from unfilled orders. Many documented anomalies survive statistical tests but vanish entirely once realistic implementation costs are applied.","q":"Which implicit cost grows with position size?","a":"Market impact — larger orders move the price against the trader, so cost rises more than proportionally with size.","v":{"k":"bars","d":[["Commission",8],["Bid-ask spread",22],["Market impact",55],["Opportunity cost",15]],"u":"share of total cost %"}},{"s":"eq","t":"Overview of Equity Securities","n":"Investing in Foreign Equities","b":"Direct investment in foreign markets brings currency risk, differing settlement conventions, regulatory restrictions on foreign ownership, and information asymmetry. Indirect routes — depository receipts, global registered shares, exchange-traded funds — reduce operational friction but not currency exposure. Diversification benefits fall as global correlations rise, particularly during crises.","q":"Do depository receipts remove currency risk?","a":"No. They simplify access and settlement, but the underlying exposure remains in the foreign currency and the receipt price reflects it.","v":{"k":"cmp","h":["Direct holding","Depository receipt"],"d":[["Settlement","Foreign convention","Domestic"],["Currency risk","Yes","Yes"],["Access barriers","Possible","Reduced"]]}},{"s":"eq","t":"Company Analysis: Forecasting","n":"Forecasting Capital Expenditure","b":"Split maintenance capital expenditure, which sustains current capacity and roughly tracks depreciation, from growth capital expenditure, which expands it and should link to revenue forecasts. Companies that consistently spend below depreciation are underinvesting, borrowing profit from future capacity. This shows up years later as accelerated replacement needs or lost competitiveness.","q":"What does capital expenditure persistently below depreciation suggest?","a":"Underinvestment in the asset base, which flatters current cash flow but implies future replacement spending or declining capacity.","v":{"k":"plot","x":"Year","y":"Amount","s":[{"n":"Depreciation","p":[[10,60],[38,60],[66,60],[92,60]]},{"n":"Capital expenditure","p":[[10,55],[38,48],[66,42],[92,36]]}],"note":"Sustained shortfall means deferred spending"}},{"s":"eq","t":"Industry and Competitive Analysis","n":"Competitive Strategy Positions","b":"Cost leadership wins by producing more cheaply, requiring scale and process discipline, and it works even in commodity markets. Differentiation wins through product attributes buyers will pay more for, requiring brand or innovation. Focus applies either approach to a narrow segment. The failure mode is being stuck in the middle — neither cheapest nor distinctive.","q":"What is the risk of a mixed strategic position?","a":"Being stuck in the middle — lacking the scale for cost leadership and the distinctiveness for premium pricing, so margins are squeezed from both sides.","v":{"k":"quad","x":["Broad market","Narrow segment"],"y":["Cost","Differentiation"],"d":["Differentiation","Focused differentiation","Cost leadership","Cost focus"]}},{"s":"eq","t":"Security Market Indexes","n":"Uses of Market Indexes","b":"Indexes serve as market sentiment gauges, performance benchmarks, proxies for market portfolios in asset pricing models, measures of beta and risk-adjusted return, and the basis for index funds and derivatives. The benchmark role imposes discipline: it must be specified in advance, investable, and appropriate to the mandate, or performance evaluation is meaningless.","q":"What makes an index a valid benchmark?","a":"It must be specified in advance, investable, measurable, appropriate to the mandate, and reflective of the manager's actual opportunity set.","v":{"k":"grid","h":["Use","Requirement"],"d":[["Sentiment gauge","Broad coverage"],["Benchmark","Specified in advance"],["Model proxy","Market representative"],["Index fund basis","Investable"]]}},{"s":"eq","t":"Equity Valuation: Concepts and Basic Tools","n":"Preferred Stock Valuation","f":"V = Dividend / r","b":"Non-callable, non-convertible preference shares with a fixed perpetual dividend value as a simple perpetuity. Add features and the model complicates: callability caps upside because the issuer redeems when rates fall, and convertibility adds an equity option. The base case is the simplest valuation in the curriculum and a reliable source of straightforward exam marks.","q":"How does callability affect preferred stock value?","a":"It caps appreciation, because the issuer will redeem when rates fall and the security would otherwise rise in value.","v":{"k":"steps","d":[["Dividend = $5","fixed perpetual"],["Required return = 8%","market rate"],["V = 5 / 0.08","perpetuity"],["V = $62.50","value"]]}},{"s":"eq","t":"Company Analysis: Past and Present","n":"Segment Analysis","b":"Consolidated figures average away the information. Segment disclosures reveal which divisions generate revenue, profit and assets — and frequently show one segment funding another's losses. Track segment margins over time and against segment capital employed, because a group return that looks adequate may combine one excellent business with one destroying value.","q":"What does segment analysis reveal that consolidated figures hide?","a":"That group performance may average an excellent business with a value-destroying one, obscuring where capital should be reallocated.","v":{"k":"bars","d":[["Segment A margin",26],["Segment B margin",11],["Segment C margin",-4],["Group average",14]],"u":"operating margin %"}},{"s":"eq","t":"Market Efficiency","n":"Intrinsic Value vs Market Price","b":"Intrinsic value is what an asset is truly worth given all information; market price is what it trades at. In efficient markets the two converge, but intrinsic value is unobservable — it is estimated, and estimates carry error. Active management is a bet that your estimation error is smaller than the market's, which is a demanding claim.","q":"Why is intrinsic value difficult to act on?","a":"It is unobservable and must be estimated, so acting on a perceived gap requires confidence that your estimate is more accurate than the market's.","v":{"k":"plot","x":"Time","y":"Value","s":[{"n":"Market price","p":[[8,45],[28,72],[48,38],[70,66],[92,52]]},{"n":"Intrinsic value","p":[[8,50],[92,56]]}],"note":"Price oscillates around an unobservable anchor"}},{"s":"eq","t":"Overview of Equity Securities","n":"Equity and the Cost of Capital","b":"The return investors require on equity is the company's cost of equity, and the company creates value only by earning more than it. Return on invested capital above the weighted cost of capital creates value; below it, growth destroys value. This is why growth is not automatically desirable — it multiplies whichever of the two conditions holds.","q":"When does growth destroy value?","a":"When return on invested capital is below the cost of capital, growth deploys more capital at a loss and destroys value faster.","v":{"k":"quad","x":["ROIC < WACC","ROIC > WACC"],"y":["Low growth","High growth"],"d":["Fast value destruction","Fast value creation","Slow destruction","Slow creation"]}},{"s":"fi","t":"Fixed-Income Instrument Features","n":"The Three Elements of a Bond","b":"Every bond reduces to issuer, maturity and coupon. The issuer determines credit risk. Maturity determines how long you are exposed and how sensitive the price is to rate changes. The coupon determines the cash flow pattern and, with maturity, the timing of when you get your money back. Everything else in fixed income elaborates these three.","q":"Which bond feature most affects interest rate sensitivity?","a":"Maturity, because longer time to repayment means cash flows are discounted over more periods and prices move more for a given yield change.","v":{"k":"flow","d":["Issuer → credit risk","Maturity → rate risk","Coupon → cash timing"]}},{"s":"fi","t":"Fixed-Income Instrument Features","n":"Par, Premium and Discount","b":"When the coupon rate equals the market yield, the bond trades at par. A coupon above market yield makes the bond attractive, so it trades at a premium and the price declines toward par as maturity approaches. A coupon below market yield makes it trade at a discount, rising toward par. This convergence is called the pull to par.","q":"What happens to a premium bond's price over time, holding yields constant?","a":"It declines toward par as maturity approaches, because the above-market coupon advantage shortens with each payment received.","v":{"k":"plot","x":"Time to maturity","y":"Price","s":[{"n":"Premium","p":[[8,124],[40,116],[70,107],[92,100]]},{"n":"Par","p":[[8,100],[92,100]]},{"n":"Discount","p":[[8,76],[40,84],[70,93],[92,100]]}],"note":"Pull to par at maturity"}},{"s":"fi","t":"Fixed-Income Instrument Features","n":"Bond Indenture and Covenants","b":"The indenture is the legal contract specifying the issuer's obligations. Affirmative covenants require actions — maintaining insurance, providing financial statements, keeping ratios. Negative covenants restrict them — limiting additional debt, asset sales, or dividends. Covenants protect lenders where credit quality is weaker, which is why high yield indentures are far more restrictive than investment grade.","q":"Why do high yield bonds carry more restrictive covenants?","a":"Weaker credit quality means lenders demand contractual protection against actions that would further increase their risk.","v":{"k":"cmp","h":["Affirmative","Negative"],"d":[["Requires","Action","Restraint"],["Example","Maintain ratios","Limit new debt"],["Breach","Technical default","Technical default"]]}},{"s":"fi","t":"Fixed-Income Instrument Features","n":"Seniority and Security","b":"Priority in bankruptcy runs from secured debt backed by specific collateral, through senior unsecured, senior subordinated, subordinated, and finally equity. Recovery rates fall sharply down the ladder. Two bonds from the same issuer can have very different expected losses despite identical default probability — seniority determines recovery, not the likelihood of default.","q":"Why do two bonds of one issuer have different credit spreads?","a":"Default probability is the same but seniority differs, so expected recovery — and therefore expected loss — differs across the capital structure.","v":{"k":"stack","d":[["Secured debt","highest recovery"],["Senior unsecured",""],["Senior subordinated",""],["Subordinated",""],["Equity","last, usually nil"]]}},{"s":"fi","t":"Fixed-Income Cash Flows and Types","n":"Amortising vs Bullet Structures","b":"A bullet bond pays coupons and repays the entire principal at maturity, concentrating refinancing risk at one date. A fully amortising bond repays principal gradually with each payment, so the outstanding balance declines steadily and credit exposure falls over time. Partially amortising structures leave a balloon payment at maturity — a hybrid with residual refinancing risk.","q":"Why is an amortising structure less risky for lenders?","a":"Principal is repaid progressively, reducing outstanding exposure over time and eliminating the concentrated refinancing risk of a bullet maturity.","v":{"k":"plot","x":"Time","y":"Principal outstanding","s":[{"n":"Bullet","p":[[8,90],[50,90],[85,90],[92,4]]},{"n":"Amortising","p":[[8,90],[50,50],[92,4]]}],"note":"Amortising reduces exposure steadily"}},{"s":"fi","t":"Fixed-Income Cash Flows and Types","n":"Floating-Rate Notes","f":"Coupon = Reference rate + Quoted margin","b":"The coupon resets periodically to a reference rate plus a fixed spread, so the price stays near par because the coupon tracks the market. This removes most interest rate risk but retains credit risk — if the issuer's credit deteriorates, the fixed quoted margin becomes insufficient and the price falls below par regardless of rate movements.","q":"Why can a floating-rate note trade below par?","a":"If the issuer's credit quality deteriorates, the required margin exceeds the fixed quoted margin, so the price falls to compensate.","v":{"k":"cmp","h":["Fixed-rate bond","Floating-rate note"],"d":[["Rate risk","High","Minimal"],["Credit risk","Yes","Yes"],["Price behaviour","Moves with yields","Anchored near par"]]}},{"s":"fi","t":"Fixed-Income Cash Flows and Types","n":"Callable Bonds","b":"A call option lets the issuer redeem early, exercised when rates fall and refinancing becomes cheaper. The investor therefore faces reinvestment risk exactly when reinvestment is least attractive. Callable bonds must offer a higher yield to compensate, and their price appreciation is capped near the call price — negative convexity in the region where rates fall.","q":"When will an issuer call a bond?","a":"When interest rates have fallen enough that refinancing at the lower rate saves more than the call premium costs.","v":{"k":"plot","x":"Falling yield →","y":"Price","s":[{"n":"Option-free","p":[[8,30],[45,58],[92,96]]},{"n":"Callable","p":[[8,30],[45,56],[92,70]]}],"note":"Upside compressed near the call price"}},{"s":"fi","t":"Fixed-Income Cash Flows and Types","n":"Putable and Convertible Bonds","b":"A put option lets the investor sell back to the issuer, valuable when rates rise or credit deteriorates — it puts a floor under the price, so putable bonds yield less. A convertible bond adds an option to convert into equity, combining bond downside protection with equity upside, and its price behaves increasingly like the stock as the share price rises.","q":"Why does a putable bond yield less than an otherwise identical bond?","a":"The put option benefits the investor by setting a price floor, and the investor pays for that protection through a lower yield.","v":{"k":"cmp","h":["Callable","Putable"],"d":[["Option held by","Issuer","Investor"],["Exercised when","Rates fall","Rates rise"],["Yield","Higher","Lower"]]}},{"s":"fi","t":"Fixed-Income Issuance and Trading","n":"Primary Market Mechanisms","b":"An underwritten offering has the investment bank buy the issue and resell it, taking price risk in exchange for the spread. A best-efforts offering leaves the risk with the issuer. Auctions, used for government debt, can be single-price where all bidders pay the clearing price, or multiple-price where each pays their own bid.","q":"Who bears price risk in an underwritten offering?","a":"The underwriter, which purchases the entire issue and bears the risk of reselling it at a lower price than paid.","v":{"k":"cmp","h":["Underwritten","Best efforts"],"d":[["Risk borne by","Underwriter","Issuer"],["Proceeds","Guaranteed","Uncertain"],["Cost to issuer","Higher","Lower"]]}},{"s":"fi","t":"Fixed-Income Issuance and Trading","n":"Secondary Market Structure","b":"Most bonds trade over the counter through dealers rather than on exchanges, because the sheer number of individual issues prevents continuous two-sided markets in each. Liquidity concentrates in recently issued on-the-run government bonds; off-the-run issues trade at wider spreads. Corporate bonds trade infrequently, so quoted prices are often estimates rather than executed levels.","q":"Why are bond markets predominantly over the counter?","a":"A single issuer may have dozens of outstanding issues, so trading is too fragmented to support continuous exchange order books in each one.","v":{"k":"scale","l":"Least liquid","r":"Most liquid","d":["Small corporate","Off-the-run govt","On-the-run govt"]}},{"s":"fi","t":"Fixed-Income Markets for Corporate Issuers","n":"Short-Term Corporate Funding","b":"Commercial paper is unsecured short-term debt issued by high-quality borrowers, cheap but dependent on continuous market access — refinancing risk is real, which is why issuers maintain backup credit lines. Repurchase agreements sell securities with a commitment to repurchase, functioning as collateralised borrowing where the repo rate depends on collateral quality and term.","q":"Why do commercial paper issuers hold backup credit lines?","a":"Commercial paper must be continuously refinanced, so a backup facility protects against being unable to roll the paper in stressed markets.","v":{"k":"flow","d":["Issue paper","Rolls at maturity","Market closes","Draw backup line"]}},{"s":"fi","t":"Fixed-Income Markets for Corporate Issuers","n":"Bank Loans and Syndication","b":"Bilateral loans involve one lender; syndicated loans spread a large facility across a group, allowing size beyond any single bank's appetite. Leveraged loans are made to below-investment-grade borrowers, typically floating rate and secured, and they trade in a secondary market. Loans generally rank senior to bonds and are secured, so recovery rates are higher.","q":"Why do leveraged loans typically recover more than bonds in default?","a":"They are usually secured and rank senior in the capital structure, giving them first claim on collateral and proceeds.","v":{"k":"cmp","h":["Leveraged loan","High yield bond"],"d":[["Rate","Floating","Usually fixed"],["Security","Secured","Often unsecured"],["Seniority","Senior","Subordinate"],["Recovery","Higher","Lower"]]}},{"s":"fi","t":"Fixed-Income Markets for Government Issuers","n":"Sovereign Debt","b":"Sovereign bonds issued in a country's own currency carry the lowest credit risk in that market, since the government controls the currency. Foreign-currency sovereign debt is genuinely risky, because the government cannot print the repayment currency — most sovereign defaults involve foreign currency obligations. This distinction drives sovereign rating methodology.","q":"Why is foreign-currency sovereign debt riskier than local-currency debt?","a":"The government cannot create the foreign currency needed for repayment, so it depends on reserves and export earnings instead.","v":{"k"
